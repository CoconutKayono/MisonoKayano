<section class="section"><div class="section-head"><h2>从你已经学过的地方继续</h2><button class="quiet-btn" data-view="courses">课程衔接路线</button></div><div class="topic-grid">${['realtime-offline','render-pipeline','microfacet','path-tracing'].map(id=>byId[id]).filter(Boolean).map(item).join('')}</div></section>${footer()}`;}
function corpus(t){const routes=ROUTES.filter(r=>r.steps.some(s=>s[0]===t.id)).map(r=>r.title+' '+r.intro).join(' ');return [t.title,t.en,t.summary,t.intuition,t.why,t.what,t.deep,t.tradeoffs,...t.pitfalls,routes].join(' ').toLowerCase();}
function library(){const words=state.query.toLowerCase().trim().split(/\s+/).filter(Boolean);let list=TOPICS.filter(t=>(state.group==='all'||t.group===state.group)&&(state.course==='all'||t.courses.includes(state.course))&&(state.level==='all'||t.level===state.level)&&words.every(w=>corpus(t).includes(w)));if(words.length)list.sort((a,b)=>{const score=t=>words.reduce((n,w)=>n+(t.title.toLowerCase().includes(w)?20:0)+(t.en.toLowerCase().includes(w)?15:0)+(t.summary.toLowerCase().includes(w)?7:0),0);return score(b)-score(a);});return `<p class="eyebrow">KNOWLEDGE INDEX</p><h1>${state.query?'搜索知识':state.group==='all'?'全部知识':GROUPS[state.group].name}</h1><p class="lead">先读直觉、Why 与 What；需要建立连接时，再展开“深一层”。课程标签表示学习衔接，不保证该课程逐项讲授这些专题。</p><div class="library-controls"><div class="pill-row">${[['all','全部'],...Object.entries(GROUPS).map(([k,v])=>[k,v.name])].map(([id,n])=>`<button class="pill ${state.group===id?'active':''}" data-filter-group="${id}" aria-pressed="${state.group===id}">${n}</button>`).join('')}</div></div><div class="library-controls"><div class="pill-row"><label for="course-filter">课程衔接</label><select id="course-filter"><option value="all">全部课程</option>${['101','104','202'].map(c=>`<option value="${c}" ${state.course===c?'selected':''}>GAMES${c}</option>`).join('')}</select><label for="level-filter">知识层次</label><select id="level-filter">${['all','基础','进阶','专题'].map(c=>`<option value="${c}" ${state.level===c?'selected':''}>${c==='all'?'全部层次':c}</option>`).join('')}</select></div><button class="quiet-btn" id="reset-filters">重置筛选</button></div><p class="result-count" role="status">${list.length} / ${TOPICS.length} 个知识节点${state.query?' · 搜索“'+esc(state.query)+'”':''}</p>${list.length?`<div class="topic-grid">${list.map(item).join('')}</div>`:`<div class="empty"><h2>没有匹配的知识。</h2><p>试试更短的关键词或英文缩写，例如“皮肤”“GI”“SSS”；也可以重置筛选。</p></div>`}${footer()}`;}
function svg(inner,label){return `<svg viewBox="0 0 760 225" role="img" aria-label="${label}"><title>${label}</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f6b44e"/></marker></defs>${inner}</svg>`;}
function diagram(t){let s='',cap='';
if(['skin','sss'].includes(t.id)){s=svg(`<path d="M35 88H725" stroke="#e99bb8" stroke-width="3"/><path d="M35 164H725" stroke="#435471"/><text x="40" y="63">表面：高光 / 微表面</text><text x="40" y="198" class="small">内部：吸收 + 多次散射</text><path d="M110 15L230 88L345 20" class="light" marker-end="url(#arrow)"/><path d="M425 17L466 88Q415 126 480 143Q547 170 581 88L625 22" class="stroke"/><circle cx="466" cy="88" r="5" fill="#85b8ff"/><circle cx="581" cy="88" r="5" fill="#85b8ff"/><path d="M470 178H580" class="light"/><text x="455" y="212" class="small">进入点与离开点不同</text>`,'皮肤表面反射与内部散射对照');cap='表面高光在界面处发生；BSSRDF 描述光从一个位置进入、经内部传播后从另一位置离开。散射距离必须与场景尺度一致。';}
else if(t.id==='hair'){s=svg(`<rect x="70" y="55" width="620" height="112" fill="#243347" stroke="#72829a"/><text x="85" y="208" class="small">展开界面的路径拓扑示意 · 形状与角度不按比例</text><path d="M110 15L220 55L280 15" class="light" marker-end="url(#arrow)"/><text x="298" y="30" class="accent">R / 表面反射</text><path d="M345 15L385 55L438 167L466 204" class="stroke"/><text x="340" y="130">TT / 透射</text><path d="M545 15L585 55L626 167L654 55L688 16" stroke="#e99bb8" stroke-width="2.5" fill="none"/><text x="513" y="130">TRT / 内部反射</text>`,'发丝 R、TT、TRT 三类散射路径');cap='这里把纤维界面展开为矩形，以表示 R、TT、TRT 的路径拓扑；形状与角度不按比例。它们帮助理解发丝为何需要纤维散射模型。实际模型还会考虑更多次内部反射、角度分布与发束多重散射。';}
else if(['ssr','ssgi','ssao'].includes(t.id)){s=svg(`<rect x="50" y="35" width="475" height="160" rx="3" fill="#182a41" stroke="#85b8ff"/><text x="65" y="63">当前屏幕可用的数据</text><path d="M160 173L300 100L448 159" class="light"/><path d="M448 159L615 68" class="light" stroke-dasharray="7 6"/><circle cx="300" cy="100" r="6" fill="#f6b44e"/><circle cx="628" cy="61" r="12" fill="none" stroke="#e99bb8"/><text x="540" y="113">屏幕外：没有记录</text><text x="65" y="220" class="small">深度 / 法线 / 已着色颜色，只描述有限视图</text>`,'屏幕空间技术的信息边界');cap='实线位于已有屏幕数据中，虚线越过视图边界。屏幕外、被遮挡表面与背面数据的缺失，需要其他信息来源补充。';}
else if(['microfacet','normal-map','anisotropy','pbr','brdf','metal-dielectric','fresnel'].includes(t.id)){s=svg(`<text x="65" y="28">相同宏观表面，不同微观法线分布</text><path d="M55 156L118 146L180 154L240 144L307 155" class="stroke"/><path d="M430 157L461 117L488 160L514 103L540 157L571 116L604 158L635 110L675 156" class="stroke"/><path d="M130 57L180 149L240 53" class="light" marker-end="url(#arrow)"/><path d="M530 49L540 150M540 150L462 56M540 150L595 42M540 150L679 102" class="light"/><text x="105" y="202">较集中的高光</text><text x="486" y="202">更宽的方向响应</text>`,'微表面法线分布与高光宽度');cap='粗糙度影响微表面法线分布，进而影响反射瓣宽度。各向异性还区分方向；Fresnel 则描述界面的角度反射比例。图示不代表具体 NDF 数值。';}
else if(['path-tracing','whitted','bdpt','mlt','photon-mapping','vcm','ray-tracing','rendering-equation','global-illumination','direct-light','realtime-offline'].includes(t.id)){s=svg(`<circle cx="68" cy="115" r="22" fill="#1d314b" stroke="#85b8ff"/><text x="43" y="171">相机</text><rect x="170" y="172" width="420" height="8" fill="#435471"/><path d="M570 40V172" stroke="#e99bb8" stroke-width="8"/><circle cx="470" cy="50" r="20" fill="#f6b44e"/><text x="440" y="97">光源</text><path d="M462 68L330 171L89 117" class="light" marker-end="url(#arrow)"/><path d="M487 60L570 118L447 171L89 117" class="stroke"/><text x="225" y="80" class="accent">直接光路</text><text x="365" y="132">间接光路</text><text x="189" y="214" class="small">积分器决定怎样寻找、采样和加权这些光路</text>`,'直接与间接光路示意');cap='按物理传播方向画出光从光源到相机的路线；采样时可以从相机、光源或两端出发。是否追踪射线，与选择哪些光路和如何估计贡献是不同问题。';}
else if(['sampling','mis','restir','denoising','taa','upscaling','spatial-aa'].includes(t.id)){s=svg(`<text x="42" y="30">有限样本</text><text x="290" y="30">采样 / 复用 / 重建</text><text x="570" y="30">更稳定的估计</text>${Array.from({length:30},(_,i)=>`<circle cx="${45+(i*41)%180}" cy="${65+(i*67)%120}" r="${i%5===0?4:2}" fill="${i%5===0?'#f6b44e':'#85b8ff'}"/>`).join('')}<path d="M239 120H282" class="light" marker-end="url(#arrow)"/><rect x="302" y="75" width="155" height="92" rx="4" fill="#1d314b" stroke="#435471"/><text x="321" y="112">分布与权重</text><text x="321" y="146" class="small">历史与辅助特征</text><path d="M478 120H522" class="light" marker-end="url(#arrow)"/><path d="M550 161Q590 66 630 101T716 85" class="stroke"/><text x="36" y="218" class="small">提高有效样本利用率与降低方差；滤波也可能引入偏差与细节损失</text>`,'有限样本到稳定估计的关系');cap='采样策略改变样本分布，重采样复用候选，降噪和重建处理估计结果。它们的角色不同；时间信息有帮助，但必须处理运动与新暴露区域。';}
else if(['ibl','precomputed-gi','prt','rsm','lpv','ddgi','voxel-gi'].includes(t.id)){s=svg(`<text x="50" y="30">场景中的照明</text><rect x="40" y="64" width="165" height="112" fill="#182a41" stroke="#435471"/><path d="M68 154L99 97L175 143" class="light"/><path d="M224 120H291" class="light" marker-end="url(#arrow)"/><text x="306" y="30">共享表示 / 缓存</text>${Array.from({length:12},(_,i)=>`<circle cx="${324+i%4*34}" cy="${76+Math.floor(i/4)*37}" r="8" fill="#1d314b" stroke="#75d8b1"/>`).join('')}<path d="M459 120H523" class="light" marker-end="url(#arrow)"/><rect x="548" y="64" width="165" height="112" fill="#182a41" stroke="#435471"/><text x="567" y="111">查询与插值</text><text x="567" y="145" class="small">表面获得照明</text><text x="44" y="217" class="small">表示在哪里、保留哪些频率、怎样更新，决定它的能力与误差</text>`,'照明缓存与查询的关系');cap='环境贴图、传输系数、VPL、体素和探针保存的信息各不相同。这是共享数据流示意，不能把所有缓存视为同一种 GI 算法。';}
else if(t.group==='pipeline'||t.group==='production'){s=svg(`<text x="40" y="28">场景与相机</text><text x="278" y="28">可见表面与光照</text><text x="568" y="28">显示结果</text>${[[40,'几何 / 深度','材质属性'],[278,'光照 / 阴影','GI / 透明'],[550,'重建 / 曝光','显示变换']].map(([x,a,b])=>`<rect x="${x}" y="65" width="171" height="105" rx="4" fill="#182a41" stroke="#435471"/><text x="${x+18}" y="106">${a}</text><text x="${x+18}" y="143" class="small">${b}</text>`).join('')}<path d="M222 115H266M462 115H538" class="light" marker-end="url(#arrow)"/><path d="M630 174V205H357V174" class="stroke" stroke-dasharray="6 5"/><text x="422" y="224" class="small">历史信息参与后续帧重建</text>`,'渲染计算与中间数据流');cap='这是逻辑层次示意。真实引擎会安排多个 pass，并按资源依赖组织执行；前向、延迟和混合管线的阶段顺序与数据表示可能不同。';}
else if(['shadow-map','soft-shadow'].includes(t.id)){s=svg(`<circle cx="85" cy="20" r="18" fill="#f6b44e"/><rect x="285" y="83" width="34" height="80" fill="#435471"/><path d="M32 179H724" class="stroke"/><path d="M85 20L285 163L307 179M85 20L319 83L675 179" class="light"/><path d="M307 180H675" stroke="#e99bb8" stroke-width="9"/><text x="45" y="95">光源</text><text x="265" y="65">遮挡物</text><text x="355" y="215">接收面上的遮挡范围</text><text x="46" y="140" class="small">灯光也需要查询“看见谁”</text>`,'光源可见性与阴影');cap='阴影来自光源与接收点之间的遮挡。面积光源的部分可见性产生半影；阴影图与射线用不同方式估计这类可见性。';}
else if(['transmission','volume','foliage','eyes'].includes(t.id)){s=svg(`<path d="M30 76H730M30 164H730" stroke="#435471"/><path d="M95 22L226 76L312 164L408 206" class="light" marker-end="url(#arrow)"/><path d="M483 22L515 76Q465 107 539 122Q600 141 607 164L656 204" class="stroke"/><text x="312" y="52">界面改变方向</text><text x="76" y="130">内部吸收 / 散射</text><text x="453" y="217" class="small">参与介质需要描述体积中的光</text>`,'界面透射与内部传播');cap='透明度、折射、吸收和体积散射表达不同物理过程。薄表面近似与有厚度的实体模型，也具有不同适用条件。';}
else{s=svg(`<rect x="45" y="67" width="190" height="105" fill="#182a41" stroke="#435471"/><text x="67" y="110">场景表示</text><text x="67" y="143" class="small">几何 / 方向 / 属性</text><path d="M251 117H300" class="light" marker-end="url(#arrow)"/><rect x="316" y="67" width="160" height="105" fill="#182a41" stroke="#435471"/><text x="338" y="110">查询与模型</text><text x="338" y="143" class="small">精度与预算</text><path d="M493 117H541" class="light" marker-end="url(#arrow)"/><rect x="557" y="67" width="160" height="105" fill="#182a41" stroke="#435471"/><text x="579" y="110">像素贡献</text><text x="579" y="143" class="small">采样与显示</text>`,'场景表示到像素贡献的连接');cap='表示方式决定可用的信息，模型决定解释方式，采样与显示决定最终像素。这个节点属于其中的某个层次，而非包办整个过程。';}
return `<figure class="diagram">${s}<figcaption>${cap}<span class="diagram-hint"> 窄屏可横向滚动查看图示。</span></figcaption></figure>`;}
function article(id){const t=byId[id];if(!t)return missing('知识节点');return `<article class="article"><div class="breadcrumbs"><a href="#library">全部知识</a><span>/</span><button class="quiet-btn" data-group="${t.group}">${GROUPS[t.group].name}</button></div><p class="eyebrow">${GROUPS[t.group].label}</p><h1>${esc(t.title)}</h1><p class="english">${esc(t.en)}</p><div class="topic-meta">${tags(t)}</div><p class="abstract">${esc(t.summary)}</p><section class="article-section"><h2><small>INTUITION</small>先建立直觉</h2><p>${esc(t.intuition)}</p></section>${diagram(t)}<section class="article-section"><h2><small>WHY</small>为什么需要这个技术？</h2><p>${esc(t.why)}</p></section><section class="article-section"><h2><small>WHAT</small>它究竟是什么？</h2><p>${esc(t.what)}</p></section><details class="deep"><summary>深一层：它与其他知识怎样连接</summary><p>${esc(t.deep)}</p></details><section class="article-section"><h2><small>TRADE-OFF</small>能力与代价</h2><p>${esc(t.tradeoffs)}</p></section><section class="article-section"><h2>容易混淆的边界</h2><ul class="pitfalls">${t.pitfalls.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></section><section class="article-section"><h2>接下来可以去哪里？</h2><div class="pill-row">${t.related.map(topicLink).join('')}</div></section><section class="article-section"><h2>继续阅读原始资料</h2><ul class="source-list">${t.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a><small>${esc(new URL(s.url).hostname)}</small></li>`).join('')}</ul></section><div class="notice">课程标签是这份地图安排的学习衔接；具体讲授范围以课程官网为准。“深一层”提供原理连接，完整推导与实现请沿原始资料继续阅读。</div>${footer()}</article>`;}
function questions(){return `<p class="eyebrow">START WITH A QUESTION</p><h1>先说现象，再找原理。</h1><p class="lead">这些入口给出一条排查与学习路线。每一步对应知识节点，并说明为什么先看它。</p><div class="question-grid section">${ROUTES.map(questionCard).join('')}</div>${footer()}`;}
function route(id){const r=ROUTES.find(x=>x.id===id);if(!r)return missing('问题路线');return `<article class="article"><div class="breadcrumbs"><a href="#questions">按问题寻找</a><span>/</span>${r.type}</div><p class="eyebrow">QUESTION → CONCEPTS</p><h1>${r.title}</h1><p class="lead">${r.intro}</p><div class="notice">先沿这条路线定位属于哪一层的问题，再进入节点读 Why 与 What。它是知识导航，不能替代具体场景的测量与验证。</div><div class="route-list">${r.steps.filter(s=>byId[s[0]]).map((s,i)=>`<div class="route-step"><span class="step-number">${String(i+1).padStart(2,'0')}</span><div><h3>${s[1]}</h3><p>${s[2]}</p>${topicLink(s[0])}</div></div>`).join('')}</div><section class="section"><h2>在全局地图中定位</h2><p class="lead">${r.steps.map(s=>byId[s[0]]?.title.split('：')[0]).filter(Boolean).join(' → ')}</p></section>${footer()}</article>`;}
function compare(){const c=COMPARE[state.comparison];return `<p class="eyebrow">COMPARE BY THE PROBLEM THEY SOLVE</p><h1>方法之间，差别在哪里？</h1><div class="pill-row section">${Object.entries(COMPARE).map(([id,v])=>`<button class="pill ${id===state.comparison?'active':''}" aria-pressed="${id===state.comparison}" data-comparison="${id}">${v.name}</button>`).join('')}</div><p class="lead" style="margin-top:24px">${c.intro}</p><div class="comparison-wrap"><table class="comparison"><thead><tr><th>方法</th><th>解决什么</th><th>优势</th><th>主要限制</th><th>常见用途</th></tr></thead><tbody>${c.rows.filter(r=>byId[r[0]]).map(r=>`<tr><td><button class="algo" data-topic="${r[0]}">${esc(byId[r[0]].title.split('：')[0])}</button><small>${esc(byId[r[0]].en)}</small></td>${r.slice(1).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">表中“实时 / 离线”是常见用途，不是算法的硬性归属。越通用的方法也可能在特定场景不如专用近似；比较时需要固定质量目标、硬件和动态条件。点击方法名查看来源与更深的解释。</div>${footer()}`;}
function courses(){return `<p class="eyebrow">CONNECT WHAT YOU ALREADY KNOW</p><h1>把三门课连成一张地图。</h1><p class="lead">101 建立原理坐标，104 解释引擎如何组织它们，202 深入实时质量与预算之间的取舍。专题延伸可按兴趣展开，无需在进下一门课前全部掌握。</p><div class="course-grid"><section class="course-col"><p class="state">已接近学完 · 原理基础</p><h2>GAMES101</h2><p>现代计算机图形学入门</p><ul><li>变换、投影、光栅化与着色</li><li>几何表示、曲线与网格</li><li>光线传播、采样与材质</li><li>相机、颜色、动画与模拟</li></ul><a href="https://sites.cs.ucsb.edu/~lingqi/teaching/games101.html" target="_blank" rel="noopener noreferrer">课程官网与讲义</a></section><section class="course-col"><p class="state">正在学习 · 系统组织</p><h2>GAMES104</h2><p>现代游戏引擎入门必修课</p><ul><li>现代引擎架构与数据组织</li><li>渲染等核心系统的原理与开发</li><li>动画、物理与工具链的连接</li><li>从效果原理到系统资源与帧预算</li></ul><a href="https://games104.boomingtech.com/" target="_blank" rel="noopener noreferrer">课程官网与资源</a></section><section class="course-col"><p class="state">后续计划 · 实时质量</p><h2>GAMES202</h2><p>高质量实时渲染</p><ul><li>软阴影与环境光照</li><li>预计算与动态全局光照</li><li>微表面、高质量着色与面光</li><li>实时光追、降噪与抗锯齿</li></ul><a href="https://sites.cs.ucsb.edu/~lingqi/teaching/games202.html" target="_blank" rel="noopener noreferrer">课程官网与讲义</a></section></div><section class="section"><h2>从 101 到 202，建议先建立这条链</h2><div class="reading-road">${['rendering-equation','brdf','microfacet','sampling','mis','ibl','taa','denoising'].map(topicLink).join('<span class="connector">→</span>')}</div><p class="lead" style="margin-top:18px">先明白要积分什么，再明白怎样在有限预算内近似它。预滤波与时间复用，是许多实时方法共享的思路。</p></section><section class="section"><h2>用 104 把原理装进引擎</h2><div class="reading-road">${['render-pipeline','forward-plus','lod','render-graph','gpu-performance'].map(topicLink).join('<span class="connector">→</span>')}</div></section><section class="section"><h2>按兴趣延伸的两条专题支线</h2><h3>复杂外观</h3><div class="pill-row">${['skin','sss','hair','eyes','cloth','volume'].map(topicLink).join('')}</div><h3 style="margin-top:22px">更深的光路与现代采样</h3><div class="pill-row">${['bdpt','mlt','photon-mapping','vcm','restir','neural-rendering'].map(topicLink).join('')}</div><div class="notice">上述支线与工程节点是地图延伸，不表示 GAMES101/104/202 都讲授了这些技术，也不是三门课的替代讲义。</div></section>${footer()}`;}
function missing(name){return `<h1>这个${name}暂不存在。</h1><p class="lead">可以回到全部知识重新寻找。</p><a class="pill" href="#library">全部知识</a>`;}
function render(scroll=false){const c=$('#content');if(state.view==='topic'){c.innerHTML=article(state.id);document.title=(byId[state.id]?.title||'知识节点')+' · 图形学地图';}else if(state.view==='route'){c.innerHTML=route(state.id);document.title=(ROUTES.find(r=>r.id===state.id)?.title||'问题路线')+' · 图形学地图';}else{c.innerHTML=({overview,library,questions,compare,courses}[state.view]||overview)();document.title='图形学地图 · 从现象到原理';}document.querySelectorAll('.nav-button').forEach(b=>{const active=b.dataset.view===state.view||(b.dataset.group===state.group&&state.view==='library');b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#clear-search').hidden=!state.query;$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function navigateHash(){const parts=location.hash.slice(1).split('/');state.view=['overview','questions','compare','courses','library','topic','route'].includes(parts[0])?parts[0]:'overview';state.id=parts[1];if(state.view!=='library'){state.query='';$('#search').value='';}render(true);}
function go(view,id){const hash='#'+view+(id?'/'+id:'');if(location.hash===hash){state.view=view;state.id=id;render(true);}else location.hash=hash;}
$('#group-nav').innerHTML=Object.entries(GROUPS).map(([id,g])=>`<button class="nav-button" data-group="${id}">${g.name}<span class="num">${TOPICS.filter(t=>t.group===id).length}</span></button>`).join('');$('#all-count').textContent=TOPICS.length;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.topic)go('topic',b.dataset.topic);else if(b.dataset.route)go('route',b.dataset.route);else if(b.dataset.view){state.group='all';state.course='all';state.level='all';go(b.dataset.view);}else if(b.dataset.group){state.group=b.dataset.group;state.course='all';state.level='all';state.query='';$('#search').value='';go('library');}else if(b.dataset.filterGroup){state.group=b.dataset.filterGroup;render();}else if(b.dataset.comparison){state.comparison=b.dataset.comparison;render();}else if(b.id==='reset-filters'){state.group='all';state.course='all';state.level='all';render();}else if(b.id==='clear-search'){state.query='';$('#search').value='';render();$('#search').focus();}else if(b.id==='menu'){const open=$('#sidebar').classList.toggle('open');b.setAttribute('aria-expanded',open);}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;state.view='library';state.group='all';state.course='all';state.level='all';history.replaceState(null,'','#library');render();});
document.addEventListener('change',e=>{if(e.target.id==='course-filter'){state.course=e.target.value;render();}if(e.target.id==='level-filter'){state.level=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus();}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');$('#search').blur();}});
window.addEventListener('hashchange',navigateHash);navigateHash();
</script>
</body></html>
