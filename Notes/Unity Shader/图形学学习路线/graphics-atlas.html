<script type="application/json" id="knowledge-data">[{"id":"visibility","title":"可见性：先知道看见谁","en":"Visibility","group":"foundations","courses":["101","104","202"],"level":"基础","summary":"遮挡是几何问题；亮不亮是光照问题。先把两者分开。","intuition":"相机沿一个方向望出去，最先遇到的表面挡住了后面的表面。灯光也一样：表面是否能看见光源，决定了有没有直接照明。两种可见性使用相似的几何查询，却服务于不同的任务。","why":"如果每个投影到像素的三角形都画出来，远处物体会盖住近处物体；如果每盏灯都直接加亮，墙后的灯也会照过来。渲染必须同时处理相机遮挡和光路上的遮挡。","what":"可见性描述两点之间是否被几何阻断。主可见性确定相机看到的表面；次级可见性用于阴影、反射和间接光。光栅化配合深度缓冲解决前者，射线求交可以处理任意方向的可见性查询。","deep":"可见性通常是不连续的：一条边略微移动，就可能让光路从通到断。这是阴影锯齿、时域闪烁和采样困难的重要来源。透明介质还需要透射率，不能只用一个可见/不可见的布尔值概括。","tradeoffs":"屏幕空间查询省钱但只有当前视图的信息；世界空间查询更完整，却需要几何结构、更新和遍历成本。","pitfalls":["深度测试不能自动生成灯光阴影。","找到交点不等于计算出该点的颜色。"],"related":["rasterization","ray-tracing","shadow-map","rendering-equation"],"sources":[{"title":"GAMES101 官方课程：光栅化与光线追踪","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games101.html"}]},{"id":"global-illumination","title":"全局光照：光会继续走","en":"Global Illumination · GI","group":"foundations","courses":["101","202"],"level":"基础","summary":"红墙把白墙染红，阴影仍有亮度：这些都需要间接光。","intuition":"光源照到红墙后，红墙会把一部分光反射出去，于是附近的白墙也略带红色。场景里的表面既是光的接收者，也可以成为后续光路的来源。只计算灯到物体的一段路，世界就会缺少这种联系。","why":"直接照明能表现灯光和阴影，却难以解释室内柔和亮度、颜色渗透、镜面互相反射、玻璃聚光等现象。为了让物体真正存在于同一个光照环境中，需要考虑多次传播。","what":"GI 是考虑场景中多次光相互作用的光照范畴，常被工程语境用来指间接照明。漫反射 GI 与镜面 GI 是不同方向；烘焙、探针、屏幕空间近似和路径追踪，都在解决其中一部分或更广的光路。","deep":"不要把 GI 视为一个开关或单一算法。比较方案时应问：覆盖哪些光路？保存在哪个空间？如何更新？怎样处理遮挡？漫反射光通常较平滑，镜面反射对方向和可见性更敏感，二者的缓存难度不同。","tradeoffs":"完整传播需要大量样本；近似方案通过预计算、低分辨率表示、有限反弹或历史复用节省预算，代价是更新迟滞、漏光或缺失光路。","pitfalls":["AO 主要表示局部遮蔽，不会自动产生颜色渗透。","IBL 不自动包含场景内完整的间接光和遮挡。"],"related":["rendering-equation","path-tracing","precomputed-gi","ssgi","ddgi","voxel-gi"],"sources":[{"title":"GAMES202 官方课程：实时全局光照","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games202.html"}]},{"id":"realtime-offline","title":"实时与离线：同一个问题，两种预算","en":"Real-time vs. Offline Rendering","group":"foundations","courses":["101","104","202"],"level":"基础","summary":"分类的核心是时间与误差预算，不是光栅化和光追的二选一。","intuition":"60 FPS 时每帧总时间约 16.67 ms，其中还要放下游戏逻辑、动画、物理和提交工作。离线图像可以让样本持续累积。两者都想估计同样的光，但对“现在必须有结果”的要求不同。","why":"互动体验无法等一张图慢慢收敛；电影和产品图则可能优先保证细节与稳定性。于是出现了预算分配、分辨率降低、缓存、近似、时域复用等策略，也出现了高样本的离线积分方法。","what":"实时渲染强调在目标硬件、分辨率和帧率下持续交付；离线渲染允许更长计算时间。路径追踪也能用于实时系统，光栅化也能进入离线工具；混合管线会按不同效果选择不同计算方式。","deep":"预算不只有毫秒，还有显存、带宽、功耗、输入延迟和画面稳定性。一个静态截图很干净的算法，在镜头移动后可能严重拖影。比较方法要固定场景、硬件、分辨率、质量目标和动态条件。","tradeoffs":"实时系统接受可控偏差换取低方差与稳定帧时间；离线系统通常能用更多样本、更完整的路径和更高精度，但仍会使用缓存与降噪。","pitfalls":["实时不等于光栅化，离线不等于路径追踪。","某篇论文的 FPS 不能脱离硬件和场景直接比较。"],"related":["rtx-hybrid","path-tracing","denoising","taa","gpu-performance"],"sources":[{"title":"GAMES202：时间约束下的质量取舍","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games202.html"},{"title":"PBRT 4：CPU/GPU 渲染系统","url":"https://www.pbr-book.org/4ed/Introduction/pbrt_System_Overview"}]},{"id":"camera","title":"相机：像素不是世界中的一个点","en":"Camera, Projection & Film","group":"foundations","courses":["101","104"],"level":"基础","summary":"投影决定看见哪里；镜头与快门决定怎样累积光。","intuition":"一个像素代表感光区域收到的一组光，而非只有一根绝对精确的射线。镜头孔径、曝光时段和像素面积都能让采样分布变宽，分别关联景深、运动模糊与抗锯齿。","why":"透视缩小、焦外模糊和运动拖尾，都无法只靠物体材质解释。为把三维世界变成可显示的图像，需要描述视点、投影、镜头和感光过程。","what":"针孔相机建立简单的投影关系；薄透镜模型加入孔径与焦平面；更真实的镜头模型可处理镜片结构。光栅化常用 MVP 变换获得投影，路径追踪则从像素、镜头和时间生成相机射线。","deep":"透视投影后的插值需要校正，深度通常也不是与距离线性对应。相机移动、抖动与前后帧矩阵还会影响 motion vector 和历史重投影，进而影响 TAA、降噪和时域升采样。","tradeoffs":"简单投影高效易控制；真实镜头效果需要更多维度的采样。后处理景深便宜，却常受遮挡边界和背景缺失影响。","pitfalls":["曝光、色调映射和材质颜色是不同环节。","裁剪空间、NDC、屏幕空间和世界空间不能混用。"],"related":["render-pipeline","sampling","spatial-aa","taa","tone-mapping"],"sources":[{"title":"PBRT 4：Cameras and Film","url":"https://www.pbr-book.org/4ed/Cameras_and_Film"}]},{"id":"rendering-equation","title":"渲染方程：一张图为什么会亮","en":"Rendering Equation / Light Transport Equation","group":"foundations","courses":["101","104","202"],"level":"基础","summary":"用能量收支把灯光、材质、可见性与多次反弹连成一个问题；它定义目标，具体算法负责近似这个目标。","intuition":"把表面上的一个小点想成光的中转站：它可能自己发光，也会接收四面八方来的光，再根据材质把其中一部分送向你的眼睛。红墙使白墙泛红，就是红墙送来的光也参与了这个收支；周围物体因此会互相影响。","why":"只把物体颜色乘上灯光强度，能解释局部明暗，却难以统一解释颜色互相染色、间接照明与玻璃聚光。我们需要一条共同的规则，让材质模型和各种渲染算法回答同一个问题，也能明确每种近似究竟省略了哪些光。","what":"渲染方程描述表面离开的辐亮度等于自发光加上反射或透射的入射光积分。对不透明表面的常见形式是 Lo = Le + ∫半球 fr · Li · |n·ωi| dωi；fr 是 BRDF，余弦项表示斜射光被摊到更大的面积上。","deep":"难点藏在 Li 中：它通常又是另一个表面的 Lo，因此局部方程实际耦合了整个场景。把递归展开可得到所有光路的积分，路径追踪与双向方法就在这上面抽样。常见表面形式假设稳态几何光学，烟雾等参与介质还需体积输运方程。","tradeoffs":"它提供统一的物理目标，但不直接承诺画质或速度。实时系统会选择性近似积分，离线系统也会截断、缓存或降噪；需要分别判断近似的偏差与抽样的方差。","pitfalls":["渲染方程不是一套可以直接运行的完整渲染管线，也不等于路径追踪算法。","把表面半球积分直接用于皮肤内部或烟雾，遗漏了位置间传播与体积散射。"],"related":["radiometry","brdf","path-tracing","pbr","direct-light"],"sources":[{"title":"PBRT 4 · The Light Transport Equation","url":"https://pbr-book.org/4ed/Light_Transport_I_Surface_Reflection/The_Light_Transport_Equation"},{"title":"PBRT 4 · The Equation of Transfer","url":"https://pbr-book.org/4ed/Light_Transport_II_Volume_Rendering/The_Equation_of_Transfer"}]},{"id":"radiometry","title":"辐射度量：先弄清楚“亮”是什么","en":"Radiometry","group":"foundations","courses":["101","104","202"],"level":"基础","summary":"区分总功率、单位面积收到的光与沿某个方向传播的光，才能正确理解距离衰减、余弦项和材质单位。","intuition":"同一盏灯既可以问“总共发出了多少光”，也可以问“这张桌子每平方米收到多少”，还可以问“相机沿这个方向看过去有多亮”。这些问题的答案不是同一个量；把它们混用，就像把水龙头的总流量当成地面的积水深度。","why":"材质、光源与相机各自处理不同的光学量。若所有变量都随意叫 brightness，就容易重复乘距离衰减、漏掉投影面积，或让换场景尺度后照明失真。辐射度量给计算一个可核对的单位体系，让物理规则和图像结果能对上。","what":"辐射通量 Φ 是总功率，单位 W；辐照度 E 是单位面积接收的功率，单位 W/m²；辐射强度 I 是单位立体角的功率；辐亮度 L 还区分投影面积和方向，单位 W/(m²·sr)。人眼加权后的流明、勒克斯和亮度属于光度学量。","deep":"在无吸收、无散射、折射率不变的自由传播中，辐亮度沿射线保持不变。点光源的辐照度仍按距离平方衰减，因为同一功率分摊到更大面积；这两句话并不矛盾。E = ∫半球 Li cosθ dω 还说明了方向量与面积量之间的关系。","tradeoffs":"度量让模型一致，但 RGB、光谱和人眼加权量之间仍需选择表达方式。只给一个流明数无法唯一恢复完整光谱；画面最终也会经过曝光与色调映射。","pitfalls":["不能因为“光会随距离变弱”，就在相机看到的表面辐亮度上额外乘 1/r²。","Radiance、irradiance 与 luminance 的中文都可能带“亮”，它们的单位和用途不同。"],"related":["rendering-equation","brdf","direct-light","ibl","color-management"],"sources":[{"title":"PBRT 4 · Radiometry","url":"https://pbr-book.org/4ed/Radiometry,_Spectra,_and_Color/Radiometry"},{"title":"PBRT 4 · Working with Radiometric Integrals","url":"https://pbr-book.org/4ed/Radiometry,_Spectra,_and_Color/Working_with_Radiometric_Integrals"}]},{"id":"rasterization","title":"光栅化与可见性","en":"Rasterization & Visibility","group":"pipeline","courses":["101","104"],"level":"基础","summary":"先问三角形覆盖哪些屏幕样本，再问其中哪个表面离相机最近。","intuition":"把三角形投影到一张像素网格上，像用模板盖章一样找出它覆盖的位置。深度缓冲再像一张距离账本，帮助保留更近的表面。它高效回答相机看见谁，但被看见的表面是什么颜色，仍要交给材质与光照计算。","why":"画面由大量像素组成，逐像素遍历整个场景会非常昂贵。三角形具有规则的投影与覆盖关系，适合 GPU 并行处理；把可见性求解和着色组织成流水线，能持续地把几何数据变成屏幕图像，成为实时渲染的重要基础。","what":"光栅化把图元映射为屏幕上的片元及覆盖样本，并插值深度、纹理坐标等属性。片元经过深度、模板、混合等操作后才影响最终像素。它是一类图元到样本的转换方法，通常配合深度缓冲解决主视角的可见性问题。","deep":"深入时要区分像素、片元与多重采样点，理解透视校正插值、裁剪空间、覆盖规则和深度精度。光栅化并不天然求出光线的多次反弹，但可以与阴影贴图、屏幕空间方法或光线追踪协作，组成混合渲染器。","tradeoffs":"规则的三角形处理与硬件支持带来高吞吐量；高重叠、微小三角形和复杂透明物体会增加成本。间接光、反射和软阴影通常还需额外算法与场景表示。","pitfalls":["一个片元不等于一个最终像素：它可能被深度测试丢弃，也可能只覆盖像素中的部分样本。","光栅化与光线追踪是求可见性的不同工具，不直接决定画面是否采用物理材质或是否具有全局光照。"],"related":["render-pipeline","spatial-aa","shadow-map","deferred"],"sources":[{"title":"Microsoft · Rasterizer Stage","url":"https://learn.microsoft.com/en-us/windows/win32/direct3d11/d3d10-graphics-programming-guide-rasterizer-stage"}]},{"id":"render-pipeline","title":"一帧的渲染管线","en":"Rendering Pipeline","group":"pipeline","courses":["101","104","202"],"level":"基础","summary":"从场景与相机出发，沿着可见性、材质、光照、重建、显示的依赖链找问题。","intuition":"把一帧想成一家工厂：场景准备零件，可见性挑出会进入照片的表面，材质与光照决定颜色，后处理和显示变换完成交付。每一步接收前一步的数据，也可能读取历史帧；找问题时先定位它发生在哪一道工序。","why":"真实引擎需要协调几何、灯光、阴影、透明、反射、抗锯齿与显示输出，任何一步都可能依赖其他步骤的结果。管线把庞大的渲染任务拆成有明确输入输出的阶段，使开发者能管理顺序、预算、数据复用和画质问题。","what":"广义渲染管线是一帧的工作组织方式，常见流程包含剔除与 LOD、阴影、深度或 G-buffer、光照、透明、时域重建和输出变换。API 的图形管线则指顶点处理、光栅化、片元着色等较底层阶段，二者尺度不同。","deep":"理解管线应追踪数据而不只背流程图：深度服务哪些效果，法线在哪个空间，颜色是否在线性 HDR 中，运动向量由谁生成。现代一帧会混用图形、计算与追踪任务；先后关系由资源依赖决定，部分工作可以并行。","tradeoffs":"分阶段能复用数据并减少重复工作，同时也引入中间缓冲、同步与带宽成本。各引擎的阶段顺序和透明处理有所不同，示意图应作为理解依赖的入口。","pitfalls":["Forward、Deferred 属于着色组织方式；光栅化、光线追踪属于可见性与光传输工具，两组分类可以组合。","广义的一帧流程不等同于一次 draw call 的硬件管线，后处理和 GI 通常涉及多个 pass。"],"related":["rasterization","forward","deferred","render-graph","tone-mapping"],"sources":[{"title":"Khronos · Vulkan Pipelines","url":"https://docs.vulkan.org/spec/latest/chapters/pipelines.html"},{"title":"Epic · Rendering Dependency Graph","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/rendering-dependency-graph?application_version=4.27"}]},{"id":"forward","title":"前向着色","en":"Forward Shading","group":"pipeline","courses":["104"],"level":"进阶","summary":"渲染物体时就计算材质和光照，适合多样材质、透明与 MSAA。","intuition":"每个物体来到画布前，先查自己的材质，再询问会影响它的灯，直接写出受光颜色。它像逐件上色的画法，流程容易理解；但画好的部分若后来被更近的物体盖住，先前的昂贵着色可能就白做了。","why":"基本光栅化管线天然适合在片元阶段得到最终颜色。当前景灯光较少、材质变化大，或项目重视透明、移动设备与低延迟显示时，直接着色能避免大型 G-buffer 的存储负担，也便于沿用硬件多重采样机制。","what":"前向着色在物体的渲染阶段评价材质与相关光源，将结果写入颜色缓冲。它可以是单 pass、多 pass，也可以配合深度预通过与分块灯光列表。Forward 指光照何时被计算，不意味着只能使用少量灯或简单材质。","deep":"性能主要取决于可见与被遮挡片元的着色量、每个片元处理的灯数、材质复杂度以及深度测试效率。深度预通过能降低过度着色，但增加几何提交；Forward+ 则通过先剔除无关灯，改善传统前向的多灯扩展性。","tradeoffs":"材质自由度高，透明和 MSAA 较自然，也可减少中间缓冲带宽；传统实现的多灯循环及过度着色可能昂贵。屏幕空间效果仍需额外提供深度、法线等数据。","pitfalls":["前向管线支持物理材质、GI 和光线追踪；它不是低画质渲染器的同义词。","MSAA 更容易集成不代表它消除所有闪烁，高光、法线贴图和纹理仍需要正确的过滤或其他抗锯齿。"],"related":["forward-plus","deferred","spatial-aa","render-pipeline"],"sources":[{"title":"Epic · Forward Shading Renderer","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/forward-shading-renderer-in-unreal-engine"}]},{"id":"deferred","title":"延迟着色与 G-buffer","en":"Deferred Shading","group":"pipeline","courses":["104"],"level":"进阶","summary":"先记录最终可见表面的属性，再统一计算光照，交换计算与带宽成本。","intuition":"先给照片中露出的每个表面填一张档案：法线、颜色、粗糙度和深度。等谁在前面确定后，再让灯光统一阅读这些档案上色。这样不必为后来被挡住的表面重复算复杂光照，但档案本身需要空间与读取成本。","why":"传统前向在高重叠与大量灯光场景里可能重复计算被遮挡表面的光照。延迟着色把可见性与灯光评价分开，让光照主要针对最终可见样本执行，并让多种屏幕空间效果共享表面属性，从而改善特定场景的工作量。","what":"第一阶段把可见表面的材质属性写入几何缓冲 G-buffer，第二阶段读取这些属性、评价灯光和 BRDF，输出颜色。位置常由深度重建，法线和材质参数可压缩存储；分块或聚簇灯光剔除也可用于延迟着色。","deep":"G-buffer 格式决定材质表达能力、精度和带宽，特殊材质可能需要模型标识或独立 pass。一个样本通常只保存一个表面，因而多层透明需额外策略；MSAA 可以实现，但多样本属性存储与着色会让成本和流程复杂化。","tradeoffs":"适合多灯、复杂不透明场景，并方便复用屏幕属性；代价是较高缓冲带宽、材质编码约束和特殊表面的额外路径。少灯或带宽敏感设备上未必更快。","pitfalls":["延迟着色并不是不能做透明或 MSAA，而是常需前向透明 pass、额外样本管理或专门的抗锯齿方案。","灯越多仍可能越贵，延迟着色不会自动获得无限灯光预算，阴影和光源剔除也要计算。"],"related":["forward","forward-plus","visibility-buffer","ssao","ssr"],"sources":[{"title":"GPU Gems 2 · Deferred Shading in S.T.A.L.K.E.R.","url":"https://developer.nvidia.com/gpugems/gpugems2/part-ii-shading-lighting-and-shadows/chapter-9-deferred-shading-stalker"}]},{"id":"forward-plus","title":"Forward+ 与聚簇光照","en":"Forward+ / Clustered Shading","group":"pipeline","courses":["104"],"level":"进阶","summary":"先缩小每个屏幕区域的灯光候选列表，再进行前向或延迟着色。","intuition":"全城有很多路灯，但你站在一条街上时只需关心附近的几盏。先给小块屏幕或三维视锥单元建立附近灯的名单，着色时照着名单查灯，便避免每个像素遍历全场景。它优化的是检索组织，而不是改变光的物理规律。","why":"前向材质与透明处理很方便，但朴素实现的灯光循环会随灯数迅速增长。灯对屏幕的影响通常具有空间局部性，通过提前剔除不相关灯，能保留前向的材质灵活性，同时把多灯计算集中在真正需要受影响的区域。","what":"Forward+ 通常先获得深度并把屏幕划为 tiles，构建每块的灯光列表，随后前向着色只遍历相关灯。Clustered Shading 进一步沿深度等维度划分单元，使前后相距很远的表面不必共享同一份宽泛灯光列表。","deep":"Tile 的深度范围受表面分布影响，前景和背景的深度断层可能让列表膨胀；聚簇通过更多空间划分改善这种情况。灯光剔除是可复用的架构：它既能服务前向，也能服务延迟着色，透明几何需适合其深度覆盖的列表。","tradeoffs":"多灯效率好，保持前向材质和 MSAA 的便利；新增深度预通过、列表构建与存储成本。大范围灯、大量重叠灯及稀疏深度结构仍可能形成热点。","pitfalls":["Tiled 与 Clustered 不完全相同：后者通常增加深度划分；Clustered 也不是只能用在前向管线。","只依据不透明深度裁剪灯光列表时，位于其他深度的透明表面可能漏灯，需专门的保守处理。"],"related":["forward","deferred","direct-light","render-pipeline"],"sources":[{"title":"AMD · ForwardPlus11","url":"https://github.com/GPUOpen-LibrariesAndSDKs/ForwardPlus11/"},{"title":"Olsson et al. · Clustered Deferred and Forward Shading","url":"https://www.highperformancegraphics.org/previous/www_2012/media/Papers/HPG2012_Papers_Olsson.pdf"}]},{"id":"visibility-buffer","title":"可见性缓冲","en":"Visibility Buffer","group":"pipeline","courses":["104"],"level":"专题","summary":"把“可见的是哪个图元”存下来，之后再重建它的材质属性并着色。","intuition":"G-buffer 把表面的大量资料复制到屏幕上，可见性缓冲只记住它的身份证号码。稍后根据号码去原始几何数据中取资料，并完成材质与光照。屏幕档案变小了，但着色阶段要承担查表、插值与资料重建的工作。","why":"高分辨率、多重采样和丰富材质会使 G-buffer 的存储与读写成为瓶颈。只存可见图元标识，可以更彻底地推迟材质评价，减少对被遮挡片元的纹理采样，并让可见性阶段不必承载统一的庞大材质属性格式。","what":"可见性阶段写入三角形、实例等标识及必要深度信息；着色阶段读取标识，访问对应顶点，重建重心坐标、属性与材质，然后计算光照。它是一种延迟评价方案，核心区别在于中间缓冲保存身份而非完整表面属性。","deep":"省下的屏幕带宽需要用几何访问与重建计算交换，性能依赖缓存、材质调度和图元密度。纹理导数的正确重建尤其重要，否则 mip 选择会出错。透明、变形顶点和 alpha test 仍需专门处理，不会因存 ID 自动解决。","tradeoffs":"紧凑缓冲适合高分辨率与带宽受限场景，也利于分离可见性与着色；复杂几何访问、纹理导数与特殊材质会提高实现难度，收益依赖具体硬件和内容。","pitfalls":["Visibility Buffer 不是把 G-buffer 改名；前者通常存图元身份，后者通常存已评价的材质与几何属性。","Alpha test 仍可能需要纹理读取，多层透明仍有信息保存问题，不能假定可见性阶段完全没有材质成本。"],"related":["deferred","rasterization","lod","render-graph"],"sources":[{"title":"Burns & Hunt · The Visibility Buffer","url":"https://jcgt.org/published/0002/02/04/paper.pdf"}]},{"id":"taa","title":"时域抗锯齿","en":"Temporal Anti-Aliasing / TAA","group":"pipeline","courses":["104","202"],"level":"进阶","summary":"跨帧积累不同子像素位置的样本，同时判断哪些历史数据仍可信。","intuition":"一帧拍不到的细节，换几个轻微错开的采样位置，多拍几帧后可能补齐。TAA 把上一帧的对应位置搬到当前帧，积累这些观察结果。难点在于物体会移动、遮挡会改变、灯光会变化，旧照片并不总能代表眼前发生的事。","why":"几何边缘、细纹理和尖锐高光都会超过单帧采样能力，增加单帧超采样又很昂贵。利用连续帧分摊采样，可以在较低成本下提升空间细节与时间稳定性；它也成为很多随机实时效果和时域放大方案的重要组成部分。","what":"TAA 常用投影抖动产生不同子像素样本，通过运动向量重投影历史颜色，并与当前结果累积。历史验证、邻域裁剪或限制等机制减少失效样本影响；核心是样本积累与历史可靠性判断，而非简单地把两帧平均。","deep":"新露出的区域没有对应历史，运动向量也未必正确追踪透明、高光与动画纹理。强历史权重稳定但可能拖影，弱历史权重响应快却更容易闪烁。采样滤波、曝光变化和颜色空间都会影响结果，需要一起理解重建过程。","tradeoffs":"可处理多种锯齿并压低随机效果噪声，单帧采样成本较低；可能带来模糊、拖影、细节消失和遮挡变化伪影。实现质量高度依赖运动向量、历史验证与内容。","pitfalls":["TAA 并不是运动模糊：它试图重建稳定图像，拖影通常来自错误或过度保留的历史。","随机 GI 或反射的时域去噪与 TAA 可以共享重投影思想，但估计目标和过滤规则并不完全相同。"],"related":["spatial-aa","upscaling","ssr","ssgi","render-pipeline"],"sources":[{"title":"Yang, Liu & Salvi · A Survey of Temporal Antialiasing Techniques","url":"https://research.nvidia.com/labs/rtr/publication/yang2020survey/"}]},{"id":"spatial-aa","title":"空间抗锯齿与采样","en":"SSAA / MSAA / FXAA / SMAA","group":"pipeline","courses":["101","104"],"level":"基础","summary":"提高样本覆盖或重建边缘：先分清几何、纹理与着色锯齿。","intuition":"一个像素应代表一小片区域，而不是无限小的针尖。若细线只在针尖之间经过，它可能忽亮忽灭。多取几个位置的样本能估计覆盖，或者在最终图像上识别边缘并重建；但已经完全漏掉的细节，事后滤波未必能猜回来。","why":"离散像素无法直接保存连续图像中的任意高频信号，几何边缘与细纹理因此出现阶梯和闪烁。抗锯齿需要结合预过滤、采样和重建，既降低视觉错误，也避免把所有预算都花在更高的显示分辨率或全面超采样上。","what":"SSAA 在更多子像素位置完整着色后过滤；MSAA 主要提高覆盖与深度采样，通常不对每个覆盖样本完整重复片元着色。FXAA、SMAA 等可在最终图像上识别边缘；SMAA 的不同模式还可结合空间或时间超采样。","deep":"几何锯齿、纹理走样和高光闪烁有不同来源。MSAA 改善轮廓并不保证解决材质内部高频；纹理应采用 mip 与适当过滤，法线与粗糙度也需考虑预过滤。后处理边缘算法受限于已渲染信息，不能把滤波视为凭空补采样。","tradeoffs":"SSAA 通用但代价高；MSAA 对几何覆盖有效但增加样本存储；FXAA/SMAA 基础模式集成较轻，可能损失细节且难恢复子像素信息。选择取决于问题来源与管线结构。","pitfalls":["MSAA 的样本数不等于每像素完整材质着色次数，也不能自动消除高光和纹理走样。","SMAA 存在多种组合模式，不能把所有 SMAA 都归为只读取单帧颜色的纯空间滤波。"],"related":["taa","rasterization","lod","upscaling"],"sources":[{"title":"Jimenez et al. · SMAA: Enhanced Subpixel Morphological Antialiasing","url":"https://www.iryoku.com/smaa/downloads/SMAA-Enhanced-Subpixel-Morphological-Antialiasing.pdf"},{"title":"Microsoft · Rasterizer Stage","url":"https://learn.microsoft.com/en-us/windows/win32/direct3d11/d3d10-graphics-programming-guide-rasterizer-stage"}]},{"id":"upscaling","title":"放大与图像重建","en":"Spatial / Temporal Upscaling","group":"pipeline","courses":["104","202"],"level":"专题","summary":"先以较低分辨率渲染，再利用当前与历史信息重建显示分辨率图像。","intuition":"画大图很贵，可以先画一张较小的图，再利用边缘、深度和多帧错位观察补成大图。空间放大只研究眼前这张小图，时域放大还借用以前的样本。后者可补充信息，但场景快速变化时，旧信息的可靠性就成为关键。","why":"高显示分辨率显著增加着色与追踪成本，往往让画质效果和帧率无法兼顾。把内部渲染分辨率与输出分辨率分离，可以把预算用于更复杂光照；重建算法则利用已有样本结构，尽量保留细节和时间稳定性。","what":"空间放大从当前低分辨率图像进行边缘感知重建与锐化；时域放大常读取颜色、深度、运动向量、曝光及历史帧，并输出更高分辨率图像。学习式方法可参与重建，具体输入和位置依实现而定，不能仅凭品牌推断算法。","deep":"时域放大与 TAA 共用积累和历史验证思想，但要在不同采样网格之间重建。透明、粒子、遮挡变化与动画纹理需要特别处理；输入分辨率过低时，未被可靠采到的细节仍难恢复。锐化提升局部对比，不等于恢复真实信息。","tradeoffs":"可显著降低内部渲染工作量，时域方法能利用多帧样本；重建本身也有成本，并可能出现拖影、细线闪烁和错误锐化。输入质量、运动向量与内容类型决定实际收益。","pitfalls":["图像放大重建与帧生成目标不同：前者提高空间输出分辨率，后者生成时间上额外的画面。","输出为 4K 不代表每帧原生渲染了全部 4K 样本，评估时应同时观察运动、遮挡与细小几何。"],"related":["taa","spatial-aa","render-pipeline","lod"],"sources":[{"title":"AMD · FidelityFX Super Resolution 2","url":"https://gpuopen.com/manuals/fidelityfx_sdk/techniques/super-resolution-temporal/"}]},{"id":"tone-mapping","title":"曝光、色调映射与显示变换","en":"Exposure / Tone Mapping / Display Transform","group":"pipeline","courses":["104"],"level":"进阶","summary":"把场景的 HDR 光照结果转换为目标屏幕和观看条件能够呈现的外观。","intuition":"室内暗墙和太阳高光的亮度差远超普通屏幕能同时显示的范围。曝光像决定相机整体接收多少亮度，色调映射像把宽大的亮度阶梯压进屏幕能容纳的阶梯。压缩应保留层次与颜色关系，而不是把亮处直接截成同一片白。","why":"物理光照结果可能远大于显示编码范围，直接裁剪会丢失高光结构，直接缩放又可能让阴影难以辨认。不同 SDR、HDR 屏幕还具有不同峰值亮度与色域，因此需要明确的输出变换，把场景数据变为可预测的显示结果。","what":"曝光缩放场景线性光照值；色调映射控制亮度动态范围与外观，完整显示变换还可能处理色域、白点和编码传递函数。ACES 等系统把渲染变换与显示编码组合成输出变换，目标是特定设备和观看条件下的呈现。","deep":"工作空间的线性 HDR 数据属于场景参考，输出属于显示参考，这两个语境不应混用。映射曲线会影响高光饱和度和材质颜色感知；HDR 显示也需要适合目标亮度的映射。调色、曝光和输出顺序会改变最终外观。","tradeoffs":"能够同时保留亮暗层次并建立一致外观；映射本身改变对比与颜色，不存在适合所有内容的唯一曲线。过强压缩会变灰，错误色域处理会导致高光偏色或剪裁。","pitfalls":["Tone mapping 不等于 gamma/sRGB 编码，后者描述数值如何编码或显示，并不负责完整的 HDR 外观压缩。","常见 ACES fitted 曲线只是近似方案的一部分，不能自动等同于完整 ACES 色彩管理与输出变换。"],"related":["color-management","render-pipeline","direct-light"],"sources":[{"title":"ACES · Output Transforms","url":"https://docs.acescentral.com/system-components/output-transforms/"}]},{"id":"color-management","title":"线性工作流与色彩管理","en":"Linear Workflow / Color Management","group":"pipeline","courses":["101","104"],"level":"基础","summary":"给颜色数据正确的含义：输入解码，在线性光空间计算，再转换为显示输出。","intuition":"两个灯的能量相加，应像两个水流量相加一样直接；但图片中的 RGB 数字常经过非线性编码，数字翻倍并不代表光能翻倍。先把颜色翻译到可正确计算的空间，再渲染、过滤和混合，最后翻译成屏幕需要的编码。","why":"混用编码颜色与线性光照会造成错误混合、过暗过亮的材质和不一致的过滤结果。不同贴图还可能保存颜色、方向或标量，不能一律使用相同转换。色彩管理使输入资产、工作空间、调色和输出设备之间的关系明确可控。","what":"线性工作流先解码颜色纹理到线性工作空间，进行材质、光照和适当合成，再通过显示变换输出。色彩管理还处理色域、白点和传递函数。法线、粗糙度、金属度等数据贴图通常属于非颜色数据，不应套用 sRGB 解码。","deep":"线性与 HDR 是不同概念，浮点格式也不能独自说明色彩空间。sRGB 的传递函数是分段函数，常用 gamma 近似并非完全相同；不同线性色域仍需转换。颜色纹理的过滤与 mip 生成应在正确语境下进行，避免错误平均光能。","tradeoffs":"正确流程提高灯光、材质和输出的一致性；需为资产与缓冲声明空间并管理转换。问题常表现得像照明或材质 bug，却真正来自重复解码、错误数据标记或输出路径。","pitfalls":["不能把粗糙度、法线与深度贴图标成 sRGB；它们存的是参数数据，非显示颜色。","linear、HDR、浮点和宽色域互不等价，不能只凭文件格式或数值大于 1 判断完整的颜色语义。"],"related":["tone-mapping","ibl","lod","render-pipeline"],"sources":[{"title":"Blender · Color Spaces and Linear Workflow","url":"https://docs.blender.org/manual/en/dev/render/color_management/color_spaces.html"}]},{"id":"lod","title":"细节层级、纹理过滤与预算","en":"Level of Detail / Mipmaps / Anisotropic Filtering","group":"pipeline","courses":["101","104"],"level":"进阶","summary":"按屏幕可辨认的尺度分配几何、纹理和着色细节，兼顾稳定性与成本。","intuition":"远处一棵树只占几个像素，就不必保留近景时的每片叶子；远处地砖也不应让一个像素随机挑中某条细缝。几何 LOD 删去看不清的形状，纹理 mip 保存平均后的细节，两者都在匹配屏幕真正能表达的尺度。","why":"场景复杂度可以不断增长，但屏幕样本与 GPU 时间始终有限。远处或细小物体的过量几何浪费预算，纹理高频直接采样还会闪烁。按投影大小调整表示和预过滤，既减少成本，也避免无法解析的细节破坏稳定性。","what":"几何 LOD 使用不同复杂度的网格或连续层级，常按屏幕尺寸或误差选择；mipmap 是逐层预过滤的纹理，匹配像素足迹。三线性过滤平滑 mip 过渡，各向异性过滤进一步处理斜视时拉长的纹理足迹，保留适当方向细节。","deep":"距离只是尺度的代理，视角、物体尺寸和分辨率都影响投影误差。颜色、法线和 BRDF 参数的过滤规律也不同，简单平均法线并不保证正确高光。LOD 切换需控制跳变，动态分辨率与放大还会影响可接受的纹理和几何细节。","tradeoffs":"能大幅降低场景和纹理访问成本，并改善远处稳定性；制作与切换管理更复杂，过度简化会破坏轮廓。各向异性过滤提高斜视清晰度，也增加纹理采样工作。","pitfalls":["Mipmaps 主要解决纹理缩小与预过滤，不等同于几何 LOD；各向异性过滤也不能替代所有 mip 层级。","LOD 阈值应考虑屏幕投影大小或误差，固定距离对不同尺寸物体与视野并不一致。"],"related":["spatial-aa","upscaling","visibility-buffer","color-management"],"sources":[{"title":"Epic · Creating and Using LODs","url":"https://dev.epicgames.com/documentation/unreal-engine/creating-and-using-lods-in-unreal-engine"},{"title":"Microsoft · Texture Filtering with Mipmaps","url":"https://learn.microsoft.com/en-us/windows/uwp/graphics-concepts/texture-filtering-with-mipmaps"}]},{"id":"render-graph","title":"渲染图与资源依赖","en":"Render Graph / Frame Graph","group":"pipeline","courses":["104"],"level":"专题","summary":"用每个 pass 读写哪些资源描述一帧，辅助调度、同步和内存管理。","intuition":"先写下每道工序要读什么、产出什么：反射要深度，光照要材质，显示要 HDR 颜色。把这些依赖连成图，就知道谁必须等谁，哪些工序可以同时做，哪些临时缓冲已经用完，可以把空间交给之后的工作。","why":"现代显式图形 API 把资源状态、同步和内存复用责任交给引擎，大量手工管理容易出错，也难观察整帧机会。把 pass 与资源依赖声明出来，可让系统分析资源生命周期、插入必要屏障，并辅助消除无用工作与并行调度。","what":"Render Graph 是组织渲染工作与资源生命周期的工程架构：节点通常是 pass，边体现读写依赖。图编译阶段可推导执行顺序、资源状态和临时内存需求，再提交图形或计算任务。它可以承载前向、延迟和混合光线追踪管线。","deep":"正确读写声明是优化和同步的基础，图无法自动理解未声明的外部副作用。资源别名要依据生命周期，异步计算收益取决于真实硬件重叠与竞争。历史资源、导入外部纹理和输出提取需要跨帧管理，不能只看单帧内部图。","tradeoffs":"减少手工状态管理并提供全帧优化机会，便于观察复杂管线；增加框架与调试学习成本。资源声明不足或过于保守会分别导致错误或抑制并行与复用收益。","pitfalls":["Render Graph 是调度与资源管理架构，不是阴影、GI 或光传输算法，本身不会让画面更物理。","图中独立的节点未必执行时就更快并行，GPU 单元、带宽、队列和同步开销仍会限制收益。"],"related":["render-pipeline","deferred","visibility-buffer","taa"],"sources":[{"title":"Epic · Rendering Dependency Graph","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/rendering-dependency-graph?application_version=4.27"}]},{"id":"prt","title":"PRT：预存物体怎样传光","en":"Precomputed Radiance Transfer","group":"lighting","courses":["202"],"level":"进阶","summary":"预计算的是光照传输响应，可以对新的环境光重新求值。","intuition":"与其每次重新计算雕像的自遮挡和反弹，不如提前测量它对不同方向光的响应。运行时把当前环境光和这些响应组合，就能快速得到有遮挡感的照明。","why":"环境光来自许多方向，实时逐方向追踪遮挡和多次反弹很贵；但静态物体的传光关系重复出现。提前计算不随当前灯光改变的部分，就能在运行时节省查询。","what":"PRT 把光照与传输函数投影到基函数空间，典型低频方法使用球谐函数。运行时组合光照系数与传输系数；相比固定结果的 lightmap，它更强调对不同照明的响应。","deep":"低阶球谐善于表示平滑方向分布，难以保持锐利阴影和窄高光。经典方案适合预处理对象和低频环境光；变形或新的遮挡关系通常会破坏已有传输。","tradeoffs":"运行时快，并可保留预计算的复杂传输；代价是预计算、存储和对几何变化的限制。提升角度频率也会增加表示成本。","pitfalls":["PRT 不只是把当前光照烘焙成一张颜色贴图。","光照可以改变，不代表任意几何变化都能直接支持。"],"related":["precomputed-gi","ibl","global-illumination"],"sources":[{"title":"Sloan 等：Precomputed Radiance Transfer 原论文","url":"https://www.microsoft.com/en-us/research/wp-content/uploads/2017/01/prt.pdf"}]},{"id":"rsm","title":"RSM：被照亮的表面变成小灯","en":"Reflective Shadow Maps","group":"lighting","courses":["202"],"level":"进阶","summary":"在阴影图中增加表面信息，近似一次间接反射。","intuition":"灯光能看到的地板、墙面已经被它照亮。把这些表面当作很多小光源，就能近似计算它们对别处的补光，而不用完整枚举所有多次反弹。","why":"传统阴影图只告诉我们光源看到的深度，丢掉了这些表面反射光的能力。若同时保存法线、位置和反射通量，就能复用光源视图来生成间接光的候选。","what":"反射阴影图扩展 shadow map，把采样到的受光表面视为虚拟点光源 VPL。选择并累积部分 VPL 的贡献，可以近似一跳间接漫反射，之后常结合插值或空间表示降低成本。","deep":"关键困难是大量 VPL 的成本，以及接收点到 VPL 的次级遮挡。若省掉后者，光可能穿过墙；若照搬点光源，又可能在近距离出现不稳定的大贡献。","tradeoffs":"复用已有光源视图，能响应动态直接照明；覆盖范围受光源视图约束，且多次传播、次级可见性和稳定采样都需要额外处理。","pitfalls":["RSM 不是把阴影图滤得更柔和。","多出来的间接光不代表次级遮挡自动正确。"],"related":["shadow-map","lpv","global-illumination","sampling"],"sources":[{"title":"GAMES202：RSM 讲义与原论文入口","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games202.html"}]},{"id":"lpv","title":"LPV：把间接光放进空间格子","en":"Light Propagation Volumes","group":"lighting","courses":["202"],"level":"进阶","summary":"用低频方向信息在三维网格中近似传播光。","intuition":"把场景分成空间格子，在每个格子记录向周围传播的光，再让信息逐步流向相邻格子。物体从附近格子取补光，因此不必对每个像素单独寻找所有间接光源。","why":"逐个累积大量 VPL 很贵，间接漫反射又经常比较平滑。共享空间中的照明，可以把大量点对点工作转为低分辨率的注入、传播与查询。","what":"LPV 通常把 RSM 生成的光注入三维网格，以低阶球谐保存方向分布，并迭代向邻居传播，获得近似漫反射间接照明。它是空间离散的 GI 方法，而非用于烟雾的体积材质模型。","deep":"格子尺寸决定了能保留的空间细节，低阶方向表示决定了角度细节。薄墙比格子小、遮挡表示不足或传播过度时容易漏光；传播次数也不能简单等同于真实表面反弹次数。","tradeoffs":"查询便宜、支持动态更新，适合较平滑的补光；空间与方向分辨率不足会损失细节，网格覆盖范围和漏光控制存在取舍。","pitfalls":["LPV 的体积是照明缓存，不意味着在渲染参与介质。","格子传播不是精确追踪真实光路。"],"related":["rsm","voxel-gi","ddgi","global-illumination"],"sources":[{"title":"Kaplanyan：Light Propagation Volumes in CryEngine 3","url":"https://advances.realtimerendering.com/s2009/Light_Propagation_Volumes.pdf"}]},{"id":"voxel-gi","title":"体素锥追踪：一次查询一束方向","en":"Voxel Cone Tracing · VXGI family","group":"lighting","courses":["202"],"level":"进阶","summary":"用分层体素保存场景与光，把光线扩展成可滤波的锥。","intuition":"模糊反射需要看向一片方向，而不是极细的一根线。把场景体素化并建立多层分辨率后，越远的锥可以读取越粗的层级，近似把一束方向里的光一次取回来。","why":"漫反射和粗糙高光包含宽方向范围，逐射线采样可能很昂贵。分层空间表示把光照预先滤波，允许用少量锥查询获得较平滑的间接照明。","what":"Voxel Cone Tracing 把几何、遮挡与辐射信息存进分层体素结构，通过逐步扩大的锥采样不同 mip 层级。可用于近似漫反射 GI、粗糙镜面 GI 和 AO；VXGI 是相关技术体系中的具体实现。","deep":"空间预滤波会混合遮挡与光照，薄结构和锐利镜面最难保持。体素尺寸、方向信息、更新频率与锥宽度共同决定质量。它不是在三角网格上精确执行路径追踪。","tradeoffs":"不依赖当前屏幕，能覆盖屏幕外信息；代价是体素化、内存和动态更新。粗糙反射较合适，镜面细节、漏光与大范围场景仍有挑战。","pitfalls":["锥追踪不是更多光线的精确等价替代。","提高体素分辨率会显著增加存储与更新压力。"],"related":["lpv","ddgi","ssgi","ssr","global-illumination"],"sources":[{"title":"Crassin 等：Interactive Indirect Illumination Using Voxel Cone Tracing","url":"https://research.nvidia.com/labs/rtr/publication/crassin2011givoxels/"}]},{"id":"ltc","title":"LTC：让面光源积分变便宜","en":"Linearly Transformed Cosines","group":"lighting","courses":["202"],"level":"进阶","summary":"用容易积分的分布拟合 BRDF，快速评估多边形面光。","intuition":"长方形灯会在金属上留下有形状的高光。把它当成一个点就失去了面积和形状；把它拆成许多点又很贵。LTC 用可解析积分的近似形状来代替难积分的反射分布。","why":"实时系统需要面光源的柔和照明和自然高光，但对整个发光面积积分 BRDF 成本高。若能将复杂分布拟合为容易积分的分布，就可以减少实时采样。","what":"LTC 对截断余弦分布施加线性变换，拟合不同粗糙度与视角下的反射瓣。其多边形域积分可转为基础余弦分布的积分，拟合参数通常通过表查询获得。","deep":"这是着色积分的近似，不自动解决面光源到表面的复杂遮挡。拟合误差在不同材质与角度下变化；实际系统仍要另外设计阴影与可见性处理。","tradeoffs":"面光源评估高效、噪声少、保留高光形状；受拟合模型与表精度限制，遮挡、复杂分层材质和特殊散射需要扩展。","pitfalls":["有面光高光不代表已经拥有正确的面光软阴影。","LTC 是积分近似技术，不是一种材质。"],"related":["direct-light","microfacet","soft-shadow","brdf"],"sources":[{"title":"Heitz 等：Real-Time Polygonal-Light Shading with LTC","url":"https://eheitzresearch.wordpress.com/415-2/"}]},{"id":"shadow-map","title":"阴影贴图","en":"Shadow Mapping","group":"lighting","courses":["101","104","202"],"level":"基础","summary":"从灯的视角记录最近表面，再判断相机看见的点是否被挡住。","intuition":"给灯装一台相机：先拍下它能看到的最近距离。真正画画时，若某个表面到灯的距离，比灯照片记录的距离更远，就说明前面有遮挡物。这一张深度照片，把大量“灯能否看见这个点”的问题变成了查表。","why":"材质只能决定光到达表面后如何反射，还必须知道光有没有被途中物体挡住。对每个受光点追踪阴影光线可能昂贵，而从灯视角光栅化一次能复用 GPU 高吞吐量，用一张深度贴图服务很多相机像素的遮挡判断。","what":"阴影贴图保存光源视角的深度。着色时把表面点变换到相同坐标系，比较它的深度与贴图深度，得到可见或被遮挡。方向光、聚光灯和点光源需要不同投影；点光源常使用立方体贴图，方向光常使用级联覆盖大场景。","deep":"主要问题来自有限分辨率、投影采样分配和深度精度，而不仅是滤波不够。Bias 解决自遮挡误差却可能令影子与物体脱离；级联改善近远分辨率分配，同时需要稳定投影和过渡管理，避免摄像机移动时出现跳动。","tradeoffs":"适合动态场景，易与多种着色管线组合，并可复用深度图；每个灯仍需额外渲染和存储。大场景、细小几何与多个投影使精度、稳定性和成本难以兼顾。","pitfalls":["直接双线性过滤深度再比较，一般不等同于 PCF；PCF 过滤的是深度比较后的可见性结果。","增大 bias 会减轻 shadow acne，却可能产生 peter-panning；它不是越大越好的画质参数。"],"related":["soft-shadow","direct-light","rasterization","render-pipeline"],"sources":[{"title":"GPU Gems · Shadow Map Antialiasing","url":"https://developer.nvidia.com/gpugems/gpugems/part-ii-lighting-and-shadows/chapter-11-shadow-map-antialiasing"}]},{"id":"soft-shadow","title":"软阴影与半影","en":"Soft Shadows / PCF / PCSS / VSM","group":"lighting","courses":["104","202"],"level":"进阶","summary":"光源具有面积时会被部分遮住；软边来自可见光源比例的变化。","intuition":"一盏小点灯要么被挡住、要么没被挡住；一扇发光窗户却可能只被挡住一半。表面收到的光随看见窗户的比例渐变，于是形成半影。通常遮挡物贴近接收面时边缘更硬，分离后半影变宽，不能只用固定模糊半径解释。","why":"硬阴影缺少面积光源带来的接触与距离线索，容易让物体显得悬浮或灯光显得不真实。精确积分面积光源的可见性需要很多样本，实时渲染因此发展出过滤阴影贴图、估计半影宽度和矩统计等降低成本的近似。","what":"PCF 对多个深度比较结果取平均，主要抑制锯齿并形成软边；PCSS 先找平均遮挡深度，再估计半影和可变滤波范围。VSM 等矩方法保存深度统计量，让可见性近似可被高效过滤；追踪面积光样本则更直接地估计遮挡。","deep":"算法分别近似了面积光可见性、遮挡深度分布或滤波过程，其误差来源不同。PCSS 的平均遮挡模型在复杂多层遮挡中会失真；VSM 的概率上界可能漏光。辨认接触硬化、采样噪声与过滤漏光，有助于选择正确方案。","tradeoffs":"PCF 简单但固定滤波不表达真实半影变化；PCSS 更有距离感但采样增多；矩方法便于大范围过滤却可能漏光；光线追踪更通用，但需样本、去噪与时间预算。","pitfalls":["PCF 的软边不自动等于物理面积光阴影；固定核尤其无法自然表达随距离变化的半影。","软阴影来自光源的角尺寸与遮挡关系，不来自材质粗糙度；粗糙度主要改变表面散射分布。"],"related":["shadow-map","direct-light","taa"],"sources":[{"title":"NVIDIA · Integrating Realistic Soft Shadows","url":"https://developer.download.nvidia.com/assets/gamedev/docs/PCSS_Integration.pdf"},{"title":"GPU Gems 3 · Summed-Area Variance Shadow Maps","url":"https://developer.nvidia.com/gpugems/gpugems3/part-ii-light-and-shadows/chapter-8-summed-area-variance-shadow-maps"}]},{"id":"direct-light","title":"直接光照与光源","en":"Direct Illumination / Light Sources","group":"lighting","courses":["101","104","202"],"level":"基础","summary":"直接光是从发光体到着色表面，中间没有其他散射事件的入射贡献。","intuition":"把光的路线分段看：灯直接照到桌子，是桌子的直接光；先照红墙、再由红墙照到桌子，是桌子的间接光。计算直接光时，既要问灯发出多少光、离得多远，也要问有没有遮挡以及桌面把光反射向哪里。","why":"“表面乘一个亮度”无法区分距离衰减、朝向、光源面积与材质响应。把光源、可见性和散射模型分开，才能解释同一材质为何随灯的位置改变外观，也能为阴影、多灯采样和全局光照建立明确的物理基线。","what":"直接光照组合光源辐射、几何关系、可见性和 BSDF，估计光源到当前表面的贡献。点光、方向光、聚光与面积光具有不同空间分布；环境光也可作为无限远光源直接参与计算，直接或间接由路径结构判断。","deep":"点光源是理想化的 delta 分布，面积光则需对发光区域或方向积分，不能把两者的公式与 PDF 随意混用。辐射亮度沿无遮挡真空光线保持不变，但点光造成的辐照度具有距离平方衰减，先分清物理量与单位。","tradeoffs":"点光和方向光便于实时评价但形态理想化；面积光能自然表现软阴影与宽高光，积分更贵。多灯场景还要兼顾光源剔除、重要性采样及阴影预算。","pitfalls":["“直接光照”不等于“只用点光”，天空或环境贴图在某个表面上也可构成直接光源贡献。","阴影是直接光路径的可见性项，不能用把材质 base color 调暗来代替遮挡计算。"],"related":["shadow-map","soft-shadow","ibl","forward-plus"],"sources":[{"title":"PBRT 4 · Light Interface","url":"https://www.pbr-book.org/4ed/Light_Sources/Light_Interface"},{"title":"PBRT 4 · Area Lights","url":"https://pbr-book.org/4ed/Light_Sources/Area_Lights"}]},{"id":"ibl","title":"基于图像的照明","en":"Image-Based Lighting / IBL","group":"lighting","courses":["104","202"],"level":"进阶","summary":"把来自各方向的环境光放进贴图，让材质自然反映所在环境。","intuition":"一颗金属球不仅映出主灯，也映出天空、窗户和暗墙。可以把这些方向上的光拍成一张环境地图，再让每个表面按自己的朝向与粗糙度读取它。粗糙金属看到宽而模糊的环境，镜面金属看到较清楚的方向细节。","why":"少量解析灯难以表达复杂环境的颜色、方向与高动态范围，物体会显得脱离场景。直接对整张环境图逐方向积分又太昂贵，因此 IBL 用预计算和重要性采样，把丰富环境照明压缩成适合材质快速评价的数据。","what":"IBL 用环境辐射贴图作为入射光源，计算漫反射与镜面反射。实时实现常预计算漫反射辐照度，用不同粗糙度的预过滤环境图表示镜面响应，再结合 BRDF 查找表。它是照明表示与积分策略，而非完整 GI 的别名。","deep":"常见 split-sum 将环境与 BRDF 的联合积分近似拆开，在尖锐光源、某些粗糙度和掠射角会产生误差。环境通常被视为无限远，局部探针及视差校正能改善房间反射，却仍不能精确表示任意位置的遮挡与多次反弹。","tradeoffs":"预计算后运行时便宜，能让材质获得丰富环境响应；空间变化与遮挡信息有限。更新动态环境、布置局部探针以及对小而亮光源的采样，都会带来额外成本。","pitfalls":["环境立方体贴图本身不记录当前表面到场景各处的遮挡关系，不能自动生成所有局部阴影。","用于天空照明的 IBL 可属于直接光；场景捕获探针可能包含已反弹光，二者不能只凭贴图形式混为一谈。"],"related":["direct-light","precomputed-gi","ssr","color-management"],"sources":[{"title":"Brian Karis · Real Shading in Unreal Engine 4","url":"https://cdn2.unrealengine.com/Resources/files/2013SiggraphPresentationsNotes-26915738.pdf"},{"title":"Google · Filament Rendering Reference","url":"https://google.github.io/filament/main/filament.html"}]},{"id":"ssao","title":"环境遮蔽与 SSAO","en":"Ambient Occlusion / SSAO / GTAO","group":"lighting","courses":["104","202"],"level":"进阶","summary":"近似表面附近的环境可见性，为缝隙、接触处与凹陷增加空间线索。","intuition":"桌脚旁、墙角和衣服褶皱通常看见的外部环境更少，所以在宽泛环境照明下会显得更暗。AO 像估计一个点向外看时被邻近几何遮住的比例；SSAO 借相机深度照片推测这件事，画面里没有的信息就无法完整恢复。","why":"只有直接灯和均匀环境亮度时，接触处与细微凹陷容易缺少层次。完整计算所有间接路径很贵，而近场环境遮蔽可以用低成本补充局部形状线索。屏幕空间方法复用已经渲染的深度和法线，适合动态画面快速处理。","what":"AO 近似半球方向的遮挡，通常含余弦权重与距离衰减；SSAO 从深度或 G-buffer 估计邻域几何。HBAO、GTAO 等采用不同积分与几何近似。AO 输出主要是遮蔽因子，有时还输出 bent normal，不能直接搬运反弹光颜色。","deep":"AO 与均匀环境光下的可见性有关，而真实 GI 同时依赖光源方向、材质与多次散射。把 AO 乘到全部光照上会重复遮蔽直接光或已有 GI；镜面环境遮蔽还与观察方向、粗糙度有关，不能一律沿用漫反射 AO 标量。","tradeoffs":"成本相对可控，接触与小尺度形状增强明显；屏幕边界、薄物体和深度不连续处可能出现光晕、闪烁或过度变暗。它适合辅助照明，不能替代完整光传输。","pitfalls":["AO 不等于 GI：它通常没有颜色溢出、间接能量传递与完整多次反弹。","增大 SSAO 半径不会让它获得画面之外的几何，可能只扩大错误阴影与轮廓光晕。"],"related":["ssgi","deferred","ibl","ddgi"],"sources":[{"title":"McGuire et al. · Scalable Ambient Obscurance","url":"https://research.nvidia.com/publication/2012-06_scalable-ambient-obscurance"},{"title":"NVIDIA · Horizon-Based Ambient Occlusion Plus","url":"https://developer.nvidia.com/rendering-technologies/horizon-based-ambient-occlusion-plus"}]},{"id":"ssr","title":"屏幕空间反射","en":"Screen-Space Reflections / SSR","group":"lighting","courses":["104","202"],"level":"进阶","summary":"沿反射方向在相机已有的深度图中寻找命中，再复用屏幕颜色。","intuition":"你已经有一张场景照片和它的深度图，就沿镜面应当看到的方向，在这张照片里寻找被反射的物体。找到后借用那里的颜色，地面便能映出眼前的角色。但角色走到画面外时，照片里就没有可借用的资料了。","why":"局部动态反射对材质可信度很重要，但重新渲染反射视角或追踪完整场景需要额外成本。SSR 复用现成画面，让当前可见物体很快进入反射；它特别适合与环境探针或场景光线追踪组合，提供便宜的近场反射细节。","what":"SSR 从表面生成镜面或粗糙反射方向，将射线投影到屏幕，在深度图或层级深度中搜索可能交点，读取场景颜色。粗糙表面可采用随机采样与时空去噪；命中置信度不足的区域需要回退到其他反射来源。","deep":"相机深度通常只记录最前一层表面，既缺少背面和隐藏层，也缺少屏幕外几何。射线步进、厚度假设与颜色的观察方向还会引入近似；命中颜色来自相机方向，并不必然等于该点向反射观察方向发出的辐射。","tradeoffs":"能反映屏幕内的动态细节，成本比重新采集完整场景通常低；会在屏幕边缘和遮挡区域漏失，也依赖去噪与回退。粗糙反射的稳定性及命中可靠度更难控制。","pitfalls":["SSR 可以在屏幕表示上追踪或步进反射射线，但不等于拥有完整场景的世界空间光线追踪。","增加步进次数可改善搜索精度，却不能找回画面外物体、被遮挡层或正确的任意方向出射颜色。"],"related":["ibl","ssgi","deferred","taa"],"sources":[{"title":"AMD · FidelityFX SSSR Technology","url":"https://media.githubusercontent.com/media/GPUOpen-Effects/FidelityFX-SSSR/master/docs/FFX_SSSR_Technology.pdf"},{"title":"AMD · SSSR Sample","url":"https://gpuopen.com/manuals/fidelityfx_sdk/samples/stochastic-screen-space-reflections/"}]},{"id":"ssgi","title":"屏幕空间全局光照","en":"Screen-Space Global Illumination / SSGI","group":"lighting","courses":["104","202"],"level":"进阶","summary":"利用屏幕内的深度与受光颜色，估计局部的间接光和颜色溢出。","intuition":"SSR 问镜面沿某个方向看见谁，SSGI 则在表面周围多个方向寻找能照亮它的邻居。如果红墙和桌子都在照片里，可以借红墙的受光颜色，估计它给桌子的红色反弹光；一旦红墙离开照片，信息便变得不完整。","why":"动态间接光让场景摆脱只有均匀环境亮度的感觉，但世界空间 GI 往往需要复杂结构与大量更新。SSGI 使用已经存在的屏幕数据，快速补充当前视野的反弹光、发光物体影响与接触细节，特别适合作为 GI 的辅助层。","what":"SSGI 在深度表示上采样或追踪邻近方向，结合场景受光颜色、几何关系与材质，估计到达当前表面的间接贡献。实现可能使用随机采样、分辨率缩减、层级深度和时空过滤；具体能表示的反弹范围取决于数据来源。","deep":"屏幕颜色是观察方向上的结果，深度多为单层，因此估计既有可见性遗漏，也有方向辐射近似。低频间接光能用时空滤波压低噪声，却会引入延迟。应结合烘焙、探针或追踪 GI，并明确如何融合以避免能量重复。","tradeoffs":"易复用已有缓冲，能快速响应屏幕内动态物体与发光变化；画面外贡献、隐藏表面和视角变化容易造成漏光或不稳定，常需世界空间方法补足照明基础。","pitfalls":["SSGI 能产生间接光颜色；SSAO 通常只是遮蔽因子，二者并非同一个效果的不同名称。","将上一帧已含间接光的颜色无控制地再次作为光源，可能形成反馈、重复计能或过度发亮。"],"related":["ssao","ssr","ddgi","precomputed-gi","taa"],"sources":[{"title":"Epic · Screen Space Global Illumination","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/screen-space-global-illumination?application_version=4.27"},{"title":"McGuire et al. · Fast Global Illumination Approximations on Deep G-Buffers","url":"https://research.nvidia.com/sites/default/files/pubs/2014-06_Fast-Global-Illumination/paper.pdf"}]},{"id":"ddgi","title":"动态漫反射全局光照","en":"Dynamic Diffuse Global Illumination / DDGI","group":"lighting","courses":["104","202"],"level":"专题","summary":"用动态更新的世界空间探针缓存漫反射间接光，分摊追踪成本。","intuition":"在房间里布置一组小型光照记录仪，它们发射射线观察周围受光情况，再记录各方向来的漫反射照明。表面需要间接光时查询附近记录仪，而不是每个像素重做全部调查。记录遮挡距离还能帮助减少隔墙借光。","why":"屏幕空间 GI 随相机视野丢失信息，静态烘焙又难响应灯与物体变化。漫反射间接光通常较平滑，可以在世界空间缓存并逐帧更新；DDGI 用少量探针射线与插值，让动态 GI 的成本不完全随屏幕像素数增长。","what":"DDGI 以世界空间探针保存辐照度，并利用射线命中距离的统计量辅助可见性感知插值。射线结果逐帧融入探针，表面查询附近探针获取间接漫反射光。它经常与独立的直接光照、镜面反射和屏幕空间细节共同使用。","deep":"探针间距决定能表达的空间频率，距离统计改善漏光却不是精确几何可见性。时间累积带来稳定性，也让快速光照变化滞后；探针置于墙内、狭窄通道或密集薄墙时需要重定位、分类或更密集布局等工程策略。","tradeoffs":"世界空间缓存可覆盖屏幕外贡献，运行时查询较便宜并支持动态更新；需探针存储、射线更新和时间收敛预算。细小遮挡及快速变化更难，镜面反射通常另行处理。","pitfalls":["DDGI 的 Diffuse 表明其核心缓存服务漫反射间接光，不能直接替代所有粗糙度下的镜面反射。","带可见性统计的探针能减轻漏光，但有限空间分辨率和近似插值仍可能产生误差。"],"related":["precomputed-gi","ssgi","ibl","ssao"],"sources":[{"title":"Majercik et al. · Dynamic Diffuse Global Illumination with Ray-Traced Irradiance Fields","url":"https://www.jcgt.org/published/0008/02/01/paper-lowres.pdf"},{"title":"NVIDIA · Integrating DDGI","url":"https://developer.nvidia.com/blog/an-engineers-guide-to-integrating-ddgi/"}]},{"id":"precomputed-gi","title":"预计算光照与 PRT","en":"Lightmaps / Probes / Precomputed Radiance Transfer","group":"lighting","courses":["104","202"],"level":"进阶","summary":"把昂贵的光传输提前计算，运行时读取结果或评价预计算的传输响应。","intuition":"如果房间布局不会改变，就先花时间计算墙面反弹光，把答案写到贴图或探针里。另一条路是先记录物体“如何搬运来自各方向的光”，运行时再代入当前环境灯光。前者像背答案，后者像先做一份可复用的解题公式。","why":"复杂 GI 可以显著提高画面可信度，但每帧重新求解并不总是值得。静态场景、受约束灯光或固定几何允许把大量工作移到离线阶段，换取稳定、低噪声的实时输出，使移动设备与大场景也能使用丰富间接照明。","what":"Lightmap 在表面纹理中保存烘焙光照，光照探针把结果保存于空间采样点，供动态对象插值。PRT 预计算几何与材质的光传输响应，运行时与光照系数组合；低阶球谐版本侧重低频照明，其他基底也有对应研究。","deep":"烘焙结果与传输系数的可变化范围不同：改变已烘焙光源通常要重新计算，而固定几何的 PRT 可允许环境照明变化。Lightmap 的 UV、分辨率与接缝影响细节；探针的插值和遮挡影响动态对象；预计算也能用于多种混合方案。","tradeoffs":"运行时成本低，容易得到稳定照明；预处理时间、存储和修改场景的代价较高。允许变化的几何、材质和光源范围由预计算内容决定，不能把所有方法都视为完全静态。","pitfalls":["PRT 不等同于存一张固定光照贴图：它可以预计算传输并在运行时改变允许范围内的环境照明。","动态物体从静态探针接收光，并不意味着它对场景的遮挡与反弹贡献也已经动态更新。"],"related":["ddgi","ibl","ssgi","direct-light"],"sources":[{"title":"Epic · CPU Lightmass Global Illumination","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/cpu-lightmass-global-illumination-in-unreal-engine"},{"title":"Sloan et al. · Precomputed Radiance Transfer","url":"https://www.microsoft.com/en-us/research/wp-content/uploads/2017/01/prt.pdf"}]},{"id":"ray-tracing","title":"光线追踪：先问一条射线碰到了什么","en":"Ray Tracing","group":"transport","courses":["101","104","202"],"level":"基础","summary":"光线追踪提供几何可见性查询；Whitted、路径追踪等积分器决定查询哪些射线，以及如何把结果变成亮度。","intuition":"想象从眼睛、镜面或灯光旁拉出一根无限细的线：它先撞到谁，中间有没有挡板，便决定能看到什么。这个查询能找出镜子里屏幕外的物体，也能判断灯与表面之间是否被挡住；碰到物体以后有多亮，则要继续问材质和照明。","why":"光栅化很擅长找相机直接看见的表面，但镜面反射、折射和任意两点之间的遮挡涉及别的方向。若只依靠屏幕已有信息，离屏物体和被前景遮住的层就会缺失。射线查询把这些问题转成场景空间中的几何求交。","what":"狭义的光线追踪核心是对 r(t) = o + td 查询最近交点或是否存在交点。射线可以来自相机，也可以是阴影线、反射线或散射后的路径段。加速结构帮助排除无关几何，着色程序再使用交点法线、材质与光照计算贡献。","deep":"要分清三个层次：求交和遍历负责可见性，BSDF 负责光与表面的相互作用，积分器负责抽样与累加光路。硬件加速通常改善遍历和部分求交，不能自动解决采样噪声或全局照明。Ray tracing 因而是多种渲染方法共用的工具。","tradeoffs":"它能查询屏幕外几何，反射与阴影规则更统一；代价包括加速结构的构建和更新、不规则访问，以及多次反弹增加的射线量。是否实时取决于整条管线的预算。","pitfalls":["使用一次阴影射线就属于光线追踪，但并不意味着整个图像已经做了路径追踪。","射线得到正确交点，不代表材质、采样或降噪得到的亮度就是正确的。"],"related":["bvh","whitted","path-tracing","rasterization","rtx-hybrid","ssr"],"sources":[{"title":"PBRT 4 · Photorealistic Rendering and the Ray-Tracing Algorithm","url":"https://pbr-book.org/4ed/Introduction/Photorealistic_Rendering_and_the_Ray-Tracing_Algorithm"},{"title":"Microsoft · DirectX Raytracing Functional Spec","url":"https://microsoft.github.io/DirectX-Specs/d3d/Raytracing.html"}]},{"id":"whitted","title":"Whitted：沿镜面与玻璃递归","en":"Whitted-Style Ray Tracing","group":"transport","courses":["101"],"level":"基础","summary":"递归追踪理想镜面反射与折射，再用阴影射线计算直接照明；是理解反射、折射与路径追踪关系的好起点。","intuition":"站在两面镜子之间，你看见的另一个房间并不在最初的视线方向上。先把视线按镜面规则折过去，再继续找下一次碰撞，就能解释镜中镜；遇到玻璃，则沿折射方向继续。它把“这面镜子映出了什么”变成了可以递归问的问题。","why":"局部着色只能根据眼前表面的法线与灯光计算颜色，无法自然得到清晰镜像或透过玻璃看到的环境。Whitted 方法把理想反射和折射带来的间接可见性接到局部照明上，建立了经典递归光线追踪的基本框架。","what":"相机射线命中表面后，查询到光源的可见性，并沿理想镜面反射和折射方向递归查询。它只评价渲染积分中的少数特殊方向，而不普遍探索漫反射或粗糙表面的整个方向分布，因此不是完整的全局照明积分器。","deep":"理想镜面或折射对应 BSDF 的 delta 分布，方向受到几何约束，可以专门追踪。经典 Whitted 方法在漫反射表面通常停留于直接照明，所以玻璃在桌面形成的聚光焦散、红墙对邻近白墙的染色等路径往往不在它的采样范围内。","tradeoffs":"清晰镜面与理想玻璃容易理解、常见结果噪声少；但粗糙反射、软阴影和漫反射多次反弹需要扩展。递归同时分叉反射和折射也可能迅速增加工作量。","pitfalls":["经典 Whitted 看起来很真实的玻璃球，并不保证桌面上出现正确的折射焦散。","给漫反射表面添加一个环境常数，不能等价替代场景相关的多次反弹。"],"related":["ray-tracing","path-tracing","rendering-equation","brdf","photon-mapping"],"sources":[{"title":"PBRT 4 · Indirect Light Transport / Whitted","url":"https://pbr-book.org/4ed/Introduction/Photorealistic_Rendering_and_the_Ray-Tracing_Algorithm#IndirectLightTransport"},{"title":"PBRT 3 · Path Tracing","url":"https://pbr-book.org/3ed-2018/Light_Transport_I_Surface_Reflection/Path_Tracing"}]},{"id":"path-tracing","title":"路径追踪：用少量光路估计所有光路","en":"Path Tracing","group":"transport","courses":["101","104","202"],"level":"进阶","summary":"通常从相机出发，对散射方向和灯光做随机抽样，估计多次反弹的光输运；噪声来自有限样本，不是几何求交误差。","intuition":"一个像素可以接收到无数条经过不同反弹的光路。你不可能逐条枚举，于是随机挑一些路线，记录它们把多少光带到像素，再做统计。样本少时，有些像素恰好发现了明亮路线，另一些还没发现，于是产生颗粒噪声。","why":"理想镜面只需特定方向，粗糙表面却会接收和散射连续的一大片方向，多次反弹后问题维度更高。路径追踪用蒙特卡洛积分应对这个庞大的方向与路径空间，使各种材质和间接照明能够放在统一框架下计算。","what":"常见路径追踪逐步生成从相机开始的散射路径，并通过击中光源或显式抽样光源来估计照明。重要性采样、直接光采样与 MIS 减少浪费；参与介质版本还会抽样体积中的散射事件。它是一类积分方法，不由离线或实时标签限定。","deep":"样本贡献要除以生成它的概率密度，期望才能对应目标积分。正确加权的俄罗斯轮盘赌能随机终止路径而保持无偏；固定最大深度、能量钳制与许多缓存近似会引入偏差。普通单向方法对某些极窄焦散路径仍会很难采到。","tradeoffs":"框架通用，样本增加时通常逐渐收敛，但复杂间接照明与焦散可能需要大量样本。实时版本常靠少样本、时空复用和重建；离线也会使用降噪与适应性采样。","pitfalls":["“路径追踪天然无偏”只适用于满足采样支持和正确权重等条件的估计器，不覆盖所有工程版本。","每像素一条路径可以达到实时帧率，但一条路径的多次求交与重建仍有可观成本。"],"related":["rendering-equation","sampling","mis","bdpt","restir","denoising"],"sources":[{"title":"PBRT 4 · Path Tracing","url":"https://pbr-book.org/4ed/Light_Transport_I_Surface_Reflection/Path_Tracing"},{"title":"PBRT 4 · A Better Path Tracer","url":"https://pbr-book.org/4ed/Light_Transport_I_Surface_Reflection/A_Better_Path_Tracer"}]},{"id":"bdpt","title":"双向路径追踪：从相机与灯光两端会合","en":"Bidirectional Path Tracing / BDPT","group":"transport","courses":["101","202"],"level":"专题","summary":"同时生成相机子路径和光源子路径，再尝试连接；提高许多间接照明路径的发现概率，但不能普遍解决所有焦散。","intuition":"在复杂迷宫里找一条从入口到出口的路，可以只从入口摸索，也可以让两队从两端出发，在中间会合。灯光穿过小窗照进房间时，从相机随机游走去找小窗很困难，从灯光先找到照亮的区域再连接就可能更容易。","why":"单向路径追踪对很小的灯光或受限的间接照明通道可能抽到大量低贡献路线。只改相机一侧的方向分布未必足够；从光源一侧主动探索，能让不同路径生成策略互补，降低某些场景的方差。","what":"BDPT 生成一条相机子路径和一条光源子路径，取它们不同长度的前缀并尝试用可见性线段连接。每种分割形成一个采样策略，再用 MIS 合并贡献；单向路径追踪、直接光采样和光线从灯端打向相机都是其中的特殊情形。","deep":"连接端点的散射必须允许连接方向：纯理想镜面顶点不能任意连接。BDPT 对许多焦散有帮助，但镜面—漫反射—镜面这类受约束光路仍可能采样低效或缺失普通连接策略；顶点合并或专门的镜面约束求解能补上另一部分能力。","tradeoffs":"许多难以从相机找到的间接光更稳定，标准估计器可保持无偏；代价是更多连接射线、路径存储与复杂权重。优势依场景和材质而变，不保证比单向追踪更快。","pitfalls":["双向并不意味着相机和灯光之间所有镜面链都能任意接起来。","不能把所有连接策略的结果直接相加，否则同一类光路会被重复计能。"],"related":["path-tracing","mis","photon-mapping","vcm","mlt"],"sources":[{"title":"PBRT 3 · Bidirectional Path Tracing","url":"https://pbr-book.org/3ed-2018/Light_Transport_III_Bidirectional_Methods/Bidirectional_Path_Tracing"},{"title":"Georgiev 等 · Bidirectional Light Transport with Vertex Merging","url":"https://iliyan.com/publications/VertexMergingSketch/VertexMerging_SigAsia2011.pdf"}]},{"id":"mlt","title":"MLT：发现好光路后，在附近继续寻找","en":"Metropolis Light Transport","group":"transport","courses":["101","202"],"level":"专题","summary":"用马尔可夫链探索高贡献光路，适合有效光路非常稀少的场景；相关样本、初始化与跨模式探索决定实际收敛表现。","intuition":"如果一个暗房间只有钥匙孔透进一点光，完全重新随机找路会反复失败。一旦找到经过钥匙孔的路线，就稍微移动其中几个点，试着发现附近同样有用的路线；同时偶尔跳到更远的地方，避免只围着同一个亮斑转。","why":"有些场景的大部分能量集中在极小的一簇光路里，独立采样很难有效覆盖。MLT 把已发现的重要路径当作探索的起点，让后续工作更多落在有贡献的区域，特别关注狭窄通道、强间接光或受限散射等困难情况。","what":"MLT 通过接受或拒绝对当前光路的扰动，构成以图像贡献为目标分布的马尔可夫链。它可以直接扰动路径，也可以像 PSSMLT 那样扰动生成路径所用的随机数。后者能复用现有的单向或双向积分器，但并非唯一的 MLT。","deep":"接受概率需要符合 Metropolis–Hastings 的平衡条件，并处理路径概率和总体亮度归一化。样本之间有相关性，所以样本数量不能直接当作独立样本数量；大步跳跃、初始化与不同亮光路区域之间的混合速度，都会影响有限时间的结果。","tradeoffs":"稀有而高贡献的光路可能更快被持续探索；普通场景未必获益。代价是调参、归一化与相关噪声问题，有限时间里还可能出现局部亮斑或不同区域收敛不均。","pitfalls":["MLT 不是简单地“只保留更亮的路径”；拒绝与接受规则共同保证目标分布。","原始路径空间 MLT 与初级样本空间 PSSMLT 的扰动对象和能力不同，不宜混称为同一实现。"],"related":["sampling","path-tracing","bdpt","photon-mapping","vcm"],"sources":[{"title":"Veach 与 Guibas · Metropolis Light Transport","url":"https://graphics.stanford.edu/papers/metro/gamma-fixed/"},{"title":"PBRT 3 · Metropolis Light Transport","url":"https://pbr-book.org/3ed-2018/Light_Transport_III_Bidirectional_Methods/Metropolis_Light_Transport"}]},{"id":"photon-mapping","title":"光子映射：先看光落在哪里","en":"Photon Mapping / Progressive Photon Mapping","group":"transport","courses":["101","202"],"level":"专题","summary":"从光源追踪能量样本，再在着色点附近估计光的密度；对焦散很有价值，有限邻域带来偏差，渐进版本可在条件下收敛。","intuition":"玻璃杯像一枚透镜，把许多光路挤到桌面上一条明亮的曲线上。从眼睛随机找这条曲线可能困难，从灯光发出大量小能量包则会自然看到它们聚在哪里。着色时再问“我附近聚集了多少光”，就能显现聚光图案。","why":"相机一侧很难抽中一些经过多次理想反射或折射后才落到漫反射面的路径。光子映射从灯端探索这些约束，让光路自然形成焦散，再用空间邻域估计代替要求两条独立路径精确接到同一个点。","what":"先从光源追踪光子样本，记录它们在表面或介质中的位置、方向和能量，再用相邻样本做密度估计。传统光子图需要存储与查询；渐进方法反复发射光子并更新相机可见点，逐步增加统计量与调整收集半径。","deep":"表面估计可直觉地写成 L ≈ Σ fr·Φ / (πr²)，它把邻域内能量摊成密度。有限半径会平滑真实照明，因此有偏；适当增加光子数并缩小半径的渐进估计器可以是一致的。无偏与一致性是不同性质，不能把光子方法都称作永远不收敛。","tradeoffs":"焦散与部分难光路容易被捕获；邻域平滑可能模糊细节、跨边界漏光，半径过小又会噪声大。存储、空间查询以及光子密度不均也是实际成本。","pitfalls":["固定半径的模糊偏差不会单靠同半径下继续加样本消失。","光子样本是加权能量记录，不能当作真实逐个可见光子或未加权命中次数。"],"related":["bdpt","vcm","mlt","sampling","rendering-equation"],"sources":[{"title":"Jensen · Global Illumination using Photon Maps","url":"https://graphics.stanford.edu/~henrik/papers/ewr7/ewr7.html"},{"title":"PBRT 3 · Stochastic Progressive Photon Mapping","url":"https://pbr-book.org/3ed-2018/Light_Transport_III_Bidirectional_Methods/Stochastic_Progressive_Photon_Mapping"}]},{"id":"vcm","title":"VCM：连接光路，也合并附近的顶点","en":"Vertex Connection and Merging","group":"transport","courses":["101","202"],"level":"专题","summary":"把 BDPT 的顶点连接与光子映射的邻域合并放进同一采样框架，用 MIS 组合它们，覆盖更广的困难光路。","intuition":"两支探路队可以拉一根线在中间接上，也可以在同一个小区域相遇后，把两条路线近似合并。前者对普通反弹很好用，后者更容易接住经过镜面链的聚光。VCM 同时允许这两种相遇方式，并判断每一种贡献该占多少权重。","why":"双向连接与光子密度估计各有擅长的场景；只用其中之一可能在普通间接照明或镜面约束光路上低效。直接叠加又会重复计算能量。VCM 给两类方法共同的概率解释，让它们能够以可推导的权重互补。","what":"VCM 在双向路径生成中加入顶点合并：相机路径的顶点可与附近的光源路径顶点通过密度估计结合。连接与合并都成为路径采样策略，再用多重重要性采样组合。它不是在图像层面混合两张图，而是在光路层面统一估计。","deep":"关键不是再造一种求交工具，而是把有限半径的合并写成可比较的采样策略，进而计算 MIS。合并部分在有限半径下仍有偏差；渐进缩小半径可获得一致估计。镜面—漫反射—镜面光路是它相对于普通 BDPT 的典型价值。","tradeoffs":"对多种照明结构更稳健，能兼顾普通反弹与困难焦散；代价是复杂的权重、路径数据与邻域查询，且合并半径仍影响偏差、噪声和细节保留。","pitfalls":["VCM 不等于把 BDPT 和光子映射两张结果各乘一半，它的权重依赖路径采样概率。","加入连接策略不会自动消除合并策略有限半径的偏差。"],"related":["bdpt","photon-mapping","mis","mlt","path-tracing"],"sources":[{"title":"Georgiev 等 · Light Transport Simulation with Vertex Connection and Merging","url":"https://www.iliyan.com/publications/VertexMerging/"},{"title":"Georgiev 等 · Bidirectional Light Transport with Vertex Merging","url":"https://iliyan.com/publications/VertexMergingSketch/VertexMerging_SigAsia2011.pdf"}]},{"id":"sampling","title":"采样与重要性：把预算花在有贡献的位置","en":"Monte Carlo Sampling / Importance Sampling","group":"transport","courses":["101","104","202"],"level":"进阶","summary":"用有限样本估计连续积分；分层、低差异和重要性采样改善样本分布，但必须保留正确概率权重和有效覆盖。","intuition":"想知道一锅汤的平均咸度，只尝一口容易碰到盐块；多处均匀尝几口更可靠。若已知某些地方变化更大，可以多尝，但最后必须补偿多尝的比例。渲染采样同理：选择像素内位置、灯光、散射方向和路径长度，都是分配观察预算。","why":"渲染需要对面积、方向、时间、镜头和多次反弹做积分，精确枚举不现实。盲目加样本只会慢慢降噪；改进样本分布能在相同预算下降低误差，所以实时与离线系统都需要把采样质量当作核心能力。","what":"基本蒙特卡洛估计器为 I ≈ (1/N)Σ f(xi)/p(xi)。重要性采样让 p 接近贡献分布，分层减少覆盖不均，低差异序列改善空间填充；随机化后的序列还便于估计误差。它们可以组合，不是互斥的渲染器类型。","deep":"独立且有限方差的普通蒙特卡洛估计，其标准误差通常按 1/√N 缩小，因此误差减半约需四倍样本。概率密度必须与积分使用同一度量，并覆盖所有非零贡献区域。抗锯齿的重建问题与光输运积分的降方差有关联，但目标并不完全一样。","tradeoffs":"更好的采样常比简单增加射线划算；但建立贡献分布也有成本。过度集中于一种预测会漏掉重要区域，低差异序列在高维和不连续积分上的收益也依具体问题而变。","pitfalls":["抽得更多的方向仍要除以正确 PDF，否则“重点照顾”会让图像整体偏亮。","蓝噪声、低差异、分层与重要性采样分别约束不同性质，不能仅凭名称判定谁永远更好。"],"related":["path-tracing","mis","restir","denoising","taa","rasterization"],"sources":[{"title":"PBRT 4 · Monte Carlo: Basics","url":"https://pbr-book.org/4ed/Monte_Carlo_Integration/Monte_Carlo_Basics"},{"title":"PBRT 4 · Improving Efficiency","url":"https://pbr-book.org/4ed/Monte_Carlo_Integration/Improving_Efficiency"},{"title":"PBRT 4 · Sampling and Integration","url":"https://pbr-book.org/4ed/Sampling_and_Reconstruction/Sampling_and_Integration"}]},{"id":"mis","title":"MIS：让多种采样策略互相兜底","en":"Multiple Importance Sampling","group":"transport","courses":["101","202"],"level":"进阶","summary":"对来自不同概率分布的样本计算兼容权重，减少某一种采样策略偶尔产生的巨大噪声，并避免重复计算相同光路。","intuition":"小灯很难被随机反射方向碰中，直接抽灯的位置更有效；窄而锐利的高光却可能更适合顺着材质的反射方向抽样。你不知道当前像素哪一招更好，于是两招都试，让最适合这个贡献的策略获得更多权重。","why":"渲染积分里有灯光、材质、余弦与可见性等因素，只按其中一个因素采样，遇到另一个因素的尖峰就可能产生大噪点。MIS 让多个不完美但互补的概率分布协作，避免要求某一种分布事先掌握整个积分的形状。","what":"MIS 为每种策略生成的样本分配权重，依据其他策略生成同一样本的概率来判断可信的分工。平衡启发式与幂启发式是常见权重形式；它被用于灯光与 BSDF 采样，也被用于 BDPT 和 VCM 的多种路径生成策略。","deep":"权重要满足相应估计器的正确性条件，常见构造在有支持的策略之间形成归一化分工。各 PDF 必须转换到同一度量，例如面积密度与立体角密度不能直接比较。理想镜面 delta 事件也需单独处理，不能套普通连续方向密度。","tradeoffs":"少量额外概率计算通常能显著抑制不匹配采样造成的尖峰；但不能凭空发现所有策略都很难采到的光路。复杂路径权重更难调试，也会增加积分器维护成本。","pitfalls":["把两种完整估计器直接平均，并不能像正确 MIS 那样主动压低高方差样本的影响。","灯光 PDF 与 BSDF PDF 看似都是一个数，但若度量不同，计算出的权重就没有意义。"],"related":["sampling","path-tracing","bdpt","vcm","restir","brdf"],"sources":[{"title":"PBRT 4 · Multiple Importance Sampling","url":"https://pbr-book.org/4ed/Monte_Carlo_Integration/Improving_Efficiency#MultipleImportanceSampling"},{"title":"Veach · Robust Monte Carlo Methods for Light Transport Simulation","url":"https://www.graphics.stanford.edu/papers/veach_thesis/"}]},{"id":"bvh","title":"BVH：不要让射线逐个问遍所有三角形","en":"Bounding Volume Hierarchy","group":"transport","courses":["101","104","202"],"level":"基础","summary":"用包围体层次排除不可能相交的几何；是可见性查询的加速结构，与路径追踪等照明积分器处于不同层次。","intuition":"要在仓库找一件物品，不必打开每个箱子；先看哪一排、哪一个货架可能包含它，再逐层缩小范围。射线如果连一个大包围盒都碰不到，盒里成千上万片三角形就无需检查；碰到了才继续打开更小的盒子。","why":"场景有数百万个三角形时，每条射线逐一求交会让反射、阴影和多次反弹都难以负担。BVH 把便宜的包围体测试放在昂贵的精确求交之前，大量剪掉无关工作，使通用射线查询可以处理复杂场景。","what":"BVH 把几何图元分成层次集合，每个节点保存包含其子树图元的包围体，叶子再进行真实求交。典型做法用轴对齐包围盒；图元集合的划分不意味着兄弟包围盒互不重叠。它能服务最近交点和是否遮挡等查询。","deep":"构建速度与遍历效率存在取舍：SAH 以表面积与测试成本估计划分质量，线性或层次线性构建更便于快速并行。动态场景可重建或 refit；refit 只更新包围体时仍能保持正确包含，但几何大幅移动可能让树变松、遍历成本恶化。","tradeoffs":"通常显著减少求交工作，但占用内存并需要构建或更新。高质量树更适合反复使用，大量动态几何可能更重视更新成本；重叠、实例层级与射线分布会影响实际收益。","pitfalls":["BVH 不是光照算法：相同的 BVH 可以同时被阴影、碰撞查询和路径追踪使用。","层次结构不保证每条射线都只需 O(log N) 工作；重叠与不利场景可能导致广泛遍历。"],"related":["ray-tracing","path-tracing","rtx-hybrid","ray-marching","sdf"],"sources":[{"title":"PBRT 4 · Bounding Volume Hierarchies","url":"https://pbr-book.org/4ed/Primitives_and_Intersection_Acceleration/Bounding_Volume_Hierarchies"},{"title":"Microsoft · DXR Acceleration Structures","url":"https://microsoft.github.io/DirectX-Specs/d3d/Raytracing.html"}]},{"id":"ray-marching","title":"光线步进：沿着射线逐段观察","en":"Ray Marching / Sphere Tracing","group":"transport","courses":["104","202"],"level":"进阶","summary":"沿射线采样连续场，可用来估计体积积分或寻找隐式表面；距离场上的 sphere tracing 是一种特殊而有条件的步进方法。","intuition":"一束视线穿过云，不是撞到一片三角形就结束；你要沿路查看每一段有多浓、吸收多少、散射出多少光。若对象是一条距离函数定义的表面，则可以不断向前试探，直到足够接近边界，两者都在沿射线前进。","why":"烟雾、云和一些程序化形状并不自然表现为一组明确可求交的表面。渲染需要查询沿线的密度或隐式函数，光线步进提供了通用的观察方式，使这些连续场能够接入可见性或光学积分。","what":"Ray marching 泛指沿射线按固定或自适应步长采样。体积渲染累加各段经透射率加权的发光与散射；隐式表面渲染寻找函数的零集。Sphere tracing 使用距离或保守距离界决定安全步长，属于表面求交用途的一种特殊方法。","deep":"步长的意义依问题而变：体积积分步长控制离散误差，表面步长控制是否跳过边界。距离界可跳过确定为空的区域，但任意隐式函数值不能直接当距离。射线步进可以成为路径追踪中的一环，二者不处于相互替代的同一分类层次。","tradeoffs":"对连续场和程序化几何灵活，空区域可用跳跃减少工作；高频密度、薄表面和掠射角容易需要很多步。固定步长常带来误差，近边界停止阈值也影响精度。","pitfalls":["不能把所有 ray marching 都称为 sphere tracing：体积积分与距离场求交的目标不同。","使用固定大步长可能穿过很薄的物体；仅增加着色质量不能修复漏掉的交点。"],"related":["sdf","ray-tracing","path-tracing","ssr","bvh"],"sources":[{"title":"Hart · Sphere Tracing","url":"https://graphics.stanford.edu/courses/cs348b-20-spring-content/uploads/hart.pdf"},{"title":"PBRT 4 · The Equation of Transfer","url":"https://pbr-book.org/4ed/Light_Transport_II_Volume_Rendering/The_Equation_of_Transfer"}]},{"id":"sdf","title":"SDF：用到表面的距离描述形状","en":"Signed Distance Field","group":"transport","courses":["104","202"],"level":"进阶","summary":"把几何表示成带符号的距离场，便于隐式建模、求交和某些近似遮挡；它描述形状，照明仍需要另外的模型。","intuition":"给空间每一点贴一张纸条，写上它离物体边界多远，并用正负号区分内外。你不再需要先找到属于哪一片三角形；看纸条就能知道附近有没有表面，也能知道从当前位置朝某个方向前进多远才仍然安全。","why":"网格擅长明确的表面，但一些程序化组合、平滑融合和空区域查询用连续距离表达更方便。SDF 把形状变成可在任意位置查询的函数，给隐式渲染、碰撞与部分遮挡近似提供统一的空间信息。","what":"SDF 的零集定义表面，数值的绝对值是到最近表面的距离；常见约定外部为正、内部为负。它可以解析表达，也可以采样到网格中。配合 sphere tracing 可寻找交点，梯度可估计法线，再使用普通材质与照明规则计算外观。","deep":"真正距离函数在可微的规则位置通常满足 |∇d| = 1；到多个最近点的地方可能不可微。CSG 的 min/max 常保留需要的零集，却不总保持精确距离。非均匀缩放或变形后的函数若高估距离，直接用它做步长就可能穿透表面。","tradeoffs":"程序化表达紧凑且便于查询，但复杂场景可能有昂贵函数评价；离散 SDF 占用空间并丢失细节。保守距离界提高可靠性，却可能缩短步长、增加求交次数。","pitfalls":["任意“内部负、外部正”的隐式函数不一定是 SDF，符号正确不代表距离正确。","SDF 遮挡或软阴影近似没有自动满足完整渲染方程，仍需评估漏光与偏差。"],"related":["ray-marching","ray-tracing","bvh","shadow-map","ssao"],"sources":[{"title":"Hart · Sphere Tracing: A Geometric Method for Implicit Surfaces","url":"https://graphics.stanford.edu/courses/cs348b-20-spring-content/uploads/hart.pdf"},{"title":"Seyb 等 · Non-linear Sphere Tracing for Deformed Signed Distance Fields","url":"https://cs.dartmouth.edu/~wjarosz/publications/seyb19nonlinear-slides.pdf"}]},{"id":"restir","title":"ReSTIR：把附近与上一帧的好样本再利用","en":"Reservoir-based Spatiotemporal Importance Resampling","group":"transport","courses":["104","202"],"level":"专题","summary":"用 reservoir 保存一个代表样本与统计权重，再在空间和时间中重采样；DI、GI 与 PT 面向不同的照明采样问题。","intuition":"附近像素和上一帧可能已经找到了一盏重要的灯，没必要每个像素都从零碰运气。给每个像素一个小样本盒，盒里保留一个代表候选与权重信息，再与邻居交换候选；保留下来的不是确定最亮的一项，而是按贡献相关权重随机选出的代表。","why":"实时系统每帧只能承担少量射线，大量小光源和间接光会使独立采样充满噪声。ReSTIR 把别处已经付过代价的候选重新评价并复用，提高低样本预算下发现重要贡献的概率，尤其针对灯光数量很多的场景。","what":"Reservoir 是对候选集合做紧凑随机摘要的数据结构，保存选中样本及必要的权重统计。ReSTIR 在初始候选、邻近像素与历史帧间反复重采样；DI 主要处理直接光，GI 与 PT 扩展到间接路径，它们的复用对象和条件并不相同。","deep":"复用会产生相关性，并涉及把旧样本映射到新像素的概率、可见性和权重修正。原始 DI 有无偏与有偏形式，GRIS 给相关重采样更一般的理论条件。实际时间复用、历史限制和不完整可见性修正可能引入偏差，不能仅凭 ReSTIR 名称保证无偏。","tradeoffs":"能明显降低少样本照明的噪声，但需额外候选评价、历史存储与复用判定。快速运动、遮挡变化和锐利高光会让复用更困难，也可能产生拖影、闪烁或局部能量偏差。","pitfalls":["Reservoir 中只存一个代表样本，不代表它等同于一个普通、独立的新样本。","ReSTIR 是采样与复用方法；它不是降噪器，也不能从 DI 的效果直接推断所有焦散都能被捕获。"],"related":["sampling","mis","path-tracing","denoising","taa","direct-light"],"sources":[{"title":"Bitterli 等 · ReSTIR Direct Lighting（2020）","url":"https://research.nvidia.com/publication/2020-07_spatiotemporal-reservoir-resampling-real-time-ray-tracing-dynamic-direct"},{"title":"Lin 等 · GRIS: Foundations of ReSTIR（2022）","url":"https://research.nvidia.com/labs/rtr/publication/lin2022generalized/"},{"title":"NVIDIA RTXDI · ReSTIR PT Documentation","url":"https://github.com/NVIDIA-RTX/RTXDI/blob/main/Doc/RestirPT.md"}]},{"id":"denoising","title":"降噪与重建：从不完整观察恢复稳定画面","en":"Monte Carlo Denoising / Reconstruction","group":"transport","courses":["104","202"],"level":"进阶","summary":"利用空间、历史帧和几何辅助信息估计干净照明；减少噪声的代价可能是偏差、细节损失与时间响应延迟。","intuition":"一张少样本图像像带颗粒的夜景照片：相邻表面的照明通常有联系，多看几帧也能观察到更稳定的平均值。降噪器利用这种联系，但必须识别真正的边缘、亮斑与运动，否则会把细节当噪声抹掉，或把昨天的光留到今天。","why":"蒙特卡洛误差下降得慢，实时系统无法每像素每帧积累大量独立路径，离线渲染也希望节省时间。降噪用图像与场景中的规律换取更快的可用结果，把有限采样的高方差观察转换成更稳定的估计。","what":"常见方法结合时间累积、运动重投影、深度与法线等引导信息，再做保边空间滤波；SVGF 用方差引导多尺度滤波。神经降噪则从训练数据学习重建规律。它位于采样之后，与 ReSTIR 改善采样分布的角色不同。","deep":"降噪是在噪声观察与先验之间做统计推断，通常会引入偏差。运动向量反映表面运动，不一定反映镜中物体或高光的运动；遮挡出现的新区域缺少历史，需要重新响应。若重要路径一直没被采到，降噪也无法保证恢复正确能量。","tradeoffs":"少量射线能得到更平滑、稳定的画面；代价包括额外算力、历史缓冲与模糊或拖影。离线可使用更多样本和更强滤波，实时更在意边缘响应与帧间稳定性。","pitfalls":["无噪点不等于无误差；滤波可能把错误的平均值变得非常稳定。","只用表面的深度和法线判断历史有效性，可能无法正确处理反射中的动态物体。"],"related":["path-tracing","sampling","restir","taa","rtx-hybrid","neural-rendering"],"sources":[{"title":"Schied 等 · Spatiotemporal Variance-Guided Filtering","url":"https://research.nvidia.com/labs/rtr/publication/schied2017spatiotemporal/"},{"title":"Chaitanya 等 · Recurrent Denoising Autoencoder","url":"https://research.nvidia.com/sites/default/files/publications/dnn_denoise_author.pdf"}]},{"id":"rtx-hybrid","title":"混合渲染：把射线预算放在最需要的效果上","en":"Hybrid Rasterization and Ray Tracing","group":"transport","courses":["104","202"],"level":"进阶","summary":"组合光栅化、场景射线、缓存与重建：例如光栅化主可见表面，再用射线处理反射、阴影或部分间接照明。","intuition":"相机直接看到的东西很多且规则，先用光栅化快速找到它们；镜子背后、阴影边界或屏幕外反射则值得另发射线。就像把专家时间留给最难的问题，常规工作走成熟的快路径，再把不同结果组合成同一张画面。","why":"完整多次反弹每帧都计算，成本可能超过互动预算，但许多视觉收益集中在特定效果上。混合渲染允许逐步增加场景射线查询，并保留已有材质、光照和后处理，让画质提升可以与工程成本及帧率需求共同权衡。","what":"典型管线先生成深度或 G-buffer，再对选中的像素追踪阴影、反射或间接照明射线，随后滤波并合成。也可混合屏幕空间查询、探针和光照缓存。DXR 等接口允许射线与图形、计算管线组合；它们提供能力而不规定唯一照明算法。","deep":"60 FPS 的一帧总预算约 16.7 ms，要共享给动画、可见性、照明与重建。硬件求交加速之外，动态几何更新、材质着色、访问不规则与长路径仍会耗时。离线和实时是预算与容错要求；光栅化或路径追踪不天然只属于其中一类。","tradeoffs":"可选择收益大的效果、逐步集成并控制成本；混合信息来源会增加一致性问题。缓存更新不及时、屏幕查询缺失和滤波偏差可能一起显现，画质取决于整条组合管线。","pitfalls":["产品标注 RTX 或光追，不能直接推断其使用了完整路径追踪或没有烘焙与缓存。","只比较射线数忽略了路径长度、材质复杂度与加速结构更新，无法可靠预测帧率。"],"related":["rasterization","ray-tracing","bvh","ssr","ddgi","denoising"],"sources":[{"title":"Microsoft · DirectX Raytracing Functional Spec","url":"https://microsoft.github.io/DirectX-Specs/d3d/Raytracing.html"},{"title":"NVIDIA · Turing Architecture Whitepaper / Hybrid Rendering","url":"https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/technologies/turing-architecture/NVIDIA-Turing-Architecture-Whitepaper.pdf"}]},{"id":"neural-rendering","title":"神经渲染：网络究竟代替了哪一部分","en":"Neural Rendering / NeRF / Neural Radiance Cache","group":"transport","courses":["104","202"],"level":"专题","summary":"网络可以表达场景、预测光照或重建图像；NeRF、神经辐射缓存与神经降噪回答不同的问题，不能混为一个渲染算法。","intuition":"你可以教一个网络记住“从不同位置看这处场景会是什么颜色”，也可以教它预测“这个表面收到多少间接光”，还可以让它从带噪图恢复画面。这三种任务都用了神经网络，但记住外观、估计光输运和修复图像的角色很不一样。","why":"复杂外观难以手工建模，多次反弹计算昂贵，低样本图像也难以稳定。学习方法尝试从图像或在线光路样本里压缩规律，减少显式表示和重复计算的负担。需要先明确要替代的是场景表示、照明积分还是图像重建。","what":"原始 NeRF 学习位置和观察方向到密度与颜色的映射，用体积渲染合成新视角。神经辐射缓存学习光输运中的辐亮度函数，可辅助路径追踪并在线适应场景。神经降噪学习从有限样本恢复图像，三者可组合但不互相等同。","deep":"从照片重建出的视角相关颜色往往混合了材质与拍摄时照明，所以原始 NeRF 不自然支持任意重新打光。辐射缓存也会受到训练覆盖、更新延迟与函数逼近偏差影响。学习结果是否满足能量守恒、可编辑性和新的观察条件，需要另外约束与验证。","tradeoffs":"可压缩外观或减少重复光照计算，但有训练和推理成本，并可能在新视角、动态变化或稀少样本区域出错。选择方法前要确认是否需要改灯、改材质与严格物理一致性。","pitfalls":["NeRF 里的 radiance field 主要是学习到的外观表示，不等于已经求解任意照明下的渲染方程。","神经辐射缓存和神经降噪作用于不同阶段，不能把两者的质量收益视作可直接替换。"],"related":["ray-marching","path-tracing","denoising","rendering-equation","ddgi"],"sources":[{"title":"Mildenhall 等 · NeRF（2020）","url":"https://arxiv.org/abs/2003.08934"},{"title":"Müller 等 · Real-Time Neural Radiance Caching for Path Tracing","url":"https://research.nvidia.com/labs/rtr/publication/muller2021nrc/"},{"title":"Chaitanya 等 · Recurrent Denoising Autoencoder","url":"https://research.nvidia.com/sites/default/files/publications/dnn_denoise_author.pdf"}]},{"id":"brdf","title":"BRDF、BSDF 与 BSSRDF","en":"Surface Scattering Functions","group":"materials","courses":["101","202"],"level":"基础","summary":"材质怎样把入射光分配到观察方向？先分清局部反射、透射和跨位置散射。","intuition":"把材质想成光的分流器：同一束光照到纸、镜子、玻璃和皮肤，会走向不同方向，有时还会从另一个位置出来。颜色只回答哪些波长保留下来；散射函数还要回答，观察者站在哪里才能接收到这些光。","why":"仅给物体指定一个颜色，无法解释高光随视角移动、玻璃透过背景、皮肤在背光下发亮。渲染需要把材质性质与光源分开描述，才能在改变照明和摄像机后继续得到一致的外观，并让不同光传输算法共享材质模型。","what":"BRDF 描述同一表面点向同侧半球的反射；BTDF 描述向另一侧的透射，两者合称 BSDF。BSSRDF 进一步允许入射点和出射点不同，适合皮肤、蜡等存在明显内部横向光传输的材质。它们都是分布函数，不是最终颜色。","deep":"局部反射连接辐照度和出射辐亮度，需要对入射方向积分。BSSRDF 还要对入射位置积分，因此求解更贵。能量守恒约束的是带余弦的积分，并不要求 BRDF 每个方向上的数值小于一；透射互易关系还需考虑折射率约定。","tradeoffs":"局部 BSDF 计算与采样高效，适合大多数不透明表面；BSSRDF 能解释空间扩散，却增加积分维度和几何处理。是否需要它，取决于散射距离相对像素和物体细节的尺度。","pitfalls":["BRDF 不包含透射；把它与 BSDF 当作完全同义词会遗漏玻璃等材料。","局部漫反射可以近似非常短程的内部散射，但不能直接表示明显跨位置的皮肤 SSS。"],"related":["rendering-equation","pbr","sss","transmission","path-tracing"],"sources":[{"title":"PBRT 4e · Surface Reflection","url":"https://pbr-book.org/4ed/Radiometry,_Spectra,_and_Color/Surface_Reflection"}]},{"id":"pbr","title":"PBR：可重用的材质语言","en":"Physically Based Rendering","group":"materials","courses":["101","104","202"],"level":"基础","summary":"为什么调好的材质一换灯就失真？PBR 用物理约束降低光照与材质的耦合。","intuition":"你希望一块木头搬到室外仍然像木头，铜从摄影棚搬到阴天仍然像铜。PBR 的直觉是先描述物体本身如何散射光，再交给环境决定它此刻多亮、有什么倒影，而不是把某盏灯的效果直接画进材质里。","why":"早期经验模型可以在一个镜头中调出漂亮结果，但参数常相互补偿，换光源就要重调。制作大量资产时，需要少量含义稳定的控制量，以及能量守恒等约束，让美术制作、引擎照明和离线参考之间更容易对齐。","what":"PBR 是一组建模与工作流原则，而不是一种固定算法。常见表面模型使用基础色、粗糙度、金属度或镜面反射参数，并遵守合理的光学行为。Disney Principled 和游戏引擎 PBR 是实用选择，仍然包含近似与艺术控制。","deep":"理解 PBR 要区分材质模型、光传输求解与显示变换：使用微表面 BRDF 并不会自动得到完整全局光照；路径追踪也可能采用不合理的材质。参数数值还依赖约定，尤其基础色的语义、粗糙度映射以及输入纹理的颜色编码。","tradeoffs":"统一参数减少返工，也让资产在不同照明下更稳定；通用模型不能准确覆盖所有材料。皮肤、头发和织物常需要专用散射模型，实时实现则进一步受性能预算约束。","pitfalls":["PBR 不等于路径追踪，也不保证照片级真实。","不要把烘焙阴影、高光或曝光直接当作基础色；它们属于照明或显示结果。"],"related":["brdf","microfacet","metal-dielectric","color-management","ibl"],"sources":[{"title":"Epic · Physically Based Materials","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/physically-based-materials-in-unreal-engine"},{"title":"Disney · Physically-Based Shading at Disney","url":"https://disneyanimation.com/publications/physically-based-shading-at-disney/"}]},{"id":"microfacet","title":"微表面与粗糙度","en":"Microfacet Theory · GGX","group":"materials","courses":["101","104","202"],"level":"进阶","summary":"从镜子到磨砂金属：用微小镜面朝向的统计分布解释高光形状。","intuition":"远看一块磨砂金属仍是一张平面，近看却像无数倾斜的小镜子。排列整齐时反射集中，朝向分散时反射铺开。粗糙度改变的主要是光被分配到哪些方向，不能简单理解为把反射亮度旋钮调低。","why":"真实表面的微观起伏影响反射，却小到无法为每个凸起建模。显式几何既占用海量存储，也难以有效采样。微表面理论用统计分布代替细节几何，在保持宏观形状的同时，解释高光宽度、尾部与掠射变化。","what":"常见微表面反射由 D、F、G 共同组成：D 统计微面法线分布，F 给出单个微面上的菲涅耳反射比例，G 估计微面之间的遮蔽与阴影。GGX 又称 Trowbridge–Reitz 分布，其较长的高光尾部适合许多实测表面。","deep":"只有法线分布还不足以保证合理反射，遮蔽项必须与分布和微观几何假设协调。常见单次散射模型忽略微面之间的多次反弹，粗糙表面可能丢失能量；可见法线采样和多次散射补偿分别改善效率与能量表现。","tradeoffs":"统计模型便宜、易采样，适合实时与离线渲染；它不会产生每条真实划痕的几何形状。极近距离、闪烁微粒或复杂微结构可能需要额外细节、专用模型或显式几何。","pitfalls":["粗糙度更高通常令高光更宽，并不等于把金属变成具有普通漫反射的塑料。","不同引擎的 roughness 到分布参数 α 的映射可能不同，不能只靠数值搬运材质。"],"related":["fresnel","brdf","anisotropy","normal-map","ibl"],"sources":[{"title":"PBRT 4e · Roughness Using Microfacet Theory","url":"https://pbr-book.org/4ed/Reflection_Models/Roughness_Using_Microfacet_Theory"}]},{"id":"fresnel","title":"菲涅耳：视角改变反射比例","en":"Fresnel Reflection","group":"materials","courses":["101","104","202"],"level":"基础","summary":"为什么斜看水面像镜子？界面反射与折射的分配依赖入射角和折射率。","intuition":"俯视清水时容易看见水底，贴近水面斜看时却更容易看见天空倒影。同一个界面并没有换材质，而是光到达界面的角度改变了反射比例。玻璃窗边缘更亮、塑料轮廓有高光，也可以从这个现象理解。","why":"把镜面反射固定成一个常数，无法同时表现正面和侧面的外观，也会错误分配进入材料的能量。需要一个由界面性质决定的角度规律，把表面反射、内部传播与折射连接起来，尤其适用于玻璃、水和金属。","what":"菲涅耳方程描述两种介质界面的反射与透射比例，依赖角度、折射率和偏振。渲染常采用非偏振平均或 Schlick 近似；F₀ 是正入射反射率。介电质和导体使用不同光学描述，导体通常需要复折射率。","deep":"光从高折射率介质进入低折射率介质时，超过临界角可发生全反射。微表面模型中的菲涅耳角度应相对于被命中的微面法线计算。它决定界面能量分配，材料内部的吸收与散射则决定透入之后发生什么。","tradeoffs":"Schlick 近似计算便宜，适合很多实时表面；精确方程更适合需要准确角度行为、复杂导体数据或偏振的场景。极端折射率、全反射和特殊光学效果不能只套一个普通近似。","pitfalls":["F₀ 不是任意视角的反射率，也不是物体最终像素亮度。","高粗糙度与低菲涅耳反射率是不同属性；不能互相代替。"],"related":["microfacet","metal-dielectric","transmission","eyes","layered-material"],"sources":[{"title":"PBRT 4e · Specular Reflection and Transmission","url":"https://pbr-book.org/4ed/Reflection_Models/Specular_Reflection_and_Transmission"}]},{"id":"metal-dielectric","title":"金属与介电质","en":"Conductors vs. Dielectrics","group":"materials","courses":["101","104","202"],"level":"基础","summary":"金属为什么有彩色倒影？塑料为什么能同时有彩色底色和近白高光？","intuition":"红塑料通常表现为红色底色加上接近光源颜色的高光，铜的反射本身就带铜色。两者的颜色形成位置不同：塑料的部分光进入内部后散射返回，厚金属中的光很快被吸收，主要观察到界面的选择性反射。","why":"用同一组随意的漫反射与镜面颜色描述所有物体，容易造出同时像金属又像塑料的材料。区分导体与介电质，可以对能量路径和参数语义施加合理约束，也是金属度工作流能够简化大量资产制作的原因。","what":"金属作为导体通常采用复折射率，厚实裸露金属主要表现有色镜面反射；玻璃、水和塑料等介电质在界面产生反射，另一部分光进入内部。金属度工作流用 metallic 在两套响应间组织参数，而不是测量金属含量。","deep":"常见金属度工作流中，基础色对介电质代表漫反射颜色，对金属则代表有色镜面反射参数。表面有油漆、锈层或透明涂层时，实际光学结构是覆盖或分层；单纯改变金属度只能提供某种有效近似，不能完整替代层间传播。","tradeoffs":"金属度工作流参数少且方便纹理制作；折射率与导体光谱数据更灵活、更接近测量，却增加制作复杂度。裸金属、涂漆金属和生锈金属应根据可见表层分别判断。","pitfalls":["metallic = 0.5 通常不是一种纯净半金属材料；它可能来自混合覆盖或过滤。","金属表面的油漆属于介电质，不能因为底下是金属就让可见油漆也使用金属响应。"],"related":["pbr","fresnel","microfacet","layered-material","texture"],"sources":[{"title":"PBRT 4e · Conductor BRDF","url":"https://pbr-book.org/4ed/Reflection_Models/Conductor_BRDF"},{"title":"Epic · Physically Based Materials","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/physically-based-materials-in-unreal-engine"}]},{"id":"texture","title":"纹理与材质参数","en":"Textures · Maps · Filtering","group":"materials","courses":["101","104"],"level":"基础","summary":"纹理不只是一张颜色图片：它让粗糙度、法线、金属度等属性随位置变化。","intuition":"同一块旧桌面上，木纹改变颜色，磨损改变粗糙度，凹槽改变细节朝向。纹理相当于这些属性的空间地图：材质决定属性如何影响光，纹理决定每个位置取什么值。图片只是保存这张地图的一种方式。","why":"单一参数无法表现真实物体的空间变化，而为每片污渍都拆分网格或材质成本很高。纹理提供连续的参数查询机制，让几何、材质模型和细节分布分别制作，也能用程序生成噪声、条纹等不依赖照片的变化。","what":"纹理是依据坐标返回标量、颜色或向量的函数，可来自二维图片、三维体数据或程序。UV 等映射将表面位置连接到纹理坐标；MipMap、双线性与各向异性过滤则近似像素覆盖区域的平均值，减少缩小时的混叠。","deep":"一次点采样并不代表整个像素；远处纹理被压缩后，高频图案会超过图像采样能力。过滤应考虑纹理足迹和语义：颜色需在正确线性空间处理，法线需考虑方向与归一化，粗糙度平均还会影响高光能量和宽度。","tradeoffs":"图片纹理表现力强且可控，但占显存、带宽并受分辨率限制；程序纹理节省存储且易扩展尺度，却增加计算与过滤难度。更多像素采样也不能高效替代正确纹理过滤。","pitfalls":["法线、粗糙度和金属度通常是数据纹理，不应按 sRGB 颜色进行解码。","基础色贴图与照片不等价；照片通常已经包含光照、反射和相机处理。"],"related":["pbr","normal-map","displacement","color-management","rasterization"],"sources":[{"title":"PBRT 4e · Textures and Materials","url":"https://pbr-book.org/4ed/Textures_and_Materials"},{"title":"PBRT 4e · Image Texture","url":"https://pbr-book.org/4ed/Textures_and_Materials/Image_Texture"}]},{"id":"normal-map","title":"法线与凹凸贴图","en":"Normal Mapping · Bump Mapping","group":"materials","courses":["101","104"],"level":"基础","summary":"低模为什么能显出毛孔和砖缝？改变着色朝向可以模仿细节，但不改变真实轮廓。","intuition":"你可以让一张平板的每个位置在算光时假装朝向略有不同，灯光就会把它看成有小凹凸。法线贴图记录这种朝向，凹凸贴图从高度变化推导朝向。它们像给光照计算戴上细节眼镜，原始几何仍然在那里。","why":"毛孔、划痕和砖缝对高光很敏感，但显式建模会消耗大量三角形。对于不需要改变轮廓或遮挡的小细节，修改着色法线能以较低成本保留外观，是高模烘焙到低模与实时角色制作的重要桥梁。","what":"法线贴图通常存储切线空间中的方向，再转换到渲染坐标；凹凸贴图通过高度函数的局部导数计算扰动法线。它们改变着色法线而非几何表面本身，因此和真正移动表面位置的置换贴图具有不同能力。","deep":"切线基、UV 接缝、镜像 UV 及绿色通道约定必须与烘焙一致。着色法线和几何法线不一致时，光传输仍要防止错误的前后面判定或能量行为。远处微小法线起伏还应与粗糙度和过滤协作，避免闪烁高光。","tradeoffs":"增加的几何成本很低，特别适合毛孔和划痕；它不能自动产生真实轮廓、凹凸自遮挡或视差。浅细节先看法线，大凸起和近距离轮廓问题则看置换或显式几何。","pitfalls":["把法线强度加大不会让砖真正凸起，也不会补出正确的几何阴影。","切线空间法线不能直接当世界空间方向使用；不匹配的切线基会产生接缝和高光错误。"],"related":["texture","displacement","microfacet","skin","taa"],"sources":[{"title":"PBRT 4e · Material Interface and Implementations","url":"https://pbr-book.org/4ed/Textures_and_Materials/Material_Interface_and_Implementations"},{"title":"PBRT 3e · Bump Mapping","url":"https://pbr-book.org/3ed-2018/Materials/Bump_Mapping"}]},{"id":"layered-material","title":"分层材质与清漆","en":"Layered Materials · Clear Coat","group":"materials","courses":["104","202"],"level":"进阶","summary":"车漆为什么有两套反射？覆盖在基底上的涂层会改变进入与离开基底的光。","intuition":"汽车漆面像在有色底漆上覆了一层透明清漆：有些光在最外面反射，有些穿过清漆才遇到底层，返回时还需再穿过一次。上层像一扇光学门，既贡献自己的高光，也改变你能看到的底层颜色和亮度。","why":"把两个 BRDF 简单相加会让两层同时接收完整入射能量，可能过亮，还会遗漏涂层造成的折射、吸收和遮蔽。车漆、上釉陶瓷、湿表面和氧化金属需要层间关系，才能让高光和底层颜色一起合理变化。","what":"分层模型用界面散射加上层内传播描述复合材质；界面可能各有粗糙度与法线，中间介质可能吸收或散射。Clear Coat 是常见的实用子集：透明介电质上层覆盖金属或漫反射基底，用较少参数模拟双层响应。","deep":"光可以在层间多次反射，准确总响应涉及一族内部路径。薄层模型常假定入射和出射仍在同一宏观点，故可压缩成 BSDF；当层内横向位移不可忽略时，需要更一般的空间散射描述。层叠与面积混合也不是同一种操作。","tradeoffs":"简化清漆模型易于实时求值，但只覆盖有限层结构；层内随机游走更灵活，计算与采样更复杂。选择时先看是否需要厚度、吸收、不同层法线或显著层间多次散射。","pitfalls":["上层反射和底层反射不能无条件直接相加；底层受到上层透射衰减。","把金属与油漆参数线性混合，不能完整表达油漆真正覆盖金属的光学结构。"],"related":["pbr","fresnel","metal-dielectric","sss","transmission"],"sources":[{"title":"PBRT 4e · Scattering from Layered Materials","url":"https://pbr-book.org/4ed/Light_Transport_II_Volume_Rendering/Scattering_from_Layered_Materials"}]},{"id":"skin","title":"皮肤：表面高光与内部柔光","en":"Skin Rendering","group":"materials","courses":["104","202"],"level":"专题","summary":"角色为什么像塑料或蜡？皮肤需要协调表面反射、空间散射、尺度与细节。","intuition":"皮肤有两种容易分辨的光：鼻尖上的油脂高光仍然锐利，脸颊受光却柔和，逆光耳朵还会透亮。前者主要来自表面界面，后者与光进入组织后散射有关。把两者一起模糊，会让脸失去毛孔、湿润感和体积。","why":"普通局部漫反射会令明暗过硬，常像干塑料；过度扩散又会像蜡。数字人需要分开处理表面镜面反射与内部颜色传播，并让皱纹、毛孔和粗糙度在运动及不同距离下保持协调，才能表现可信的皮肤尺度。","what":"皮肤着色通常组合介电质镜面层、次表面散射及空间变化的基础色、粗糙度和法线。实时常用预积分、扩散轮廓或屏幕空间处理；离线可采用 BSSRDF 或内部随机游走。具体算法选择取决于质量、厚度与帧预算。","deep":"SSS 应主要影响进入皮肤后返回的分量，不能把所有镜面细节都当作扩散光。散射距离具有物理长度，模型尺度会直接改变外观；耳缘等薄部位还涉及透射。肤色并非一个固定红色，它与吸收、散射及表面结构共同相关。","tradeoffs":"实时扩散近似可快速获得柔和肤质，但对薄边、遮挡与屏幕外传播处理有限；随机游走更自然地结合几何与厚度，却更昂贵。特写先排查尺度、粗糙度和法线，再判断散射算法不足。","pitfalls":["把整个最终画面模糊不能代替皮肤 SSS，会同时破坏表面高光和几何边界。","扫描得到的纹理必须区分反照率与已含光照的颜色，否则换灯后会出现重复明暗。"],"related":["sss","microfacet","normal-map","eyes","hair"],"sources":[{"title":"Epic · Digital Humans","url":"https://dev.epicgames.com/documentation/unreal-engine/digital-humans?application_version=4.27"},{"title":"Jensen et al. · A Practical Model for Subsurface Light Transport","url":"https://graphics.stanford.edu/~srm/publications/SG01-subsurf-abstract.html"}]},{"id":"sss","title":"次表面散射","en":"Subsurface Scattering · SSS","group":"materials","courses":["101","202"],"level":"进阶","summary":"光在哪里进入，在哪里离开？皮肤、蜡、牛奶与玉石需要跨位置的散射地图。","intuition":"手电贴着手指时，你会看到周围和背面发红，因为光没有在第一处表面立即返回，而是在内部走了一段路。SSS 的关键直觉是光会在材料中搬家：一个位置受到照明，可以影响附近另一位置的颜色和亮度。","why":"局部 BRDF 将出入射限制在同一个点，不能解释柔化的明暗边界、蜡的透亮和皮肤的空间扩散。直接追踪每次微观散射又很昂贵，因此需要将内部传播压缩成扩散轮廓，或者用可控的随机采样求解它。","what":"SSS 是光进入材料后被吸收与散射、再从表面离开的现象；BSSRDF 是描述它的一种函数。扩散近似适合多次散射占优的介质，单次散射补充不同路径；随机游走则在实际几何内部采样传播与散射事件。","deep":"扩散不是所有半透明材料的通用答案：薄片、强吸收、小物体或紧邻边界时，假设可能失效。随机游走对几何更直接，却依赖封闭体积和介质参数。尺度决定散射长度相对物体尺寸，红绿蓝通道也可能具有不同传播距离。","tradeoffs":"扩散轮廓易于预计算和快速近似，适合皮肤等高散射材料；随机游走更好结合形状和厚度，但增加样本噪声及运算。实时屏幕空间方法尤其需要关注边缘、遮挡及屏幕外信息。","pitfalls":["SSS 不等于透明度，更不等于统一增加背面红光；它包含空间传播。","散射半径没有脱离尺度的固定正确值：厘米模型与米模型需要一致的物理单位。"],"related":["brdf","skin","volume","foliage","path-tracing"],"sources":[{"title":"PBRT 3e · The BSSRDF","url":"https://pbr-book.org/3ed-2018/Volume_Scattering/The_BSSRDF"},{"title":"Jensen et al. · A Practical Model for Subsurface Light Transport","url":"https://graphics.stanford.edu/~srm/publications/SG01-subsurf-abstract.html"}]},{"id":"hair","title":"头发与毛发","en":"Hair Scattering · R / TT / TRT","group":"materials","courses":["104","202"],"level":"专题","summary":"头发为何有成束亮带和有色透光？单根纤维散射与整束毛发的遮挡需要分别解决。","intuition":"一根头发更像带色素的细长透明纤维，而非涂色圆柱。光可以在外面反射，也能穿过它，或进入后反弹再出来。这些路径形成不同亮带；许多根聚在一起时，光还会在纤维间多次散射，让浅色毛发显得蓬松明亮。","why":"普通表面 BRDF 很难描述纤维轴向高光、透射颜色与分离的亮带。逐根显式追踪纤维内部又贵且难采样。专用头发散射模型把内部路径压缩成可求值的瓣，同时让几何表示、阴影和抗锯齿各自解决对应问题。","what":"典型毛发模型按路径区分 R：外表面反射；TT：进入后直接穿出；TRT：进入后内部反射一次再穿出，并可加更高阶路径。颜色主要受内部吸收影响，纤维切向决定方向性。发片和发丝是几何表示，不是散射模型名称。","deep":"纵向与方位方向分布常被拆分建模，鳞片倾斜会移动不同瓣的高光位置。单根纤维模型仍不足以解释整束头发：纤维间可见性、多次散射和密度均重要。实时还要解决透明覆盖、深阴影和细丝在像素间闪烁的问题。","tradeoffs":"发片通常更省几何和带宽，但侧视轮廓及透明排序受限；发丝更自然，却增加覆盖、阴影与采样成本。单次散射便宜，密集浅色毛发的多次散射则显著影响能量与观感。","pitfalls":["只增加各向异性表面高光，不能完整替代头发内部的 TT、TRT 路径。","头发发黑可能来自遮挡、密度或缺失多次散射，不能只靠把基础色调亮修复。"],"related":["anisotropy","volume","shadow-map","taa","transmission"],"sources":[{"title":"PBRT 4e · Scattering from Hair","url":"https://pbr-book.org/4ed/Reflection_Models/Scattering_from_Hair"},{"title":"PBRT · The Implementation of a Hair Scattering Model","url":"https://www.pbrt.org/hair.pdf"}]},{"id":"eyes","title":"眼睛：角膜、虹膜与湿润层","en":"Eye Rendering","group":"materials","courses":["104","202"],"level":"专题","summary":"眼睛为什么像贴在球上的照片？透明角膜和虹膜具有不同的形状与光学职责。","intuition":"眼睛的彩色部分像藏在透明凸面窗后面的花纹：窗产生亮点和折射，花纹提供颜色与深度。只在球上贴一张虹膜图片，会把前面的湿润高光与后面的颜色压在同一层，视角变化时就容易显得平、干或假。","why":"人对眼睛形状与高光非常敏感，一张更高清的贴图并不能修复缺失角膜曲率和虹膜深度的问题。眼睛渲染需要分开组织表面反射、折射后的虹膜、眼白散射及眼睑接触，让视角和照明改变时仍然可信。","what":"眼部模型通常组合透明角膜或等效湿润层、位于其后的虹膜和瞳孔区域，以及眼白。可采用真实多层几何与折射，也可在单一眼着色器中近似这些响应；模型形状、UV 和材质参数必须共同满足同一套约定。","deep":"角膜的法线主导前层反射，虹膜自己的细节法线影响后层响应，二者不应无条件共用。折射改变虹膜的可见位置和深度感；眼睑遮挡、泪线与接触阴影又提供尺度线索。相应问题经常同时涉及几何、材质和照明。","tradeoffs":"真实分层几何更容易表达光学关系，却增加透明、折射和交叠处理；专用实时着色器更高效，但依赖指定眼球形状与 UV。近距离角色可优先使用经验证的完整眼部模型，再定制参数。","pitfalls":["前面的高光不应跟着虹膜贴图细节随意起伏；它主要由角膜和湿润表面决定。","把眼睛当完全球体，可能遗漏前部角膜的凸起及后层虹膜深度。"],"related":["fresnel","transmission","layered-material","skin","shadow-map"],"sources":[{"title":"Epic · Digital Humans — Eye Shading","url":"https://dev.epicgames.com/documentation/unreal-engine/digital-humans?application_version=4.27"}]},{"id":"cloth","title":"织物、绒毛与丝绸","en":"Cloth · Sheen · Fiber Scattering","group":"materials","courses":["104","202"],"level":"专题","summary":"棉、丝绸、天鹅绒为什么差别巨大？织法、纤维朝向和表面绒毛共同决定反射。","intuition":"布料远看是一片表面，近看却由纱线和细纤维编织而成。丝绸的方向性亮带、天鹅绒边缘的柔亮和棉布的柔和反射，来自不同层级的结构。把一张布纹颜色贴到塑料上，通常只能得到有布纹的塑料。","why":"通用微表面模型难以同时解释纱线朝向、纤维多次散射和绒毛层形成的 sheen。织物又有明显尺度变化：远景只能容纳统计模型，特写可以看见编织。需要专用模型及层级表示，将这些结构稳定地映射到图像。","what":"实用织物模型可由基底反射加绒毛 sheen 组成，也可显式组织经纬纱线的方向性散射。更深入的方法从纤维或纱线的反射、透射和遮挡推导整体响应。不同布种需要不同权重与结构，不能用一个高光参数概括。","deep":"Sheen 是纤维表面结构导致的一种反射表现，不是固定的轮廓增亮滤镜；各向异性则描述转动表面后散射响应改变。纱线级模型需考虑织法、法线与方向场，远处过滤还要防止纤维结构造成摩尔纹与闪烁。","tradeoffs":"Sheen 加普通基底便宜且易制作，适合大多数实时服装；纱线和纤维模型更能体现织法及近景结构，却增加计算、参数与过滤负担。模型复杂度应随镜头距离和布种需求选择。","pitfalls":["法线贴图中的编织纹理不等于织物散射模型；它不能独自补出绒毛反射。","天鹅绒、棉布和丝绸不应只通过同一 roughness 数值的大小区分。"],"related":["anisotropy","microfacet","normal-map","layered-material","texture"],"sources":[{"title":"NVIDIA · A Practical and Hierarchical Yarn-based Shading Model for Cloth","url":"https://research.nvidia.com/labs/rtr/publication/weidlich2023hierarchical/"},{"title":"Epic · Shading Models — Cloth","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/shading-models-in-unreal-engine"}]},{"id":"transmission","title":"玻璃、水与透射","en":"Transmission · Refraction · Absorption","group":"materials","courses":["101","104","202"],"level":"进阶","summary":"透明为何不只是降低 alpha？真实透射包含折射、界面反射和材料内部吸收。","intuition":"降低一张图片的不透明度，只让背后的颜色混进来；玻璃却会弯折背景、反射天空，而且厚处可能更深色。透明物体是一套光的路径系统：界面决定方向和分流，厚度与内部介质决定沿路损失多少光。","why":"Alpha 混合适合覆盖和合成，却不足以模拟镜片、玻璃杯或水体。需要折射解释背景变形，菲涅耳解释角度相关反射，吸收解释厚度相关颜色；否则会出现过于平的透明物体，以及错误的颜色与能量关系。","what":"BTDF 描述表面透射分布；光滑折射遵守 Snell 定律，粗糙界面使透射方向展开。体内吸收通常随光程指数衰减。薄玻璃近似可省略真实厚度造成的位移，厚玻璃则需要考虑前后界面及正确的介质内外状态。","deep":"从高折射率介质射向低折射率介质时可能全反射。折射率改变辐亮度的传输约定，粗糙透射也不能直接复制镜面反射公式。焦散来自光路聚焦，是照明积分的难题；一个正确玻璃 BSDF 并不保证高效得到清晰焦散。","tradeoffs":"屏幕空间折射和薄层近似速度快，但缺少屏幕外背景或真实光程；追踪穿过多界面的光线更通用，却增加交点、噪声与介质管理成本。先判断需求是透明合成、薄片还是厚实体。","pitfalls":["Opacity 与物理透射不是同一个量，alpha = 0.2 不等于固定有八成光无偏折穿过。","把玻璃颜色涂在镜面高光上，容易遗漏介电质界面反射与体内吸收的区别。"],"related":["fresnel","brdf","volume","ray-tracing","path-tracing"],"sources":[{"title":"PBRT 4e · Dielectric BSDF","url":"https://pbr-book.org/4ed/Reflection_Models/Dielectric_BSDF"},{"title":"PBRT 4e · Specular Reflection and Transmission","url":"https://pbr-book.org/4ed/Reflection_Models/Specular_Reflection_and_Transmission"}]},{"id":"volume","title":"烟、雾、云与参与介质","en":"Volume Scattering · Participating Media","group":"materials","courses":["101","202"],"level":"进阶","summary":"光束为何会在空气里显形？路径中每一段空间都可能吸收、发射或散射光。","intuition":"干净空气里的光束通常看不见，烟雾中却能看见，因为沿途粒子把光转向你的眼睛。与此同时，远处物体的光也被粒子削弱。体积渲染把空间本身视为会与光交换的材料，而非只在三角形表面处理光。","why":"只有表面的场景假设光在两次碰撞之间保持不变，无法解释雾的衰减、云的柔亮和体积光束。单独在画面上叠灰色雾不能表达光源方向、遮挡和密度结构，因此必须将参与介质加入光传输过程。","what":"参与介质通过吸收系数、散射系数、发射与相函数描述光的行为。相函数给出散射方向分布，密度决定这些过程在空间中的强弱。实时常沿射线步进积分，离线通常以蒙特卡洛方法采样距离与散射方向。","deep":"消光包含吸收与出散射，而进入观察方向的散射又补充能量，因此雾不只是乘一个衰减值。单次散射适合部分稀薄情形，云等高散射介质需要多次散射；异质密度下还要处理步长误差、距离采样与复杂可见性。","tradeoffs":"单次散射和较粗步进便宜，但可能让云过暗、光束分层或遗漏薄结构；多次散射更准确，却扩大路径空间与噪声。实时体积缓存和低分辨率重建能省预算，同时带来时序与细节限制。","pitfalls":["相函数不是表面 BRDF，不应机械套用表面法线的余弦项。","更高雾密度并非总让画面更亮；结果取决于照明、吸收、散射和可见路径。"],"related":["sss","transmission","path-tracing","shadow-map","taa"],"sources":[{"title":"PBRT 4e · Volume Scattering","url":"https://pbr-book.org/4ed/Volume_Scattering"},{"title":"PBRT 4e · Volume Scattering Processes","url":"https://pbr-book.org/4ed/Volume_Scattering/Volume_Scattering_Processes"}]},{"id":"foliage","title":"叶片与薄片透光","en":"Foliage · Thin-Sheet Scattering","group":"materials","courses":["104","202"],"level":"专题","summary":"树叶背面为什么不能只用正面光照？薄叶片要结合双面可见、透射与密集覆盖。","intuition":"阳光从叶片背面照来，你仍能在正面看到鲜亮绿色，因为光穿过薄薄的组织。叶脉和薄处又透得不同。两面都能看见只是第一步：把叶片背面也绘制出来，不会自动让背后的光正确穿到观察侧。","why":"单面不透明着色容易让叶片背面发黑，厚皮肤式散射又不一定适合很薄的叶片。植被还有海量重复细节和空隙，几何、覆盖、阴影及抗锯齿互相影响。专门的薄片透光模型提供外观，管线策略负责稳定和效率。","what":"薄片模型可用两侧反射和漫透射近似叶片内部传播，以透射颜色或厚度控制背光；叶脉可使用不同参数。双面渲染决定两面能否被看见，alpha mask 决定叶片形状覆盖，它们与透射是不同职责。","deep":"叶片两侧可能拥有不同表面结构，不能只把法线无条件翻转后使用完全相同响应。密集植被的多层覆盖影响阴影与过绘制；细叶在远处容易消失或闪烁，需要覆盖过滤、细节层级与时序重建协调处理。","tradeoffs":"薄片透光近似成本低且适合游戏植被；真实内部体积传播更细致，却不适合为每片远景叶子支付高成本。可按距离保留透光轮廓和整体密度，把精细叶脉留给近景。","pitfalls":["开启 two-sided 只改变可见面处理，不等于已经实现叶片透射。","alpha 测试的裁剪轮廓与透射颜色需要分开设计，否则叶缘与背光会互相污染。"],"related":["sss","transmission","texture","shadow-map","taa"],"sources":[{"title":"Epic · Shading Models — Two Sided Foliage","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/shading-models-in-unreal-engine"},{"title":"PBRT 4e · Surface Reflection","url":"https://pbr-book.org/4ed/Radiometry,_Spectra,_and_Color/Surface_Reflection"}]},{"id":"displacement","title":"置换、视差与真实几何","en":"Displacement · Parallax","group":"materials","courses":["101","104"],"level":"进阶","summary":"砖缝为何随视角露馅？需要判断细节只影响光照，还是必须改变交点和轮廓。","intuition":"法线贴图让平板在光照中看起来有凹凸，真正置换则把表面的位置也推高或压低。斜看墙面时，砖头应该挡住后面的缝隙，边缘应该凸出；这些线索取决于空间中的形状，单纯改变法线就不够。","why":"当细节尺度足以影响轮廓、遮挡和视差，着色近似会暴露平坦几何。又不希望手工建模每个凸起，因此可用高度函数驱动细分后的几何，或使用局部视差追踪近似交点，在几何成本与外观线索之间选择。","what":"真正置换改变表面几何或渲染求交所用的表面；凹凸映射只改变着色法线。视差贴图通过改变纹理采样位置模拟深度，POM 等方法进一步沿高度场寻找交点，但普通实现通常仍受原始网格轮廓和局部高度场限制。","deep":"真正位移后，法线、阴影、包围盒和细节层级都应与新形状一致。过粗几何无法承载高频高度，过细几何又消耗预算。视差方法对掠射角、UV 边界、层数和自遮挡处理敏感，因此近景质量需要实际镜头验证。","tradeoffs":"法线最便宜；视差增加计算以改善平面内部深度感；真正置换更可靠地改变轮廓和遮挡，但需要额外几何或求交成本。选择依据应是像素尺度与需要保留的形状线索。","pitfalls":["材质接口里叫 displacement 的高度输入，可能最终只用于 bump mapping，必须检查实现。","普通 POM 不能保证改变原始网格的外轮廓，也不能自动修复所有几何阴影。"],"related":["normal-map","texture","rasterization","ray-tracing","shadow-map"],"sources":[{"title":"PBRT 3e · Bump Mapping","url":"https://pbr-book.org/3ed-2018/Materials/Bump_Mapping"},{"title":"Epic · Nanite Virtualized Geometry — Displacement","url":"https://dev.epicgames.com/documentation/en-us/unreal-engine/nanite-virtualized-geometry-in-unreal-engine"}]},{"id":"anisotropy","title":"各向异性与方向场","en":"Anisotropic Reflection","group":"materials","courses":["104","202"],"level":"进阶","summary":"拉丝金属的亮带为何随纹理方向变化？表面旋转以后反射分布可以不保持相同。","intuition":"旋转一块均匀磨砂板时，高光形状通常变化不大；旋转拉丝金属或丝绸时，亮带却跟着纤维方向变化。表面有方向性的微结构，所以不仅需要知道法线朝哪里，还需要知道沿着表面哪一个方向是沟槽或纤维。","why":"一个各向同性粗糙度只能控制围绕法线均匀分布的变化，难以解释拉丝、车削和纱线的定向高光。增加切线方向以及不同轴向的粗糙度，可以用统计描述替代大量真实沟槽，并让形状与材质方向保持对应。","what":"各向异性指表面绕宏观法线转动后，局部散射响应发生改变。微表面模型可使用两个切向轴上的不同粗糙度参数与一个方向场；纤维模型则以纤维轴为关键方向。它描述反射规律，不只是纹理图案有条纹。","deep":"方向场必须在曲面上连续或明确处理接缝，否则高光会突变。GGX 等分布可以扩展为各向异性，同时需要相应遮蔽项和采样策略。织物和头发虽也有强方向性，但各自内部结构与散射路径往往需要进一步专用建模。","tradeoffs":"各向异性微表面模型只增加少量参数，适合拉丝金属和部分丝绸近似；它不能完整替代纤维透射或绒毛层。资产制作还需稳定的切线或梳理方向，错误方向会比错误颜色更显眼。","pitfalls":["各向异性纹理过滤解决纹理采样足迹，和各向异性材质反射是不同概念。","条纹基础色不自动产生定向高光；需要材质方向与散射模型共同参与。"],"related":["microfacet","hair","cloth","texture","normal-map"],"sources":[{"title":"PBRT 4e · Roughness Using Microfacet Theory","url":"https://pbr-book.org/4ed/Reflection_Models/Roughness_Using_Microfacet_Theory"},{"title":"Disney · Physically-Based Shading at Disney","url":"https://disneyanimation.com/publications/physically-based-shading-at-disney/"}]},{"id":"geometry","title":"几何表示：世界用什么保存","en":"Geometry Representation","group":"geometry","courses":["101","104"],"level":"基础","summary":"网格、曲线、隐式曲面和体素，会改变后续查询的方式。","intuition":"同一个球可以用很多三角形拼成，也可以写成“到球心距离等于半径”。前者容易送进光栅化管线，后者容易表达光滑形状。表示方式不是外观本身，却决定了我们怎样找到表面和保存细节。","why":"没有一种表示能同时最适合建模、变形、碰撞、存储、光栅化和射线求交。头发需要曲线，烟雾需要体积，硬表面常用网格；技术通常为特定操作选择方便的世界表示。","what":"显式表示直接保存表面位置，如三角网格、参数曲面和曲线；隐式表示用函数定义表面，如 SDF 的零等值面；体素把空间离散成格子。表示之间可以转换，但转换会引入分辨率与精度限制。","deep":"几何法线描述实际表面方向，着色法线可以被插值或法线贴图修改。拓扑、尺度、曲率和切线空间都会影响材质、阴影与变形。细分与位移能增加真实几何，法线贴图主要改变着色。","tradeoffs":"网格成熟、便于编辑，但细节增加会增大数据与处理成本；隐式表示方便组合，却可能需要迭代求交；体素便于空间查询，但内存增长很快。","pitfalls":["法线贴图不会普遍改变物体轮廓或真实遮挡。","渲染表示不必和物理碰撞表示完全相同。"],"related":["displacement","normal-map","sdf","hair","lod","animation"],"sources":[{"title":"GAMES101 官方课程：几何表示与网格处理","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games101.html"}]},{"id":"animation","title":"动画与模拟：让场景随时间改变","en":"Animation & Simulation","group":"geometry","courses":["101","104"],"level":"基础","summary":"渲染回答这一帧长什么样；动画与模拟产生这一帧的场景。","intuition":"骨骼驱动角色动作，布料和头发则需要随运动响应。渲染器收到的是变化后的几何与材质；如果前后帧位置不连续，时域算法也无法稳定复用历史。","why":"静态模型不能表达运动、弹性、碰撞和交互。艺术家需要可控制的动作，系统也需要物理合理的响应，因此动画混合、蒙皮、约束与数值模拟承担不同职责。","what":"关键帧与骨骼动画描述受控运动；运动学处理位置与约束；动力学通过力、质量和数值积分推进状态。实时系统常使用简化模型和固定时间步，再把结果插值到显示帧。","deep":"蒙皮改变顶点，也影响法线、切线、motion vector 和加速结构更新。渲染头发的散射模型与模拟头发的力学模型属于不同层；两者都重要，但不要用其中一个代替另一个。","tradeoffs":"物理精度越高，稳定求解与碰撞成本往往越大。实际系统在艺术控制、稳定性、实时预算和表现细节之间选择。","pitfalls":["头发的 BRDF/散射模型不负责头发摆动。","帧率变化不应直接让模拟行为完全变化。"],"related":["geometry","hair","cloth","taa","bvh","render-graph"],"sources":[{"title":"GAMES101 官方课程：动画与模拟","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games101.html"},{"title":"GAMES104 官方课程：引擎核心系统","url":"https://games104.boomingtech.com/"}]},{"id":"gpu-performance","title":"GPU 预算：慢在哪里，才优化哪里","en":"GPU Performance & Frame Budget","group":"production","courses":["104","202"],"level":"进阶","summary":"几何、着色、带宽、遍历与同步，可能是完全不同的瓶颈。","intuition":"像流水线生产一样，一个步骤算得再快，也不能消除另一个步骤的堵塞。大量透明头发可能受 overdraw 限制，复杂材质可能受着色限制，大 G-buffer 可能受带宽限制。","why":"只凭三角形数量、光线数量或 draw call 数量无法解释全部性能。真实系统需要知道 CPU 与 GPU 的依赖，以及每个 pass 的计算、内存与等待成本，才能把预算用在有效的地方。","what":"性能分析在代表性场景中测量帧时间、pass 时间和资源使用。常见优化包括剔除、LOD、减少重复着色、缩小工作集、降低分辨率和整理资源依赖；选择取决于瓶颈而非术语新旧。","deep":"平均帧率会掩盖偶发卡顿。资源流送、着色器编译、加速结构重建和 CPU/GPU 同步，都可能使最慢帧恶化。应同时观察动态条件、峰值成本、画面误差和输入响应。","tradeoffs":"省显存的表示可能多算一些，省计算的缓存可能多占带宽。任何优化都需要在目标硬件上确认收益，并检查是否把瓶颈移到别处。","pitfalls":["低三角形数不保证低 overdraw 或低着色成本。","GPU 优化不一定能解决 CPU 提交或同步瓶颈。"],"related":["lod","render-graph","forward-plus","bvh","upscaling","realtime-offline"],"sources":[{"title":"GAMES104 官方课程：系统架构与引擎开发","url":"https://games104.boomingtech.com/"}]},{"id":"npr","title":"非真实感渲染：让图像服务表达","en":"Non-Photorealistic Rendering · NPR","group":"production","courses":["101","202"],"level":"专题","summary":"风格化需要控制形状、层次和时间稳定性，而非只关闭 PBR。","intuition":"插画会主动简化明暗、强调轮廓、安排色块。渲染也可以这样做：图像的目标是传达风格与结构，而不是尽可能复现相机记录的物理外观。","why":"动漫、技术说明与艺术作品有独立的表达目标。物理正确的复杂光照可能反而削弱读图和视觉设计，所以需要可控的轮廓、明暗分层与笔触系统。","what":"NPR 是一组面向风格化表达的技术，包括 toon shading、轮廓线、明暗量化、笔触与基于图像的风格化。它可以与 PBR、GI 和真实几何并用，不对应一种固定渲染管线。","deep":"屏幕边缘检测容易取得轮廓，却会受深度、法线、遮挡与分辨率影响。动画中轮廓跳动、阴影阈值闪烁和笔触漂移，都需要时间一致性；静态好看不等于运动中稳定。","tradeoffs":"更强的艺术控制能够提高可读性，但风格规则、特殊材质与时域稳定通常需要额外设计和内容配合。","pitfalls":["NPR 不等于简单把颜色分成几档。","风格化不是不需要光照、采样或色彩管理。"],"related":["render-pipeline","taa","normal-map","color-management"],"sources":[{"title":"GAMES202：高质量着色与 NPR 课程入口","url":"https://sites.cs.ucsb.edu/~lingqi/teaching/games202.html"}]}]</script>
<script>
'use strict';
const TOPICS=JSON.parse(document.getElementById('knowledge-data').textContent);
const byId=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const GROUPS={foundations:{name:'基础与总框架',label:'从世界到图像',color:'#f6b44e'},pipeline:{name:'光栅化与管线',label:'组织一帧的工作',color:'#85b8ff'},lighting:{name:'光照、阴影与 GI',label:'光从哪里来',color:'#75d8b1'},transport:{name:'光追与光路采样',label:'怎样估计传播',color:'#baabff'},materials:{name:'材质与复杂外观',label:'表面如何响应',color:'#e99bb8'},geometry:{name:'几何与动画',label:'描述和改变场景',color:'#91d4e9'},production:{name:'性能与风格化',label:'让结果持续可用',color:'#c4d49b'}};
const ROUTES=[
{id:'hair-problem',type:'角色外观',title:'头发为什么像塑料？',intro:'先分清几何表示、单根纤维的散射和发束之间的遮挡。改变普通表面粗糙度，通常不能补齐纤维的内部透射。',steps:[['hair','建立纤维直觉','先看 R、TT、TRT 光路与发丝方向为何重要。'],['anisotropy','认识方向性','高光的方向受发丝切线影响，不能只看法线。'],['shadow-map','检查发束遮挡','密集发丝需要合理的遮挡与透射处理。'],['taa','检查运动稳定性','细发丝与透明覆盖容易造成闪烁和历史拖影。']]},

let state={view:'overview',group:'all',course:'all',level:'all',query:'',comparison:'rays'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const topicLink=id=>byId[id]?`<a class="pill" href="#topic/${id}">${esc(byId[id].title)}</a>`:'';
const highlight=s=>{const terms=state.query.trim().split(/\s+/).filter(Boolean).sort((a,b)=>b.length-a.length);if(!terms.length)return esc(s);const pattern=terms.map(t=>t.replace(/[.*+?^{}$()|[\]\\]/g,'\\$&')).join('|');return String(s).split(new RegExp('('+pattern+')','gi')).map((part,i)=>i%2?'\x3cmark>'+esc(part)+'\x3c/mark>':esc(part)).join('');};
