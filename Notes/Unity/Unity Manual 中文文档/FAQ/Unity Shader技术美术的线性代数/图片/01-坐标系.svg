<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><title>同一个点在局部与世界坐标中的表示</title><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#17324d"/></marker><marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#dce5ed"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#bd3b48"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#14856e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#316db5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#b65a08"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#687c90"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#17324d"><text x="30" y="38" fill="#17324d" font-size="24">同一个点，两份地址</text><line x1="90" y1="430" x2="90" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="155" y1="430" x2="155" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="220" y1="430" x2="220" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="285" y1="430" x2="285" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="350" y1="430" x2="350" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="415" y1="430" x2="415" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="480" y1="430" x2="480" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="430" x2="480" y2="430" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="365" x2="480" y2="365" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="300" x2="480" y2="300" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="235" x2="480" y2="235" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="170" x2="480" y2="170" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="105" x2="480" y2="105" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="430" x2="480" y2="430" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="90" y1="430" x2="90" y2="105" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><text x="488" y="422" fill="#17324d" font-size="18">世界 x</text><text x="100" y="93" fill="#17324d" font-size="18">世界 y</text><circle cx="285" cy="365" r="6" fill="#316db5"/><text x="297" y="389" fill="#316db5" font-size="18">o = (3,1)</text><line x1="285" y1="365" x2="285" y2="235" stroke="#bd3b48" stroke-width="3" marker-end="url(#red)"/><text x="301" y="300" fill="#bd3b48" font-size="18">bₓ = (0,2)</text><line x1="285" y1="365" x2="220" y2="365" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="110" y="395" fill="#14856e" font-size="18">bᵧ = (−1,0)</text><line x1="285" y1="235" x2="285" y2="105" stroke="#bd3b48" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#red)"/><line x1="285" y1="105" x2="220" y2="105" stroke="#14856e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#green)"/><circle cx="220" cy="105" r="6" fill="#b65a08"/><text x="196" y="93" fill="#b65a08" font-size="18">P</text><text x="570" y="115" fill="#17324d" font-size="18">局部地址：Pₒ = (2,1)</text><text x="570" y="160" fill="#17324d" font-size="18">世界地址：P𝑤 = (2,5)</text><text x="570" y="225" fill="#17324d" font-size="18">从 o 出发：</text><text x="570" y="265" fill="#bd3b48" font-size="18">走 2 次红色 x 轴</text><text x="570" y="305" fill="#14856e" font-size="18">再走 1 次绿色 y 轴</text><text x="570" y="375" fill="#17324d" font-size="18">P = o + 2bₓ + bᵧ</text><text x="570" y="415" fill="#17324d" font-size="18">点没变，描述它的尺子变了。</text></g></svg>