<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><title>逆转置保证法线与缩放后的切向量垂直</title><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#17324d"/></marker><marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#dce5ed"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#bd3b48"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#14856e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#316db5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#b65a08"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#687c90"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#17324d"><text x="30" y="38" fill="#17324d" font-size="24">法线要保持垂直，而不只是跟着拉长</text><text x="30" y="85" fill="#17324d" font-size="22">变换前</text><line x1="90" y1="405" x2="90" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="165" y1="405" x2="165" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="240" y1="405" x2="240" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="315" y1="405" x2="315" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="390" y1="405" x2="390" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="405" x2="390" y2="405" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="330" x2="390" y2="330" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="255" x2="390" y2="255" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="180" x2="390" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="90" y1="330" x2="390" y2="330" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="240" y1="405" x2="240" y2="180" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="165" y1="405" x2="315" y2="255" stroke="#316db5" stroke-width="4" marker-end="url(#blue)"/><text x="265" y="239" fill="#316db5" font-size="18">t=(1,1)</text><line x1="240" y1="330" x2="165" y2="255" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="70" y="240" fill="#14856e" font-size="18">n=(−1,1)</text><text x="30" y="440" fill="#17324d" font-size="19">n · t = 0</text><text x="500" y="85" fill="#17324d" font-size="22">x 拉宽 2 倍后</text><line x1="560" y1="405" x2="560" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="635" y1="405" x2="635" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="710" y1="405" x2="710" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="785" y1="405" x2="785" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="860" y1="405" x2="860" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="560" y1="405" x2="860" y2="405" stroke="#dce5ed" stroke-width="1"/><line x1="560" y1="330" x2="860" y2="330" stroke="#dce5ed" stroke-width="1"/><line x1="560" y1="255" x2="860" y2="255" stroke="#dce5ed" stroke-width="1"/><line x1="560" y1="180" x2="860" y2="180" stroke="#dce5ed" stroke-width="1"/><line x1="560" y1="330" x2="860" y2="330" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="710" y1="405" x2="710" y2="180" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="560" y1="405" x2="860" y2="255" stroke="#316db5" stroke-width="4" marker-end="url(#blue)"/><text x="810" y="239" fill="#316db5" font-size="18">t′=(2,1)</text><line x1="710" y1="330" x2="672.5" y2="255" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="577.5" y="240" fill="#14856e" font-size="18">正确 (−0.5,1)</text><line x1="710" y1="330" x2="560" y2="255" stroke="#bd3b48" stroke-width="3" marker-end="url(#red)"/><text x="550" y="290" fill="#bd3b48" font-size="18">错误 (−2,1)</text><text x="500" y="440" fill="#17324d" font-size="19">正确点积 = 0；错误点积 = −3</text><text x="30" y="488" fill="#687c90" font-size="17">为方便核对，这里画出未归一化的向量；实际着色时还需归一化。</text></g></svg>