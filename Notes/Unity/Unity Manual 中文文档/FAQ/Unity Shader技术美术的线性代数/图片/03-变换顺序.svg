<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535" role="img"><title>旋转与平移顺序的数值对照</title><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#17324d"/></marker><marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#dce5ed"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#bd3b48"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#14856e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#316db5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#b65a08"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#687c90"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#17324d"><text x="30" y="38" fill="#17324d" font-size="24">顺序变了，终点也变了</text><text x="30" y="80" fill="#17324d" font-size="20">TRp：先转 90°，再右移 3</text><line x1="70" y1="395" x2="70" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="135" y1="395" x2="135" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="200" y1="395" x2="200" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="265" y1="395" x2="265" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="330" y1="395" x2="330" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="395" y1="395" x2="395" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="395" x2="395" y2="395" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="330" x2="395" y2="330" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="265" x2="395" y2="265" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="200" x2="395" y2="200" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="135" x2="395" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="70" y1="395" x2="395" y2="395" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="70" y1="395" x2="70" y2="135" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><circle cx="135" cy="395" r="6" fill="#316db5"/><text x="135" y="425" fill="#316db5" font-size="18">p = (1,0)</text><line x1="135" y1="395" x2="70" y2="330" stroke="#316db5" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/><circle cx="70" cy="330" r="6" fill="#316db5"/><line x1="70" y1="330" x2="265" y2="330" stroke="#b65a08" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orange)"/><circle cx="265" cy="330" r="6" fill="#b65a08"/><text x="275" y="318" fill="#b65a08" font-size="18">(3,1)</text><text x="30" y="465" fill="#17324d" font-size="19">(1,0) → (0,1) → (3,1)</text><text x="500" y="80" fill="#17324d" font-size="20">RTp：先右移 3，再转 90°</text><line x1="540" y1="395" x2="540" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="605" y1="395" x2="605" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="670" y1="395" x2="670" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="735" y1="395" x2="735" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="800" y1="395" x2="800" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="865" y1="395" x2="865" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="395" x2="865" y2="395" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="330" x2="865" y2="330" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="265" x2="865" y2="265" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="200" x2="865" y2="200" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="135" x2="865" y2="135" stroke="#dce5ed" stroke-width="1"/><line x1="540" y1="395" x2="865" y2="395" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="540" y1="395" x2="540" y2="135" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><circle cx="605" cy="395" r="6" fill="#316db5"/><text x="605" y="425" fill="#316db5" font-size="18">p = (1,0)</text><line x1="605" y1="395" x2="800" y2="395" stroke="#316db5" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/><circle cx="800" cy="395" r="6" fill="#316db5"/><line x1="800" y1="395" x2="540" y2="135" stroke="#b65a08" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orange)"/><circle cx="540" cy="135" r="6" fill="#b65a08"/><text x="550" y="123" fill="#b65a08" font-size="18">(0,4)</text><text x="500" y="465" fill="#17324d" font-size="19">(1,0) → (4,0) → (0,4)</text><text x="30" y="505" fill="#687c90" font-size="17">虚线连接运算前后的位置，只表示步骤，不表示旋转的真实运动轨迹。</text></g></svg>