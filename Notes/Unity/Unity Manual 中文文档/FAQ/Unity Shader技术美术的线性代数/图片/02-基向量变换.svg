<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img"><title>拉伸旋转错切镜像对基向量与单位方格的作用</title><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#17324d"/></marker><marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#dce5ed"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#bd3b48"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#14856e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#316db5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#b65a08"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#687c90"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#17324d"><text x="30" y="36" fill="#17324d" font-size="24">看两根基向量，就能看懂整个方格</text><text x="30" y="80" fill="#17324d" font-size="21">拉伸：x × 2</text><line x1="59" y1="303" x2="59" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="117" y1="303" x2="117" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="175" y1="303" x2="175" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="233" y1="303" x2="233" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="291" y1="303" x2="291" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="349" y1="303" x2="349" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="59" y1="303" x2="349" y2="303" stroke="#dce5ed" stroke-width="1"/><line x1="59" y1="245" x2="349" y2="245" stroke="#dce5ed" stroke-width="1"/><line x1="59" y1="187" x2="349" y2="187" stroke="#dce5ed" stroke-width="1"/><line x1="59" y1="129" x2="349" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="59" y1="245" x2="349" y2="245" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="175" y1="303" x2="175" y2="129" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><polygon points="175,245 233,245 233,187 175,187" fill="none" fill-opacity="0.1" stroke="#687c90" stroke-width="2" stroke-dasharray="6 4"/><polygon points="175,245 291,245 291,187 175,187" fill="#316db5" fill-opacity="0.1" stroke="#316db5" stroke-width="2"/><line x1="175" y1="245" x2="291" y2="245" stroke="#bd3b48" stroke-width="3" marker-end="url(#red)"/><line x1="175" y1="245" x2="175" y2="187" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="299" y="237" fill="#bd3b48" font-size="18">x′</text><text x="183" y="175" fill="#14856e" font-size="18">y′</text><text x="30" y="320" fill="#687c90" font-size="17">面积 × 2</text><text x="500" y="80" fill="#17324d" font-size="21">逆时针 90°</text><line x1="529" y1="303" x2="529" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="587" y1="303" x2="587" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="645" y1="303" x2="645" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="703" y1="303" x2="703" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="761" y1="303" x2="761" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="819" y1="303" x2="819" y2="129" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="303" x2="819" y2="303" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="245" x2="819" y2="245" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="187" x2="819" y2="187" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="129" x2="819" y2="129" stroke="#dce5ed" stroke-width