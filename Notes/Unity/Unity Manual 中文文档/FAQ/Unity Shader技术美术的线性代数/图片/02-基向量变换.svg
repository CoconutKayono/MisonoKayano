" stroke-width="2" stroke-dasharray="6 4"/><polygon points="175,515 233,515 291,457 233,457" fill="#316db5" fill-opacity="0.1" stroke="#316db5" stroke-width="2"/><line x1="175" y1="515" x2="233" y2="515" stroke="#bd3b48" stroke-width="3" marker-end="url(#red)"/><line x1="175" y1="515" x2="233" y2="457" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="241" y="507" fill="#bd3b48" font-size="18">x′</text><text x="241" y="445" fill="#14856e" font-size="18">y′</text><text x="30" y="590" fill="#687c90" font-size="17">面积不变，直角改变</text><text x="500" y="350" fill="#17324d" font-size="21">镜像：x′ = −x</text><line x1="529" y1="573" x2="529" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="587" y1="573" x2="587" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="645" y1="573" x2="645" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="703" y1="573" x2="703" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="761" y1="573" x2="761" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="819" y1="573" x2="819" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="573" x2="819" y2="573" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="515" x2="819" y2="515" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="457" x2="819" y2="457" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="399" x2="819" y2="399" stroke="#dce5ed" stroke-width="1"/><line x1="529" y1="515" x2="819" y2="515" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><line x1="645" y1="573" x2="645" y2="399" stroke="#687c90" stroke-width="1.5" marker-end="url(#muted)"/><polygon points="645,515 703,515 703,457 645,457" fill="none" fill-opacity="0.1" stroke="#687c90" stroke-width="2" stroke-dasharray="6 4"/><polygon points="645,515 587,515 587,457 645,457" fill="#316db5" fill-opacity="0.1" stroke="#316db5" stroke-width="2"/><line x1="645" y1="515" x2="587" y2="515" stroke="#bd3b48" stroke-width="3" marker-end="url(#red)"/><line x1="645" y1="515" x2="645" y2="457" stroke="#14856e" stroke-width="3" marker-end="url(#green)"/><text x="595" y="507" fill="#bd3b48" font-size="18">x′</text><text x="653" y="445" fill="#14856e" font-size="18">y′</text><text x="500" y="590" fill="#687c90" font-size="17">方向性翻转</text></g></svg>