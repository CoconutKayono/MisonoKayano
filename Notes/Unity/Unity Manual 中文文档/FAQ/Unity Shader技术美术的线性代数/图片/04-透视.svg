<svg xmlns="http://www.w3.org/2000/svg" width="960" height="505" viewBox="0 0 960 505" role="img"><title>相似三角形解释近大远小</title><defs><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#17324d"/></marker><marker id="grid" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#dce5ed"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#bd3b48"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#14856e"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#316db5"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#b65a08"/></marker><marker id="muted" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 Z" fill="#687c90"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfe"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#17324d"><text x="30" y="38" fill="#17324d" font-size="24">透视：等高物体，距离越远，投影越小</text><line x1="90" y1="345" x2="840" y2="345" stroke="#687c90" stroke-width="2" marker-end="url(#muted)"/><circle cx="90" cy="345" r="6" fill="#17324d"/><text x="65" y="380" fill="#17324d" font-size="18">相机</text><line x1="240" y1="405" x2="240" y2="135" stroke="#687c90" stroke-width="2" stroke-dasharray="7 5"/><text x="175" y="123" fill="#17324d" font-size="18">成像平面 z=1</text><line x1="390" y1="345" x2="390" y2="195" stroke="#316db5" stroke-width="5"/><text x="350" y="175" fill="#316db5" font-size="18">z=2，高=1</text><line x1="690" y1="345" x2="690" y2="195" stroke="#14856e" stroke-width="5"/><text x="650" y="175" fill="#14856e" font-size="18">z=4，高=1</text><line x1="90" y1="345" x2="390" y2="195" stroke="#316db5" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="345" x2="690" y2="195" stroke="#14856e" stroke-width="2" stroke-dasharray="7 5"/><circle cx="240" cy="270" r="6" fill="#316db5"/><circle cx="240" cy="307.5" r="6" fill="#14856e"/><text x="185" y="268" fill="#316db5" font-size="18">1/2</text><text x="252" y="310.5" fill="#14856e" font-size="18">1/4</text><text x="35" y="435" fill="#17324d" font-size="20">教学模型：向 +z 观察，f = 1；投影高度 = f × 高度 / 深度。</text><text x="35" y="475" fill="#687c90" font-size="18">示意成像平面放在相机前方；不是 Unity 的完整投影矩阵。</text></g></svg>