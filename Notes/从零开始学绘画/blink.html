<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>眨眼小练习 · 从零开始学绘画</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#2a405b;background:#f3f7fc;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:820px;margin:auto}a{color:#38669f}header{display:flex;gap:16px;justify-content:space-between;align-items:center}h1{font-size:25px;margin:0 0 10px}p{line-height:1.8;font-size:14px;color:#65758a}button,select,input{font:inherit}button,select{padding:9px 13px;border-radius:9px;background:white;border:1px solid #d4dfec;color:#2a405b}button{cursor:pointer}button:hover{background:#e8f1fc}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #75a0d7;outline-offset:3px}.primary{background:#406fa9;color:white}.primary:hover{background:#335b8e}.stage{background:white;border:1px solid #dce5ee;border-radius:15px;margin:18px 0;padding:14px;text-align:center}.view{height:260px;display:grid;place-items:center;background:conic-gradient(#f4f6f9 25%,white 0 50%,#f4f6f9 0 75%,white 0) 0 0/20px 20px;border-radius:10px;overflow:hidden}.view svg{width:100%;height:100%;background:#fffefa}.view img{max-width:100%;max-height:260px;object-fit:contain}#state{font-weight:650;margin:13px 0 3px;color:#355b8b}.sequence{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.sequence button{font-size:13px;padding:10px 3px}.sequence button.active{background:#deebfc;border-color:#608abd;color:#2d5383}.sequence small{display:block;color:#71849d;font-size:11px;margin-top:5px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{font-size:13px}details{border:1px solid #dce5ee;border-radius:13px;padding:16px;background:white;margin:22px 0}summary{cursor:pointer;font-weight:650}details p{margin:12px 0}.files{display:grid;gap:12px;margin:18px 0}.files label{display:grid;gap:7px;font-weight:600}.files input{max-width:100%;font-size:13px;font-weight:400}#message{min-height:23px;color:#486c57}#message.error{color:#a34545}.note{font-size:12px}body.embedded{padding:16px}body.embedded header a{display:none}body.embedded .intro{display:none}body.embedded h1{font-size:20px}body.embedded .view{height:205px}body.embedded .view img{max-height:205px}body.embedded .stage{margin:10px 0;padding:10px}body.embedded details{margin-top:14px}body.embedded .note{margin-bottom:0}[hidden]{display:none!important}@media(max-width:500px){body{padding:16px}header{display:block}header a{font-size:12px}.sequence{gap:4px}.sequence button{font-size:12px}.controls{gap:6px}.controls button{padding:8px 10px}.view{height:220px}.view img{max-height:220px}}
</style></head><body><main><header><h1>眨眼小练习</h1><a href="index.html#lesson-24">返回第 24 课 →</a></header><p class="intro">先看懂开合，再让自己的头像动起来。默认画面是程序绘制的眼睑示意，三张自选图片只在本机读取。</p><section class="stage" aria-label="眨眼预览"><div class="view"><svg id="schematic" viewBox="0 0 440 260" role="img" aria-label="两只简化眼睛，上眼睑遮挡虹膜的眨眼演示"><defs><clipPath id="left-clip"><path id="left-mask"/></clipPath><clipPath id="right-clip"><path id="right-mask"/></clipPath></defs><g id="left-eye" transform="translate(54 70)"><path d="M 0 0 Q 56 -18 112 0" fill="none" stroke="#738298" stroke-width="4" stroke-linecap="round"/><g clip-path="url(#left-clip)"><rect x="0" y="20" width="112" height="105" fill="white"/><circle cx="56" cy="78" r="33" fill="#82a9dc"/><circle cx="56" cy="78" r="15" fill="#31577f"/><circle cx="47" cy="67" r="6" fill="white"/></g><path id="left-outline" fill="none" stroke="#33465e" stroke-width="4" stroke-linecap="round"/></g><g id="right-eye" transform="translate(274 70)"><path d="M 0 0 Q 56 -18 112 0" fill="none" stroke="#738298" stroke-width="4" stroke-linecap="round"/><g clip-path="url(#right-clip)"><rect x="0" y="20" width="112" height="105" fill="white"/><circle cx="56" cy="78" r="33" fill="#82a9dc"/><circle cx="56" cy="78" r="15" fill="#31577f"/><circle cx="47" cy="67" r="6" fill="white"/></g><path id="right-outline" fill="none" stroke="#33465e" stroke-width="4" stroke-linecap="round"/></g><path d="M 213 206 Q 220 209 227 206" fill="none" stroke="#65768c" stroke-width="3" stroke-linecap="round"/></svg><img id="custom-image" alt="自选头像的眨眼状态" hidden></div><p id="state"></p><p class="note" id="mode">正在使用：简化眼睑示意</p></section><div class="sequence" aria-label="五个播放位置"><button data-step="0">01 睁眼<small>1000 ms</small></button><button data-step="1">02 半闭<small>80 ms</small></button><button data-step="2">03 闭眼<small>80 ms</small></button><button data-step="3">04 半闭<small>80 ms</small></button><button data-step="4">05 睁眼<small>1760 ms</small></button></div><div class="controls"><button id="play" class="primary">播放</button><button id="previous">上一步</button><button id="next">下一步</button><button id="restart">回到第 1 步</button><label for="speed">速度</label><select id="speed"><option value="1">正常 · 一轮 3 秒</option><option value="0.25">慢速 · 一轮 12 秒</option><option value="2">快速 · 一轮 1.5 秒</option></select></div><p class="note">正常播放用来感受节奏；暂停和逐步查看用来找位置、遮挡问题。切到其他标签页时会自动暂停。</p><details><summary>换成我自己画的三张图</summary><p>选择同尺寸、同位置的完整头像 PNG，不要分别裁掉画布边缘。三张都选好后再应用；文件不会上传，刷新后需要重新选择。</p><div class="files"><label>睁眼 PNG<input id="file-open" type="file" accept="image/png"></label><label>半闭 PNG<input id="file-half" type="file" accept="image/png"></label><label>闭眼 PNG<input id="file-closed" type="file" accept="image/png"></label></div><div class="controls"><button id="apply" class="primary">使用我的三张图</button><button id="reset">恢复示意图</button></div><p id="message" role="status" aria-live="polite"></p></details><p class="note">本工具只做预览，不导出 GIF 或视频。完成后请保留绘画源文件和三张 PNG。</p></main><script>
'use strict';
const $=id=>document.getElementById(id), states=['睁眼','半闭','闭眼','半闭','睁眼'], durations=[1000,80,80,80,1760], imageIndex=[0,1,2,1,0];
let step=0,playing=false,timer=null,frames=null,generation=0;
if(new URLSearchParams(location.search).has('embedded'))document.body.classList.add('embedded');
function render(){const state=imageIndex[step];const top=[8,72,124][state];const upper=`M 0 68 Q 56 ${top} 112 68`;const path=upper+' Q 56 124 0 68 Z';for(const side of ['left','right']){$(side+'-mask').setAttribute('d',state===2?'M 0 0 Z':path);$(side+'-outline').setAttribute('d',state===2?'M 0 68 Q 56 124 112 68':path)}$('schematic').hidden=!!frames;$('schematic').style.display=frames?'none':'';$('custom-image').hidden=!frames;if(frames){$('custom-image').src=frames[state].url;$('custom-image').alt='我的头像 · '+states[step]}$('state').textContent=`第 ${step+1} / 5 步 · ${states[step]}`;document.querySelectorAll('[data-step]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.step)===step);b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step))});$('play').textContent=playing?'暂停':'播放';}
function pause(){playing=false;clearTimeout(timer);render()}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{step=(step+1)%5;render();schedule()},durations[step]/Number($('speed').value))}
$('play').addEventListener('click',()=>{playing=!playing;render();schedule()});
function go(n){pause();step=(n+5)%5;render()}
$('previous').addEventListener('click',()=>go(step-1));$('next').addEventListener('click',()=>go(step+1));$('restart').addEventListener('click',()=>go(0));document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.step))));$('speed').addEventListener('change',schedule);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function release(arr){if(arr)arr.forEach(f=>URL.revokeObjectURL(f.url))}
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
$('apply').addEventListener('click',async()=>{const files=['file-open','file-half','file-closed'].map(id=>$(id).files[0]);if(files.some(f=>!f)){message('请先分别选择睁眼、半闭、闭眼三张 PNG。',true);return}if(files.some(f=>f.type!=='image/png'&&!f.name.toLowerCase().endsWith('.png'))){message('本练习使用 PNG 文件，请重新选择。',true);return}pause();const version=++generation;$('apply').disabled=true;const pending=files.map(file=>({file,url:URL.createObjectURL(file)}));try{await Promise.all(pending.map(f=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{f.width=img.naturalWidth;f.height=img.naturalHeight;resolve()};img.onerror=()=>reject(new Error('有图片无法读取，请检查文件是否为有效 PNG。'));img.src=f.url})));if(version!==generation){release(pending);return}if(pending.some(f=>f.width!==pending[0].width||f.height!==pending[0].height))throw new Error('三张图的尺寸不同：'+pending.map(f=>`${f.width} × ${f.height}`).join('、')+'。请使用同一画布重新导出。');release(frames);frames=pending;step=0;$('mode').textContent=`正在使用：你的三张头像 · ${frames[0].width} × ${frames[0].height}`;message('载入完成。尺寸一致；请逐步切换，检查鼻子与头发的位置是否稳定。');render()}catch(error){release(pending);if(version===generation)message(error.message,true)}finally{if(version===generation)$('apply').disabled=false}});
$('reset').addEventListener('click',()=>{generation++;pause();release(frames);frames=null;step=0;$('custom-image').removeAttribute('src');['file-open','file-half','file-closed'].forEach(id=>$(id).value='');$('apply').disabled=false;$('mode').textContent='正在使用：简化眼睑示意';message('已恢复示意图，你的原文件没有被修改。');render()});render();
</script></body></html>
