>检查：\u003c/strong> 大椭圆两侧是否给帽檐留出足够空间？小椭圆是否有可能容纳头？它们不是两条必须完整露出的装饰线。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：从帽口向上连接帽身\u003c/h2>\n\u003cp>从帽口两侧向上画收拢的轮廓，先概括成一个锥体般的大形。帽身的下部要与帽口连接，不能像另一顶帽子悬在上面。\u003c/p>\n\u003cp>先把整体高度和宽度安排好，再决定尖顶是否微弯、帽身是否柔软。第一遍可以不加褶皱，只保留简单轮廓。\u003c/p>\n\u003cp>图里的尖顶略有弯折，是造型变化，不是让你忘掉里面最开始规划的体量。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：判断谁在前，隐藏被遮住的线\u003c/h2>\n\u003cp>观察参考，前方帽檐通常会挡住一部分上方头发。帽身也会挡住后方帽檐的一些边界。\u003c/p>\n\u003cp>在每个交接处都问一次：沿着视线看，哪一个部分更靠近我们？靠后的部分被挡住时，边界就不能继续穿过前面的形状。\u003c/p>\n\u003cp>如果把辅助椭圆完整描成黑线，它很可能穿过头发或帽身，像透明塑料圆环。解决方法是保留完整辅助层用于理解，清稿层只画可见部分。\u003c/p>\n\u003cp>帽檐下方哪些边缘还露在头两侧，要结合你画的倾角判断。不要简单地把椭圆一半全部擦掉。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：最后加帽带\u003c/h2>\n\u003cp>沿帽身下部画一条带状区域。它的走向要顺着帽身绕过去，不能完全无视已经画出的体积，像贴了一条与帽子方向冲突的直线。\u003c/p>\n\u003cp>先画上下两条边界，间距保持大致连贯。装饰、缝线和复杂褶皱都可以暂时省略。\u003c/p>\n\u003cp>缩小看整张头像：帽子和头是否连接？帽檐有没有不小心遮掉全部眼睛？帽尖是否仍在画布里？\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎样改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>帽子像漂在头上\u003c/td>\n\u003ctd>帽口是否离头过远，遮挡是否缺失\u003c/td>\n\u003ctd>重新安排戴帽位置和接触区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>帽身插进头里\u003c/td>\n\u003ctd>是否只顾尖顶，忘记帽口容积\u003c/td>\n\u003ctd>显示完整头部，调整帽口与底部宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>椭圆线穿过刘海\u003c/td>\n\u003ctd>是否把辅助线全部清成实线\u003c/td>\n\u003ctd>按前后关系隐藏被挡部分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>帽檐看起来拧了\u003c/td>\n\u003ctd>两侧方向、宽度与帽口关系是否矛盾\u003c/td>\n\u003ctd>回到大椭圆，先修整体方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最后帽尖被裁掉\u003c/td>\n\u003ctd>草图阶段是否没有预留空间\u003c/td>\n\u003ctd>先扩展画布或整体缩放，再完成细节\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 在已有头部上只画帽口、帽檐和简单帽身，不加帽带。\u003c/p>\n\u003cp>\u003cstrong>B，八分钟：\u003c/strong> 自己判断一处遮挡，清掉不该露出的辅助线，再加一条简单帽带。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只改变帽檐宽度，保持帽口和头不动，比较造型变化。\u003c/p>\n\u003cp>能说明帽口在哪里、头怎样被包住、哪条线因为遮挡而消失，就可以保存。今天不要求复杂帽子透视全部掌握。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-13\">上一篇：辫子\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-15\">下一篇：颈肩连接\u003c/a>\u003c/p>", "text": "# 14 · 帽子怎样放在头上\n\n> 今天只练一顶简化魔法帽怎样围住头部：先安排帽口与帽檐，再连接帽身。\n>\n> 前置：[11 · 刘海](11-刘海先画成几大块.md)、[12 · 侧后发](12-侧发和后发怎样包住头.md)。辫子尚未画好也可以先练帽子。\n\n## 1. 把帽子分成三个大部分\n\n先把洛琪希这类魔法帽概括为：容纳头部的帽口、向外展开的帽檐、向上延伸的帽身。\n\n帽口不是直接画在脸上的小椭圆；它表示头进入帽子的开口。帽檐也不是一条随意穿过头的横线，它围着帽口向外延伸。\n\n**先考虑帽子里面有没有空间放下头，再画好看的尖顶。**\n\n## 2. 看图：辅助椭圆与最后可见轮廓\n\n![魔法帽围绕头部的帽口、帽檐、帽身与遮挡示意](assets/lesson-14-witch-hat.png)\n\n| 编号 | 观察重点 |\n| --- | --- |\n| 01 | 保留头部体积，知道帽子要包住哪里 |\n| 02 | 用大、小辅助椭圆规划帽檐与帽口 |\n| 03 | 在帽口上方建立向上收拢的帽身 |\n| 04 | 决定前后遮挡，辨认可见边界 |\n| 05 | 整理帽子线稿，去掉不需要的辅助线 |\n| 06 | 简单着色后确认整体形状可读 |\n\n蓝线和虚线用于帮助推想完整形状，不是最后都要描出来的轮廓。04 的虚线尤其用于提示辅助范围，不能机械地认为虚线所经过的整段永远不可见；是否可见仍取决于帽身、头部与帽檐实际的遮挡。\n\n配图是生成的简化示意，各格存在轻微形状差异。自己练习时在同一底稿上逐步添加。脸部已有颜色只方便辨认，不要求现在同步上色。\n\n## 3. 第一步：先留出整顶帽子的空间\n\n在画布上方和两侧留出余量。先用很轻的线框一下帽尖和帽檐最远能到哪里，避免等帽子画好才发现尖顶被裁掉。\n\n显示完整头部底稿，即使头顶之后会被帽子遮住，也先保留它。头发还有一定体量，规划帽口时一起考虑。\n\n本篇先练近正面、帽子没有大幅倾斜的情况。复杂侧视和帽檐翻折可以以后再展开。\n\n## 4. 第二步：用辅助椭圆规划帽口和帽檐\n\n在头部上方附近，用一个较小的椭圆帮助表示帽口范围。它应该能围住戴帽位置的头部与头发，而不是小到插进头里。\n\n再围着它画一个较大的椭圆，作为帽檐展开范围。先让两个形状的大致方向一致，别一个明显向左斜、一个明显向右斜。\n\n这里用椭圆近似圆形开口的投影。看得越倾斜，圆形投影可能越扁；今天先照着近正面的参考安排，不必背某个固定扁率。\n\n**检查：** 大椭圆两侧是否给帽檐留出足够空间？小椭圆是否有可能容纳头？它们不是两条必须完整露出的装饰线。\n\n## 5. 第三步：从帽口向上连接帽身\n\n从帽口两侧向上画收拢的轮廓，先概括成一个锥体般的大形。帽身的下部要与帽口连接，不能像另一顶帽子悬在上面。\n\n先把整体高度和宽度安排好，再决定尖顶是否微弯、帽身是否柔软。第一遍可以不加褶皱，只保留简单轮廓。\n\n图里的尖顶略有弯折，是造型变化，不是让你忘掉里面最开始规划的体量。\n\n## 6. 第四步：判断谁在前，隐藏被遮住的线\n\n观察参考，前方帽檐通常会挡住一部分上方头发。帽身也会挡住后方帽檐的一些边界。\n\n在每个交接处都问一次：沿着视线看，哪一个部分更靠近我们？靠后的部分被挡住时，边界就不能继续穿过前面的形状。\n\n如果把辅助椭圆完整描成黑线，它很可能穿过头发或帽身，像透明塑料圆环。解决方法是保留完整辅助层用于理解，清稿层只画可见部分。\n\n帽檐下方哪些边缘还露在头两侧，要结合你画的倾角判断。不要简单地把椭圆一半全部擦掉。\n\n## 7. 第五步：最后加帽带\n\n沿帽身下部画一条带状区域。它的走向要顺着帽身绕过去，不能完全无视已经画出的体积，像贴了一条与帽子方向冲突的直线。\n\n先画上下两条边界，间距保持大致连贯。装饰、缝线和复杂褶皱都可以暂时省略。\n\n缩小看整张头像：帽子和头是否连接？帽檐有没有不小心遮掉全部眼睛？帽尖是否仍在画布里？\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 可以怎样改 |\n| --- | --- | --- |\n| 帽子像漂在头上 | 帽口是否离头过远，遮挡是否缺失 | 重新安排戴帽位置和接触区域 |\n| 帽身插进头里 | 是否只顾尖顶，忘记帽口容积 | 显示完整头部，调整帽口与底部宽度 |\n| 椭圆线穿过刘海 | 是否把辅助线全部清成实线 | 按前后关系隐藏被挡部分 |\n| 帽檐看起来拧了 | 两侧方向、宽度与帽口关系是否矛盾 | 回到大椭圆，先修整体方向 |\n| 最后帽尖被裁掉 | 草图阶段是否没有预留空间 | 先扩展画布或整体缩放，再完成细节 |\n\n## 9. 三次小练习\n\n**A，十分钟：** 在已有头部上只画帽口、帽檐和简单帽身，不加帽带。\n\n**B，八分钟：** 自己判断一处遮挡，清掉不该露出的辅助线，再加一条简单帽带。\n\n**C，五分钟：** 复制一版，只改变帽檐宽度，保持帽口和头不动，比较造型变化。\n\n能说明帽口在哪里、头怎样被包住、哪条线因为遮挡而消失，就可以保存。今天不要求复杂帽子透视全部掌握。\n\n[上一篇：辫子](13-辫子怎样概括.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：颈肩连接](15-脖子怎样接到肩膀.md)\n"}, {"id": "lesson-15", "number": 15, "short": "脖子怎样接到肩膀", "file": "15-脖子怎样接到肩膀.md", "html": "\u003ch1 id=\"15\">15 · 脖子怎样接到肩膀\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只补一个简单的正面颈肩，让头像有清楚的支撑和连接。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-01\">01 · 头部轮廓\u003c/a>。头发和帽子可以临时隐藏，便于看清连接。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 脖子不是从下巴尖分出的两条线\u003c/h2>\n\u003cp>正面看，头在脖子前上方，脖子的两侧从下颌后方附近显露，再向下与肩部连接。\u003c/p>\n\u003cp>如果把两条线都从下巴尖开始拉，容易像用一根细杆撑着头。今天先用简化轮廓理解前后与宽度，不展开肌肉和骨骼名称。\u003c/p>\n\u003cp>\u003cstrong>保留头部，补出颈部两侧，再把它们自然地过渡到肩部。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先规划位置，再连接曲线\u003c/h2>\n\u003cp>\u003cimg alt=\"正面头部、脖子与肩部的连接步骤\" src=\"assets/lesson-15-neck-shoulders.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>当前任务\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>保留头部和中线，暂时没有颈肩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>标出下颌两侧参考位置和肩部大致高度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>从下颌后方附近画出颈部两侧的可见轮廓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>向外接到肩部，形成连贯的过渡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>可选地用少量线提示锁骨区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>简化整理，并用普通领口帮助表现衣服关系\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>红点用于观察下颌两侧，不是要求颈线严格从点上出发。下方蓝色横线只规划大致高度与范围，不是最终肩膀的形状。图为生成的概括示意，比例不是唯一标准。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：先决定头像画到哪里\u003c/h2>\n\u003cp>可以只画到肩膀上部，不必把整件衣服都展开。先在头部下方轻画一条高度参考线，表示你准备让肩部大致出现的位置。\u003c/p>\n\u003cp>脖子长短先对照一个清楚的正面参考。不要为了给服饰留空间，把它不断向下拉长。\u003c/p>\n\u003cp>这次画面近正面、平静站立，先让头部中心与躯干中心大致一致，避免引入复杂扭转。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：画颈部两侧，留出宽度\u003c/h2>\n\u003cp>在下颌两边较靠内的位置，画出颈部侧边，从下颌后面向下延伸。注意下巴轮廓仍然在前面，不要把原下巴擦成颈线的一部分。\u003c/p>\n\u003cp>两条颈线之间要有合理宽度。先与头宽比较，不急着记固定比例。不同角色、姿势和画风会有不同安排。\u003c/p>\n\u003cp>线可以略弯，不必是两条笔直平行的柱子。第一遍曲度小一些，避免为了柔软而画出过多凹凸。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 头看起来是否被一个有宽度的颈部支撑？两侧是否都挤到了下巴尖下方？\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：向外延伸成肩部\u003c/h2>\n\u003cp>到颈根附近，轮廓逐渐向外、略向下延伸，接出肩膀的走向。先看整体的缓和转折，不要突然接成一条水平横杠。\u003c/p>\n\u003cp>画左侧后，立即画右侧，再比较高度和延伸方向。正面基准练习先保持相近；后面动作课会有高低肩和身体倾斜。\u003c/p>\n\u003cp>不必今天画完上臂，只要肩部轮廓在画面中有明确延续即可。截取胸像时，画面可以在合适位置结束。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：少量提示内部关系\u003c/h2>\n\u003cp>想进一步说明颈肩转折，可以在颈根左右加很轻的线，概括锁骨区域。它们应当服务于大形，不需要画成两条很深的沟。\u003c/p>\n\u003cp>你也可以先不画内部线。若外轮廓已经能表达连接，省略细节是成立的。\u003c/p>\n\u003cp>头部下面的阴影以后再学。今天不要用一大块黑色遮住不确定的连接，先把轮廓看清楚。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：让领口围住颈部\u003c/h2>\n\u003cp>可以先画一个简单圆领或简化立领，帮助完成头像。领口要围着颈部和上胸所在的体积转过去，不是孤零零的一条装饰线。\u003c/p>\n\u003cp>衣领靠前时会遮住一部分颈部，按前后关系隐藏相应线条。不要同时保留领口前面的完整颈线，仿佛衣服透明。\u003c/p>\n\u003cp>若准备画洛琪希的具体衣领，可以参考正式画面，把复杂部分先合并为几个大形。今天的目标仍是颈肩连接。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>怎样试改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像细杆撑着头\u003c/td>\n\u003ctd>颈部是否过窄、两线是否从下巴尖出发\u003c/td>\n\u003ctd>把两侧连接分开，参考下颌后方位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像一根长管子\u003c/td>\n\u003ctd>是否拉长颈部而未检查肩高\u003c/td>\n\u003ctd>提高肩部或缩短可见颈长\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>肩膀像 T 字横杆\u003c/td>\n\u003ctd>是否突然变成完全水平直线\u003c/td>\n\u003ctd>让颈根到肩部有较自然的过渡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头偏在肩膀一边\u003c/td>\n\u003ctd>是否无意混入倾斜或躯干移位\u003c/td>\n\u003ctd>检查基准中线，先稳定正面安排\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>衣领穿过脖子\u003c/td>\n\u003ctd>遮挡处是否保留了多余颈线\u003c/td>\n\u003ctd>保留草稿，隐藏最终不可见部分\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 隐藏头发，只给现有头部接上简单颈肩。\u003c/p>\n\u003cp>\u003cstrong>B，五到八分钟：\u003c/strong> 另画一个小草图，先放肩高，再连接颈部，不照搬每一笔。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只改变可见颈长，保持头部大小不变，比较整体比例。\u003c/p>\n\u003cp>可以结束时，你能解释颈线为何不从下巴尖拉出，肩部如何延续，以及领口挡住了哪一部分。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-14\">上一篇：帽子\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-16\">下一篇：整理线稿\u003c/a>\u003c/p>", "text": "# 15 · 脖子怎样接到肩膀\n\n> 今天只补一个简单的正面颈肩，让头像有清楚的支撑和连接。\n>\n> 前置：[01 · 头部轮廓](01-头部起形：从圆到脸颊和下巴.md)。头发和帽子可以临时隐藏，便于看清连接。\n\n## 1. 脖子不是从下巴尖分出的两条线\n\n正面看，头在脖子前上方，脖子的两侧从下颌后方附近显露，再向下与肩部连接。\n\n如果把两条线都从下巴尖开始拉，容易像用一根细杆撑着头。今天先用简化轮廓理解前后与宽度，不展开肌肉和骨骼名称。\n\n**保留头部，补出颈部两侧，再把它们自然地过渡到肩部。**\n\n## 2. 看图：先规划位置，再连接曲线\n\n![正面头部、脖子与肩部的连接步骤](assets/lesson-15-neck-shoulders.png)\n\n| 编号 | 当前任务 |\n| --- | --- |\n| 01 | 保留头部和中线，暂时没有颈肩 |\n| 02 | 标出下颌两侧参考位置和肩部大致高度 |\n| 03 | 从下颌后方附近画出颈部两侧的可见轮廓 |\n| 04 | 向外接到肩部，形成连贯的过渡 |\n| 05 | 可选地用少量线提示锁骨区域 |\n| 06 | 简化整理，并用普通领口帮助表现衣服关系 |\n\n红点用于观察下颌两侧，不是要求颈线严格从点上出发。下方蓝色横线只规划大致高度与范围，不是最终肩膀的形状。图为生成的概括示意，比例不是唯一标准。\n\n## 3. 第一步：先决定头像画到哪里\n\n可以只画到肩膀上部，不必把整件衣服都展开。先在头部下方轻画一条高度参考线，表示你准备让肩部大致出现的位置。\n\n脖子长短先对照一个清楚的正面参考。不要为了给服饰留空间，把它不断向下拉长。\n\n这次画面近正面、平静站立，先让头部中心与躯干中心大致一致，避免引入复杂扭转。\n\n## 4. 第二步：画颈部两侧，留出宽度\n\n在下颌两边较靠内的位置，画出颈部侧边，从下颌后面向下延伸。注意下巴轮廓仍然在前面，不要把原下巴擦成颈线的一部分。\n\n两条颈线之间要有合理宽度。先与头宽比较，不急着记固定比例。不同角色、姿势和画风会有不同安排。\n\n线可以略弯，不必是两条笔直平行的柱子。第一遍曲度小一些，避免为了柔软而画出过多凹凸。\n\n**检查：** 头看起来是否被一个有宽度的颈部支撑？两侧是否都挤到了下巴尖下方？\n\n## 5. 第三步：向外延伸成肩部\n\n到颈根附近，轮廓逐渐向外、略向下延伸，接出肩膀的走向。先看整体的缓和转折，不要突然接成一条水平横杠。\n\n画左侧后，立即画右侧，再比较高度和延伸方向。正面基准练习先保持相近；后面动作课会有高低肩和身体倾斜。\n\n不必今天画完上臂，只要肩部轮廓在画面中有明确延续即可。截取胸像时，画面可以在合适位置结束。\n\n## 6. 第四步：少量提示内部关系\n\n想进一步说明颈肩转折，可以在颈根左右加很轻的线，概括锁骨区域。它们应当服务于大形，不需要画成两条很深的沟。\n\n你也可以先不画内部线。若外轮廓已经能表达连接，省略细节是成立的。\n\n头部下面的阴影以后再学。今天不要用一大块黑色遮住不确定的连接，先把轮廓看清楚。\n\n## 7. 第五步：让领口围住颈部\n\n可以先画一个简单圆领或简化立领，帮助完成头像。领口要围着颈部和上胸所在的体积转过去，不是孤零零的一条装饰线。\n\n衣领靠前时会遮住一部分颈部，按前后关系隐藏相应线条。不要同时保留领口前面的完整颈线，仿佛衣服透明。\n\n若准备画洛琪希的具体衣领，可以参考正式画面，把复杂部分先合并为几个大形。今天的目标仍是颈肩连接。\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 怎样试改 |\n| --- | --- | --- |\n| 像细杆撑着头 | 颈部是否过窄、两线是否从下巴尖出发 | 把两侧连接分开，参考下颌后方位置 |\n| 像一根长管子 | 是否拉长颈部而未检查肩高 | 提高肩部或缩短可见颈长 |\n| 肩膀像 T 字横杆 | 是否突然变成完全水平直线 | 让颈根到肩部有较自然的过渡 |\n| 头偏在肩膀一边 | 是否无意混入倾斜或躯干移位 | 检查基准中线，先稳定正面安排 |\n| 衣领穿过脖子 | 遮挡处是否保留了多余颈线 | 保留草稿，隐藏最终不可见部分 |\n\n## 9. 三次小练习\n\n**A，十分钟：** 隐藏头发，只给现有头部接上简单颈肩。\n\n**B，五到八分钟：** 另画一个小草图，先放肩高，再连接颈部，不照搬每一笔。\n\n**C，五分钟：** 复制一版，只改变可见颈长，保持头部大小不变，比较整体比例。\n\n可以结束时，你能解释颈线为何不从下巴尖拉出，肩部如何延续，以及领口挡住了哪一部分。\n\n[上一篇：帽子](14-帽子怎样放在头上.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：整理线稿](16-草图怎样整理成线稿.md)\n"}, {"id": "lesson-16", "number": 16, "short": "草图怎样整理成线稿", "file": "16-草图怎样整理成线稿.md", "html": "\u003ch1 id=\"16\">16 · 草图怎样整理成线稿\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只把已有草图中的主要边界整理清楚，不在清稿时同时大改造型。\u003c/p>\n\u003cp>前置：有一张脸、发型和简单颈肩都已安排好的草图。帽子可以有，也可以暂时隐藏。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 清稿是做选择，不是把每条草稿线描黑\u003c/h2>\n\u003cp>草图里常有几条相近的尝试线、定位线和被遮住的辅助形。清稿时需要决定：哪条边界最符合想要的形状？哪条只是在帮助思考？\u003c/p>\n\u003cp>如果把所有线都加深，画面只会从浅乱变成深乱。\u003cstrong>先确定形状，再挑需要保留的线。\u003c/strong>\u003c/p>\n\u003cp>发现严重位置问题时，先回草图层调整。清稿更适合处理已经基本决定的大形。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：保留同一设计，逐步选择边界\u003c/h2>\n\u003cp>\u003cimg alt=\"草图、选择性清线与整理后的线稿对照\" src=\"assets/lesson-16-clean-lineart.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>蓝色草图保留尝试线和辅助线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>降低草图存在感，在上面选择部分边界清线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>隐藏草图，检查独立线稿是否读得清楚\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>红色短标记提示正在观察的轮廓。图为生成示意，细节在格间略有变化；实际清稿时沿用自己的同一底稿，不需要把发型改成示例。图中辫子与服装只作整体示范。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：保留草稿副本，降低不透明度\u003c/h2>\n\u003cp>先保存源文件。把草图放进单独图层或图层组，再在上方建立“线稿”层。\u003c/p>\n\u003cp>把草图透明度调到能看清但不抢眼的程度。没有必须使用的百分比，关键是你能区分新线和旧线。\u003c/p>\n\u003cp>检查当前选中的是线稿层，避免忙了半天却把清线全部画到草图里。可以先试画一小笔，再隐藏草图验证。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：先选一个小区域清理\u003c/h2>\n\u003cp>建议从一束头发或半边脸部外轮廓开始。沿着草图看一遍，决定要保留哪条路径，再落笔。\u003c/p>\n\u003cp>如果同一位置有三条尝试线，不必取它们机械平均。选择最符合你要的形状的一条，必要时在草图层先重新概括。\u003c/p>\n\u003cp>一小块清好后，缩小看是否与周围连贯，再继续下一块。这样比从头到尾追着细线跑更容易发现大形偏差。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：用舒服的方向画较长的线\u003c/h2>\n\u003cp>可以旋转或平移画布，让你习惯的落笔方向对着当前轮廓。也可以适度使用防抖，但不同软件和设备手感不同，先从较轻的辅助程度尝试。\u003c/p>\n\u003cp>一条长轮廓可以分成几笔。把接笔安排在自然转折或遮挡附近，通常比在最平滑的中段反复接线更容易整理。\u003c/p>\n\u003cp>不要只用很短的碎线来回磨。同样也不必要求所有线一笔完成。目标是连贯地表达形状，不是表演控笔。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：用线重区分主要与次要\u003c/h2>\n\u003cp>你可以让整体外轮廓或重要遮挡线稍重一些，内部发丝、浅褶皱等次要线较轻。这是一个易于尝试的层次方法，不是所有画风的强制规则。\u003c/p>\n\u003cp>先小幅变化。把每个交点都涂黑，不一定更有立体感；眼角、嘴角也不需要自动画成大黑块。\u003c/p>\n\u003cp>检查方法是缩小：主要形状是否仍清楚？内部线条有没有比五官更抢眼？若有，先减少次要线，而不是继续加粗所有轮廓。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：清理遮挡和接头\u003c/h2>\n\u003cp>检查刘海与额头、侧发与脸、辫子交叠、帽檐与头发、衣领与颈部这些位置。\u003c/p>\n\u003cp>前方边界保持清楚，后方被挡住的线在合适位置停下。线头可以稍微修整，避免超过交接位置留下小刺。\u003c/p>\n\u003cp>但不要把所有线强行封闭。某些眼睑或脸部提示线本来就可以断开。后续上色需要封闭区域时，可以用单独辅助层或选区解决，不必为了油漆桶把画风改变成处处封口。\u003c/p>\n\u003ch2 id=\"8\">8. 第六步：隐藏草图，单独看线稿\u003c/h2>\n\u003cp>草图常会在视觉上替新线补全缺漏。隐藏它以后，你才知道线稿自身是否完整。\u003c/p>\n\u003cp>先看整张头像，再放大找少量明显漏线、毛刺或不需要的辅助线。只修最影响阅读的问题，不必把每个像素磨平。\u003c/p>\n\u003cp>清稿后若整张脸反而不像草图，检查有没有在追线时改变眼睛大小、下巴长度或刘海轮廓。可以叠回草图比较大位置，而不只是继续加细节。\u003c/p>\n\u003ch2 id=\"9\">9. 常见问题与练习\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>可以先做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>线越描越粗\u003c/td>\n\u003ctd>撤回重复加线，重新选择一条明确路径\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>清完像换了人\u003c/td>\n\u003ctd>对照草图的大位置和轮廓，不先怪笔刷\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>看着草图很完整，隐藏后缺东西\u003c/td>\n\u003ctd>单独检查线稿层，补真正需要的边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>所有线都很抢眼\u003c/td>\n\u003ctd>减少内部细线，保留主要层次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一个局部磨很久\u003c/td>\n\u003ctd>缩小确认它是否影响整体，给本次修改设个小范围\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 只清理一束刘海和附近的脸部轮廓，理解选择过程。\u003c/p>\n\u003cp>\u003cstrong>B，十分钟：\u003c/strong> 自己清理另一块区域，过程中至少隐藏一次草图检查。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只减轻内部次要线，比较整体可读性。\u003c/p>\n\u003cp>可以结束时，线稿脱离草图后仍看得清主要形状；你能指出哪些线被保留，哪些线因为辅助或遮挡被去掉。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-15\">上一篇：颈肩连接\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-17\">下一篇：铺底色\u003c/a>\u003c/p>", "text": "# 16 · 草图怎样整理成线稿\n\n> 今天只把已有草图中的主要边界整理清楚，不在清稿时同时大改造型。\n>\n> 前置：有一张脸、发型和简单颈肩都已安排好的草图。帽子可以有，也可以暂时隐藏。\n\n## 1. 清稿是做选择，不是把每条草稿线描黑\n\n草图里常有几条相近的尝试线、定位线和被遮住的辅助形。清稿时需要决定：哪条边界最符合想要的形状？哪条只是在帮助思考？\n\n如果把所有线都加深，画面只会从浅乱变成深乱。**先确定形状，再挑需要保留的线。**\n\n发现严重位置问题时，先回草图层调整。清稿更适合处理已经基本决定的大形。\n\n## 2. 看图：保留同一设计，逐步选择边界\n\n![草图、选择性清线与整理后的线稿对照](assets/lesson-16-clean-lineart.png)\n\n| 编号 | 当前状态 |\n| --- | --- |\n| 01 | 蓝色草图保留尝试线和辅助线 |\n| 02 | 降低草图存在感，在上面选择部分边界清线 |\n| 03 | 隐藏草图，检查独立线稿是否读得清楚 |\n\n红色短标记提示正在观察的轮廓。图为生成示意，细节在格间略有变化；实际清稿时沿用自己的同一底稿，不需要把发型改成示例。图中辫子与服装只作整体示范。\n\n## 3. 第一步：保留草稿副本，降低不透明度\n\n先保存源文件。把草图放进单独图层或图层组，再在上方建立“线稿”层。\n\n把草图透明度调到能看清但不抢眼的程度。没有必须使用的百分比，关键是你能区分新线和旧线。\n\n检查当前选中的是线稿层，避免忙了半天却把清线全部画到草图里。可以先试画一小笔，再隐藏草图验证。\n\n## 4. 第二步：先选一个小区域清理\n\n建议从一束头发或半边脸部外轮廓开始。沿着草图看一遍，决定要保留哪条路径，再落笔。\n\n如果同一位置有三条尝试线，不必取它们机械平均。选择最符合你要的形状的一条，必要时在草图层先重新概括。\n\n一小块清好后，缩小看是否与周围连贯，再继续下一块。这样比从头到尾追着细线跑更容易发现大形偏差。\n\n## 5. 第三步：用舒服的方向画较长的线\n\n可以旋转或平移画布，让你习惯的落笔方向对着当前轮廓。也可以适度使用防抖，但不同软件和设备手感不同，先从较轻的辅助程度尝试。\n\n一条长轮廓可以分成几笔。把接笔安排在自然转折或遮挡附近，通常比在最平滑的中段反复接线更容易整理。\n\n不要只用很短的碎线来回磨。同样也不必要求所有线一笔完成。目标是连贯地表达形状，不是表演控笔。\n\n## 6. 第四步：用线重区分主要与次要\n\n你可以让整体外轮廓或重要遮挡线稍重一些，内部发丝、浅褶皱等次要线较轻。这是一个易于尝试的层次方法，不是所有画风的强制规则。\n\n先小幅变化。把每个交点都涂黑，不一定更有立体感；眼角、嘴角也不需要自动画成大黑块。\n\n检查方法是缩小：主要形状是否仍清楚？内部线条有没有比五官更抢眼？若有，先减少次要线，而不是继续加粗所有轮廓。\n\n## 7. 第五步：清理遮挡和接头\n\n检查刘海与额头、侧发与脸、辫子交叠、帽檐与头发、衣领与颈部这些位置。\n\n前方边界保持清楚，后方被挡住的线在合适位置停下。线头可以稍微修整，避免超过交接位置留下小刺。\n\n但不要把所有线强行封闭。某些眼睑或脸部提示线本来就可以断开。后续上色需要封闭区域时，可以用单独辅助层或选区解决，不必为了油漆桶把画风改变成处处封口。\n\n## 8. 第六步：隐藏草图，单独看线稿\n\n草图常会在视觉上替新线补全缺漏。隐藏它以后，你才知道线稿自身是否完整。\n\n先看整张头像，再放大找少量明显漏线、毛刺或不需要的辅助线。只修最影响阅读的问题，不必把每个像素磨平。\n\n清稿后若整张脸反而不像草图，检查有没有在追线时改变眼睛大小、下巴长度或刘海轮廓。可以叠回草图比较大位置，而不只是继续加细节。\n\n## 9. 常见问题与练习\n\n| 现象 | 可以先做什么 |\n| --- | --- |\n| 线越描越粗 | 撤回重复加线，重新选择一条明确路径 |\n| 清完像换了人 | 对照草图的大位置和轮廓，不先怪笔刷 |\n| 看着草图很完整，隐藏后缺东西 | 单独检查线稿层，补真正需要的边界 |\n| 所有线都很抢眼 | 减少内部细线，保留主要层次 |\n| 一个局部磨很久 | 缩小确认它是否影响整体，给本次修改设个小范围 |\n\n**A，十分钟：** 只清理一束刘海和附近的脸部轮廓，理解选择过程。\n\n**B，十分钟：** 自己清理另一块区域，过程中至少隐藏一次草图检查。\n\n**C，五分钟：** 复制一版，只减轻内部次要线，比较整体可读性。\n\n可以结束时，线稿脱离草图后仍看得清主要形状；你能指出哪些线被保留，哪些线因为辅助或遮挡被去掉。\n\n[上一篇：颈肩连接](15-脖子怎样接到肩膀.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：铺底色](17-底色怎样铺清楚.md)\n"}, {"id": "lesson-17", "number": 17, "short": "底色怎样铺清楚", "file": "17-底色怎样铺清楚.md", "html": "\u003ch1 id=\"17\">17 · 底色怎样铺清楚\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只给主要区域铺上颜色，先不画复杂阴影、高光和材质。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-16\">16 · 整理线稿\u003c/a>。使用自己的可编辑画稿，而不是把教程示意图当成分层源文件。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 底色在解决什么问题？\u003c/h2>\n\u003cp>底色先回答“这是哪一块、它大致是什么颜色”。皮肤、头发、帽子、衣服有了清楚的颜色区域，角色就开始能被整体阅读。\u003c/p>\n\u003cp>阴影和高光负责进一步说明光照与体积，可以以后再加。今天先把边界、覆盖和颜色分组处理好。\u003c/p>\n\u003cp>\u003cstrong>同一种材料先用一个主要颜色。\u003c/strong> 例如头发先用一块蓝色，不需要立刻为每个辫子交叠画深浅变化。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：按区域逐步增加颜色\u003c/h2>\n\u003cp>\u003cimg alt=\"线稿、肤色、发色和其他主要颜色的四阶段示意\" src=\"assets/lesson-17-flat-colors.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>新增加的内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>线稿，尚未铺主要颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>皮肤区域的底色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>头发和眼睛的基本颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>帽子、帽带和衣服的大色块\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>图下的小色块提示可以先使用有限的配色。示意为了放大脸部而裁取了部分帽尖；自己的完整头像是否裁帽尖，要根据最终构图决定，不能在保存时无意裁掉。\u003c/p>\n\u003cp>配图经过简化着色编辑，用来说明区域顺序。生成图仍可能有轻微色差，自己练习时先用统一底色即可，不必仿照细微渐变。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：确认线稿下面能够看见颜色\u003c/h2>\n\u003cp>先保存源文件。在线稿下新建“皮肤底色”层，试涂一小块颜色，确认线条仍然在上面、颜色能在下面显示。\u003c/p>\n\u003cp>如果看不见底色，检查线稿层是否有不透明白底：自己在透明图层上画出的线，与一张带白色背景的图片不同。不要为了这个问题把所有内容合并。先回到保留透明背景的线稿层，或检查是哪一个背景层挡住了颜色。\u003c/p>\n\u003cp>一种够用的层次，从上到下是：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">线稿\n头发、帽子等底色层（可按部件分开）\n皮肤底色\n后发底色（按实际遮挡调整）\n临时背景\n草图（通常隐藏）\n\u003c/code>\u003c/pre>\n\u003cp>这不是固定图层模板。前后顺序要符合你画的遮挡，颜色也可以在选区里分别完成。先用你能理解、方便修改的少量图层。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：先定少量主要颜色\u003c/h2>\n\u003cp>在画布角落或单独色板层试放几个色块：肤色、蓝色头发、棕色帽子、浅色衣服等。\u003c/p>\n\u003cp>可以从参考中观察颜色，也可以先试选近似颜色。底色不是永远不能改的决定，保留分层之后还可以调整。\u003c/p>\n\u003cp>先缩小看这些颜色能否区分主要区域。不要一开始就收集十几种发色、阴影色和反光色，让选择变得困难。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：完整填住一个区域\u003c/h2>\n\u003cp>先从脸部或一块较大的头发开始。你可以沿边界用画笔涂满，也可以用选区圈住区域后填色。\u003c/p>\n\u003cp>沿轮廓涂色时，注意细窄角落和发尖。边缘可以稍微伸到线条下面，避免颜色与线之间留一圈缝，但不要越过可见外边界。\u003c/p>\n\u003cp>完成后隐藏一下线稿，检查色块是否完整。线稿可能遮住小空洞，单独看底色更容易发现它们。\u003c/p>\n\u003cp>先认真完成一个区域，再复制这种检查方法到其他部件。\u003c/p>\n\u003ch2 id=\"6\">6. 油漆桶为什么有时会填满整个画面？\u003c/h2>\n\u003cp>填充工具需要根据某些边界判断区域。若它只参考当前空白图层，或者线稿有缺口，就可能把颜色填到更大的范围。不同软件的“参考图层”“容差”“扩展”等选项名称会不同。\u003c/p>\n\u003cp>遇到这种情况先撤销，然后检查两件事：工具实际参考了哪些图层？区域边界是否闭合或被工具正确识别？\u003c/p>\n\u003cp>如果暂时不熟悉这些设置，直接用选区或画笔补色也能完成这篇练习。不需要为了使用油漆桶，把所有本来应该断开的眼线和发丝都强行封死。\u003c/p>\n\u003cp>边缘有细白缝时，也可以用小画笔补到线下。稍后熟悉填充扩展等功能，再提高效率。\u003c/p>\n\u003ch2 id=\"7\">7. 第四步：区分“白色”和“透明”\u003c/h2>\n\u003cp>在白背景上，没涂的区域和涂了白色的衣服可能看起来一样。但导出透明背景或换深色背景后，差异就会出现。\u003c/p>\n\u003cp>所以白色衣服、眼白等需要保留颜色的部位，也要有自己的不透明底色，不能仅依赖下面的白色背景。\u003c/p>\n\u003cp>可以在最下方临时放一层中灰色背景。检查眼白、衣服有没有变成灰色，或出现不该有的透明洞。确认后再恢复想要的背景。\u003c/p>\n\u003cp>这只是检查颜色覆盖的方法，不意味着最终作品必须使用灰背景。\u003c/p>\n\u003ch2 id=\"8\">8. 第五步：整体看一次，停在底色阶段\u003c/h2>\n\u003cp>把草图隐藏，缩小到正常观看尺寸。先看角色主要区域是否清楚，再看颜色有没有漏出、白色区域是否完整。\u003c/p>\n\u003cp>如果两个相邻部件颜色接近，先利用清楚的线条和颜色分区判断；需要时小幅调整其中一块底色，不必立即画复杂光影。\u003c/p>\n\u003cp>底色完成后保存一个版本。你已经可以用它做表情卡或头像，不必等待上色知识全部学完。\u003c/p>\n\u003ch2 id=\"9\">9. 常见问题与练习\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>下层颜色完全看不见\u003c/td>\n\u003ctd>检查上方是否有不透明白底层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一点填充涂满整个画布\u003c/td>\n\u003ctd>撤销，检查参考层与缺口，再决定手工补色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>轮廓旁留一圈白缝\u003c/td>\n\u003ctd>隐藏线稿检查，用画笔或填充扩展补到线下\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换背景后眼白消失\u003c/td>\n\u003ctd>给应该是白色的部件真正铺不透明白色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>颜色越加越难控制\u003c/td>\n\u003ctd>回到少量主要底色，先不做光影\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 给皮肤和头发铺底色，只检查覆盖和越界。\u003c/p>\n\u003cp>\u003cstrong>B，十分钟：\u003c/strong> 自己给帽子、衣服与眼白上色，再换一次临时灰背景检查。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只改变发色的明暗或饱和程度，比较它与皮肤、帽子的关系。选择一个继续用，不必追求唯一答案。\u003c/p>\n\u003cp>可以结束时，主要色块清楚、白色与透明区分明确，源文件仍保留可编辑图层。下一篇将整理和保存第一张完整头像。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-16\">上一篇：整理线稿\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-18\">下一篇：保存第一张头像\u003c/a>\u003c/p>", "text": "# 17 · 底色怎样铺清楚\n\n> 今天只给主要区域铺上颜色，先不画复杂阴影、高光和材质。\n>\n> 前置：[16 · 整理线稿](16-草图怎样整理成线稿.md)。使用自己的可编辑画稿，而不是把教程示意图当成分层源文件。\n\n## 1. 底色在解决什么问题？\n\n底色先回答“这是哪一块、它大致是什么颜色”。皮肤、头发、帽子、衣服有了清楚的颜色区域，角色就开始能被整体阅读。\n\n阴影和高光负责进一步说明光照与体积，可以以后再加。今天先把边界、覆盖和颜色分组处理好。\n\n**同一种材料先用一个主要颜色。** 例如头发先用一块蓝色，不需要立刻为每个辫子交叠画深浅变化。\n\n## 2. 看图：按区域逐步增加颜色\n\n![线稿、肤色、发色和其他主要颜色的四阶段示意](assets/lesson-17-flat-colors.png)\n\n| 编号 | 新增加的内容 |\n| --- | --- |\n| 01 | 线稿，尚未铺主要颜色 |\n| 02 | 皮肤区域的底色 |\n| 03 | 头发和眼睛的基本颜色 |\n| 04 | 帽子、帽带和衣服的大色块 |\n\n图下的小色块提示可以先使用有限的配色。示意为了放大脸部而裁取了部分帽尖；自己的完整头像是否裁帽尖，要根据最终构图决定，不能在保存时无意裁掉。\n\n配图经过简化着色编辑，用来说明区域顺序。生成图仍可能有轻微色差，自己练习时先用统一底色即可，不必仿照细微渐变。\n\n## 3. 第一步：确认线稿下面能够看见颜色\n\n先保存源文件。在线稿下新建“皮肤底色”层，试涂一小块颜色，确认线条仍然在上面、颜色能在下面显示。\n\n如果看不见底色，检查线稿层是否有不透明白底：自己在透明图层上画出的线，与一张带白色背景的图片不同。不要为了这个问题把所有内容合并。先回到保留透明背景的线稿层，或检查是哪一个背景层挡住了颜色。\n\n一种够用的层次，从上到下是：\n\n```text\n线稿\n头发、帽子等底色层（可按部件分开）\n皮肤底色\n后发底色（按实际遮挡调整）\n临时背景\n草图（通常隐藏）\n```\n\n这不是固定图层模板。前后顺序要符合你画的遮挡，颜色也可以在选区里分别完成。先用你能理解、方便修改的少量图层。\n\n## 4. 第二步：先定少量主要颜色\n\n在画布角落或单独色板层试放几个色块：肤色、蓝色头发、棕色帽子、浅色衣服等。\n\n可以从参考中观察颜色，也可以先试选近似颜色。底色不是永远不能改的决定，保留分层之后还可以调整。\n\n先缩小看这些颜色能否区分主要区域。不要一开始就收集十几种发色、阴影色和反光色，让选择变得困难。\n\n## 5. 第三步：完整填住一个区域\n\n先从脸部或一块较大的头发开始。你可以沿边界用画笔涂满，也可以用选区圈住区域后填色。\n\n沿轮廓涂色时，注意细窄角落和发尖。边缘可以稍微伸到线条下面，避免颜色与线之间留一圈缝，但不要越过可见外边界。\n\n完成后隐藏一下线稿，检查色块是否完整。线稿可能遮住小空洞，单独看底色更容易发现它们。\n\n先认真完成一个区域，再复制这种检查方法到其他部件。\n\n## 6. 油漆桶为什么有时会填满整个画面？\n\n填充工具需要根据某些边界判断区域。若它只参考当前空白图层，或者线稿有缺口，就可能把颜色填到更大的范围。不同软件的“参考图层”“容差”“扩展”等选项名称会不同。\n\n遇到这种情况先撤销，然后检查两件事：工具实际参考了哪些图层？区域边界是否闭合或被工具正确识别？\n\n如果暂时不熟悉这些设置，直接用选区或画笔补色也能完成这篇练习。不需要为了使用油漆桶，把所有本来应该断开的眼线和发丝都强行封死。\n\n边缘有细白缝时，也可以用小画笔补到线下。稍后熟悉填充扩展等功能，再提高效率。\n\n## 7. 第四步：区分“白色”和“透明”\n\n在白背景上，没涂的区域和涂了白色的衣服可能看起来一样。但导出透明背景或换深色背景后，差异就会出现。\n\n所以白色衣服、眼白等需要保留颜色的部位，也要有自己的不透明底色，不能仅依赖下面的白色背景。\n\n可以在最下方临时放一层中灰色背景。检查眼白、衣服有没有变成灰色，或出现不该有的透明洞。确认后再恢复想要的背景。\n\n这只是检查颜色覆盖的方法，不意味着最终作品必须使用灰背景。\n\n## 8. 第五步：整体看一次，停在底色阶段\n\n把草图隐藏，缩小到正常观看尺寸。先看角色主要区域是否清楚，再看颜色有没有漏出、白色区域是否完整。\n\n如果两个相邻部件颜色接近，先利用清楚的线条和颜色分区判断；需要时小幅调整其中一块底色，不必立即画复杂光影。\n\n底色完成后保存一个版本。你已经可以用它做表情卡或头像，不必等待上色知识全部学完。\n\n## 9. 常见问题与练习\n\n| 现象 | 先做什么 |\n| --- | --- |\n| 下层颜色完全看不见 | 检查上方是否有不透明白底层 |\n| 一点填充涂满整个画布 | 撤销，检查参考层与缺口，再决定手工补色 |\n| 轮廓旁留一圈白缝 | 隐藏线稿检查，用画笔或填充扩展补到线下 |\n| 换背景后眼白消失 | 给应该是白色的部件真正铺不透明白色 |\n| 颜色越加越难控制 | 回到少量主要底色，先不做光影 |\n\n**A，十分钟：** 给皮肤和头发铺底色，只检查覆盖和越界。\n\n**B，十分钟：** 自己给帽子、衣服与眼白上色，再换一次临时灰背景检查。\n\n**C，五分钟：** 复制一版，只改变发色的明暗或饱和程度，比较它与皮肤、帽子的关系。选择一个继续用，不必追求唯一答案。\n\n可以结束时，主要色块清楚、白色与透明区分明确，源文件仍保留可编辑图层。下一篇将整理和保存第一张完整头像。\n\n[上一篇：整理线稿](16-草图怎样整理成线稿.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：保存第一张头像](18-保存第一张完整头像.md)\n"}, {"id": "lesson-18", "number": 18, "short": "保存第一张完整头像", "file": "18-保存第一张完整头像.md", "html": "\u003ch1 id=\"18\">18 · 保存第一张完整头像\u003c/h1>\n\u003cblockquote>\n\u003cp>今天把已有画稿整理成一个能展示、能再次打开修改的作品。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-17\">17 · 铺底色\u003c/a>。这次允许简单线稿和底色成为完成版，不额外加入阴影、背景和复杂装饰。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 先决定这一版“完成”包含什么\u003c/h2>\n\u003cp>建议这一版包含：头部和五官、可辨认的发型、可选的帽子、简单颈肩或衣领，以及清楚的主要颜色。\u003c/p>\n\u003cp>如果辫子或帽子还很难，可以保留简化版本。完成的意义是把目前会的内容组织成一件作品，并留下下一次可以继续修改的文件。\u003c/p>\n\u003cp>\u003cstrong>先确定这次要交什么，再检查是否达到。\u003c/strong> 不要在最后不停新增衣服花纹、魔法特效或背景，把终点越推越远。\u003c/p>\n\u003ch2 id=\"2\">2. 看一个完成范围的示例\u003c/h2>\n\u003cp>\u003cimg alt=\"简化洛琪希头像完成示例，保留主要造型与颜色\" src=\"assets/lesson-18-first-portrait.png\" />\u003c/p>\n\u003cp>这张图由 imagegen 生成并作了简化着色编辑，用于说明“头像、主要造型、基本颜色已经组成一件作品”的范围。它不是你需要立刻达到的控笔精度，也不是你自己的练习成果。\u003c/p>\n\u003cp>你可以省略图中的少量装饰与细节。线条还不稳定、比例仍可改进，也可以保存为第一版。正式角色细节仍以你选定的作品参考为准。\u003c/p>\n\u003cp>示例本身是白底展示图；你是否导出透明背景，要在自己的源文件里决定，不能因为一张图看起来白就认为它已经透明。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：检查画面有没有完整放进画布\u003c/h2>\n\u003cp>缩小看整个画布，确认帽尖、帽檐、头发与辫子末端有没有被无意裁掉。人物四周是否有你希望保留的空间？\u003c/p>\n\u003cp>头像也可以刻意截到肩部，帽子也可以作构图裁切。关键是你作出的选择，而不是画完才发现画布不够大。\u003c/p>\n\u003cp>需要调整时，可以先扩展画布或整体调整人物位置。若整体缩放，尽量操作完整的人物图层组或副本，避免只缩了脸、没缩帽子。\u003c/p>\n\u003cp>今天先保持原来的工作分辨率，不必反复缩小再放大源文件。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：只检查三类问题\u003c/h2>\n\u003ch3 id=\"_1\">大关系\u003c/h3>\n\u003cp>五官位置、发型轮廓、帽子与头部连接是否符合这次的目标？先用第 10 篇的方法，选最影响整体的一项判断。\u003c/p>\n\u003ch3 id=\"_2\">颜色覆盖\u003c/h3>\n\u003cp>有无明显漏色、越界或意外透明？临时换个背景，特别检查眼白、浅色衣服和发尖。\u003c/p>\n\u003ch3 id=\"_3\">遗留草稿\u003c/h3>\n\u003cp>最终展示里是否还有不需要的中线、定位点、试色块或参考图？把这些放到单独图层并隐藏，保留在源文件里即可。\u003c/p>\n\u003cp>挑一到两处最值得修的问题处理，然后再看整体。其余内容可以记入下一版，不需要一次解决全部。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：先保存可编辑源文件\u003c/h2>\n\u003cp>如果用 Krita，先保存为 \u003ccode>.kra\u003c/code>。使用其他绘画软件时，保留它自己的分层源文件格式。\u003c/p>\n\u003cp>图层至少要能让你理解主要内容在哪里。可以按“线稿、底色、草图、背景”分组，也可以保留眼睛、嘴等单独层，方便下一阶段改表情。\u003c/p>\n\u003cp>首次保存后关闭再打开一次，确认画面、图层和隐藏状态没有意外。保存按钮按过，不等于你已经确认文件能继续使用。\u003c/p>\n\u003cp>\u003cstrong>PNG 用来展示和接入程序；可编辑源文件用来继续画。两种文件都保留。\u003c/strong>\u003c/p>\n\u003ch2 id=\"6-png\">6. 第四步：导出一张展示 PNG\u003c/h2>\n\u003cp>在源文件里准备最终要显示的图层组合。选择白色、纯色背景，或者隐藏背景得到透明区域，再导出 PNG。\u003c/p>\n\u003cp>第一次可以直接使用当前画布像素尺寸。以后要做特定大小的头像，再另外导出缩小版本，不必覆盖原始大稿。\u003c/p>\n\u003cp>导出之后，用图片查看器重新打开 PNG。检查是否和你想展示的画面一致，有没有漏掉图层、带出草图或出现不该有的背景。\u003c/p>\n\u003cp>如果你导出的是透明图，查看器可能用白色或深色显示透明区域。可以把它重新导入绘画软件，在下面放另一种背景检查；不要只凭单一查看器的底色判断。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：取一个以后找得到的文件名\u003c/h2>\n\u003cp>例如把这次成果放在一个作品文件夹中：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">我的第一张头像/\n├── roxy-avatar-v01.kra       可编辑源文件\n├── roxy-avatar-v01.png       展示图片\n└── 练习记录.md              参考与本次观察\n\u003c/code>\u003c/pre>\n\u003cp>这是组织示例，不是已经替你创建了这些作品文件。你可以使用中文文件名，只要自己能看懂版本即可。\u003c/p>\n\u003cp>继续修改时另存 \u003ccode>v02\u003c/code>，让第一版留在原处。这样以后比较的是两个真实阶段，而不是凭记忆判断有没有进步。\u003c/p>\n\u003ch2 id=\"8\">8. 写一条完成记录\u003c/h2>\n\u003cp>不用写长篇总结，记录几句就够了：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">日期：\n本次作品范围：\n参考来源：\n我最喜欢的一个细节：\n我实际修过的一处问题：\n下一版最想改的一个地方：\n源文件名与展示图片名：\n\u003c/code>\u003c/pre>\n\u003cp>分享临摹或参考练习时，可以一起说明来源与练习目的。它也能帮助未来的你找到当时在观察什么。\u003c/p>\n\u003ch2 id=\"9\">9. 三个收尾任务\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 整理显示图层和构图，挑一到两处明显问题修正。\u003c/p>\n\u003cp>\u003cstrong>B，五到十分钟：\u003c/strong> 保存源文件、重新打开确认，再导出并打开 PNG。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 把这次头像与最早的头部或脸部练习并排看，写一处具体变化。比如“现在我会先判断帽子遮住哪一块头发”，而不是只说“好像进步了”。\u003c/p>\n\u003cp>完成时检查：\u003c/p>\n\u003cul>\n\u003cli>[ ] 有一张我愿意称为第一版的完整画面。\u003c/li>\n\u003cli>[ ] 源文件可以重新打开，保留了可编辑图层。\u003c/li>\n\u003cli>[ ] PNG 导出的内容和背景经过检查。\u003c/li>\n\u003cli>[ ] 我知道参考来自哪里，也知道下一版想改什么。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"10\">10. 下一阶段会用到这张头像\u003c/h2>\n\u003cp>接下来会从微笑开始，在同一张底稿上调整眉、眼、嘴，再画闭眼和半闭眼，让角色第一次眨眼。\u003c/p>\n\u003cp>所以现在保留眼睛、眉毛、嘴与脸部底色的可编辑性很有帮助。但不用为将来提前做复杂绑定或完全拆图，能复制图层并改表情就够了。\u003c/p>\n\u003cp>下一篇：\u003ca href=\"#lesson-19\">微笑怎样从嘴角传到眼睛\u003c/a>。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-17\">上一篇：铺底色\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a>\u003c/p>", "text": "# 18 · 保存第一张完整头像\n\n> 今天把已有画稿整理成一个能展示、能再次打开修改的作品。\n>\n> 前置：[17 · 铺底色](17-底色怎样铺清楚.md)。这次允许简单线稿和底色成为完成版，不额外加入阴影、背景和复杂装饰。\n\n## 1. 先决定这一版“完成”包含什么\n\n建议这一版包含：头部和五官、可辨认的发型、可选的帽子、简单颈肩或衣领，以及清楚的主要颜色。\n\n如果辫子或帽子还很难，可以保留简化版本。完成的意义是把目前会的内容组织成一件作品，并留下下一次可以继续修改的文件。\n\n**先确定这次要交什么，再检查是否达到。** 不要在最后不停新增衣服花纹、魔法特效或背景，把终点越推越远。\n\n## 2. 看一个完成范围的示例\n\n![简化洛琪希头像完成示例，保留主要造型与颜色](assets/lesson-18-first-portrait.png)\n\n这张图由 imagegen 生成并作了简化着色编辑，用于说明“头像、主要造型、基本颜色已经组成一件作品”的范围。它不是你需要立刻达到的控笔精度，也不是你自己的练习成果。\n\n你可以省略图中的少量装饰与细节。线条还不稳定、比例仍可改进，也可以保存为第一版。正式角色细节仍以你选定的作品参考为准。\n\n示例本身是白底展示图；你是否导出透明背景，要在自己的源文件里决定，不能因为一张图看起来白就认为它已经透明。\n\n## 3. 第一步：检查画面有没有完整放进画布\n\n缩小看整个画布，确认帽尖、帽檐、头发与辫子末端有没有被无意裁掉。人物四周是否有你希望保留的空间？\n\n头像也可以刻意截到肩部，帽子也可以作构图裁切。关键是你作出的选择，而不是画完才发现画布不够大。\n\n需要调整时，可以先扩展画布或整体调整人物位置。若整体缩放，尽量操作完整的人物图层组或副本，避免只缩了脸、没缩帽子。\n\n今天先保持原来的工作分辨率，不必反复缩小再放大源文件。\n\n## 4. 第二步：只检查三类问题\n\n### 大关系\n\n五官位置、发型轮廓、帽子与头部连接是否符合这次的目标？先用第 10 篇的方法，选最影响整体的一项判断。\n\n### 颜色覆盖\n\n有无明显漏色、越界或意外透明？临时换个背景，特别检查眼白、浅色衣服和发尖。\n\n### 遗留草稿\n\n最终展示里是否还有不需要的中线、定位点、试色块或参考图？把这些放到单独图层并隐藏，保留在源文件里即可。\n\n挑一到两处最值得修的问题处理，然后再看整体。其余内容可以记入下一版，不需要一次解决全部。\n\n## 5. 第三步：先保存可编辑源文件\n\n如果用 Krita，先保存为 `.kra`。使用其他绘画软件时，保留它自己的分层源文件格式。\n\n图层至少要能让你理解主要内容在哪里。可以按“线稿、底色、草图、背景”分组，也可以保留眼睛、嘴等单独层，方便下一阶段改表情。\n\n首次保存后关闭再打开一次，确认画面、图层和隐藏状态没有意外。保存按钮按过，不等于你已经确认文件能继续使用。\n\n**PNG 用来展示和接入程序；可编辑源文件用来继续画。两种文件都保留。**\n\n## 6. 第四步：导出一张展示 PNG\n\n在源文件里准备最终要显示的图层组合。选择白色、纯色背景，或者隐藏背景得到透明区域，再导出 PNG。\n\n第一次可以直接使用当前画布像素尺寸。以后要做特定大小的头像，再另外导出缩小版本，不必覆盖原始大稿。\n\n导出之后，用图片查看器重新打开 PNG。检查是否和你想展示的画面一致，有没有漏掉图层、带出草图或出现不该有的背景。\n\n如果你导出的是透明图，查看器可能用白色或深色显示透明区域。可以把它重新导入绘画软件，在下面放另一种背景检查；不要只凭单一查看器的底色判断。\n\n## 7. 第五步：取一个以后找得到的文件名\n\n例如把这次成果放在一个作品文件夹中：\n\n```text\n我的第一张头像/\n├── roxy-avatar-v01.kra       可编辑源文件\n├── roxy-avatar-v01.png       展示图片\n└── 练习记录.md              参考与本次观察\n```\n\n这是组织示例，不是已经替你创建了这些作品文件。你可以使用中文文件名，只要自己能看懂版本即可。\n\n继续修改时另存 `v02`，让第一版留在原处。这样以后比较的是两个真实阶段，而不是凭记忆判断有没有进步。\n\n## 8. 写一条完成记录\n\n不用写长篇总结，记录几句就够了：\n\n```text\n日期：\n本次作品范围：\n参考来源：\n我最喜欢的一个细节：\n我实际修过的一处问题：\n下一版最想改的一个地方：\n源文件名与展示图片名：\n```\n\n分享临摹或参考练习时，可以一起说明来源与练习目的。它也能帮助未来的你找到当时在观察什么。\n\n## 9. 三个收尾任务\n\n**A，十分钟：** 整理显示图层和构图，挑一到两处明显问题修正。\n\n**B，五到十分钟：** 保存源文件、重新打开确认，再导出并打开 PNG。\n\n**C，五分钟：** 把这次头像与最早的头部或脸部练习并排看，写一处具体变化。比如“现在我会先判断帽子遮住哪一块头发”，而不是只说“好像进步了”。\n\n完成时检查：\n\n- [ ] 有一张我愿意称为第一版的完整画面。\n- [ ] 源文件可以重新打开，保留了可编辑图层。\n- [ ] PNG 导出的内容和背景经过检查。\n- [ ] 我知道参考来自哪里，也知道下一版想改什么。\n\n## 10. 下一阶段会用到这张头像\n\n接下来会从微笑开始，在同一张底稿上调整眉、眼、嘴，再画闭眼和半闭眼，让角色第一次眨眼。\n\n所以现在保留眼睛、眉毛、嘴与脸部底色的可编辑性很有帮助。但不用为将来提前做复杂绑定或完全拆图，能复制图层并改表情就够了。\n\n下一篇：[微笑怎样从嘴角传到眼睛](19-微笑怎样从嘴角传到眼睛.md)。\n\n[上一篇：铺底色](17-底色怎样铺清楚.md) · [返回总目录](00-系列总计划与目录.md)\n"}, {"id": "lesson-19", "number": 19, "short": "微笑怎样从嘴角传到眼睛", "file": "19-微笑怎样从嘴角传到眼睛.md", "html": "\u003ch1 id=\"19\">19 · 微笑怎样从嘴角传到眼睛\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：在已经画好的头像上，改出一个轻柔的闭嘴微笑。用时可以先留 20—40 分钟，不需要重画头发。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：有第 18 篇保存的头像；知道眼睑、眉毛、嘴分别在哪里。不确定嘴的形状时，回看\u003ca href=\"#lesson-08\">闭合的小嘴\u003c/a>。\u003c/p>\n\u003ch2 id=\"1\">1. 微笑为什么不只是换一个嘴？\u003c/h2>\n\u003cp>嘴角轻轻抬起，通常已经能提示笑意；眼睑与眉毛配合后，神态可能更柔和。你可以选择只改嘴，也可以多改一个部件。这里没有“必须全改才算笑”的规定。\u003c/p>\n\u003cp>“从嘴角传到眼睛”指观看时各部件共同表达情绪，并不是画面里真的有一条力线。先把变化分开做，才知道是哪一笔带来了效果。不要同时换眼型、脸型、配色，然后猜为什么变可爱了。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先找变化最大的地方\u003c/h2>\n\u003cp>\u003cimg alt=\"从平静到轻柔微笑的四个观察版本\" src=\"assets/lesson-19-gentle-smile.png\" />\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>01：平静底稿。\u003c/strong> 先记住嘴宽、眉眼距离与眼睛开口。\u003c/li>\n\u003cli>\u003cstrong>02：观察嘴角。\u003c/strong> 嘴线的两端略高，中部较低，形成轻微弧度。\u003c/li>\n\u003cli>\u003cstrong>03：观察眼睛。\u003c/strong> 开口收得更柔和，下眼睑略抬起，眼睛仍然睁着。\u003c/li>\n\u003cli>\u003cstrong>04：看整张脸。\u003c/strong> 眉眼与嘴共同呈现轻柔笑意，选你喜欢的强度即可。\u003c/li>\n\u003c/ul>\n\u003cp>这是 imagegen 生成的关系示意，各格也存在眉毛、发丝等细小差异。它帮助你辨认变化，不是可直接裁切的动画帧。实际作业请复制自己的同一张头像。\u003c/p>\n\u003ch2 id=\"3\">3. 动手第一步：留下平静版\u003c/h2>\n\u003cp>另存源文件为“头像-表情练习”，将原来的眉、眼、嘴放进一个能整体隐藏的图层组，命名“平静”。复制这个组，再命名“微笑”。暂时只显示其中一个。\u003c/p>\n\u003cp>若原画已经合并，可以复制整张画，在上层修改；但必须先用脸部底色清掉旧嘴和旧眼睑，避免新旧线条重叠。长期练习仍建议把五官线稿与脸部底色分开。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 快速切换两个版本，鼻尖、下巴、发际线应停在原位。此时完全相同是正常的；这是对照的起点。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：只改嘴角，不放大整张嘴\u003c/h2>\n\u003cp>在原嘴两端做两个很小的定位点，保持它们的左右位置。把两端略向上移，用一条柔和的浅弧连接，中部比两端稍低。线不需要弯成明显的半圆。\u003c/p>\n\u003cp>先看缩小后的头像。如果嘴像一个符号贴在脸上，试着降低弧度或减轻线条。不要为了表现开心就越画越宽；宽度和弧度是两件不同的事，这次优先保留嘴宽。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 隐藏“微笑”组再显示，应该主要看到嘴角变化，嘴的中心位置不明显上下跳。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：让眼睛更柔和\u003c/h2>\n\u003cp>复制刚刚只改嘴的版本。保留两侧眼角的大致位置，将下眼睑中段轻轻抬起，让眼睛的开口略小。如果原来没有画完整下眼睑，可以只用一小段淡线提示，或调整眼白下缘，不必加一圈黑框。\u003c/p>\n\u003cp>虹膜仍然是原来大小的虹膜，只是部分被眼睑遮住。不要把虹膜缩成小圆来适应开口，也不要把整只眼睛纵向压缩。眼睛变小一点就够了；若只剩细缝，会更接近眯眼笑，那是另一种强度。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 两只眼的调整幅度是否接近？其中一边不小心缩得过多，会像在挤眼。先去掉高光和睫毛的干扰，只看上下边界。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：眉毛只做必要的小改动\u003c/h2>\n\u003cp>如果眉头明显压低、眉尾明显抬高，眼神可能仍然很锐利。可以稍减这种倾斜，让眉形更舒展。原眉已经平缓，就保留它。\u003c/p>\n\u003cp>不要自动把眉毛整个抬高。眉眼距离变大也可能读成惊讶，特别是同时睁大眼睛时。每改一次都缩小观察：你想要的是轻轻高兴，还是非常兴奋？本篇先留住前者。\u003c/p>\n\u003ch2 id=\"7\">7. 一次只比较一个条件\u003c/h2>\n\u003cp>保存 A“只改嘴”和 B“嘴加眼睑”。交替显示两张，暂时让眉毛完全相同。问自己：B 的眼睛有没有显得更柔和？如果没有，先看下眼睑变化是否小到看不出来，而不是继续添加腮红。\u003c/p>\n\u003cp>也可能你更喜欢 A。这是有价值的选择：你已经知道用较少的改动也能表达想要的心情。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的问题\u003c/th>\n\u003cth>优先检查\u003c/th>\n\u003cth>先改一个地方\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>笑起来像换了人\u003c/td>\n\u003ctd>嘴是否变宽、下巴是否跟着改了\u003c/td>\n\u003ctd>恢复原嘴宽和脸形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>眼神像不高兴\u003c/td>\n\u003ctd>眉头是否压得很低\u003c/td>\n\u003ctd>减弱眉毛的倾斜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像困倦而不是笑\u003c/td>\n\u003ctd>是否只有上眼睑明显下垂\u003c/td>\n\u003ctd>回退一点，尝试轻抬下眼睑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一边像在眨眼\u003c/td>\n\u003ctd>左右开口是否差太多\u003c/td>\n\u003ctd>比较两眼中段的高度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线条显脏\u003c/td>\n\u003ctd>新旧嘴线是否同时显示\u003c/td>\n\u003ctd>清掉旧线或隐藏旧图层\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟着做一次：\u003c/strong> 在复制的头像上只改嘴角，保存前后两个状态。\u003c/li>\n\u003cli>\u003cstrong>自己做一次：\u003c/strong> 关掉示意图，试着给眼睑加入轻微笑意，再缩小看整体。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 固定眉眼，做两种嘴角弧度，圈出你更喜欢的一张并写一句原因。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"10\">10. 到这里就可以结束\u003c/h2>\n\u003cul>\n\u003cli>[ ] 我保留了平静版，可以随时切回。\u003c/li>\n\u003cli>[ ] 我能指出微笑版具体改了哪些线。\u003c/li>\n\u003cli>[ ] 头、发型和鼻子没有随表情移动。\u003c/li>\n\u003cli>[ ] 我选出了一个愿意继续使用的微笑版本。\u003c/li>\n\u003c/ul>\n\u003cp>下一课使用同一张底稿表现轻度惊讶，观察“抬眉”和“睁眼”的区别。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-18\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-19\">打开 HTML 阅读版\u003c/a> · \u003ca href=\"#lesson-20\">下一篇\u003c/a>\u003c/p>", "text": "# 19 · 微笑怎样从嘴角传到眼睛\n\n> 今天只做一件事：在已经画好的头像上，改出一个轻柔的闭嘴微笑。用时可以先留 20—40 分钟，不需要重画头发。\n\n前置：有第 18 篇保存的头像；知道眼睑、眉毛、嘴分别在哪里。不确定嘴的形状时，回看[闭合的小嘴](08-闭合的小嘴怎么画.md)。\n\n## 1. 微笑为什么不只是换一个嘴？\n\n嘴角轻轻抬起，通常已经能提示笑意；眼睑与眉毛配合后，神态可能更柔和。你可以选择只改嘴，也可以多改一个部件。这里没有“必须全改才算笑”的规定。\n\n“从嘴角传到眼睛”指观看时各部件共同表达情绪，并不是画面里真的有一条力线。先把变化分开做，才知道是哪一笔带来了效果。不要同时换眼型、脸型、配色，然后猜为什么变可爱了。\n\n## 2. 看图：先找变化最大的地方\n\n![从平静到轻柔微笑的四个观察版本](assets/lesson-19-gentle-smile.png)\n\n- **01：平静底稿。** 先记住嘴宽、眉眼距离与眼睛开口。\n- **02：观察嘴角。** 嘴线的两端略高，中部较低，形成轻微弧度。\n- **03：观察眼睛。** 开口收得更柔和，下眼睑略抬起，眼睛仍然睁着。\n- **04：看整张脸。** 眉眼与嘴共同呈现轻柔笑意，选你喜欢的强度即可。\n\n这是 imagegen 生成的关系示意，各格也存在眉毛、发丝等细小差异。它帮助你辨认变化，不是可直接裁切的动画帧。实际作业请复制自己的同一张头像。\n\n## 3. 动手第一步：留下平静版\n\n另存源文件为“头像-表情练习”，将原来的眉、眼、嘴放进一个能整体隐藏的图层组，命名“平静”。复制这个组，再命名“微笑”。暂时只显示其中一个。\n\n若原画已经合并，可以复制整张画，在上层修改；但必须先用脸部底色清掉旧嘴和旧眼睑，避免新旧线条重叠。长期练习仍建议把五官线稿与脸部底色分开。\n\n**检查：** 快速切换两个版本，鼻尖、下巴、发际线应停在原位。此时完全相同是正常的；这是对照的起点。\n\n## 4. 第二步：只改嘴角，不放大整张嘴\n\n在原嘴两端做两个很小的定位点，保持它们的左右位置。把两端略向上移，用一条柔和的浅弧连接，中部比两端稍低。线不需要弯成明显的半圆。\n\n先看缩小后的头像。如果嘴像一个符号贴在脸上，试着降低弧度或减轻线条。不要为了表现开心就越画越宽；宽度和弧度是两件不同的事，这次优先保留嘴宽。\n\n**检查：** 隐藏“微笑”组再显示，应该主要看到嘴角变化，嘴的中心位置不明显上下跳。\n\n## 5. 第三步：让眼睛更柔和\n\n复制刚刚只改嘴的版本。保留两侧眼角的大致位置，将下眼睑中段轻轻抬起，让眼睛的开口略小。如果原来没有画完整下眼睑，可以只用一小段淡线提示，或调整眼白下缘，不必加一圈黑框。\n\n虹膜仍然是原来大小的虹膜，只是部分被眼睑遮住。不要把虹膜缩成小圆来适应开口，也不要把整只眼睛纵向压缩。眼睛变小一点就够了；若只剩细缝，会更接近眯眼笑，那是另一种强度。\n\n**检查：** 两只眼的调整幅度是否接近？其中一边不小心缩得过多，会像在挤眼。先去掉高光和睫毛的干扰，只看上下边界。\n\n## 6. 第四步：眉毛只做必要的小改动\n\n如果眉头明显压低、眉尾明显抬高，眼神可能仍然很锐利。可以稍减这种倾斜，让眉形更舒展。原眉已经平缓，就保留它。\n\n不要自动把眉毛整个抬高。眉眼距离变大也可能读成惊讶，特别是同时睁大眼睛时。每改一次都缩小观察：你想要的是轻轻高兴，还是非常兴奋？本篇先留住前者。\n\n## 7. 一次只比较一个条件\n\n保存 A“只改嘴”和 B“嘴加眼睑”。交替显示两张，暂时让眉毛完全相同。问自己：B 的眼睛有没有显得更柔和？如果没有，先看下眼睑变化是否小到看不出来，而不是继续添加腮红。\n\n也可能你更喜欢 A。这是有价值的选择：你已经知道用较少的改动也能表达想要的心情。\n\n## 8. 常见问题怎样改？\n\n| 看到的问题 | 优先检查 | 先改一个地方 |\n| --- | --- | --- |\n| 笑起来像换了人 | 嘴是否变宽、下巴是否跟着改了 | 恢复原嘴宽和脸形 |\n| 眼神像不高兴 | 眉头是否压得很低 | 减弱眉毛的倾斜 |\n| 像困倦而不是笑 | 是否只有上眼睑明显下垂 | 回退一点，尝试轻抬下眼睑 |\n| 一边像在眨眼 | 左右开口是否差太多 | 比较两眼中段的高度 |\n| 线条显脏 | 新旧嘴线是否同时显示 | 清掉旧线或隐藏旧图层 |\n\n## 9. 三次小练习\n\n1. **跟着做一次：** 在复制的头像上只改嘴角，保存前后两个状态。\n2. **自己做一次：** 关掉示意图，试着给眼睑加入轻微笑意，再缩小看整体。\n3. **只改一个条件：** 固定眉眼，做两种嘴角弧度，圈出你更喜欢的一张并写一句原因。\n\n## 10. 到这里就可以结束\n\n- [ ] 我保留了平静版，可以随时切回。\n- [ ] 我能指出微笑版具体改了哪些线。\n- [ ] 头、发型和鼻子没有随表情移动。\n- [ ] 我选出了一个愿意继续使用的微笑版本。\n\n下一课使用同一张底稿表现轻度惊讶，观察“抬眉”和“睁眼”的区别。\n\n[上一篇](18-保存第一张完整头像.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-19) · [下一篇](20-惊讶怎样表现.md)\n"}, {"id": "lesson-20", "number": 20, "short": "惊讶怎样表现", "file": "20-惊讶怎样表现.md", "html": "\u003ch1 id=\"20\">20 · 惊讶怎样表现\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：从平静头像改出一个“诶？”的轻度惊讶。先控制眉、眼、嘴三个地方的变化，不画夸张惊恐。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：第 19 篇的表情图层做法；需要时回看\u003ca href=\"#lesson-09\">张开的小嘴\u003c/a>。本课从平静版出发，避免把上一课的微笑全部叠进来。\u003c/p>\n\u003ch2 id=\"1\">1. 先想清楚是哪一种惊讶\u003c/h2>\n\u003cp>收到意外的小礼物，与遇到危险，都可能睁眼、抬眉，但强度和部件组合不同。本篇选择前一种：短暂注意到意外的东西，嘴张开一点，脸形基本不变。\u003c/p>\n\u003cp>惊讶不是必须满足某套表情公式。我们拆成抬眉、开眼、小开口，是为了让你看清每次修改的作用；角色也可以闭着嘴表达惊讶。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：三个部件逐步配合\u003c/h2>\n\u003cp>\u003cimg alt=\"轻度惊讶中眉眼嘴的变化\" src=\"assets/lesson-20-surprise.png\" />\u003c/p>\n\u003cp>\u003cstrong>01\u003c/strong> 是平静状态；\u003cstrong>02\u003c/strong> 重点看眉毛与眼睛之间的距离；\u003cstrong>03\u003c/strong> 看上眼睑抬起后虹膜露出的部分；\u003cstrong>04\u003c/strong> 加入小圆口，整张脸的情绪更清楚。\u003c/p>\n\u003cp>这张生成图的各格并非严格相同的底稿，不能用像素测量证明某个固定比例。练习时复制自己的同一头像，只改变指定部位，比较会更可靠。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：只抬眉，先看神态\u003c/h2>\n\u003cp>复制平静组并命名“惊讶”。沿原眉的位置，把眉毛略向上移。两边可以保持原来的弧度，不必突然弯成高高的拱门。\u003c/p>\n\u003cp>为什么先动眉？眉眼之间的空隙变化很容易观察，也不涉及虹膜的重画。你可以先知道“只抬眉”会给这张脸带来什么感觉。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 眼睛有没有被误选并一起移动？如果眉眼整组向上挪，改变的就是五官位置，而不是眉眼关系。撤销，再只选择眉毛图层。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：让上眼睑抬高一点\u003c/h2>\n\u003cp>保留眼角的大致位置，抬起上眼睑中段，让眼睛的开口稍高。下眼睑这次先保持原样。原先被挡住的上部虹膜可能露出更多，应补出被遮住的部分。\u003c/p>\n\u003cp>虹膜的底层大小先保持不变。注意区别：眼睛睁大意味着开口改变，不意味着虹膜跟着等比放大。也不需要在虹膜四周突然留出一整圈很宽的眼白；那常会把情绪推得更强烈。\u003c/p>\n\u003cp>如果原画的虹膜已经露得很多，只做很小的改变即可。不同画风的眼睛开口不同，没有必须再增加多少高度的标准。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 与平静版切换，头部保持稳定，主要是上眼睑打开。双眼的开合程度应能读成同一个表情。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：在原嘴的位置做小开口\u003c/h2>\n\u003cp>隐藏闭嘴线。在原嘴中心附近画一个小椭圆或柔软的圆角开口，用较深、但不一定纯黑的颜色填入口腔。先不画牙齿、舌头和嘴唇高光。\u003c/p>\n\u003cp>小嘴不需要非常圆。你可以略偏竖向，也可以上缘更平一点。本次先保持很小的开口，避免一改嘴就变成大喊。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 嘴中心有没有下降到下巴附近？开口增加了高度，中心仍应靠近原来的嘴部区域。先查位置，再查形状。\u003c/p>\n\u003ch2 id=\"6\">6. 把强度当作可以调节的量\u003c/h2>\n\u003cp>保存 A“轻微抬眉、闭嘴”和 B“同样眉眼、小圆口”。这次只改变嘴。观察哪一张更像“刚注意到”，哪一张更像“已经发出声音”。不需要给每张图贴唯一情绪标签。\u003c/p>\n\u003cp>想画更明显的版本时，下一轮再增加眉毛高度或眼睛开口。每次只选一项，留住上一版作比较。三项同时加到最大，容易超过你原本想表达的情绪。\u003c/p>\n\u003ch2 id=\"7\">7. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的问题\u003c/th>\n\u003cth>可能原因\u003c/th>\n\u003cth>先尝试的修改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>看起来像害怕\u003c/td>\n\u003ctd>虹膜缩得过小，眼白过多\u003c/td>\n\u003ctd>恢复虹膜大小，减弱开眼幅度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像开心地大笑\u003c/td>\n\u003ctd>嘴角明显上扬，开口太宽\u003c/td>\n\u003ctd>换成更小、更接近圆角的开口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只有嘴动，神态很弱\u003c/td>\n\u003ctd>眉眼仍非常放松\u003c/td>\n\u003ctd>先略抬眉再比较\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>五官整体上移\u003c/td>\n\u003ctd>移动眉时选中了整组\u003c/td>\n\u003ctd>单独修改眉毛图层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>嘴里黑成一大块\u003c/td>\n\u003ctd>开口太大或内部对比过强\u003c/td>\n\u003ctd>先缩小开口，再调暗部颜色\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"8\">8. 三次小练习\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟做：\u003c/strong> 复制平静版，只抬眉，保存一张对照。\u003c/li>\n\u003cli>\u003cstrong>独立做：\u003c/strong> 在第二份复制稿上完成轻度惊讶，不看图尝试说明每一步的作用。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 保持眉眼不变，做闭嘴和小圆口两版，选择更接近“诶？”的一张。\u003c/li>\n\u003c/ol>\n\u003cp>可以把平静、微笑、惊讶并排放在同一画布上。缩小到平时会使用的头像大小，看看情绪是否仍有区别。不要只在放大到几百倍时判断。\u003c/p>\n\u003ch2 id=\"9\">9. 到这里就可以结束\u003c/h2>\n\u003cul>\n\u003cli>[ ] 我保留了原来的脸形、发型和五官中心位置。\u003c/li>\n\u003cli>[ ] 我能区分“眼睛开口变大”和“虹膜变大”。\u003c/li>\n\u003cli>[ ] 惊讶版能与平静版区分，不必靠文字标签才能认出变化。\u003c/li>\n\u003cli>[ ] 我知道怎样减弱这个表情，而不只是不断画得更夸张。\u003c/li>\n\u003c/ul>\n\u003cp>下一课把变化集中到视线：头不转，眼睛也能表达想看又有些迟疑的感觉。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-19\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-20\">打开 HTML 阅读版\u003c/a> · \u003ca href=\"#lesson-21\">下一篇\u003c/a>\u003c/p>", "text": "# 20 · 惊讶怎样表现\n\n> 今天只做一件事：从平静头像改出一个“诶？”的轻度惊讶。先控制眉、眼、嘴三个地方的变化，不画夸张惊恐。\n\n前置：第 19 篇的表情图层做法；需要时回看[张开的小嘴](09-张开的小嘴怎么画.md)。本课从平静版出发，避免把上一课的微笑全部叠进来。\n\n## 1. 先想清楚是哪一种惊讶\n\n收到意外的小礼物，与遇到危险，都可能睁眼、抬眉，但强度和部件组合不同。本篇选择前一种：短暂注意到意外的东西，嘴张开一点，脸形基本不变。\n\n惊讶不是必须满足某套表情公式。我们拆成抬眉、开眼、小开口，是为了让你看清每次修改的作用；角色也可以闭着嘴表达惊讶。\n\n## 2. 看图：三个部件逐步配合\n\n![轻度惊讶中眉眼嘴的变化](assets/lesson-20-surprise.png)\n\n**01** 是平静状态；**02** 重点看眉毛与眼睛之间的距离；**03** 看上眼睑抬起后虹膜露出的部分；**04** 加入小圆口，整张脸的情绪更清楚。\n\n这张生成图的各格并非严格相同的底稿，不能用像素测量证明某个固定比例。练习时复制自己的同一头像，只改变指定部位，比较会更可靠。\n\n## 3. 第一步：只抬眉，先看神态\n\n复制平静组并命名“惊讶”。沿原眉的位置，把眉毛略向上移。两边可以保持原来的弧度，不必突然弯成高高的拱门。\n\n为什么先动眉？眉眼之间的空隙变化很容易观察，也不涉及虹膜的重画。你可以先知道“只抬眉”会给这张脸带来什么感觉。\n\n**检查：** 眼睛有没有被误选并一起移动？如果眉眼整组向上挪，改变的就是五官位置，而不是眉眼关系。撤销，再只选择眉毛图层。\n\n## 4. 第二步：让上眼睑抬高一点\n\n保留眼角的大致位置，抬起上眼睑中段，让眼睛的开口稍高。下眼睑这次先保持原样。原先被挡住的上部虹膜可能露出更多，应补出被遮住的部分。\n\n虹膜的底层大小先保持不变。注意区别：眼睛睁大意味着开口改变，不意味着虹膜跟着等比放大。也不需要在虹膜四周突然留出一整圈很宽的眼白；那常会把情绪推得更强烈。\n\n如果原画的虹膜已经露得很多，只做很小的改变即可。不同画风的眼睛开口不同，没有必须再增加多少高度的标准。\n\n**检查：** 与平静版切换，头部保持稳定，主要是上眼睑打开。双眼的开合程度应能读成同一个表情。\n\n## 5. 第三步：在原嘴的位置做小开口\n\n隐藏闭嘴线。在原嘴中心附近画一个小椭圆或柔软的圆角开口，用较深、但不一定纯黑的颜色填入口腔。先不画牙齿、舌头和嘴唇高光。\n\n小嘴不需要非常圆。你可以略偏竖向，也可以上缘更平一点。本次先保持很小的开口，避免一改嘴就变成大喊。\n\n**检查：** 嘴中心有没有下降到下巴附近？开口增加了高度，中心仍应靠近原来的嘴部区域。先查位置，再查形状。\n\n## 6. 把强度当作可以调节的量\n\n保存 A“轻微抬眉、闭嘴”和 B“同样眉眼、小圆口”。这次只改变嘴。观察哪一张更像“刚注意到”，哪一张更像“已经发出声音”。不需要给每张图贴唯一情绪标签。\n\n想画更明显的版本时，下一轮再增加眉毛高度或眼睛开口。每次只选一项，留住上一版作比较。三项同时加到最大，容易超过你原本想表达的情绪。\n\n## 7. 常见问题怎样改？\n\n| 看到的问题 | 可能原因 | 先尝试的修改 |\n| --- | --- | --- |\n| 看起来像害怕 | 虹膜缩得过小，眼白过多 | 恢复虹膜大小，减弱开眼幅度 |\n| 像开心地大笑 | 嘴角明显上扬，开口太宽 | 换成更小、更接近圆角的开口 |\n| 只有嘴动，神态很弱 | 眉眼仍非常放松 | 先略抬眉再比较 |\n| 五官整体上移 | 移动眉时选中了整组 | 单独修改眉毛图层 |\n| 嘴里黑成一大块 | 开口太大或内部对比过强 | 先缩小开口，再调暗部颜色 |\n\n## 8. 三次小练习\n\n1. **跟做：** 复制平静版，只抬眉，保存一张对照。\n2. **独立做：** 在第二份复制稿上完成轻度惊讶，不看图尝试说明每一步的作用。\n3. **只改一个条件：** 保持眉眼不变，做闭嘴和小圆口两版，选择更接近“诶？”的一张。\n\n可以把平静、微笑、惊讶并排放在同一画布上。缩小到平时会使用的头像大小，看看情绪是否仍有区别。不要只在放大到几百倍时判断。\n\n## 9. 到这里就可以结束\n\n- [ ] 我保留了原来的脸形、发型和五官中心位置。\n- [ ] 我能区分“眼睛开口变大”和“虹膜变大”。\n- [ ] 惊讶版能与平静版区分，不必靠文字标签才能认出变化。\n- [ ] 我知道怎样减弱这个表情，而不只是不断画得更夸张。\n\n下一课把变化集中到视线：头不转，眼睛也能表达想看又有些迟疑的感觉。\n\n[上一篇](19-微笑怎样从嘴角传到眼睛.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-20) · [下一篇](21-害羞怎样通过视线表达.md)\n"}, {"id": "lesson-21", "number": 21, "short": "害羞怎样通过视线表达", "file": "21-害羞怎样通过视线表达.md", "html": "\u003ch1 id=\"21\">21 · 害羞怎样通过视线表达\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：保持头朝正面，让双眼轻轻移开视线，再用很少的眉嘴变化尝试含蓄的表情。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：知道\u003ca href=\"#lesson-04\">虹膜和瞳孔的关系\u003c/a>，能把\u003ca href=\"#lesson-05\">两只眼睛配成一对\u003c/a>。本篇不学习转头，也不要求画手挡脸。\u003c/p>\n\u003ch2 id=\"1\">1. 移开视线为什么有用？\u003c/h2>\n\u003cp>直视观看者，与看向一侧，给人的交流感觉会不同。侧向视线可以读成思考、分心、迟疑，也可能在眉嘴与情境的配合下读成害羞。它并不天然等于害羞，更不能据此判断真实人物的心理。\u003c/p>\n\u003cp>画角色表情时，我们可以试着组合“视线稍避开、眉毛柔和、嘴角轻微上扬”。先不加腮红，看看眼神本身有没有变化。腮红以后可以用来加强效果，不承担所有表达任务。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：头仍向前，眼神移向一边\u003c/h2>\n\u003cp>\u003cimg alt=\"正面头部上移开视线与含蓄表情的对照\" src=\"assets/lesson-21-shy-gaze.png\" />\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>01：视线主要朝前。\u003c/strong> 先看每只眼里虹膜的位置。\u003c/li>\n\u003cli>\u003cstrong>02：双眼看向画面左边。\u003c/strong> 两个虹膜都向图像左侧偏移，鼻子与下巴仍朝前。\u003c/li>\n\u003cli>\u003cstrong>03：保留偏移的视线。\u003c/strong> 加入柔和眉形与小幅度的嘴角变化，尝试含蓄的笑意。\u003c/li>\n\u003c/ul>\n\u003cp>图内 01 的嘴也带着轻微笑意，所以这里不把 01 与 02 解释成严格的“只改变视线”实验。真正的单变量比较请用自己的底稿，只移动虹膜与瞳孔。图示中的发丝也有细微变化，不用于制作动画。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：明确说“画面左边”\u003c/h2>\n\u003cp>看着画布，确认你现在要让角色看向哪一侧。这里统一用观看者看到的方向：\u003cstrong>画面左边就是屏幕左边\u003c/strong>，不使用容易混淆的“角色左眼往左”。\u003c/p>\n\u003cp>在画布外侧画一个临时小点，表示她在看的方向。点只是你的辅助标记，不导出到成品。今天让目标略偏左、距离较远，先不做看鼻尖附近物体的近距离汇聚视线。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 你能不看角色设定，直接指出目标在屏幕哪边。这样移动两个虹膜时才不会一边采用角色方向、一边采用画面方向。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：虹膜、瞳孔、高光作为一个组\u003c/h2>\n\u003cp>在“平静”复制稿里选中一只眼的虹膜与瞳孔，让它们一起向画面左边轻移。高光若属于你当前简化的眼睛设计，也先随组移动，避免浮在旧位置。另一只眼同样向画面左边移动。\u003c/p>\n\u003cp>不要只移动瞳孔而把虹膜留在原地，那样瞳孔会偏到虹膜边缘。本篇沿用简化的正面圆形虹膜，偏移幅度较小；极端侧视时虹膜形状的透视变化留到以后。\u003c/p>\n\u003cp>移动多少不靠统一像素数。先做很小的偏移，缩小观察，再逐步增加。虹膜靠近眼角时，会被眼睑遮挡，超出眼睛开口的部分应隐藏，不能穿到眼外皮肤上。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 对照两眼的左右眼白分布，它们都应支持朝同一侧看。两只眼各自向鼻子靠近，会更像看近处；各自往外跑，会显得视线散开。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：头部方向保持稳定\u003c/h2>\n\u003cp>来回切换原版和侧看版，盯着鼻尖、下巴尖、脸部中线，而不是只盯虹膜。它们应留在原处。今天改变的是眼睛在看哪里，不是整个头在朝哪里。\u003c/p>\n\u003cp>如果你突然觉得必须把鼻子也移过去，先停一下，保留现在这个“正面头、侧向眼神”的版本。转头是后面第 25—27 篇要拆解的问题，本课先把视线本身画清楚。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：用眉嘴尝试不同读法\u003c/h2>\n\u003cp>保留偏移后的双眼，复制成两个版本：A 使用中性的眉嘴；B 把眉头轻轻抬一点，让眉形柔和，再给嘴角很小的笑意。\u003c/p>\n\u003cp>这不是害羞的唯一画法。眉头抬得太高、嘴角又向下，可能更像担忧；眉毛压得很低，可能变成警惕的侧目。先尝试较小的幅度，观察整个组合。\u003c/p>\n\u003cp>如果你喜欢安静、克制的洛琪希表情，可以让变化非常轻。不必为了让别人第一秒认出“害羞”就把所有符号都堆上去。\u003c/p>\n\u003ch2 id=\"7\">7. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的问题\u003c/th>\n\u003cth>优先检查\u003c/th>\n\u003cth>修改办法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像对眼\u003c/td>\n\u003ctd>两个虹膜是否都向鼻子移动了\u003c/td>\n\u003ctd>回到屏幕方向，让两边都向同一侧偏移\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>视线散开\u003c/td>\n\u003ctd>两个虹膜是否各往外侧跑\u003c/td>\n\u003ctd>先放回正视版，再一起偏向目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>眼珠飞出眼角\u003c/td>\n\u003ctd>是否没有处理遮挡\u003c/td>\n\u003ctd>用眼睛开口限制虹膜可见区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>表情像担忧\u003c/td>\n\u003ctd>眉头过高、嘴角过低\u003c/td>\n\u003ctd>减小眉形变化，试轻微闭嘴笑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>角色像转头了\u003c/td>\n\u003ctd>鼻子、下巴或眼形一起变了\u003c/td>\n\u003ctd>恢复底稿，只改视线组\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"8\">8. 三次小练习\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟做：\u003c/strong> 让双眼向画面左边稍偏，眉嘴不动。\u003c/li>\n\u003cli>\u003cstrong>独立做：\u003c/strong> 回到正视底稿，尝试向画面右边看，确认没有变成对眼。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 固定侧向视线和嘴，只比较两种眉毛弧度，说说各自让你想到什么心情。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"9\">9. 到这里就可以结束\u003c/h2>\n\u003cul>\n\u003cli>[ ] 我能明确指出双眼看向屏幕哪一侧。\u003c/li>\n\u003cli>[ ] 瞳孔仍属于虹膜，虹膜没有越出眼睛开口。\u003c/li>\n\u003cli>[ ] 鼻子、下巴和发型没有跟着视线移动。\u003c/li>\n\u003cli>[ ] 我知道侧看也可能表达其他心情，能从眉嘴组合解释自己的选择。\u003c/li>\n\u003c/ul>\n\u003cp>下一课暂时收起情绪变化，只学习眼睑完全合上时怎样画，为眨眼准备一个闭眼状态。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-20\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-21\">打开 HTML 阅读版\u003c/a> · \u003ca href=\"#lesson-22\">下一篇\u003c/a>\u003c/p>", "text": "# 21 · 害羞怎样通过视线表达\n\n> 今天只做一件事：保持头朝正面，让双眼轻轻移开视线，再用很少的眉嘴变化尝试含蓄的表情。\n\n前置：知道[虹膜和瞳孔的关系](04-虹膜和瞳孔放在哪里.md)，能把[两只眼睛配成一对](05-两只眼睛怎样配成一对.md)。本篇不学习转头，也不要求画手挡脸。\n\n## 1. 移开视线为什么有用？\n\n直视观看者，与看向一侧，给人的交流感觉会不同。侧向视线可以读成思考、分心、迟疑，也可能在眉嘴与情境的配合下读成害羞。它并不天然等于害羞，更不能据此判断真实人物的心理。\n\n画角色表情时，我们可以试着组合“视线稍避开、眉毛柔和、嘴角轻微上扬”。先不加腮红，看看眼神本身有没有变化。腮红以后可以用来加强效果，不承担所有表达任务。\n\n## 2. 看图：头仍向前，眼神移向一边\n\n![正面头部上移开视线与含蓄表情的对照](assets/lesson-21-shy-gaze.png)\n\n- **01：视线主要朝前。** 先看每只眼里虹膜的位置。\n- **02：双眼看向画面左边。** 两个虹膜都向图像左侧偏移，鼻子与下巴仍朝前。\n- **03：保留偏移的视线。** 加入柔和眉形与小幅度的嘴角变化，尝试含蓄的笑意。\n\n图内 01 的嘴也带着轻微笑意，所以这里不把 01 与 02 解释成严格的“只改变视线”实验。真正的单变量比较请用自己的底稿，只移动虹膜与瞳孔。图示中的发丝也有细微变化，不用于制作动画。\n\n## 3. 第一步：明确说“画面左边”\n\n看着画布，确认你现在要让角色看向哪一侧。这里统一用观看者看到的方向：**画面左边就是屏幕左边**，不使用容易混淆的“角色左眼往左”。\n\n在画布外侧画一个临时小点，表示她在看的方向。点只是你的辅助标记，不导出到成品。今天让目标略偏左、距离较远，先不做看鼻尖附近物体的近距离汇聚视线。\n\n**检查：** 你能不看角色设定，直接指出目标在屏幕哪边。这样移动两个虹膜时才不会一边采用角色方向、一边采用画面方向。\n\n## 4. 第二步：虹膜、瞳孔、高光作为一个组\n\n在“平静”复制稿里选中一只眼的虹膜与瞳孔，让它们一起向画面左边轻移。高光若属于你当前简化的眼睛设计，也先随组移动，避免浮在旧位置。另一只眼同样向画面左边移动。\n\n不要只移动瞳孔而把虹膜留在原地，那样瞳孔会偏到虹膜边缘。本篇沿用简化的正面圆形虹膜，偏移幅度较小；极端侧视时虹膜形状的透视变化留到以后。\n\n移动多少不靠统一像素数。先做很小的偏移，缩小观察，再逐步增加。虹膜靠近眼角时，会被眼睑遮挡，超出眼睛开口的部分应隐藏，不能穿到眼外皮肤上。\n\n**检查：** 对照两眼的左右眼白分布，它们都应支持朝同一侧看。两只眼各自向鼻子靠近，会更像看近处；各自往外跑，会显得视线散开。\n\n## 5. 第三步：头部方向保持稳定\n\n来回切换原版和侧看版，盯着鼻尖、下巴尖、脸部中线，而不是只盯虹膜。它们应留在原处。今天改变的是眼睛在看哪里，不是整个头在朝哪里。\n\n如果你突然觉得必须把鼻子也移过去，先停一下，保留现在这个“正面头、侧向眼神”的版本。转头是后面第 25—27 篇要拆解的问题，本课先把视线本身画清楚。\n\n## 6. 第四步：用眉嘴尝试不同读法\n\n保留偏移后的双眼，复制成两个版本：A 使用中性的眉嘴；B 把眉头轻轻抬一点，让眉形柔和，再给嘴角很小的笑意。\n\n这不是害羞的唯一画法。眉头抬得太高、嘴角又向下，可能更像担忧；眉毛压得很低，可能变成警惕的侧目。先尝试较小的幅度，观察整个组合。\n\n如果你喜欢安静、克制的洛琪希表情，可以让变化非常轻。不必为了让别人第一秒认出“害羞”就把所有符号都堆上去。\n\n## 7. 常见问题怎样改？\n\n| 看到的问题 | 优先检查 | 修改办法 |\n| --- | --- | --- |\n| 像对眼 | 两个虹膜是否都向鼻子移动了 | 回到屏幕方向，让两边都向同一侧偏移 |\n| 视线散开 | 两个虹膜是否各往外侧跑 | 先放回正视版，再一起偏向目标 |\n| 眼珠飞出眼角 | 是否没有处理遮挡 | 用眼睛开口限制虹膜可见区域 |\n| 表情像担忧 | 眉头过高、嘴角过低 | 减小眉形变化，试轻微闭嘴笑 |\n| 角色像转头了 | 鼻子、下巴或眼形一起变了 | 恢复底稿，只改视线组 |\n\n## 8. 三次小练习\n\n1. **跟做：** 让双眼向画面左边稍偏，眉嘴不动。\n2. **独立做：** 回到正视底稿，尝试向画面右边看，确认没有变成对眼。\n3. **只改一个条件：** 固定侧向视线和嘴，只比较两种眉毛弧度，说说各自让你想到什么心情。\n\n## 9. 到这里就可以结束\n\n- [ ] 我能明确指出双眼看向屏幕哪一侧。\n- [ ] 瞳孔仍属于虹膜，虹膜没有越出眼睛开口。\n- [ ] 鼻子、下巴和发型没有跟着视线移动。\n- [ ] 我知道侧看也可能表达其他心情，能从眉嘴组合解释自己的选择。\n\n下一课暂时收起情绪变化，只学习眼睑完全合上时怎样画，为眨眼准备一个闭眼状态。\n\n[上一篇](20-惊讶怎样表现.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-21) · [下一篇](22-闭眼线怎样画.md)\n"}, {"id": "lesson-22", "number": 22, "short": "闭眼线怎样画", "file": "22-闭眼线怎样画.md", "html": "\u003ch1 id=\"22\">22 · 闭眼线怎样画\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：在原头像上画一双自然合上的眼睛，并让脸的其他部分留在原位。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：能指出上下眼睑和内外眼角。不清楚这些位置时，回看\u003ca href=\"#lesson-03\">一只眼睛的外形\u003c/a>。本课做普通眨眼中的闭合状态，先不做用力挤眼或大笑。\u003c/p>\n\u003ch2 id=\"1\">1. 眼睛闭上后，留下的线是什么？\u003c/h2>\n\u003cp>闭眼线可以理解为上下眼睑闭合处的简化表达。它不是在原虹膜中间另外贴一条线，也不是把上眼睑复制到眼睛正中间就结束。\u003c/p>\n\u003cp>当眼睑合上，虹膜、瞳孔和眼白不再从开口里露出来。它们仍可以保存在源文件里，但在闭眼版本中应该隐藏。眉毛属于另一部件，不必随着眼睛一起下降。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：观察眼角、开口与闭合线\u003c/h2>\n\u003cp>\u003cimg alt=\"从睁眼经遮挡到闭眼的眼睑关系\" src=\"assets/lesson-22-closed-eyes.png\" />\u003c/p>\n\u003cp>\u003cstrong>01\u003c/strong> 显示睁眼，蓝点提示眼角附近位置。\u003cstrong>02\u003c/strong> 显示上眼睑下降、虹膜被遮挡的中间状态；淡蓝虚线提示完整虹膜形状，不属于最后线稿。\u003cstrong>03\u003c/strong> 开口关闭，只留下闭眼线与少量睫毛。\u003c/p>\n\u003cp>图中的蓝点与虚线用于找关系，不是严格重合的测量模板。实际作业以自己的原眼角为基准。图中 03 是浅浅下垂的弧线，适合本课的放松闭合示例；其他画风也可以更平，笑着闭眼还会有别的弧度。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：复制睁眼版，标出眼角\u003c/h2>\n\u003cp>使用平静、正视的头像，不沿用上一课偏向一侧的视线。复制成“闭眼”组，保留脸、眉毛、嘴与头发不变。在临时辅助层上标出四个眼角位置。\u003c/p>\n\u003cp>为什么需要眼角？闭眼线的起止区域若左右漂移，切换时就像眼睛位置变了。对这次简化练习，眼角可以作为大致稳定的锚点。真实表情里皮肤也会运动，但现在先不加入这些变化。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 辅助点只放在眼角附近，不要把睫毛尖当眼角。长睫毛可以伸出边界，不能拿它的最远端量眼宽。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：隐藏眼睛内部，清掉旧边界\u003c/h2>\n\u003cp>在闭眼组里隐藏虹膜、瞳孔、高光和眼白。如果白色眼白直接画在脸底色上，要用匹配的皮肤底色恢复该区域。再移除旧的上眼睑与多余下眼睑线，给新线留出位置。\u003c/p>\n\u003cp>这是闭眼状态中很容易漏掉的一步。只在睁眼图上加一条弧线，眼白和虹膜仍露着，就不会读成完全闭合。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 暂时把新闭眼线也隐藏，脸上应只有干净的皮肤区域，没有漂浮的高光或零散蓝点。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：连接两个眼角区域\u003c/h2>\n\u003cp>从内眼角附近向外眼角附近画一条浅弧。对本课的放松闭合，可以让中段略低于两端，接近原下眼睑所在区域；具体高度以你的原眼形与参考为准，不规定为眼睛高度的一半。\u003c/p>\n\u003cp>先用细线，画完后再看是否需要给外侧加一点线重。弧度太深，闭眼线会像下垂的绳子；线太粗，则像在眼皮上涂了黑色条块。两种问题都先减量解决。\u003c/p>\n\u003cp>与睁眼切换，观察线有没有突然掉到脸颊。位置不合适时，整条线轻微调整比增加很多睫毛更有效。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：只保留少量睫毛\u003c/h2>\n\u003cp>在外侧用一两根短线提示睫毛即可。睫毛跟随闭合线的方向，不把睁眼状态那一大簇完整搬过来。你也可以先完全不画睫毛，只用闭眼线验证状态。\u003c/p>\n\u003cp>两边不必机械镜像，但闭合程度应一致。一边弧度非常深、另一边接近平线，可能像不同强度的挤眼。本次先做温和、接近的双眼状态。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 缩小到头像大小，即使没有额外表情符号，也应该能看清“眼睛合上了”。\u003c/p>\n\u003ch2 id=\"7\">7. 一次只比较弧度\u003c/h2>\n\u003cp>固定闭眼线的两端和大致位置，画 A 较平的浅弧、B 中段略低的浅弧。不要同时改变眉毛和嘴。看看哪一版与自己的原头像更协调。\u003c/p>\n\u003cp>向上拱起的闭眼弧经常用于笑眯眼，但也受整张脸和画风影响。先完成本课的普通闭眼，再另存一版尝试笑眼，避免把两种练习混在一起。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的问题\u003c/th>\n\u003cth>先检查哪里\u003c/th>\n\u003cth>修改动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>还是像半睁着\u003c/td>\n\u003ctd>虹膜、眼白是否还在\u003c/td>\n\u003ctd>隐藏内部色块并补回皮肤\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像脸颊多了一条线\u003c/td>\n\u003ctd>闭眼线是否过低\u003c/td>\n\u003ctd>对照原眼角与下眼睑位置调整\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像浓重的眼影\u003c/td>\n\u003ctd>线宽与旧线残留\u003c/td>\n\u003ctd>减细新线，清理多余边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>切换时整张脸跳动\u003c/td>\n\u003ctd>是否重新画了整张头像\u003c/td>\n\u003ctd>恢复同一底稿，只替换眼睛\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习与结束检查\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟做：\u003c/strong> 在一对简化眼形上标眼角，隐藏内部，连出闭眼线。\u003c/li>\n\u003cli>\u003cstrong>独立做：\u003c/strong> 把做法放回自己的完整头像，暂时不画睫毛。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 固定线的端点，比较两种浅弧的效果。\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>[ ] 闭眼状态没有露出虹膜、瞳孔或眼白。\u003c/li>\n\u003cli>[ ] 双眼的起止区域与睁眼版大致一致。\u003c/li>\n\u003cli>[ ] 眉毛、鼻子、嘴和头发保持稳定。\u003c/li>\n\u003cli>[ ] 我保留了睁眼与闭眼两个可以切换的版本。\u003c/li>\n\u003c/ul>\n\u003cp>下一课补两者之间的半闭状态，重点是虹膜被遮住，而不是变扁。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-21\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-22\">打开 HTML 阅读版\u003c/a> · \u003ca href=\"#lesson-23\">下一篇\u003c/a>\u003c/p>", "text": "# 22 · 闭眼线怎样画\n\n> 今天只做一件事：在原头像上画一双自然合上的眼睛，并让脸的其他部分留在原位。\n\n前置：能指出上下眼睑和内外眼角。不清楚这些位置时，回看[一只眼睛的外形](03-一只眼睛的外形怎么画.md)。本课做普通眨眼中的闭合状态，先不做用力挤眼或大笑。\n\n## 1. 眼睛闭上后，留下的线是什么？\n\n闭眼线可以理解为上下眼睑闭合处的简化表达。它不是在原虹膜中间另外贴一条线，也不是把上眼睑复制到眼睛正中间就结束。\n\n当眼睑合上，虹膜、瞳孔和眼白不再从开口里露出来。它们仍可以保存在源文件里，但在闭眼版本中应该隐藏。眉毛属于另一部件，不必随着眼睛一起下降。\n\n## 2. 看图：观察眼角、开口与闭合线\n\n![从睁眼经遮挡到闭眼的眼睑关系](assets/lesson-22-closed-eyes.png)\n\n**01** 显示睁眼，蓝点提示眼角附近位置。**02** 显示上眼睑下降、虹膜被遮挡的中间状态；淡蓝虚线提示完整虹膜形状，不属于最后线稿。**03** 开口关闭，只留下闭眼线与少量睫毛。\n\n图中的蓝点与虚线用于找关系，不是严格重合的测量模板。实际作业以自己的原眼角为基准。图中 03 是浅浅下垂的弧线，适合本课的放松闭合示例；其他画风也可以更平，笑着闭眼还会有别的弧度。\n\n## 3. 第一步：复制睁眼版，标出眼角\n\n使用平静、正视的头像，不沿用上一课偏向一侧的视线。复制成“闭眼”组，保留脸、眉毛、嘴与头发不变。在临时辅助层上标出四个眼角位置。\n\n为什么需要眼角？闭眼线的起止区域若左右漂移，切换时就像眼睛位置变了。对这次简化练习，眼角可以作为大致稳定的锚点。真实表情里皮肤也会运动，但现在先不加入这些变化。\n\n**检查：** 辅助点只放在眼角附近，不要把睫毛尖当眼角。长睫毛可以伸出边界，不能拿它的最远端量眼宽。\n\n## 4. 第二步：隐藏眼睛内部，清掉旧边界\n\n在闭眼组里隐藏虹膜、瞳孔、高光和眼白。如果白色眼白直接画在脸底色上，要用匹配的皮肤底色恢复该区域。再移除旧的上眼睑与多余下眼睑线，给新线留出位置。\n\n这是闭眼状态中很容易漏掉的一步。只在睁眼图上加一条弧线，眼白和虹膜仍露着，就不会读成完全闭合。\n\n**检查：** 暂时把新闭眼线也隐藏，脸上应只有干净的皮肤区域，没有漂浮的高光或零散蓝点。\n\n## 5. 第三步：连接两个眼角区域\n\n从内眼角附近向外眼角附近画一条浅弧。对本课的放松闭合，可以让中段略低于两端，接近原下眼睑所在区域；具体高度以你的原眼形与参考为准，不规定为眼睛高度的一半。\n\n先用细线，画完后再看是否需要给外侧加一点线重。弧度太深，闭眼线会像下垂的绳子；线太粗，则像在眼皮上涂了黑色条块。两种问题都先减量解决。\n\n与睁眼切换，观察线有没有突然掉到脸颊。位置不合适时，整条线轻微调整比增加很多睫毛更有效。\n\n## 6. 第四步：只保留少量睫毛\n\n在外侧用一两根短线提示睫毛即可。睫毛跟随闭合线的方向，不把睁眼状态那一大簇完整搬过来。你也可以先完全不画睫毛，只用闭眼线验证状态。\n\n两边不必机械镜像，但闭合程度应一致。一边弧度非常深、另一边接近平线，可能像不同强度的挤眼。本次先做温和、接近的双眼状态。\n\n**检查：** 缩小到头像大小，即使没有额外表情符号，也应该能看清“眼睛合上了”。\n\n## 7. 一次只比较弧度\n\n固定闭眼线的两端和大致位置，画 A 较平的浅弧、B 中段略低的浅弧。不要同时改变眉毛和嘴。看看哪一版与自己的原头像更协调。\n\n向上拱起的闭眼弧经常用于笑眯眼，但也受整张脸和画风影响。先完成本课的普通闭眼，再另存一版尝试笑眼，避免把两种练习混在一起。\n\n## 8. 常见问题怎样改？\n\n| 看到的问题 | 先检查哪里 | 修改动作 |\n| --- | --- | --- |\n| 还是像半睁着 | 虹膜、眼白是否还在 | 隐藏内部色块并补回皮肤 |\n| 像脸颊多了一条线 | 闭眼线是否过低 | 对照原眼角与下眼睑位置调整 |\n| 像浓重的眼影 | 线宽与旧线残留 | 减细新线，清理多余边界 |\n| 切换时整张脸跳动 | 是否重新画了整张头像 | 恢复同一底稿，只替换眼睛 |\n\n## 9. 三次小练习与结束检查\n\n1. **跟做：** 在一对简化眼形上标眼角，隐藏内部，连出闭眼线。\n2. **独立做：** 把做法放回自己的完整头像，暂时不画睫毛。\n3. **只改一个条件：** 固定线的端点，比较两种浅弧的效果。\n\n- [ ] 闭眼状态没有露出虹膜、瞳孔或眼白。\n- [ ] 双眼的起止区域与睁眼版大致一致。\n- [ ] 眉毛、鼻子、嘴和头发保持稳定。\n- [ ] 我保留了睁眼与闭眼两个可以切换的版本。\n\n下一课补两者之间的半闭状态，重点是虹膜被遮住，而不是变扁。\n\n[上一篇](21-害羞怎样通过视线表达.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-22) · [下一篇](23-半闭眼为什么不是把眼睛压扁.md)\n"}, {"id": "lesson-23", "number": 23, "short": "半闭眼为什么不是把眼睛压扁", "file": "23-半闭眼为什么不是把眼睛压扁.md", "html": "\u003ch1 id=\"23\">23 · 半闭眼为什么不是把眼睛压扁\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：在睁眼与闭眼之间，补出一个上眼睑下降的半闭眼状态。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：第 22 篇的闭眼版，以及原来的正视睁眼版。本篇只处理眨眼中间状态，不把“半闭眼”固定解释成困倦、嫌弃或某一种性格。\u003c/p>\n\u003ch2 id=\"1\">1. 开口变窄，与东西被压扁，是两件事\u003c/h2>\n\u003cp>想象一张圆形蓝纸放在窗口后面，窗帘从上往下拉。你看到的蓝色区域越来越少，但纸还是原来的圆。半闭眼中的遮挡，可以先借这个关系理解。\u003c/p>\n\u003cp>眼睑不是平面窗帘，实际会沿眼球表面运动；不过在本课的正面简化画法里，先理解“遮住”就足够。把整个眼睛图层纵向压缩，会把虹膜、高光、睫毛一起压扁，丢掉这个关系。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：第二格与第三格差在哪里？\u003c/h2>\n\u003cp>\u003cimg alt=\"虹膜被眼睑遮挡与整体压扁的对照\" src=\"assets/lesson-23-half-closed-eyes.png\" />\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>01：睁眼。\u003c/strong> 虹膜已有一部分被上眼睑覆盖。\u003c/li>\n\u003cli>\u003cstrong>02：半闭。\u003c/strong> 上眼睑下降，蓝色虚线帮助想象原来的完整虹膜；被遮住的部分不画在成品上。\u003c/li>\n\u003cli>\u003cstrong>03：本课要避免的压扁方式。\u003c/strong> 虹膜和瞳孔一起横向变扁，像整张眼睛被压缩。\u003c/li>\n\u003c/ul>\n\u003cp>第三格的叉号针对的是“用整体压缩代替本课遮挡”的做法，不意味着所有椭圆虹膜都错误。侧视、特定画风或夸张动画可以出现别的形状，这里先固定正面视角研究一个变化。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：从睁眼版复制\u003c/h2>\n\u003cp>把正视的睁眼组复制为“半闭”，不要从闭眼版凭记忆重新画虹膜。这样原虹膜的大小、瞳孔位置、高光和左右视线都能保留。\u003c/p>\n\u003cp>若虹膜原本只画了可见的一部分，可以在临时辅助层补出完整圆形或原画风的椭圆外形。它用于检查连续关系，最终要隐藏。不要为了画辅助圆而改掉已满意的眼睛设计。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 复制完成时，睁眼版和半闭版切换没有变化。先确认这个起点，再开始改线。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：只让上眼睑中段下降\u003c/h2>\n\u003cp>保留内外眼角的大致区域，让上眼睑中段下移。新线仍然是一条带弧度的眼睑边界，不必画成绝对水平的切割线。外侧睫毛跟随眼睑向下调整。\u003c/p>\n\u003cp>“半闭”在这里指介于开和关之间，不要求精确剩下一半高度。选择一个能与睁眼、闭眼明显区分的开口即可。下眼睑先保持近似稳定，这是一种适合起步的简化，不是对所有眨眼的解剖规定。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 只看上边界，你能辨认它比原版更低。若上下两边同时向中央挤、虹膜也变扁，可能误用了整层缩放。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：隐藏新眼睑以上的虹膜\u003c/h2>\n\u003cp>清掉旧上眼睑，再把新边界上方露出的虹膜、瞳孔和眼白隐藏。可以使用蒙版，也可以在复制稿上擦除；选择你当前熟悉的工具。用脸部皮肤色补回眼皮覆盖的区域，保持层次一致。\u003c/p>\n\u003cp>眼睑上方不该还有原高光漂浮着。高光如果落入被遮挡的范围，也应该一起消失。不要特意把它挪到下方，只为了让每个状态都有一颗亮点。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 暂时显示完整虹膜辅助形，它应能与下方可见部分接起来；如果接不上，回查是否移动或缩放了虹膜。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：对照闭眼版，而不只看单张\u003c/h2>\n\u003cp>按“睁眼—半闭—闭眼”手动切换。注意三件事：眼角有没有大幅跳动；上眼睑是否总体向下；完全闭合时内部色块是否全部消失。\u003c/p>\n\u003cp>半闭版单独看可能显得困倦，这是正常的阅读结果。作为眨眼过渡，它会很短暂地出现，最终效果还要看播放顺序与停留时间。不要因为一张静止图显困就把嘴角加成微笑，本课先保持其他部件稳定。\u003c/p>\n\u003ch2 id=\"7\">7. 一次只比较遮挡量\u003c/h2>\n\u003cp>保存 A“较少遮挡”和 B“较多遮挡”，两版共用同一个虹膜。交替查看，看哪一版更适合作为开与关之间的中间一步。先不改瞳孔大小，不加新的光影。\u003c/p>\n\u003cp>如果你熟悉编程，可以把这一点理解为“改变可见区域”与“改变图形尺寸”的区别。这个类比只是帮助理解，实际板绘仍通过眼睑边界、皮肤覆盖与线条来表达。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>可能原因\u003c/th>\n\u003cth>一次先改什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>蓝色虹膜变成扁饼\u003c/td>\n\u003ctd>缩放了整只眼睛\u003c/td>\n\u003ctd>取回原虹膜，只改变上方遮挡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>眼皮上有亮点\u003c/td>\n\u003ctd>高光没跟着遮挡隐藏\u003c/td>\n\u003ctd>清掉新边界以上的高光\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线稿有两条上边界\u003c/td>\n\u003ctd>旧上眼睑未移除\u003c/td>\n\u003ctd>隐藏旧线，仅保留新边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左右像不同表情\u003c/td>\n\u003ctd>双眼遮挡程度相差太多\u003c/td>\n\u003ctd>对比两侧剩余开口高度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>半闭时头发也晃动\u003c/td>\n\u003ctd>状态来自不同完整画稿\u003c/td>\n\u003ctd>使用同一头像的复制版本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习与结束检查\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟做：\u003c/strong> 在单眼上画辅助虹膜，下降上眼睑并遮住上部。\u003c/li>\n\u003cli>\u003cstrong>独立做：\u003c/strong> 回到头像，为双眼补出半闭版，隐藏辅助层。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 比较两种遮挡程度，挑一个作为中间状态。\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>[ ] 半闭版保留了原虹膜的底层大小。\u003c/li>\n\u003cli>[ ] 旧眼睑、高光和眼白没有残留在眼皮上方。\u003c/li>\n\u003cli>[ ] 我能手动按顺序切换三种状态，其他部件保持稳定。\u003c/li>\n\u003cli>[ ] 三种状态已经保存，准备做第一次播放。\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"#lesson-22\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-23\">打开 HTML 阅读版\u003c/a> · \u003ca href=\"#lesson-24\">下一篇\u003c/a>\u003c/p>", "text": "# 23 · 半闭眼为什么不是把眼睛压扁\n\n> 今天只做一件事：在睁眼与闭眼之间，补出一个上眼睑下降的半闭眼状态。\n\n前置：第 22 篇的闭眼版，以及原来的正视睁眼版。本篇只处理眨眼中间状态，不把“半闭眼”固定解释成困倦、嫌弃或某一种性格。\n\n## 1. 开口变窄，与东西被压扁，是两件事\n\n想象一张圆形蓝纸放在窗口后面，窗帘从上往下拉。你看到的蓝色区域越来越少，但纸还是原来的圆。半闭眼中的遮挡，可以先借这个关系理解。\n\n眼睑不是平面窗帘，实际会沿眼球表面运动；不过在本课的正面简化画法里，先理解“遮住”就足够。把整个眼睛图层纵向压缩，会把虹膜、高光、睫毛一起压扁，丢掉这个关系。\n\n## 2. 看图：第二格与第三格差在哪里？\n\n![虹膜被眼睑遮挡与整体压扁的对照](assets/lesson-23-half-closed-eyes.png)\n\n- **01：睁眼。** 虹膜已有一部分被上眼睑覆盖。\n- **02：半闭。** 上眼睑下降，蓝色虚线帮助想象原来的完整虹膜；被遮住的部分不画在成品上。\n- **03：本课要避免的压扁方式。** 虹膜和瞳孔一起横向变扁，像整张眼睛被压缩。\n\n第三格的叉号针对的是“用整体压缩代替本课遮挡”的做法，不意味着所有椭圆虹膜都错误。侧视、特定画风或夸张动画可以出现别的形状，这里先固定正面视角研究一个变化。\n\n## 3. 第一步：从睁眼版复制\n\n把正视的睁眼组复制为“半闭”，不要从闭眼版凭记忆重新画虹膜。这样原虹膜的大小、瞳孔位置、高光和左右视线都能保留。\n\n若虹膜原本只画了可见的一部分，可以在临时辅助层补出完整圆形或原画风的椭圆外形。它用于检查连续关系，最终要隐藏。不要为了画辅助圆而改掉已满意的眼睛设计。\n\n**检查：** 复制完成时，睁眼版和半闭版切换没有变化。先确认这个起点，再开始改线。\n\n## 4. 第二步：只让上眼睑中段下降\n\n保留内外眼角的大致区域，让上眼睑中段下移。新线仍然是一条带弧度的眼睑边界，不必画成绝对水平的切割线。外侧睫毛跟随眼睑向下调整。\n\n“半闭”在这里指介于开和关之间，不要求精确剩下一半高度。选择一个能与睁眼、闭眼明显区分的开口即可。下眼睑先保持近似稳定，这是一种适合起步的简化，不是对所有眨眼的解剖规定。\n\n**检查：** 只看上边界，你能辨认它比原版更低。若上下两边同时向中央挤、虹膜也变扁，可能误用了整层缩放。\n\n## 5. 第三步：隐藏新眼睑以上的虹膜\n\n清掉旧上眼睑，再把新边界上方露出的虹膜、瞳孔和眼白隐藏。可以使用蒙版，也可以在复制稿上擦除；选择你当前熟悉的工具。用脸部皮肤色补回眼皮覆盖的区域，保持层次一致。\n\n眼睑上方不该还有原高光漂浮着。高光如果落入被遮挡的范围，也应该一起消失。不要特意把它挪到下方，只为了让每个状态都有一颗亮点。\n\n**检查：** 暂时显示完整虹膜辅助形，它应能与下方可见部分接起来；如果接不上，回查是否移动或缩放了虹膜。\n\n## 6. 第四步：对照闭眼版，而不只看单张\n\n按“睁眼—半闭—闭眼”手动切换。注意三件事：眼角有没有大幅跳动；上眼睑是否总体向下；完全闭合时内部色块是否全部消失。\n\n半闭版单独看可能显得困倦，这是正常的阅读结果。作为眨眼过渡，它会很短暂地出现，最终效果还要看播放顺序与停留时间。不要因为一张静止图显困就把嘴角加成微笑，本课先保持其他部件稳定。\n\n## 7. 一次只比较遮挡量\n\n保存 A“较少遮挡”和 B“较多遮挡”，两版共用同一个虹膜。交替查看，看哪一版更适合作为开与关之间的中间一步。先不改瞳孔大小，不加新的光影。\n\n如果你熟悉编程，可以把这一点理解为“改变可见区域”与“改变图形尺寸”的区别。这个类比只是帮助理解，实际板绘仍通过眼睑边界、皮肤覆盖与线条来表达。\n\n## 8. 常见问题怎样改？\n\n| 问题 | 可能原因 | 一次先改什么 |\n| --- | --- | --- |\n| 蓝色虹膜变成扁饼 | 缩放了整只眼睛 | 取回原虹膜，只改变上方遮挡 |\n| 眼皮上有亮点 | 高光没跟着遮挡隐藏 | 清掉新边界以上的高光 |\n| 线稿有两条上边界 | 旧上眼睑未移除 | 隐藏旧线，仅保留新边界 |\n| 左右像不同表情 | 双眼遮挡程度相差太多 | 对比两侧剩余开口高度 |\n| 半闭时头发也晃动 | 状态来自不同完整画稿 | 使用同一头像的复制版本 |\n\n## 9. 三次小练习与结束检查\n\n1. **跟做：** 在单眼上画辅助虹膜，下降上眼睑并遮住上部。\n2. **独立做：** 回到头像，为双眼补出半闭版，隐藏辅助层。\n3. **只改一个条件：** 比较两种遮挡程度，挑一个作为中间状态。\n\n- [ ] 半闭版保留了原虹膜的底层大小。\n- [ ] 旧眼睑、高光和眼白没有残留在眼皮上方。\n- [ ] 我能手动按顺序切换三种状态，其他部件保持稳定。\n- [ ] 三种状态已经保存，准备做第一次播放。\n\n[上一篇](22-闭眼线怎样画.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-23) · [下一篇](24-把三种眼睛状态连起来.md)\n"}, {"id": "lesson-24", "number": 24, "short": "把三种眼睛状态连起来", "file": "24-把三种眼睛状态连起来.md", "html": "\u003ch1 id=\"24\">24 · 把三种眼睛状态连起来\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：把自己画的睁眼、半闭、闭眼三个状态，按顺序播放成一次简单眨眼。\u003c/p>\n\u003c/blockquote>\n\u003cp>前置：第 22、23 篇的闭眼和半闭版，以及同一底稿的睁眼版。第一版可以很粗糙，先检查变化是否连贯，不要求立即变成完整桌宠。\u003c/p>\n\u003ch2 id=\"1\">1. 三张图，为什么要排成五个位置？\u003c/h2>\n\u003cp>眨眼包含合上和重新睁开。最小练习可以用下面的顺序：\u003c/p>\n\u003cp>\u003cstrong>睁眼 → 半闭 → 闭眼 → 半闭 → 睁眼。\u003c/strong>\u003c/p>\n\u003cp>这是五个播放位置，但只有三张不同的图片。第一次练习时，张开阶段直接复用半闭图就可以。以后还可以分别画闭合与张开的过渡，调整速度，让动作更细腻。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：顺序和停留长短\u003c/h2>\n\u003cp>\u003cimg alt=\"五个播放位置与停留长短的眨眼示意\" src=\"assets/lesson-24-blink-sequence.png\" />\u003c/p>\n\u003cp>图中 \u003cstrong>01、05\u003c/strong> 都是睁眼，\u003cstrong>02、04\u003c/strong> 都是半闭，\u003cstrong>03\u003c/strong> 是闭眼。下方长条提示睁眼停留较长，中间几个状态短暂经过。条长只是示意，不按比例测量时间。\u003c/p>\n\u003cp>生成图中的发丝、眼睛位置存在细微差异，因此不要直接裁下这五格作为正式帧。动画最容易暴露这种差异：单张看起来接近，快速切换时头发却会抖。请使用自己的同一底稿。\u003c/p>\n\u003ch2 id=\"3\">3. 先手动检查三个文件\u003c/h2>\n\u003cp>从源文件分别导出 \u003ccode>open.png\u003c/code>、\u003ccode>half.png\u003c/code>、\u003ccode>closed.png\u003c/code>。三张使用完全相同的画布尺寸与导出范围，人物位置不变。不要每张单独裁切到人物边缘。\u003c/p>\n\u003cp>这里导出的是完整头像状态。即使眼睛之外的地方完全相同，也先保留它们，减少第一次练习的组装步骤。透明背景可以用，三张都保留同样的透明画布边距。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 在同一个窗口里切换三张。盯着帽尖、鼻子或下巴，如果它们在动，先回源文件修位置，再调动画速度。尺寸相同也不代表内容已对齐；两项都要看。\u003c/p>\n\u003ch2 id=\"4\">4. 用本地预览直接试\u003c/h2>\n\u003cp>打开\u003ca href=\"blink.html\">眨眼练习工具\u003c/a>。HTML 阅读版在本课下方也提供同一工具入口。\u003c/p>\n\u003cp>工具起初显示一对简化眼睛，用来演示遮挡关系。它是程序绘制的教学示意，不是你的画稿，也不是洛琪希的成品动画。你可以先按“下一步”观察五个位置，再点击“播放”。\u003c/p>\n\u003cp>准备好自己的图后，分别选择睁眼、半闭、闭眼三个 PNG，点击“使用我的三张图”。文件只在当前浏览器页面中读取，不会上传，也不会改动原图。工具会检查三张尺寸是否一致；位置是否对齐仍需要你观看判断。\u003c/p>\n\u003cp>关闭或刷新页面后，自选图片需要重新选择。工具只做预览，不导出 GIF 或视频；可编辑源文件和三张 PNG 仍是本课需要保留的成果。\u003c/p>\n\u003ch2 id=\"5\">5. 先采用一套简单节奏\u003c/h2>\n\u003cp>工具的默认一轮是：睁眼 1000 毫秒，半闭 80 毫秒，闭眼 80 毫秒，半闭 80 毫秒，睁眼 1760 毫秒。加起来是 3000 毫秒，也就是 3 秒。\u003c/p>\n\u003cp>这是便于比较的练习参数，不是所有角色或真实眨眼必须遵守的时间。重点是：大部分时间保持睁眼，中间几个状态快速经过。第五步与下一轮第一步都是同一张睁眼图，它们相邻时只会继续保持睁眼。\u003c/p>\n\u003cp>点击暂停，再逐步切换可以检查图形；播放时才判断节奏。把所有状态都设成一秒，通常会像角色在慢慢闭眼休息。你可以切到慢速观察，再恢复正常速度比较。\u003c/p>\n\u003ch2 id=\"6-krita\">6. 想用 Krita 时怎样对应？\u003c/h2>\n\u003cp>Krita 可以通过动画工作区与时间轴进行逐帧动画，重复帧便于保留原画继续修改，绘图纸外观可辅助检查相邻帧。入口与术语可查\u003ca href=\"https://docs.krita.org/zh_CN/user_manual/animation.html\">Krita 官方动画手册\u003c/a>。\u003c/p>\n\u003cp>本课给一个可选的 12 帧每秒练习安排：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时间轴帧号\u003c/th>\n\u003cth>放什么状态\u003c/th>\n\u003cth>保持到哪一帧\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>0\u003c/td>\n\u003ctd>睁眼\u003c/td>\n\u003ctd>11\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>半闭\u003c/td>\n\u003ctd>12\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>闭眼\u003c/td>\n\u003ctd>13\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>半闭\u003c/td>\n\u003ctd>14\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>睁眼\u003c/td>\n\u003ctd>35\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>将播放范围设为第 0—35 帧，这一轮共 36 帧，在 12 帧每秒下约为 3 秒。表中的单帧过渡约 83 毫秒，与网页默认的 80 毫秒接近，但不是完全一样。不熟悉时间轴时，先完成网页预览就足够。\u003c/p>\n\u003ch2 id=\"7\">7. 一次只比较播放速度\u003c/h2>\n\u003cp>同一组三张图，分别用正常速度与慢速播放。不要同时换图。慢速有助于找旧线残留、遮挡错误和位置跳动；正常速度帮助判断是否像短暂眨眼。\u003c/p>\n\u003cp>如果正常播放很生硬，先暂停定位是哪一步不连贯。半闭与闭眼的差距特别大，可以调整半闭版的遮挡量。若头发在抖，修改时间并不能解决，应该修帧的一致性。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题怎样改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>看到的问题\u003c/th>\n\u003cth>优先检查\u003c/th>\n\u003cth>下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>整个人忽大忽小\u003c/td>\n\u003ctd>导出尺寸、裁切范围是否一致\u003c/td>\n\u003ctd>同一画布重新导出全部状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头发在跳\u003c/td>\n\u003ctd>是否用了分别生成或分别重画的图\u003c/td>\n\u003ctd>回到同一底稿复制修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像慢慢睡着\u003c/td>\n\u003ctd>中间状态停留过长\u003c/td>\n\u003ctd>缩短半闭与闭眼，保留较长睁眼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像闪了一下\u003c/td>\n\u003ctd>闭合过快，或中间状态差距过大\u003c/td>\n\u003ctd>慢放检查形状，再小幅调整时间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览器提示尺寸不同\u003c/td>\n\u003ctd>三张文件尺寸不一致\u003c/td>\n\u003ctd>修正源文件画布与导出范围\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习与结束检查\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>跟做：\u003c/strong> 使用默认示意，暂停并走完五步，说出为什么只有三张图。\u003c/li>\n\u003cli>\u003cstrong>独立做：\u003c/strong> 载入自己的三张 PNG，播放一轮，再逐步检查鼻尖是否稳定。\u003c/li>\n\u003cli>\u003cstrong>只改一个条件：\u003c/strong> 使用同一组图比较正常与慢速，写下一个形状问题或节奏感受。\u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli>[ ] 三个 PNG 使用同一画布，头部位置稳定。\u003c/li>\n\u003cli>[ ] 闭合时眼睛内部完全隐藏，重新睁开能回到原状。\u003c/li>\n\u003cli>[ ] 我看到了自己的头像第一次眨眼，或已定位到一个具体要修的问题。\u003c/li>\n\u003cli>[ ] 我保留了源文件和导出文件，下一次可以继续改。\u003c/li>\n\u003c/ul>\n\u003cp>本阶段 19—24 到这里完成。第 25 篇计划从“球体中线怎样表示转向”开始，目前待写。第 39—42 篇的素材整理、节奏细化与点击响应也仍在计划中。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-23\">上一篇\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-24\">打开 HTML 阅读版\u003c/a>\u003c/p>", "text": "# 24 · 把三种眼睛状态连起来\n\n> 今天只做一件事：把自己画的睁眼、半闭、闭眼三个状态，按顺序播放成一次简单眨眼。\n\n前置：第 22、23 篇的闭眼和半闭版，以及同一底稿的睁眼版。第一版可以很粗糙，先检查变化是否连贯，不要求立即变成完整桌宠。\n\n## 1. 三张图，为什么要排成五个位置？\n\n眨眼包含合上和重新睁开。最小练习可以用下面的顺序：\n\n**睁眼 → 半闭 → 闭眼 → 半闭 → 睁眼。**\n\n这是五个播放位置，但只有三张不同的图片。第一次练习时，张开阶段直接复用半闭图就可以。以后还可以分别画闭合与张开的过渡，调整速度，让动作更细腻。\n\n## 2. 看图：顺序和停留长短\n\n![五个播放位置与停留长短的眨眼示意](assets/lesson-24-blink-sequence.png)\n\n图中 **01、05** 都是睁眼，**02、04** 都是半闭，**03** 是闭眼。下方长条提示睁眼停留较长，中间几个状态短暂经过。条长只是示意，不按比例测量时间。\n\n生成图中的发丝、眼睛位置存在细微差异，因此不要直接裁下这五格作为正式帧。动画最容易暴露这种差异：单张看起来接近，快速切换时头发却会抖。请使用自己的同一底稿。\n\n## 3. 先手动检查三个文件\n\n从源文件分别导出 `open.png`、`half.png`、`closed.png`。三张使用完全相同的画布尺寸与导出范围，人物位置不变。不要每张单独裁切到人物边缘。\n\n这里导出的是完整头像状态。即使眼睛之外的地方完全相同，也先保留它们，减少第一次练习的组装步骤。透明背景可以用，三张都保留同样的透明画布边距。\n\n**检查：** 在同一个窗口里切换三张。盯着帽尖、鼻子或下巴，如果它们在动，先回源文件修位置，再调动画速度。尺寸相同也不代表内容已对齐；两项都要看。\n\n## 4. 用本地预览直接试\n\n打开[眨眼练习工具](blink.html)。HTML 阅读版在本课下方也提供同一工具入口。\n\n工具起初显示一对简化眼睛，用来演示遮挡关系。它是程序绘制的教学示意，不是你的画稿，也不是洛琪希的成品动画。你可以先按“下一步”观察五个位置，再点击“播放”。\n\n准备好自己的图后，分别选择睁眼、半闭、闭眼三个 PNG，点击“使用我的三张图”。文件只在当前浏览器页面中读取，不会上传，也不会改动原图。工具会检查三张尺寸是否一致；位置是否对齐仍需要你观看判断。\n\n关闭或刷新页面后，自选图片需要重新选择。工具只做预览，不导出 GIF 或视频；可编辑源文件和三张 PNG 仍是本课需要保留的成果。\n\n## 5. 先采用一套简单节奏\n\n工具的默认一轮是：睁眼 1000 毫秒，半闭 80 毫秒，闭眼 80 毫秒，半闭 80 毫秒，睁眼 1760 毫秒。加起来是 3000 毫秒，也就是 3 秒。\n\n这是便于比较的练习参数，不是所有角色或真实眨眼必须遵守的时间。重点是：大部分时间保持睁眼，中间几个状态快速经过。第五步与下一轮第一步都是同一张睁眼图，它们相邻时只会继续保持睁眼。\n\n点击暂停，再逐步切换可以检查图形；播放时才判断节奏。把所有状态都设成一秒，通常会像角色在慢慢闭眼休息。你可以切到慢速观察，再恢复正常速度比较。\n\n## 6. 想用 Krita 时怎样对应？\n\nKrita 可以通过动画工作区与时间轴进行逐帧动画，重复帧便于保留原画继续修改，绘图纸外观可辅助检查相邻帧。入口与术语可查[Krita 官方动画手册](https://docs.krita.org/zh_CN/user_manual/animation.html)。\n\n本课给一个可选的 12 帧每秒练习安排：\n\n| 时间轴帧号 | 放什么状态 | 保持到哪一帧 |\n| --- | --- | --- |\n| 0 | 睁眼 | 11 |\n| 12 | 半闭 | 12 |\n| 13 | 闭眼 | 13 |\n| 14 | 半闭 | 14 |\n| 15 | 睁眼 | 35 |\n\n将播放范围设为第 0—35 帧，这一轮共 36 帧，在 12 帧每秒下约为 3 秒。表中的单帧过渡约 83 毫秒，与网页默认的 80 毫秒接近，但不是完全一样。不熟悉时间轴时，先完成网页预览就足够。\n\n## 7. 一次只比较播放速度\n\n同一组三张图，分别用正常速度与慢速播放。不要同时换图。慢速有助于找旧线残留、遮挡错误和位置跳动；正常速度帮助判断是否像短暂眨眼。\n\n如果正常播放很生硬，先暂停定位是哪一步不连贯。半闭与闭眼的差距特别大，可以调整半闭版的遮挡量。若头发在抖，修改时间并不能解决，应该修帧的一致性。\n\n## 8. 常见问题怎样改？\n\n| 看到的问题 | 优先检查 | 下一步 |\n| --- | --- | --- |\n| 整个人忽大忽小 | 导出尺寸、裁切范围是否一致 | 同一画布重新导出全部状态 |\n| 头发在跳 | 是否用了分别生成或分别重画的图 | 回到同一底稿复制修改 |\n| 像慢慢睡着 | 中间状态停留过长 | 缩短半闭与闭眼，保留较长睁眼 |\n| 像闪了一下 | 闭合过快，或中间状态差距过大 | 慢放检查形状，再小幅调整时间 |\n| 浏览器提示尺寸不同 | 三张文件尺寸不一致 | 修正源文件画布与导出范围 |\n\n## 9. 三次小练习与结束检查\n\n1. **跟做：** 使用默认示意，暂停并走完五步，说出为什么只有三张图。\n2. **独立做：** 载入自己的三张 PNG，播放一轮，再逐步检查鼻尖是否稳定。\n3. **只改一个条件：** 使用同一组图比较正常与慢速，写下一个形状问题或节奏感受。\n\n- [ ] 三个 PNG 使用同一画布，头部位置稳定。\n- [ ] 闭合时眼睛内部完全隐藏，重新睁开能回到原状。\n- [ ] 我看到了自己的头像第一次眨眼，或已定位到一个具体要修的问题。\n- [ ] 我保留了源文件和导出文件，下一次可以继续改。\n\n本阶段 19—24 到这里完成。第 25 篇计划从“球体中线怎样表示转向”开始，目前待写。第 39—42 篇的素材整理、节奏细化与点击响应也仍在计划中。\n\n[上一篇](23-半闭眼为什么不是把眼睛压扁.md) · [返回总目录](00-系列总计划与目录.md) · [打开 HTML 阅读版](index.html#lesson-24)\n"}]</script><script src="reader.js"></script></body></html>
