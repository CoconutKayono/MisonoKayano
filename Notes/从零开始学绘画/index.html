\u003c/p>\n\u003cp>如果只是想拉开间距，却直接把左眼缩小，就混入了另一个变量。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：还要检查两侧有没有空间\u003c/h2>\n\u003cp>从画面左侧到右侧，依次有五块区域：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">脸侧空隙 ｜ 左眼 ｜ 中间空隙 ｜ 右眼 ｜ 脸侧空隙\n\u003c/code>\u003c/pre>\n\u003cp>这五部分共同占据这一个高度上的脸宽。眼睛越宽，中间空隙或两侧空隙就需要相应调整。\u003c/p>\n\u003cp>所以，如果你把眼距拉大后，两只眼睛快碰到脸部轮廓了，先停下来。可以减小眼距，或者另存一版、适度缩小两只眼睛后重新比较。不要为了保留某个数字，把眼睛硬塞进头里。\u003c/p>\n\u003cp>此时最值得看的，是整体空间关系，而不是椭圆是否画得光滑。\u003c/p>\n\u003ch2 id=\"7\">7. 遇到这些情况，怎么改？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>试着改一项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>一边高、一边低\u003c/td>\n\u003ctd>两个眼形中心是否在同一条横线附近\u003c/td>\n\u003ctd>单独调整偏高或偏低的一只\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>五官区域显得挤在中间\u003c/td>\n\u003ctd>内眼角之间的空隙是否过小\u003c/td>\n\u003ctd>两只眼睛各向外移一点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>眼睛快碰到脸侧\u003c/td>\n\u003ctd>五块区域的宽度是否互相挤占\u003c/td>\n\u003ctd>先缩小间距，再决定是否调整眼宽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>怎么移动都不协调\u003c/td>\n\u003ctd>是否同时改了头型和眼形大小\u003c/td>\n\u003ctd>回到同一个底稿，只改高度或间距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换一张参考就不适用\u003c/td>\n\u003ctd>是否把练习起点当成固定公式\u003c/td>\n\u003ctd>按新参考比较头宽、眼宽和空隙\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"8\">8. 三个小练习\u003c/h2>\n\u003cp>\u003cstrong>A，五到八分钟：\u003c/strong> 在第 01 篇头型上画两个占位眼，保留中线和横线。能说明每条线表示什么即可。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 复制三份，只改变眼睛高度。选一版，写下你喜欢它的原因，例如“下方空间更接近参考”。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 从选中的版本再复制三份，只改变眼距。比较中间空隙与脸侧空隙，而不是给画面打好坏分数。\u003c/p>\n\u003ch2 id=\"9\">9. 可以结束的标准\u003c/h2>\n\u003cul>\n\u003cli>[ ] 我知道横线在本篇代表眼形中心高度。\u003c/li>\n\u003cli>[ ] 我能同时移动两只眼睛，而不重画头部。\u003c/li>\n\u003cli>[ ] 我比较了眼距，也检查了脸侧剩余空间。\u003c/li>\n\u003cli>[ ] 我能说出一次调整改的是高度、间距还是大小。\u003c/li>\n\u003c/ul>\n\u003cp>保存一个自己愿意继续画下去的版本。下一篇只挑其中一只眼睛，把占位形状换成真正的眼睑外形。\u003c/p>\n\u003cp>\u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-03\">下一篇：一只眼睛的外形怎么画\u003c/a>\u003c/p>", "text": "# 02 · 眼睛在脸上的什么位置\n\n> 今天只做一件事：在已经画好的正面头部里，安排两只眼睛的位置。\n>\n> 前置：[01 · 头部起形](01-头部起形：从圆到脸颊和下巴.md)。本篇用椭圆占位，不需要会画漂亮的眼睛。\n\n## 1. 为什么先决定位置？\n\n一只眼睛单独看很好看，放进脸里却可能不协调。问题有时出在位置：两只眼睛太高、太低、太挤，或者把脸的两侧撑满了。\n\n先用两个简单形状占位，调整起来很轻松。等位置合适，再把它们换成眼睑、虹膜和瞳孔。\n\n**今天只观察三个关系：眼睛在脸上的高度、两只眼睛之间的空隙、眼睛到脸侧的空隙。**\n\n## 2. 看图：上排改高度，下排改间距\n\n![相同正面头型中眼睛高度与间距的比较](assets/lesson-02-eye-placement.png)\n\n| 编号 | 看什么 | 自己练习时固定什么 |\n| --- | --- | --- |\n| 01—03 | 眼睛从较高到较低的位置变化 | 头型、眼睛大小和左右间距 |\n| 04—06 | 两只眼睛从较近到较远的变化 | 头型、眼睛大小和所在高度 |\n\n蓝色竖线表示脸的中线，横线表示本图约定的**眼形中心高度**；红色短标记强调两只眼睛中间的空隙。这里的横线不是所有画法通用的“上眼睑线”。\n\n配图是 AI 生成的关系示意，各格存在微小差异。你练习时复制自己的同一张头部底稿，才更容易做到一次只改一个条件。六格是变化比较，不是正确答案与错误答案。\n\n## 3. 第一步：准备同一个头部底稿\n\n打开第 01 篇的画稿，在头部轮廓上方新建“眼睛占位”图层。保留浅色竖直中线。\n\n今天练正面、平视、没有歪头的脸。先检查下巴是否大致在中线上。头型明显歪斜时，先调整轮廓，避免一边摆眼睛、一边猜到底哪里出错。\n\n可以复制底稿做三份。轮廓保持不动，眼睛在单独图层上画，之后就能只移动眼睛。\n\n## 4. 第二步：先选一条试画的高度\n\n### 从哪里开始？\n\n如果你还没有参考，可以先在“头顶到下巴”的大约中间高度画一条轻横线，作为试画起点。这里说的头顶是头部轮廓顶部，不是头发或帽子顶部。\n\n这不是角色比例的标准答案。二次元头型、眼睛大小和画风都会改变安排；有了喜欢的参考之后，应比较参考中的具体关系。\n\n### 怎么放？\n\n在横线左右两边，各画一个横向椭圆。让横线从两个椭圆的大致中心经过，两个形状高度、宽度先画得相近。\n\n暂时不填瞳孔，不加睫毛。缩小看看椭圆上方留下多少额头区域，下方留下多少脸部区域。\n\n### 怎么检查？\n\n复制一份，把两只眼睛**一起**稍微往上移；再复制一份，一起往下移。一次移动小一点，比较更容易。\n\n问自己：“哪一版更接近我喜欢的参考？哪一版给鼻子、嘴和下巴留下的空间比较合适？”今天还没画那些部件，也可以先观察剩下的空间。\n\n不要在同一次比较里又放大眼睛、又缩短下巴，否则你难以判断变化来自哪里。\n\n## 5. 第三步：安排中间的空隙\n\n先看靠近中线的两个边界，也就是未来的两个内眼角。它们不应该自动贴到中线上，中间需要留出鼻梁所在的区域。\n\n如果不知道从哪里起步，可以暂时让中间空隙接近一只占位眼的宽度，再结合参考调整。这个办法只是让你能开始比较，不是所有二次元角色的定律。\n\n把左眼往左、右眼往右移动，中间空隙会增大；反向移动，空隙会缩小。**保持两只眼睛同时、对称地移动，先别改变眼形大小。**\n\n如果只是想拉开间距，却直接把左眼缩小，就混入了另一个变量。\n\n## 6. 第四步：还要检查两侧有没有空间\n\n从画面左侧到右侧，依次有五块区域：\n\n```text\n脸侧空隙 ｜ 左眼 ｜ 中间空隙 ｜ 右眼 ｜ 脸侧空隙\n```\n\n这五部分共同占据这一个高度上的脸宽。眼睛越宽，中间空隙或两侧空隙就需要相应调整。\n\n所以，如果你把眼距拉大后，两只眼睛快碰到脸部轮廓了，先停下来。可以减小眼距，或者另存一版、适度缩小两只眼睛后重新比较。不要为了保留某个数字，把眼睛硬塞进头里。\n\n此时最值得看的，是整体空间关系，而不是椭圆是否画得光滑。\n\n## 7. 遇到这些情况，怎么改？\n\n| 现象 | 先检查 | 试着改一项 |\n| --- | --- | --- |\n| 一边高、一边低 | 两个眼形中心是否在同一条横线附近 | 单独调整偏高或偏低的一只 |\n| 五官区域显得挤在中间 | 内眼角之间的空隙是否过小 | 两只眼睛各向外移一点 |\n| 眼睛快碰到脸侧 | 五块区域的宽度是否互相挤占 | 先缩小间距，再决定是否调整眼宽 |\n| 怎么移动都不协调 | 是否同时改了头型和眼形大小 | 回到同一个底稿，只改高度或间距 |\n| 换一张参考就不适用 | 是否把练习起点当成固定公式 | 按新参考比较头宽、眼宽和空隙 |\n\n## 8. 三个小练习\n\n**A，五到八分钟：** 在第 01 篇头型上画两个占位眼，保留中线和横线。能说明每条线表示什么即可。\n\n**B，五分钟：** 复制三份，只改变眼睛高度。选一版，写下你喜欢它的原因，例如“下方空间更接近参考”。\n\n**C，五分钟：** 从选中的版本再复制三份，只改变眼距。比较中间空隙与脸侧空隙，而不是给画面打好坏分数。\n\n## 9. 可以结束的标准\n\n- [ ] 我知道横线在本篇代表眼形中心高度。\n- [ ] 我能同时移动两只眼睛，而不重画头部。\n- [ ] 我比较了眼距，也检查了脸侧剩余空间。\n- [ ] 我能说出一次调整改的是高度、间距还是大小。\n\n保存一个自己愿意继续画下去的版本。下一篇只挑其中一只眼睛，把占位形状换成真正的眼睑外形。\n\n[返回总目录](00-系列总计划与目录.md) · [下一篇：一只眼睛的外形怎么画](03-一只眼睛的外形怎么画.md)\n"}, {"id": "lesson-03", "number": 3, "short": "一只眼睛的外形怎么画", "file": "03-一只眼睛的外形怎么画.md", "html": "\u003ch1 id=\"03\">03 · 一只眼睛的外形怎么画\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只画眼睛的开口外形：两个眼角、上眼睑和下眼睑。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-02\">02 · 眼睛位置\u003c/a>。暂时不画虹膜、瞳孔和复杂睫毛。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 先认识今天要画的四个部分\u003c/h2>\n\u003cp>你看到的眼睛外形，可以先概括为四个部分：靠近鼻子的内眼角、远离鼻子的外眼角、上方的眼睑边界、下方的眼睑边界。\u003c/p>\n\u003cp>“眼睑”就是眼皮。今天画的是眼皮围出的可见开口，不是整个眼球的外轮廓。把它想成一个有上下边界的窗口，有助于理解下一篇的遮挡。\u003c/p>\n\u003cp>为方便讲解，本图画的是\u003cstrong>画面右侧的那只眼睛\u003c/strong>：图内左边靠近鼻子，右边靠近脸侧。另一只眼睛的方向相反。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先定两端，再连上下边界\u003c/h2>\n\u003cp>\u003cimg alt=\"眼角、上下眼睑及开口高度的六格分步示意\" src=\"assets/lesson-03-eye-contour.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>当前做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>用两个点确定内外眼角和眼睛宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>在两点之间画上眼睑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>加一条较浅的下眼睑弧线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>整理线条，让上边界稍重、下边界较轻\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>对比开口较窄的眼形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>对比开口较高的眼形\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>左侧蓝色竖向弧线只提示靠鼻子的一侧，不是需要画进眼睛里的部件。04—06 用来比较开口大小；生成图有细微边界差异，自己练习时保持两眼角和下边界不变，只移动上边界。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：两个点决定这一只眼睛占多宽\u003c/h2>\n\u003cp>在新图层上画一条很淡的短横线，标两个点。先把它们看作内外眼角，距离就是眼睛的大致宽度。\u003c/p>\n\u003cp>刚开始让两点在差不多的高度，比较容易。喜欢的画风可能让外眼角略高或略低，这个变化可以之后再试。\u003c/p>\n\u003cp>\u003cstrong>为什么先画点？\u003c/strong> 如果直接画一条很长的漂亮弧线，你可能最后才发现眼睛占得太宽。先定两端，就能把线限制在已决定的区域内。\u003c/p>\n\u003cp>检查时，把它放回第 02 篇的占位区域：两个点有没有明显超出原来的安排？有的话，先改点的位置。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：画上眼睑，先找到最高处\u003c/h2>\n\u003cp>在两个点上方轻点一个位置，作为这次上眼睑弧线的最高区域。它可以略偏向一侧，不必永远在正中间。\u003c/p>\n\u003cp>从内眼角开始，线条向上拱，到高处后再向外眼角落下。可以用两段弧线完成，不要求一笔画出。\u003c/p>\n\u003cp>用眼睛沿着这条线走一遍：有没有突然鼓出一个尖包？有没有在接笔处凹进去？先把明显断裂或突兀转折整理掉。\u003c/p>\n\u003cp>\u003cstrong>这一步只决定大形。\u003c/strong> 上边界可以有柔和转折，动漫眼睛也不一定是完美圆弧。暂时不要用很多睫毛掩盖轮廓。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：画下眼睑，围出内部空间\u003c/h2>\n\u003cp>从内眼角向下绕出一条浅弧，再接向外眼角。作为本次示例，下弧比上弧平一些，这样眼睛不会像一个对称的叶片。\u003c/p>\n\u003cp>你现在得到的是封闭或近似封闭的眼部开口。正式二次元线稿里，下边界可以断开、变轻甚至部分省略；初学先把完整开口理解清楚。\u003c/p>\n\u003cp>\u003cstrong>检查内部的白色形状。\u003c/strong> 它的宽高是否接近你想要的眼形？如果内部太窄，就先调整边界，别急着往里面塞虹膜。\u003c/p>\n\u003cp>画歪时不一定要重来整只眼睛。只擦掉最影响形状的一小段，重新连接。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：稍微区分上下线的轻重\u003c/h2>\n\u003cp>把上眼睑略微加重，下眼睑保持较细。这个处理有助于读出上方边界，但不是所有画风都必须使用的规则。\u003c/p>\n\u003cp>如果软件压感还不顺，你可以先画普通细线，再在上边界局部补一点厚度，不必强求一笔粗细自然变化。\u003c/p>\n\u003cp>线条加粗会吃掉内部的白色空间。如果越描越像一条黑条，先退回较轻版本，看看是不是加得太多。\u003c/p>\n\u003cp>今天可以不画任何单根睫毛。让轮廓有清楚的起止和变化，已经完成主要任务。\u003c/p>\n\u003ch2 id=\"7\">7. 只改一个条件：上眼睑的高度\u003c/h2>\n\u003cp>复制完成的眼形三份。第一份不动，第二份把上眼睑压低一点，第三份把上眼睑抬高一点。内外眼角和下眼睑尽量不动。\u003c/p>\n\u003cp>这能帮助你分辨“眼睛变窄”与“眼睛整体缩小”：前者改变的是开口，后者会连眼宽一起改变。\u003c/p>\n\u003cp>不同开口会影响神态，但此时还没有眉毛和虹膜，不急着给每一种形状贴上固定情绪标签。先说得具体些：“这一个上边界更低，可见区域更窄。”\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>可能需要检查的地方\u003c/th>\n\u003cth>试改方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像规则叶片\u003c/td>\n\u003ctd>上下弧线是否完全一样\u003c/td>\n\u003ctd>让下弧浅一些，再比较内部白形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像尖锐菱形\u003c/td>\n\u003ctd>是否全用直线硬接\u003c/td>\n\u003ctd>把一两处转折改成较柔和的曲线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线越来越黑，形状越来越小\u003c/td>\n\u003ctd>是否反复在内侧加粗\u003c/td>\n\u003ctd>回退，先修边界，再少量改变线重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>眼角接不上\u003c/td>\n\u003ctd>起止点是否被不断移动\u003c/td>\n\u003ctd>重新标两端，只重接出问题的一段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单眼漂亮，放进脸里太大\u003c/td>\n\u003ctd>是否忘了原来的占位范围\u003c/td>\n\u003ctd>缩小或重画到既定区域，再看整体\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三个小练习\u003c/h2>\n\u003cp>\u003cstrong>A：\u003c/strong> 按 01—04 画一只简单眼形，约十分钟。先完整连出开口，再考虑省略下边界。\u003c/p>\n\u003cp>\u003cstrong>B：\u003c/strong> 另画一只，不逐笔照抄。先定眼角，再决定上下弧线。约五分钟。\u003c/p>\n\u003cp>\u003cstrong>C：\u003c/strong> 复制 B，只改上眼睑高度，得到窄、中、较高三种开口。约五分钟。\u003c/p>\n\u003cp>结束前检查：我能指出内外眼角吗？我知道哪些线在围出开口吗？我有没有先检查位置，再加重线条？\u003c/p>\n\u003cp>下一篇会把虹膜和瞳孔放进这个开口里。今天画好的眼形可以直接继续使用。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-02\">上一篇：眼睛位置\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-04\">下一篇：虹膜和瞳孔\u003c/a>\u003c/p>", "text": "# 03 · 一只眼睛的外形怎么画\n\n> 今天只画眼睛的开口外形：两个眼角、上眼睑和下眼睑。\n>\n> 前置：[02 · 眼睛位置](02-眼睛在脸上的什么位置.md)。暂时不画虹膜、瞳孔和复杂睫毛。\n\n## 1. 先认识今天要画的四个部分\n\n你看到的眼睛外形，可以先概括为四个部分：靠近鼻子的内眼角、远离鼻子的外眼角、上方的眼睑边界、下方的眼睑边界。\n\n“眼睑”就是眼皮。今天画的是眼皮围出的可见开口，不是整个眼球的外轮廓。把它想成一个有上下边界的窗口，有助于理解下一篇的遮挡。\n\n为方便讲解，本图画的是**画面右侧的那只眼睛**：图内左边靠近鼻子，右边靠近脸侧。另一只眼睛的方向相反。\n\n## 2. 看图：先定两端，再连上下边界\n\n![眼角、上下眼睑及开口高度的六格分步示意](assets/lesson-03-eye-contour.png)\n\n| 编号 | 当前做什么 |\n| --- | --- |\n| 01 | 用两个点确定内外眼角和眼睛宽度 |\n| 02 | 在两点之间画上眼睑 |\n| 03 | 加一条较浅的下眼睑弧线 |\n| 04 | 整理线条，让上边界稍重、下边界较轻 |\n| 05 | 对比开口较窄的眼形 |\n| 06 | 对比开口较高的眼形 |\n\n左侧蓝色竖向弧线只提示靠鼻子的一侧，不是需要画进眼睛里的部件。04—06 用来比较开口大小；生成图有细微边界差异，自己练习时保持两眼角和下边界不变，只移动上边界。\n\n## 3. 第一步：两个点决定这一只眼睛占多宽\n\n在新图层上画一条很淡的短横线，标两个点。先把它们看作内外眼角，距离就是眼睛的大致宽度。\n\n刚开始让两点在差不多的高度，比较容易。喜欢的画风可能让外眼角略高或略低，这个变化可以之后再试。\n\n**为什么先画点？** 如果直接画一条很长的漂亮弧线，你可能最后才发现眼睛占得太宽。先定两端，就能把线限制在已决定的区域内。\n\n检查时，把它放回第 02 篇的占位区域：两个点有没有明显超出原来的安排？有的话，先改点的位置。\n\n## 4. 第二步：画上眼睑，先找到最高处\n\n在两个点上方轻点一个位置，作为这次上眼睑弧线的最高区域。它可以略偏向一侧，不必永远在正中间。\n\n从内眼角开始，线条向上拱，到高处后再向外眼角落下。可以用两段弧线完成，不要求一笔画出。\n\n用眼睛沿着这条线走一遍：有没有突然鼓出一个尖包？有没有在接笔处凹进去？先把明显断裂或突兀转折整理掉。\n\n**这一步只决定大形。** 上边界可以有柔和转折，动漫眼睛也不一定是完美圆弧。暂时不要用很多睫毛掩盖轮廓。\n\n## 5. 第三步：画下眼睑，围出内部空间\n\n从内眼角向下绕出一条浅弧，再接向外眼角。作为本次示例，下弧比上弧平一些，这样眼睛不会像一个对称的叶片。\n\n你现在得到的是封闭或近似封闭的眼部开口。正式二次元线稿里，下边界可以断开、变轻甚至部分省略；初学先把完整开口理解清楚。\n\n**检查内部的白色形状。** 它的宽高是否接近你想要的眼形？如果内部太窄，就先调整边界，别急着往里面塞虹膜。\n\n画歪时不一定要重来整只眼睛。只擦掉最影响形状的一小段，重新连接。\n\n## 6. 第四步：稍微区分上下线的轻重\n\n把上眼睑略微加重，下眼睑保持较细。这个处理有助于读出上方边界，但不是所有画风都必须使用的规则。\n\n如果软件压感还不顺，你可以先画普通细线，再在上边界局部补一点厚度，不必强求一笔粗细自然变化。\n\n线条加粗会吃掉内部的白色空间。如果越描越像一条黑条，先退回较轻版本，看看是不是加得太多。\n\n今天可以不画任何单根睫毛。让轮廓有清楚的起止和变化，已经完成主要任务。\n\n## 7. 只改一个条件：上眼睑的高度\n\n复制完成的眼形三份。第一份不动，第二份把上眼睑压低一点，第三份把上眼睑抬高一点。内外眼角和下眼睑尽量不动。\n\n这能帮助你分辨“眼睛变窄”与“眼睛整体缩小”：前者改变的是开口，后者会连眼宽一起改变。\n\n不同开口会影响神态，但此时还没有眉毛和虹膜，不急着给每一种形状贴上固定情绪标签。先说得具体些：“这一个上边界更低，可见区域更窄。”\n\n## 8. 常见问题\n\n| 现象 | 可能需要检查的地方 | 试改方法 |\n| --- | --- | --- |\n| 像规则叶片 | 上下弧线是否完全一样 | 让下弧浅一些，再比较内部白形 |\n| 像尖锐菱形 | 是否全用直线硬接 | 把一两处转折改成较柔和的曲线 |\n| 线越来越黑，形状越来越小 | 是否反复在内侧加粗 | 回退，先修边界，再少量改变线重 |\n| 眼角接不上 | 起止点是否被不断移动 | 重新标两端，只重接出问题的一段 |\n| 单眼漂亮，放进脸里太大 | 是否忘了原来的占位范围 | 缩小或重画到既定区域，再看整体 |\n\n## 9. 三个小练习\n\n**A：** 按 01—04 画一只简单眼形，约十分钟。先完整连出开口，再考虑省略下边界。\n\n**B：** 另画一只，不逐笔照抄。先定眼角，再决定上下弧线。约五分钟。\n\n**C：** 复制 B，只改上眼睑高度，得到窄、中、较高三种开口。约五分钟。\n\n结束前检查：我能指出内外眼角吗？我知道哪些线在围出开口吗？我有没有先检查位置，再加重线条？\n\n下一篇会把虹膜和瞳孔放进这个开口里。今天画好的眼形可以直接继续使用。\n\n[上一篇：眼睛位置](02-眼睛在脸上的什么位置.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：虹膜和瞳孔](04-虹膜和瞳孔放在哪里.md)\n"}, {"id": "lesson-04", "number": 4, "short": "虹膜和瞳孔放在哪里", "file": "04-虹膜和瞳孔放在哪里.md", "html": "\u003ch1 id=\"04\">04 · 虹膜和瞳孔放在哪里\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只练一个关系：眼睑遮住虹膜，虹膜中间有瞳孔。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-03\">03 · 眼睛的外形\u003c/a>。准备一只已经画好开口的正面眼睛。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 先把几个名字分清\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>眼睑：\u003c/strong> 上下眼皮，围出我们能看见的眼部开口。\u003c/li>\n\u003cli>\u003cstrong>虹膜：\u003c/strong> 眼睛里有颜色的部分；在二次元里常画成蓝色、紫色或其他色彩。\u003c/li>\n\u003cli>\u003cstrong>瞳孔：\u003c/strong> 虹膜中央的深色区域，常用较小的深色圆形或椭圆来概括。\u003c/li>\n\u003cli>\u003cstrong>眼白：\u003c/strong> 虹膜外侧、开口内可见的浅色区域。\u003c/li>\n\u003cli>\u003cstrong>高光：\u003c/strong> 表示反光的亮点，不是瞳孔，也不必在今天加上。\u003c/li>\n\u003c/ul>\n\u003cp>本篇采用正面、视线较平的简化圆形虹膜。某些风格会拉长或改造虹膜形状；先用容易观察的形状理解遮挡，再研究风格变化。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：完整辅助形与最后看得见的部分\u003c/h2>\n\u003cp>\u003cimg alt=\"眼睑遮挡虹膜与不同睁眼程度的示意\" src=\"assets/lesson-04-iris-occlusion.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>观察重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>只有眼睛开口，内部仍是空白\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>蓝色虚线先表示完整虹膜辅助圆，包括被遮挡的部分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>加虹膜颜色和瞳孔，仍保留部分辅助线用于理解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>隐藏被眼睑遮住的轮廓，得到完成示意\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>上眼睑更低，看见的虹膜更少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>上眼睑更高，看见的虹膜更多\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>图中上方另外的细弧线是风格化的眼皮褶皱示意，不是眉毛，今天可以不画。各格为生成示意，不是严格对齐的动画帧；练习要在自己的同一底稿上保留虹膜大小，再改遮挡。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：先画完整的辅助圆\u003c/h2>\n\u003cp>在眼睑线稿下面新建“虹膜草图”层。先在眼睛开口中间画一个圆，让它的上方有一部分超过上眼睑。\u003c/p>\n\u003cp>现在超过边界没有关系，因为你是在画辅助形。这一步让你知道被眼皮挡住的部分仍然延续成一个完整形状。\u003c/p>\n\u003cp>不要只照着剩下的白色区域画一个被挤扁的圆。虹膜的辅助形状和眼睛开口是两个不同的东西。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 这个圆是否给左右留出了可见的眼白？是否大到把眼睛整个塞满？先比较虹膜与眼宽，再决定大小。\u003c/p>\n\u003cp>有些角色的虹膜很大，另一些较小。第一遍可以参考图中的关系，不要把它当成固定占比。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：在虹膜自己的中心放瞳孔\u003c/h2>\n\u003cp>找到刚才完整辅助圆的大致中心，画一个更小的深色圆形。\u003c/p>\n\u003cp>注意：中心指的是\u003cstrong>完整虹膜的中心\u003c/strong>，不是“被眼皮遮过以后剩余色块的视觉中心”。如果上面被遮住了，不能为了让瞳孔居中于剩余色块，就自动把它向下挪。\u003c/p>\n\u003cp>画的时候可以暂时显示完整辅助圆，再隐藏一次，来回检查。\u003c/p>\n\u003cp>瞳孔一开始画得小一点、颜色深一点就够了。不需要同时添加很多亮点和纹理，否则很难看清位置是否合适。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：只留下开口里能看见的部分\u003c/h2>\n\u003cp>把完整虹膜辅助层复制或保留备份。在工作层上，擦掉眼睑外侧的虹膜线与颜色。\u003c/p>\n\u003cp>如果你熟悉选区，也可以先选中眼部开口，再在选区内上色。初学使用橡皮清理同样可以，暂时不需要复杂蒙版。\u003c/p>\n\u003cp>上眼睑边界应当在虹膜前面，视觉上把虹膜上方挡住。下眼睑如果也遮到虹膜，按同样关系处理。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 有没有一段蓝色圆弧画到了眼皮上方？有没有颜色漏到开口以外？那通常是辅助线或多余颜色没有清掉。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：比较“遮得更多”和“虹膜缩小”\u003c/h2>\n\u003cp>复制这只眼睛。保持虹膜和瞳孔不动，只把上眼睑的边界向下移一点，并相应遮住更多虹膜。\u003c/p>\n\u003cp>你会发现，眼睛可以显得半闭，而虹膜本身不需要缩成一个小圆。\u003c/p>\n\u003cp>再复制一份，把上眼睑稍微抬高，就能露出更多虹膜。至于虹膜上方要不要露出明显眼白，要结合表情与画风判断；露白较多可能让神态更紧张或惊讶，不是越完整越正确。\u003c/p>\n\u003cp>此时还不用做动画。只是轮流隐藏、显示两个版本，观察变化来自哪条边界。\u003c/p>\n\u003ch2 id=\"7\">7. 高光什么时候加？\u003c/h2>\n\u003cp>等位置、大小和遮挡关系已经清楚，可以在最上方单独加一个小亮点。它能帮助表达光泽，但不会自动修正不协调的虹膜。\u003c/p>\n\u003cp>暂时让亮点小一些，不遮住整个瞳孔。双眼的高光与光照关系会在后面继续处理；今天做单眼练习，完全可以不加。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题与修正\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎么改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像一个圆贴在眼皮外面\u003c/td>\n\u003ctd>虹膜上边界是否越过上眼睑\u003c/td>\n\u003ctd>清掉被遮住的圆弧和颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>半闭眼时虹膜被压扁\u003c/td>\n\u003ctd>是否直接垂直缩放了整个虹膜\u003c/td>\n\u003ctd>恢复原形，改眼睑遮挡\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>瞳孔看起来飘在虹膜边缘\u003c/td>\n\u003ctd>是否按可见色块而非完整虹膜找中心\u003c/td>\n\u003ctd>显示辅助圆，重查中心\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>显得特别瞪眼\u003c/td>\n\u003ctd>虹膜是否过小、上方露白是否过多\u003c/td>\n\u003ctd>分别试着加大虹膜或降低上眼睑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加了很多高光还是不自然\u003c/td>\n\u003ctd>是否跳过位置和大小检查\u003c/td>\n\u003ctd>暂时隐藏高光，回到基础形状\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三个小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 在上一课眼形里画完整辅助圆，加瞳孔，再清除被遮住的部分。保存能看见辅助圆的一版和完成版。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 另画一只眼睛，从眼睑开口开始自己完成一次。给自己讲清楚哪一层在前、哪一层在后。\u003c/p>\n\u003cp>\u003cstrong>C，五到十分钟：\u003c/strong> 复制同一眼睛，只降低上眼睑。确认虹膜和瞳孔的位置、大小没有跟着乱动。\u003c/p>\n\u003cp>可以结束时，你应当能够指出眼睑、虹膜、瞳孔和眼白，并解释“被遮住”与“变小”的区别。\u003c/p>\n\u003cp>下一篇把两只眼睛放回同一张脸，检查高度、大小和视线是否协调。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-03\">上一篇：眼睛外形\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-05\">下一篇：两只眼睛怎样配成一对\u003c/a>\u003c/p>", "text": "# 04 · 虹膜和瞳孔放在哪里\n\n> 今天只练一个关系：眼睑遮住虹膜，虹膜中间有瞳孔。\n>\n> 前置：[03 · 眼睛的外形](03-一只眼睛的外形怎么画.md)。准备一只已经画好开口的正面眼睛。\n\n## 1. 先把几个名字分清\n\n- **眼睑：** 上下眼皮，围出我们能看见的眼部开口。\n- **虹膜：** 眼睛里有颜色的部分；在二次元里常画成蓝色、紫色或其他色彩。\n- **瞳孔：** 虹膜中央的深色区域，常用较小的深色圆形或椭圆来概括。\n- **眼白：** 虹膜外侧、开口内可见的浅色区域。\n- **高光：** 表示反光的亮点，不是瞳孔，也不必在今天加上。\n\n本篇采用正面、视线较平的简化圆形虹膜。某些风格会拉长或改造虹膜形状；先用容易观察的形状理解遮挡，再研究风格变化。\n\n## 2. 看图：完整辅助形与最后看得见的部分\n\n![眼睑遮挡虹膜与不同睁眼程度的示意](assets/lesson-04-iris-occlusion.png)\n\n| 编号 | 观察重点 |\n| --- | --- |\n| 01 | 只有眼睛开口，内部仍是空白 |\n| 02 | 蓝色虚线先表示完整虹膜辅助圆，包括被遮挡的部分 |\n| 03 | 加虹膜颜色和瞳孔，仍保留部分辅助线用于理解 |\n| 04 | 隐藏被眼睑遮住的轮廓，得到完成示意 |\n| 05 | 上眼睑更低，看见的虹膜更少 |\n| 06 | 上眼睑更高，看见的虹膜更多 |\n\n图中上方另外的细弧线是风格化的眼皮褶皱示意，不是眉毛，今天可以不画。各格为生成示意，不是严格对齐的动画帧；练习要在自己的同一底稿上保留虹膜大小，再改遮挡。\n\n## 3. 第一步：先画完整的辅助圆\n\n在眼睑线稿下面新建“虹膜草图”层。先在眼睛开口中间画一个圆，让它的上方有一部分超过上眼睑。\n\n现在超过边界没有关系，因为你是在画辅助形。这一步让你知道被眼皮挡住的部分仍然延续成一个完整形状。\n\n不要只照着剩下的白色区域画一个被挤扁的圆。虹膜的辅助形状和眼睛开口是两个不同的东西。\n\n**检查：** 这个圆是否给左右留出了可见的眼白？是否大到把眼睛整个塞满？先比较虹膜与眼宽，再决定大小。\n\n有些角色的虹膜很大，另一些较小。第一遍可以参考图中的关系，不要把它当成固定占比。\n\n## 4. 第二步：在虹膜自己的中心放瞳孔\n\n找到刚才完整辅助圆的大致中心，画一个更小的深色圆形。\n\n注意：中心指的是**完整虹膜的中心**，不是“被眼皮遮过以后剩余色块的视觉中心”。如果上面被遮住了，不能为了让瞳孔居中于剩余色块，就自动把它向下挪。\n\n画的时候可以暂时显示完整辅助圆，再隐藏一次，来回检查。\n\n瞳孔一开始画得小一点、颜色深一点就够了。不需要同时添加很多亮点和纹理，否则很难看清位置是否合适。\n\n## 5. 第三步：只留下开口里能看见的部分\n\n把完整虹膜辅助层复制或保留备份。在工作层上，擦掉眼睑外侧的虹膜线与颜色。\n\n如果你熟悉选区，也可以先选中眼部开口，再在选区内上色。初学使用橡皮清理同样可以，暂时不需要复杂蒙版。\n\n上眼睑边界应当在虹膜前面，视觉上把虹膜上方挡住。下眼睑如果也遮到虹膜，按同样关系处理。\n\n**检查：** 有没有一段蓝色圆弧画到了眼皮上方？有没有颜色漏到开口以外？那通常是辅助线或多余颜色没有清掉。\n\n## 6. 第四步：比较“遮得更多”和“虹膜缩小”\n\n复制这只眼睛。保持虹膜和瞳孔不动，只把上眼睑的边界向下移一点，并相应遮住更多虹膜。\n\n你会发现，眼睛可以显得半闭，而虹膜本身不需要缩成一个小圆。\n\n再复制一份，把上眼睑稍微抬高，就能露出更多虹膜。至于虹膜上方要不要露出明显眼白，要结合表情与画风判断；露白较多可能让神态更紧张或惊讶，不是越完整越正确。\n\n此时还不用做动画。只是轮流隐藏、显示两个版本，观察变化来自哪条边界。\n\n## 7. 高光什么时候加？\n\n等位置、大小和遮挡关系已经清楚，可以在最上方单独加一个小亮点。它能帮助表达光泽，但不会自动修正不协调的虹膜。\n\n暂时让亮点小一些，不遮住整个瞳孔。双眼的高光与光照关系会在后面继续处理；今天做单眼练习，完全可以不加。\n\n## 8. 常见问题与修正\n\n| 现象 | 先检查 | 可以怎么改 |\n| --- | --- | --- |\n| 像一个圆贴在眼皮外面 | 虹膜上边界是否越过上眼睑 | 清掉被遮住的圆弧和颜色 |\n| 半闭眼时虹膜被压扁 | 是否直接垂直缩放了整个虹膜 | 恢复原形，改眼睑遮挡 |\n| 瞳孔看起来飘在虹膜边缘 | 是否按可见色块而非完整虹膜找中心 | 显示辅助圆，重查中心 |\n| 显得特别瞪眼 | 虹膜是否过小、上方露白是否过多 | 分别试着加大虹膜或降低上眼睑 |\n| 加了很多高光还是不自然 | 是否跳过位置和大小检查 | 暂时隐藏高光，回到基础形状 |\n\n## 9. 三个小练习\n\n**A，十分钟：** 在上一课眼形里画完整辅助圆，加瞳孔，再清除被遮住的部分。保存能看见辅助圆的一版和完成版。\n\n**B，五分钟：** 另画一只眼睛，从眼睑开口开始自己完成一次。给自己讲清楚哪一层在前、哪一层在后。\n\n**C，五到十分钟：** 复制同一眼睛，只降低上眼睑。确认虹膜和瞳孔的位置、大小没有跟着乱动。\n\n可以结束时，你应当能够指出眼睑、虹膜、瞳孔和眼白，并解释“被遮住”与“变小”的区别。\n\n下一篇把两只眼睛放回同一张脸，检查高度、大小和视线是否协调。\n\n[上一篇：眼睛外形](03-一只眼睛的外形怎么画.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：两只眼睛怎样配成一对](05-两只眼睛怎样配成一对.md)\n"}, {"id": "lesson-05", "number": 5, "short": "两只眼睛怎样配成一对", "file": "05-两只眼睛怎样配成一对.md", "html": "\u003ch1 id=\"05\">05 · 两只眼睛怎样配成一对\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只练一件事：让同一张正面脸上的两只眼睛，在高度、大小和视线方面协调。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-02\">02 · 位置\u003c/a>、\u003ca href=\"#lesson-03\">03 · 眼形\u003c/a>、\u003ca href=\"#lesson-04\">04 · 虹膜与瞳孔\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 为什么单眼画好了，放成一对还会不协调？\u003c/h2>\n\u003cp>当你长时间放大左眼，只关注细节，切到右眼时很容易换一套宽度、开口高度或虹膜大小。两只单独看都成立，放回脸里却不属于同一套安排。\u003c/p>\n\u003cp>这次我们把画面缩回能同时看见双眼的大小。\u003cstrong>先比较两只眼睛之间的关系，再修改其中一只。\u003c/strong>\u003c/p>\n\u003cp>本篇限定在正面、平视、平静神态。转头时两眼会有透视差异，眨眼时开合也可以不同；这些情况后面再练。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：每一列只检查一种关系\u003c/h2>\n\u003cp>\u003cimg alt=\"双眼高度、大小和视线的比较与调整示意\" src=\"assets/lesson-05-eye-pair.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>上下对应\u003c/th>\n\u003cth>当前检查什么\u003c/th>\n\u003cth>先看哪里\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01 与 04\u003c/td>\n\u003ctd>双眼的高度关系\u003c/td>\n\u003ctd>上下边界与水平辅助线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02 与 05\u003c/td>\n\u003ctd>双眼的尺寸关系\u003c/td>\n\u003ctd>包住眼睛的简化边界框\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03 与 06\u003c/td>\n\u003ctd>虹膜、瞳孔的位置关系\u003c/td>\n\u003ctd>两眼内侧和外侧的眼白分布\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>图中鼻子、眉毛和嘴只提供整脸语境，尚未学到可以先忽略。红色标记用于突出瞳孔位置与比较方向，不是实际视线光路。生成图存在微小变化，自己练习时固定底稿，再做指定调整。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：同时画两只眼睛的大形\u003c/h2>\n\u003cp>保留第 02 篇的中线和眼部参考线。在两个占位区域里，先都画上眼睑，再都画下眼睑。\u003c/p>\n\u003cp>这种交替进行的方法方便你及时比较。你可以先画一只，再立即画另一只，但不要等第一只已经画满高光和睫毛才开始第二只。\u003c/p>\n\u003cp>比较四个眼角的位置，以及两边眼睛离脸侧的空隙。如果一边明显挤到轮廓上，先回到位置关系，而不是继续细化。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：查高度，先选同一种位置来比较\u003c/h2>\n\u003cp>你可以用上眼睑最高处比较，也可以用两只眼睛开口的中间高度比较。关键是不要拿左眼的眼角去对右眼的最高处。\u003c/p>\n\u003cp>临时画一条横线，穿过你选的比较位置，看另一只眼睛的对应位置偏上还是偏下。\u003c/p>\n\u003cp>如果整只眼睛都高了，可以选中眼睑、虹膜与瞳孔一起移动；如果只有上眼睑过高，则改上边界就够了。\u003c/p>\n\u003cp>\u003cstrong>先判断是“整只眼移位”，还是“开口形状变了”。\u003c/strong> 两种问题的改法不同。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：查大小，用一个想象中的外框\u003c/h2>\n\u003cp>给两只眼睛各套一个简单矩形：左到右包住内外眼角，上到下包住眼部开口。图 02、05 的蓝框就是为了说明这个比较方法。\u003c/p>\n\u003cp>先比宽，再比高。前者主要影响占据脸部的空间，后者影响开口程度。\u003c/p>\n\u003cp>如果右眼整体比左眼大，可以缩小右眼或重画到相近范围；如果只是右眼更睁开，就单独调整眼睑。\u003c/p>\n\u003cp>不要求每个像素镜像相同。我们的目标是让你能控制差异，而不是无意中画出两套大小。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：查视线，观察虹膜周围的空隙\u003c/h2>\n\u003cp>把两只虹膜和瞳孔先安排在比较自然的正视状态。分别观察每只虹膜靠鼻子一侧和靠脸侧一侧剩多少眼白，再把两只一起看。\u003c/p>\n\u003cp>如果把两只虹膜都挤向鼻子，容易读成向内集中；如果一只靠上、一只靠下，也可能让视线不协调。需要结合眼形、头部角度和想看的目标判断，不能只用“瞳孔必须在开口正中”来套所有情况。\u003c/p>\n\u003cp>本次只做平静的正面练习。有疑问时对照一张清楚的正面参考，先模仿它的大致眼白分布。\u003c/p>\n\u003cp>移动虹膜时，瞳孔作为虹膜的一部分跟着移动。不要只把深色瞳孔单独拖到虹膜边缘；同时继续清理超出眼睑的部分。\u003c/p>\n\u003ch2 id=\"7\">7. 可以复制和翻转吗？\u003c/h2>\n\u003cp>可以。复制一只眼睛并水平翻转，是数字绘画里方便的起点。它能帮助你先检查位置，也适合把精力放在这一课的配对关系上。\u003c/p>\n\u003cp>复制后仍要看整体：内外眼角方向是否正确，眼距是否合适？如果复制内容里有高光，镜像后高光方向也会反过来，可以先隐藏高光再检查。\u003c/p>\n\u003cp>练习手画双眼时，也可以把镜像版本作为比较参考，再自己画一遍。工具辅助和手绘练习可以并用。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先分辨\u003c/th>\n\u003cth>修改顺序\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>一只明显更高\u003c/td>\n\u003ctd>是整体移动，还是上眼睑更高\u003c/td>\n\u003ctd>先改位置，再看开口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一边总显得更大\u003c/td>\n\u003ctd>眼宽、开口高度、虹膜直径哪一项不同\u003c/td>\n\u003ctd>一次只改其中一项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像在看两个方向\u003c/td>\n\u003ctd>虹膜与瞳孔是否各自乱移\u003c/td>\n\u003ctd>用同一参考检查视线关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改完眼睛，眉毛显得奇怪\u003c/td>\n\u003ctd>眉毛仍留在修改前的位置\u003c/td>\n\u003ctd>先稳定双眼，下一篇再安排眉毛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>画面越修越乱\u003c/td>\n\u003ctd>是否同时改了所有部件\u003c/td>\n\u003ctd>回到副本，只处理最明显的问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 画一对不带高光的眼睛，画出临时高度线，检查位置和大小。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 复制一版，故意把右眼往上移一点。再把它修回去，体验“找出问题—指定改法”的过程。\u003c/p>\n\u003cp>\u003cstrong>C，五到十分钟：\u003c/strong> 另存一版，只改变一只眼睛的开口高度；判断这次应该移动整眼，还是只改眼睑。\u003c/p>\n\u003cp>可以结束时，你应当能分开检查高度、大小、视线，并能说出自己修改的是哪一种。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-04\">上一篇：虹膜和瞳孔\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-06\">下一篇：眉毛\u003c/a>\u003c/p>", "text": "# 05 · 两只眼睛怎样配成一对\n\n> 今天只练一件事：让同一张正面脸上的两只眼睛，在高度、大小和视线方面协调。\n>\n> 前置：[02 · 位置](02-眼睛在脸上的什么位置.md)、[03 · 眼形](03-一只眼睛的外形怎么画.md)、[04 · 虹膜与瞳孔](04-虹膜和瞳孔放在哪里.md)。\n\n## 1. 为什么单眼画好了，放成一对还会不协调？\n\n当你长时间放大左眼，只关注细节，切到右眼时很容易换一套宽度、开口高度或虹膜大小。两只单独看都成立，放回脸里却不属于同一套安排。\n\n这次我们把画面缩回能同时看见双眼的大小。**先比较两只眼睛之间的关系，再修改其中一只。**\n\n本篇限定在正面、平视、平静神态。转头时两眼会有透视差异，眨眼时开合也可以不同；这些情况后面再练。\n\n## 2. 看图：每一列只检查一种关系\n\n![双眼高度、大小和视线的比较与调整示意](assets/lesson-05-eye-pair.png)\n\n| 上下对应 | 当前检查什么 | 先看哪里 |\n| --- | --- | --- |\n| 01 与 04 | 双眼的高度关系 | 上下边界与水平辅助线 |\n| 02 与 05 | 双眼的尺寸关系 | 包住眼睛的简化边界框 |\n| 03 与 06 | 虹膜、瞳孔的位置关系 | 两眼内侧和外侧的眼白分布 |\n\n图中鼻子、眉毛和嘴只提供整脸语境，尚未学到可以先忽略。红色标记用于突出瞳孔位置与比较方向，不是实际视线光路。生成图存在微小变化，自己练习时固定底稿，再做指定调整。\n\n## 3. 第一步：同时画两只眼睛的大形\n\n保留第 02 篇的中线和眼部参考线。在两个占位区域里，先都画上眼睑，再都画下眼睑。\n\n这种交替进行的方法方便你及时比较。你可以先画一只，再立即画另一只，但不要等第一只已经画满高光和睫毛才开始第二只。\n\n比较四个眼角的位置，以及两边眼睛离脸侧的空隙。如果一边明显挤到轮廓上，先回到位置关系，而不是继续细化。\n\n## 4. 第二步：查高度，先选同一种位置来比较\n\n你可以用上眼睑最高处比较，也可以用两只眼睛开口的中间高度比较。关键是不要拿左眼的眼角去对右眼的最高处。\n\n临时画一条横线，穿过你选的比较位置，看另一只眼睛的对应位置偏上还是偏下。\n\n如果整只眼睛都高了，可以选中眼睑、虹膜与瞳孔一起移动；如果只有上眼睑过高，则改上边界就够了。\n\n**先判断是“整只眼移位”，还是“开口形状变了”。** 两种问题的改法不同。\n\n## 5. 第三步：查大小，用一个想象中的外框\n\n给两只眼睛各套一个简单矩形：左到右包住内外眼角，上到下包住眼部开口。图 02、05 的蓝框就是为了说明这个比较方法。\n\n先比宽，再比高。前者主要影响占据脸部的空间，后者影响开口程度。\n\n如果右眼整体比左眼大，可以缩小右眼或重画到相近范围；如果只是右眼更睁开，就单独调整眼睑。\n\n不要求每个像素镜像相同。我们的目标是让你能控制差异，而不是无意中画出两套大小。\n\n## 6. 第四步：查视线，观察虹膜周围的空隙\n\n把两只虹膜和瞳孔先安排在比较自然的正视状态。分别观察每只虹膜靠鼻子一侧和靠脸侧一侧剩多少眼白，再把两只一起看。\n\n如果把两只虹膜都挤向鼻子，容易读成向内集中；如果一只靠上、一只靠下，也可能让视线不协调。需要结合眼形、头部角度和想看的目标判断，不能只用“瞳孔必须在开口正中”来套所有情况。\n\n本次只做平静的正面练习。有疑问时对照一张清楚的正面参考，先模仿它的大致眼白分布。\n\n移动虹膜时，瞳孔作为虹膜的一部分跟着移动。不要只把深色瞳孔单独拖到虹膜边缘；同时继续清理超出眼睑的部分。\n\n## 7. 可以复制和翻转吗？\n\n可以。复制一只眼睛并水平翻转，是数字绘画里方便的起点。它能帮助你先检查位置，也适合把精力放在这一课的配对关系上。\n\n复制后仍要看整体：内外眼角方向是否正确，眼距是否合适？如果复制内容里有高光，镜像后高光方向也会反过来，可以先隐藏高光再检查。\n\n练习手画双眼时，也可以把镜像版本作为比较参考，再自己画一遍。工具辅助和手绘练习可以并用。\n\n## 8. 常见问题\n\n| 现象 | 先分辨 | 修改顺序 |\n| --- | --- | --- |\n| 一只明显更高 | 是整体移动，还是上眼睑更高 | 先改位置，再看开口 |\n| 一边总显得更大 | 眼宽、开口高度、虹膜直径哪一项不同 | 一次只改其中一项 |\n| 像在看两个方向 | 虹膜与瞳孔是否各自乱移 | 用同一参考检查视线关系 |\n| 改完眼睛，眉毛显得奇怪 | 眉毛仍留在修改前的位置 | 先稳定双眼，下一篇再安排眉毛 |\n| 画面越修越乱 | 是否同时改了所有部件 | 回到副本，只处理最明显的问题 |\n\n## 9. 三次小练习\n\n**A，十分钟：** 画一对不带高光的眼睛，画出临时高度线，检查位置和大小。\n\n**B，五分钟：** 复制一版，故意把右眼往上移一点。再把它修回去，体验“找出问题—指定改法”的过程。\n\n**C，五到十分钟：** 另存一版，只改变一只眼睛的开口高度；判断这次应该移动整眼，还是只改眼睑。\n\n可以结束时，你应当能分开检查高度、大小、视线，并能说出自己修改的是哪一种。\n\n[上一篇：虹膜和瞳孔](04-虹膜和瞳孔放在哪里.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：眉毛](06-眉毛怎样放在眼睛上方.md)\n"}, {"id": "lesson-06", "number": 6, "short": "眉毛怎样放在眼睛上方", "file": "06-眉毛怎样放在眼睛上方.md", "html": "\u003ch1 id=\"06\">06 · 眉毛怎样放在眼睛上方\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只练眉毛的位置和方向，观察它怎样改变同一张脸的神态。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-05\">05 · 双眼配对\u003c/a>。准备同一双眼睛，其他部件先保持不动。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 眉毛先当成一条有方向的短带\u003c/h2>\n\u003cp>靠近鼻子的一端叫眉头，远离鼻子的一端叫眉尾。初学先用一条线或一条窄色带表达，不用逐根画眉毛。\u003c/p>\n\u003cp>它有几个容易调整的条件：整体高度、倾斜方向、弯曲程度和长度。\u003cstrong>今天先固定长度与粗细，主要比较高度和倾斜。\u003c/strong>\u003c/p>\n\u003cp>眉毛不是上眼睑，也不是贴着上眼睑的那条眼皮褶皱。它位于更上方，和眼睛之间留有空间。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：眼睛不变，眉毛怎样影响感觉？\u003c/h2>\n\u003cp>\u003cimg alt=\"相同眼睛搭配平缓、抬高、眉头压低三种眉毛\" src=\"assets/lesson-06-eyebrows.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>眉毛变化\u003c/th>\n\u003cth>观察方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>较平缓的基准眉形\u003c/td>\n\u003ctd>先记住眉毛与上眼睑之间的距离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>整体向上抬起\u003c/td>\n\u003ctd>比较额头区域和眉眼空隙的变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>靠鼻子的一端降低，外侧相对抬起\u003c/td>\n\u003ctd>比较眉毛斜向带来的紧张、专注或不满感\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>珊瑚红用于强调眉毛，不表示最终必须用这个颜色。图中的眼睛已有细节，你自己可以用简单版。配图用于比较趋势，不作为严格不变的逐像素模板。\u003c/p>\n\u003cp>情绪还受眼睑、嘴部、姿势和场景影响，不能把一种眉形永远对应成一个固定情绪。这里先练“位置改变了，感觉也会变化”。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：在眼睛上方找一块空间\u003c/h2>\n\u003cp>新建“眉毛”图层。在一只眼睛上方，轻轻画一条短线，暂时让它大致顺着眼睛走向，保持放松、轻微的弧度。\u003c/p>\n\u003cp>别急着把线加粗。缩小看它离上眼睑是否近到快黏在一起，或者高到像漂在额头中央。\u003c/p>\n\u003cp>如果拿不准，先参考你喜欢的角色正面画面，比较的是“眉眼之间的空隙”和“眼睛自身的高度”，而不是只记住像素距离。\u003c/p>\n\u003cp>头型大小变了，像素距离也会变；部件之间的相对关系更值得观察。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：放上另一侧眉毛\u003c/h2>\n\u003cp>在另一只眼睛上方画出对应眉形。先比较左右眉头的高度，再比较眉尾的方向。\u003c/p>\n\u003cp>这次做平静、正面的基准练习，两边先安排得相近。以后可以抬一边眉毛表达疑惑，但今天先把有意变化和无意画歪区分开。\u003c/p>\n\u003cp>如果你发现眼睛本身一边高一边低，回到上一课处理，不要靠把眉毛也画歪来补偿。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：只抬高，不改变眉形\u003c/h2>\n\u003cp>复制基准版本，把两侧眉毛作为整体向上移一点。长度、粗细和弯曲程度先不变。\u003c/p>\n\u003cp>轮流显示修改前后。你会更清楚地看见，变化来自眉眼空隙，而不是眼睛突然变大。\u003c/p>\n\u003cp>移动幅度先小一些。如果一下抬得很高，只能看到强烈差别，却不容易学会控制轻微神态。\u003c/p>\n\u003cp>可以写一句：“眉毛抬高后，我觉得这张脸更像______。”允许不同人有不同判断，但尽量说清楚观察到的变化。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：只改变倾斜方向\u003c/h2>\n\u003cp>回到基准版本。保持眉毛在原来的大致区域，把靠鼻子的眉头向下压一点，让眉尾相对更高。\u003c/p>\n\u003cp>两侧都做同一种相对变化：左边眉头靠中间，右边眉头也靠中间。不要把两条眉毛朝同一个画面方向旋转，否则会变成另一种不对称神态。\u003c/p>\n\u003cp>再试着把眉头稍微抬起、眉尾相对降低，感受变化。这个额外版本可以帮助理解方向，但不必今天画满各种表情。\u003c/p>\n\u003ch2 id=\"7\">7. 什么时候开始画眉毛的粗细？\u003c/h2>\n\u003cp>位置和方向确定后，可以让短带一端稍厚、另一端渐细。先观察你选的画风，不必统一规定哪一段必须多厚。\u003c/p>\n\u003cp>线条过重会抢走注意力。如果想保留轻柔的角色感觉，可以先用较细、较浅的眉形比较。颜色和浓淡同样属于表达选择，不是技术分数。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>可能原因\u003c/th>\n\u003cth>可以怎么做\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像多画了一条上眼线\u003c/td>\n\u003ctd>眉毛太贴近眼睑，或混淆了褶皱\u003c/td>\n\u003ctd>把眉毛单独上移，重新看空隙\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总像在生气\u003c/td>\n\u003ctd>眉头无意中压得很低，斜度较大\u003c/td>\n\u003ctd>先恢复平缓眉形，再逐步加倾斜\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>左右神态不一致\u003c/td>\n\u003ctd>对眉头、眉尾的方向理解反了\u003c/td>\n\u003ctd>先标鼻子侧，再比较两端\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>抬眉后像换了角色\u003c/td>\n\u003ctd>同时改了眼睛、眉宽和嘴\u003c/td>\n\u003ctd>回到同一底稿，只移动眉毛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一条眉毛画很久\u003c/td>\n\u003ctd>太早进入单根毛发细节\u003c/td>\n\u003ctd>暂时改成短线或窄色带\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三个小练习与检查\u003c/h2>\n\u003cp>\u003cstrong>A：\u003c/strong> 用五到八分钟，在已有眼睛上方画一对平缓眉毛。\u003c/p>\n\u003cp>\u003cstrong>B：\u003c/strong> 复制一版，只抬高两侧眉毛。保持其他部件不动。\u003c/p>\n\u003cp>\u003cstrong>C：\u003c/strong> 回到基准版，只压低眉头，比较倾斜前后。用五分钟写下两个版本分别带来的感觉。\u003c/p>\n\u003cp>完成时检查：我分得清眉头和眉尾吗？我能单独改高度吗？我能单独改斜度吗？如果能，就保存基准版，后面做表情时继续使用。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-05\">上一篇：双眼配对\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-07\">下一篇：鼻子定位\u003c/a>\u003c/p>", "text": "# 06 · 眉毛怎样放在眼睛上方\n\n> 今天只练眉毛的位置和方向，观察它怎样改变同一张脸的神态。\n>\n> 前置：[05 · 双眼配对](05-两只眼睛怎样配成一对.md)。准备同一双眼睛，其他部件先保持不动。\n\n## 1. 眉毛先当成一条有方向的短带\n\n靠近鼻子的一端叫眉头，远离鼻子的一端叫眉尾。初学先用一条线或一条窄色带表达，不用逐根画眉毛。\n\n它有几个容易调整的条件：整体高度、倾斜方向、弯曲程度和长度。**今天先固定长度与粗细，主要比较高度和倾斜。**\n\n眉毛不是上眼睑，也不是贴着上眼睑的那条眼皮褶皱。它位于更上方，和眼睛之间留有空间。\n\n## 2. 看图：眼睛不变，眉毛怎样影响感觉？\n\n![相同眼睛搭配平缓、抬高、眉头压低三种眉毛](assets/lesson-06-eyebrows.png)\n\n| 编号 | 眉毛变化 | 观察方式 |\n| --- | --- | --- |\n| 01 | 较平缓的基准眉形 | 先记住眉毛与上眼睑之间的距离 |\n| 02 | 整体向上抬起 | 比较额头区域和眉眼空隙的变化 |\n| 03 | 靠鼻子的一端降低，外侧相对抬起 | 比较眉毛斜向带来的紧张、专注或不满感 |\n\n珊瑚红用于强调眉毛，不表示最终必须用这个颜色。图中的眼睛已有细节，你自己可以用简单版。配图用于比较趋势，不作为严格不变的逐像素模板。\n\n情绪还受眼睑、嘴部、姿势和场景影响，不能把一种眉形永远对应成一个固定情绪。这里先练“位置改变了，感觉也会变化”。\n\n## 3. 第一步：在眼睛上方找一块空间\n\n新建“眉毛”图层。在一只眼睛上方，轻轻画一条短线，暂时让它大致顺着眼睛走向，保持放松、轻微的弧度。\n\n别急着把线加粗。缩小看它离上眼睑是否近到快黏在一起，或者高到像漂在额头中央。\n\n如果拿不准，先参考你喜欢的角色正面画面，比较的是“眉眼之间的空隙”和“眼睛自身的高度”，而不是只记住像素距离。\n\n头型大小变了，像素距离也会变；部件之间的相对关系更值得观察。\n\n## 4. 第二步：放上另一侧眉毛\n\n在另一只眼睛上方画出对应眉形。先比较左右眉头的高度，再比较眉尾的方向。\n\n这次做平静、正面的基准练习，两边先安排得相近。以后可以抬一边眉毛表达疑惑，但今天先把有意变化和无意画歪区分开。\n\n如果你发现眼睛本身一边高一边低，回到上一课处理，不要靠把眉毛也画歪来补偿。\n\n## 5. 第三步：只抬高，不改变眉形\n\n复制基准版本，把两侧眉毛作为整体向上移一点。长度、粗细和弯曲程度先不变。\n\n轮流显示修改前后。你会更清楚地看见，变化来自眉眼空隙，而不是眼睛突然变大。\n\n移动幅度先小一些。如果一下抬得很高，只能看到强烈差别，却不容易学会控制轻微神态。\n\n可以写一句：“眉毛抬高后，我觉得这张脸更像______。”允许不同人有不同判断，但尽量说清楚观察到的变化。\n\n## 6. 第四步：只改变倾斜方向\n\n回到基准版本。保持眉毛在原来的大致区域，把靠鼻子的眉头向下压一点，让眉尾相对更高。\n\n两侧都做同一种相对变化：左边眉头靠中间，右边眉头也靠中间。不要把两条眉毛朝同一个画面方向旋转，否则会变成另一种不对称神态。\n\n再试着把眉头稍微抬起、眉尾相对降低，感受变化。这个额外版本可以帮助理解方向，但不必今天画满各种表情。\n\n## 7. 什么时候开始画眉毛的粗细？\n\n位置和方向确定后，可以让短带一端稍厚、另一端渐细。先观察你选的画风，不必统一规定哪一段必须多厚。\n\n线条过重会抢走注意力。如果想保留轻柔的角色感觉，可以先用较细、较浅的眉形比较。颜色和浓淡同样属于表达选择，不是技术分数。\n\n## 8. 常见问题\n\n| 现象 | 可能原因 | 可以怎么做 |\n| --- | --- | --- |\n| 像多画了一条上眼线 | 眉毛太贴近眼睑，或混淆了褶皱 | 把眉毛单独上移，重新看空隙 |\n| 总像在生气 | 眉头无意中压得很低，斜度较大 | 先恢复平缓眉形，再逐步加倾斜 |\n| 左右神态不一致 | 对眉头、眉尾的方向理解反了 | 先标鼻子侧，再比较两端 |\n| 抬眉后像换了角色 | 同时改了眼睛、眉宽和嘴 | 回到同一底稿，只移动眉毛 |\n| 一条眉毛画很久 | 太早进入单根毛发细节 | 暂时改成短线或窄色带 |\n\n## 9. 三个小练习与检查\n\n**A：** 用五到八分钟，在已有眼睛上方画一对平缓眉毛。\n\n**B：** 复制一版，只抬高两侧眉毛。保持其他部件不动。\n\n**C：** 回到基准版，只压低眉头，比较倾斜前后。用五分钟写下两个版本分别带来的感觉。\n\n完成时检查：我分得清眉头和眉尾吗？我能单独改高度吗？我能单独改斜度吗？如果能，就保存基准版，后面做表情时继续使用。\n\n[上一篇：双眼配对](05-两只眼睛怎样配成一对.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：鼻子定位](07-简化的鼻子怎样定位.md)\n"}, {"id": "lesson-07", "number": 7, "short": "简化的鼻子怎样定位", "file": "07-简化的鼻子怎样定位.md", "html": "\u003ch1 id=\"07\">07 · 简化的鼻子怎样定位\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只解决正面脸上鼻子的基本位置，并用一个很小的标记表达它。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-06\">06 · 眉毛\u003c/a>。不要求先学会写实鼻子，也暂时不画侧脸。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 为什么二次元鼻子只有一点或一小笔？\u003c/h2>\n\u003cp>绘画可以省略细节，用少量线条或明暗提示体积。在某些二次元画风里，正面鼻子会被简化得很小，让注意力集中在眼睛和表情上。\u003c/p>\n\u003cp>省略不意味着可以随便放。即使只有一小笔，它仍然和中线、眼睛、嘴、下巴保持关系。\u003c/p>\n\u003cp>今天先做一个定位点，再决定用短线还是小色块表现。你不需要把鼻子的完整结构压缩到这一篇里学完。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先定位置，再选择表达方式\u003c/h2>\n\u003cp>\u003cimg alt=\"正面简化鼻子的定位与三种表达方式\" src=\"assets/lesson-07-nose-placement.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>这一格的作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>保留中线和双眼，鼻子区域还是空白\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>在中线上标一个小定位点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>加一条简单嘴部占位，检查剩余空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>用短而略有方向的一笔表达鼻子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>用很小的明暗色块提示鼻子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>用接近点状的记号作极简表达\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>红点是定位记号，不是最后必须画在脸上的颜色。图中的嘴只是帮助观察空间，这一课画一条轻短线即可，下一篇再认真练嘴形。\u003c/p>\n\u003cp>配图为生成示意，04—06 展示可选的简化方式，不是画得越复杂越高级。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：确认中线指的是脸的朝向\u003c/h2>\n\u003cp>打开你已有的正面脸草图。让浅色中线从额头区域延伸到下巴附近。\u003c/p>\n\u003cp>今天的头没有转向，所以鼻部定位先放在中线附近。如果未来头转向一侧，中线与鼻子的关系会改变，那时不能继续套用今天这条笔直线。\u003c/p>\n\u003cp>先检查两只眼睛是不是分布在中线两侧。如果眼睛本身全偏到一边，单独把鼻子放在纸张正中并不能解决问题。\u003c/p>\n\u003cp>\u003cstrong>要对齐的是这张脸的中间，不一定是整个画布的中间。\u003c/strong>\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：在眼睛下方选一个试放的位置\u003c/h2>\n\u003cp>观察眼部区域下方到下巴的空间。在这段空间里轻放一个点，给它下方的嘴和下巴留出余地。\u003c/p>\n\u003cp>没有参考时，可以先把点试放在“眼部下方至下巴这段距离”的中间附近，再准备嘴部占位后微调。它只是试画起点，不是人体比例公式。\u003c/p>\n\u003cp>如果使用洛琪希的参考，就比较眼睛下缘到鼻子标记有多远、鼻子到嘴有多远、嘴到下巴还剩多少。先观察三段关系，再决定定位。\u003c/p>\n\u003cp>这一步只画一个轻点，方便移动。不要刚放下就描成很黑的一块。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：加嘴部占位，检查空间分配\u003c/h2>\n\u003cp>在鼻子点下面画一条很短的横线，作为嘴的大致位置。\u003c/p>\n\u003cp>现在从上往下看：眼睛、鼻子、嘴、下巴。问自己：鼻子是不是快贴到嘴？嘴下面有没有留出下巴区域？鼻子是否离眼睛特别近，让中间挤成一团？\u003c/p>\n\u003cp>如果不合适，移动鼻子点或嘴的占位，先一次只改一个。别把头部轮廓、眼睛和鼻子同时大改，容易失去比较依据。\u003c/p>\n\u003cp>\u003cstrong>这一步的目的，是在很轻的草稿阶段发现空间问题。\u003c/strong>\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：把定位点换成小标记\u003c/h2>\n\u003cp>你可以从三种方式里任选一种开始：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>短线：\u003c/strong> 在定位点附近画一小段略带方向的线，长度保持克制。\u003c/li>\n\u003cli>\u003cstrong>小色块：\u003c/strong> 用一小块较浅的灰色或之后的肤色阴影，提示鼻尖附近的明暗。\u003c/li>\n\u003cli>\u003cstrong>点状概括：\u003c/strong> 用很小的记号提示鼻子存在，适合高度简化的练习。\u003c/li>\n\u003c/ul>\n\u003cp>选择表达方式时，位置先保持不变。这样你就能比较风格差异，而不是又开始改变整张脸的比例。\u003c/p>\n\u003cp>表示鼻部阴影的笔触，可以略偏到定位中心的一侧，因为它在提示一个局部面；这和把整个鼻部位置画歪是两回事。今天可以先照示意轻画，光照方向以后再展开。\u003c/p>\n\u003ch2 id=\"7\">7. 为什么不从两眼之间画一条长线下来？\u003c/h2>\n\u003cp>当然有画风会清楚画出鼻梁，但如果你想要的是这次示例中的简化正面脸，一条长而黑的鼻梁线可能会改变画面的细节密度和风格。\u003c/p>\n\u003cp>初次练习可以先省略鼻梁，缩小画面看小标记是否已经足够。想增加线条时，先问自己：这一笔是在说明哪个边界或哪个面？\u003c/p>\n\u003cp>之后学侧转，鼻子的突出与遮挡会变得更重要，我们会用另外一篇处理。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎样试改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>鼻子很抢眼\u003c/td>\n\u003ctd>是否太大、太黑或鼻梁线太长\u003c/td>\n\u003ctd>先减小标记、减轻颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>鼻子像偏到脸边\u003c/td>\n\u003ctd>定位点是否偏离脸的中线\u003c/td>\n\u003ctd>打开辅助线，先移动定位点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>鼻嘴挤在一起\u003c/td>\n\u003ctd>两个标记之间是否几乎没空隙\u003c/td>\n\u003ctd>小幅调整一者，比较三段距离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下半脸显得特别长\u003c/td>\n\u003ctd>是鼻嘴位置靠上，还是下巴太长\u003c/td>\n\u003ctd>分开检查位置与头型，不急着一起改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>换成阴影块后像脏点\u003c/td>\n\u003ctd>色块是否太大或边界过重\u003c/td>\n\u003ctd>先用更小、更轻的形状尝试\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三个小练习\u003c/h2>\n\u003cp>\u003cstrong>A，八分钟：\u003c/strong> 在已有脸上找到中线，放鼻子点，加一条嘴部占位，检查空间关系。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 复制一版，只把鼻子略向上或向下移动，比较它与眼睛、嘴的距离变化。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 恢复你选中的位置，做短线和小色块两个版本。只改表达方式，不改位置。\u003c/p>\n\u003cp>结束前，你应当能指出鼻部定位点，解释为什么它放在那里，并区分“移动鼻子”与“改变鼻子的画法”。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-06\">上一篇：眉毛\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-08\">下一篇：闭合的小嘴\u003c/a>\u003c/p>", "text": "# 07 · 简化的鼻子怎样定位\n\n> 今天只解决正面脸上鼻子的基本位置，并用一个很小的标记表达它。\n>\n> 前置：[06 · 眉毛](06-眉毛怎样放在眼睛上方.md)。不要求先学会写实鼻子，也暂时不画侧脸。\n\n## 1. 为什么二次元鼻子只有一点或一小笔？\n\n绘画可以省略细节，用少量线条或明暗提示体积。在某些二次元画风里，正面鼻子会被简化得很小，让注意力集中在眼睛和表情上。\n\n省略不意味着可以随便放。即使只有一小笔，它仍然和中线、眼睛、嘴、下巴保持关系。\n\n今天先做一个定位点，再决定用短线还是小色块表现。你不需要把鼻子的完整结构压缩到这一篇里学完。\n\n## 2. 看图：先定位置，再选择表达方式\n\n![正面简化鼻子的定位与三种表达方式](assets/lesson-07-nose-placement.png)\n\n| 编号 | 这一格的作用 |\n| --- | --- |\n| 01 | 保留中线和双眼，鼻子区域还是空白 |\n| 02 | 在中线上标一个小定位点 |\n| 03 | 加一条简单嘴部占位，检查剩余空间 |\n| 04 | 用短而略有方向的一笔表达鼻子 |\n| 05 | 用很小的明暗色块提示鼻子 |\n| 06 | 用接近点状的记号作极简表达 |\n\n红点是定位记号，不是最后必须画在脸上的颜色。图中的嘴只是帮助观察空间，这一课画一条轻短线即可，下一篇再认真练嘴形。\n\n配图为生成示意，04—06 展示可选的简化方式，不是画得越复杂越高级。\n\n## 3. 第一步：确认中线指的是脸的朝向\n\n打开你已有的正面脸草图。让浅色中线从额头区域延伸到下巴附近。\n\n今天的头没有转向，所以鼻部定位先放在中线附近。如果未来头转向一侧，中线与鼻子的关系会改变，那时不能继续套用今天这条笔直线。\n\n先检查两只眼睛是不是分布在中线两侧。如果眼睛本身全偏到一边，单独把鼻子放在纸张正中并不能解决问题。\n\n**要对齐的是这张脸的中间，不一定是整个画布的中间。**\n\n## 4. 第二步：在眼睛下方选一个试放的位置\n\n观察眼部区域下方到下巴的空间。在这段空间里轻放一个点，给它下方的嘴和下巴留出余地。\n\n没有参考时，可以先把点试放在“眼部下方至下巴这段距离”的中间附近，再准备嘴部占位后微调。它只是试画起点，不是人体比例公式。\n\n如果使用洛琪希的参考，就比较眼睛下缘到鼻子标记有多远、鼻子到嘴有多远、嘴到下巴还剩多少。先观察三段关系，再决定定位。\n\n这一步只画一个轻点，方便移动。不要刚放下就描成很黑的一块。\n\n## 5. 第三步：加嘴部占位，检查空间分配\n\n在鼻子点下面画一条很短的横线，作为嘴的大致位置。\n\n现在从上往下看：眼睛、鼻子、嘴、下巴。问自己：鼻子是不是快贴到嘴？嘴下面有没有留出下巴区域？鼻子是否离眼睛特别近，让中间挤成一团？\n\n如果不合适，移动鼻子点或嘴的占位，先一次只改一个。别把头部轮廓、眼睛和鼻子同时大改，容易失去比较依据。\n\n**这一步的目的，是在很轻的草稿阶段发现空间问题。**\n\n## 6. 第四步：把定位点换成小标记\n\n你可以从三种方式里任选一种开始：\n\n- **短线：** 在定位点附近画一小段略带方向的线，长度保持克制。\n- **小色块：** 用一小块较浅的灰色或之后的肤色阴影，提示鼻尖附近的明暗。\n- **点状概括：** 用很小的记号提示鼻子存在，适合高度简化的练习。\n\n选择表达方式时，位置先保持不变。这样你就能比较风格差异，而不是又开始改变整张脸的比例。\n\n表示鼻部阴影的笔触，可以略偏到定位中心的一侧，因为它在提示一个局部面；这和把整个鼻部位置画歪是两回事。今天可以先照示意轻画，光照方向以后再展开。\n\n## 7. 为什么不从两眼之间画一条长线下来？\n\n当然有画风会清楚画出鼻梁，但如果你想要的是这次示例中的简化正面脸，一条长而黑的鼻梁线可能会改变画面的细节密度和风格。\n\n初次练习可以先省略鼻梁，缩小画面看小标记是否已经足够。想增加线条时，先问自己：这一笔是在说明哪个边界或哪个面？\n\n之后学侧转，鼻子的突出与遮挡会变得更重要，我们会用另外一篇处理。\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 可以怎样试改 |\n| --- | --- | --- |\n| 鼻子很抢眼 | 是否太大、太黑或鼻梁线太长 | 先减小标记、减轻颜色 |\n| 鼻子像偏到脸边 | 定位点是否偏离脸的中线 | 打开辅助线，先移动定位点 |\n| 鼻嘴挤在一起 | 两个标记之间是否几乎没空隙 | 小幅调整一者，比较三段距离 |\n| 下半脸显得特别长 | 是鼻嘴位置靠上，还是下巴太长 | 分开检查位置与头型，不急着一起改 |\n| 换成阴影块后像脏点 | 色块是否太大或边界过重 | 先用更小、更轻的形状尝试 |\n\n## 9. 三个小练习\n\n**A，八分钟：** 在已有脸上找到中线，放鼻子点，加一条嘴部占位，检查空间关系。\n\n**B，五分钟：** 复制一版，只把鼻子略向上或向下移动，比较它与眼睛、嘴的距离变化。\n\n**C，五分钟：** 恢复你选中的位置，做短线和小色块两个版本。只改表达方式，不改位置。\n\n结束前，你应当能指出鼻部定位点，解释为什么它放在那里，并区分“移动鼻子”与“改变鼻子的画法”。\n\n[上一篇：眉毛](06-眉毛怎样放在眼睛上方.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：闭合的小嘴](08-闭合的小嘴怎么画.md)\n"}, {"id": "lesson-08", "number": 8, "short": "闭合的小嘴怎么画", "file": "08-闭合的小嘴怎么画.md", "html": "\u003ch1 id=\"08\">08 · 闭合的小嘴怎么画\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只用一条简洁的线，画出闭合的小嘴，并比较它的宽度与嘴角变化。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-07\">07 · 鼻子定位\u003c/a>。使用同一张正面、平视的脸。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 一条线画的是什么？\u003c/h2>\n\u003cp>在这类简化二次元画法里，小嘴上的线主要提示上下嘴唇闭合处的关系，不是要求你把嘴唇的完整外轮廓描一圈。\u003c/p>\n\u003cp>写实嘴唇还有体积和明暗，本篇先省略。\u003cstrong>我们先看嘴放在哪里、有多宽、两端怎样变化。\u003c/strong>\u003c/p>\n\u003cp>“小嘴”也不代表越小越可爱。它需要和眼睛、脸宽、角色表情放在一起判断。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先改宽度，再改弯曲\u003c/h2>\n\u003cp>\u003cimg alt=\"闭合嘴形的宽度与嘴角变化比较\" src=\"assets/lesson-08-closed-mouth.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>主要比较内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01—03\u003c/td>\n\u003ctd>大致相同位置，嘴从较窄到较宽\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>接近平缓的基准嘴形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>嘴角相对中段抬起，形成轻微笑意\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>嘴角相对中段降低，形成另一种神态\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>红点强调嘴角，蓝线是脸部中线。鼻子和下巴只是空间参照，图中的鼻部细节可以忽略。配图为生成示意，各格不是精确测量模板。\u003c/p>\n\u003cp>不要把 05 理解成整张嘴一起向上移。这里讨论的是两端与中段的相对高度变化。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：找嘴所在的位置\u003c/h2>\n\u003cp>打开上一课的草图。在鼻子下方、下巴上方找到嘴部占位线。如果之前没有画，就先放一小段轻横线。\u003c/p>\n\u003cp>比较两个空隙：鼻子到嘴，嘴到下巴。参考图中的分配通常比背一个统一比例更有用。\u003c/p>\n\u003cp>先让嘴的大致中心落在正面脸的中线附近。这次练平静正面，不刻意做偏向一边的笑容。\u003c/p>\n\u003cp>把画面缩小，看嘴是否挤到了鼻子下面，或掉到快碰下巴的位置。位置合适后，先固定下来再练形状。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：用两个点确定嘴角\u003c/h2>\n\u003cp>在占位线左右各点一个小点，表示两个嘴角。它们之间的距离，就是这次想画的嘴宽。\u003c/p>\n\u003cp>可以先取比单只眼睛宽度更小的一段作为尝试，再对照具体角色调整。这里只是为了从小范围开始，不是所有角色的标准。\u003c/p>\n\u003cp>从这两个点的中间向上看，是否大致对着鼻子和脸的中线？如果明显偏了，先移动两个点的位置。\u003c/p>\n\u003cp>用点确定两端，比一笔画完后才发现嘴太宽更容易修改。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：用一条轻线连接\u003c/h2>\n\u003cp>从一端连接到另一端，可以接近平直，也可以带很轻的弧度。不要为了“看起来像嘴”，马上加很多褶皱和嘴唇边线。\u003c/p>\n\u003cp>这条线可以分两笔画。接头处别突然变粗，嘴角也不必画成两个很大的黑点。\u003c/p>\n\u003cp>线画得太重时，小嘴会成为脸上最显眼的地方。可以用较细笔刷、稍浅颜色，或者减少重复描线。\u003c/p>\n\u003cp>\u003cstrong>检查方法：\u003c/strong> 把画面缩回整张脸大小。如果你第一眼只能看到嘴的一大块黑色，先检查线重和尺寸。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：固定位置，只比较宽度\u003c/h2>\n\u003cp>复制基准版。保持嘴中心和高度大致不变，把两个嘴角向外各移动一点，再重新连接。\u003c/p>\n\u003cp>另一版则把两端往内收。这样你得到窄、中、宽三个版本。\u003c/p>\n\u003cp>比较它们与脸宽和眼睛大小的关系。选一个更接近你希望表达的角色感觉的版本，写一句理由。\u003c/p>\n\u003cp>不要同时缩短下巴、移动鼻子，否则宽度变化的效果会被混在一起。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：固定宽度，只改变嘴角与中段的关系\u003c/h2>\n\u003cp>回到基准版。两端宽度先不动，让线的中间略低于嘴角，会得到柔和的上扬嘴角效果。\u003c/p>\n\u003cp>再试另一版，让中间略高、两端相对较低，比较不同感觉。弯曲幅度保持小一些，先练轻微差别。\u003c/p>\n\u003cp>本次没有同步修改眼睛和眉毛，所以可能出现情绪不完全一致的情况。这正是后面表情课要处理的内容。今天先学会控制嘴形本身。\u003c/p>\n\u003ch2 id=\"8\">8. 下嘴唇那条小线要不要画？\u003c/h2>\n\u003cp>有些画法会在嘴下面加一小段线或明暗提示下唇体积。它不是必须项，也不是第二张嘴。\u003c/p>\n\u003cp>第一遍可以省略。想加时，让它更短、更轻，和主嘴线保持清楚区分。如果加了之后像重复画了两张嘴，就先隐藏，回到一条线版本。\u003c/p>\n\u003ch2 id=\"9\">9. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>一次试改一项\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像一条很黑的横杠\u003c/td>\n\u003ctd>线重是否过大\u003c/td>\n\u003ctd>减细或减轻线条\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>嘴显得歪向一边\u003c/td>\n\u003ctd>两端的中点是否偏离中线\u003c/td>\n\u003ctd>整体移动，不急着重画形状\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>微笑变成很夸张的弯月\u003c/td>\n\u003ctd>弧度是否过大\u003c/td>\n\u003ctd>先减小中段与嘴角的高差\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>小嘴像贴在脸上的符号\u003c/td>\n\u003ctd>位置是否与鼻子、下巴不协调\u003c/td>\n\u003ctd>回到整体距离，检查上下空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加了唇线反而乱\u003c/td>\n\u003ctd>次要线是否与主线一样重\u003c/td>\n\u003ctd>隐藏次要线，再判断是否需要\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"10\">10. 三次小练习与结束标准\u003c/h2>\n\u003cp>\u003cstrong>A，八分钟：\u003c/strong> 在已有脸上标嘴角，画一条平缓闭嘴线。只检查位置、宽度和线重。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 复制三版，只比较窄、中、宽。\u003c/p>\n\u003cp>\u003cstrong>C，五到八分钟：\u003c/strong> 固定你选中的宽度，比较平缓、嘴角微抬、嘴角微降三个版本。\u003c/p>\n\u003cp>可以结束时，你应当能分别调整嘴的位置、宽度和弧度，而不是每次只能全部重画。保存平静版，下一课会在这个区域里画小开口。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-07\">上一篇：鼻子定位\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-09\">下一篇：张开的小嘴\u003c/a>\u003c/p>", "text": "# 08 · 闭合的小嘴怎么画\n\n> 今天只用一条简洁的线，画出闭合的小嘴，并比较它的宽度与嘴角变化。\n>\n> 前置：[07 · 鼻子定位](07-简化的鼻子怎样定位.md)。使用同一张正面、平视的脸。\n\n## 1. 一条线画的是什么？\n\n在这类简化二次元画法里，小嘴上的线主要提示上下嘴唇闭合处的关系，不是要求你把嘴唇的完整外轮廓描一圈。\n\n写实嘴唇还有体积和明暗，本篇先省略。**我们先看嘴放在哪里、有多宽、两端怎样变化。**\n\n“小嘴”也不代表越小越可爱。它需要和眼睛、脸宽、角色表情放在一起判断。\n\n## 2. 看图：先改宽度，再改弯曲\n\n![闭合嘴形的宽度与嘴角变化比较](assets/lesson-08-closed-mouth.png)\n\n| 编号 | 主要比较内容 |\n| --- | --- |\n| 01—03 | 大致相同位置，嘴从较窄到较宽 |\n| 04 | 接近平缓的基准嘴形 |\n| 05 | 嘴角相对中段抬起，形成轻微笑意 |\n| 06 | 嘴角相对中段降低，形成另一种神态 |\n\n红点强调嘴角，蓝线是脸部中线。鼻子和下巴只是空间参照，图中的鼻部细节可以忽略。配图为生成示意，各格不是精确测量模板。\n\n不要把 05 理解成整张嘴一起向上移。这里讨论的是两端与中段的相对高度变化。\n\n## 3. 第一步：找嘴所在的位置\n\n打开上一课的草图。在鼻子下方、下巴上方找到嘴部占位线。如果之前没有画，就先放一小段轻横线。\n\n比较两个空隙：鼻子到嘴，嘴到下巴。参考图中的分配通常比背一个统一比例更有用。\n\n先让嘴的大致中心落在正面脸的中线附近。这次练平静正面，不刻意做偏向一边的笑容。\n\n把画面缩小，看嘴是否挤到了鼻子下面，或掉到快碰下巴的位置。位置合适后，先固定下来再练形状。\n\n## 4. 第二步：用两个点确定嘴角\n\n在占位线左右各点一个小点，表示两个嘴角。它们之间的距离，就是这次想画的嘴宽。\n\n可以先取比单只眼睛宽度更小的一段作为尝试，再对照具体角色调整。这里只是为了从小范围开始，不是所有角色的标准。\n\n从这两个点的中间向上看，是否大致对着鼻子和脸的中线？如果明显偏了，先移动两个点的位置。\n\n用点确定两端，比一笔画完后才发现嘴太宽更容易修改。\n\n## 5. 第三步：用一条轻线连接\n\n从一端连接到另一端，可以接近平直，也可以带很轻的弧度。不要为了“看起来像嘴”，马上加很多褶皱和嘴唇边线。\n\n这条线可以分两笔画。接头处别突然变粗，嘴角也不必画成两个很大的黑点。\n\n线画得太重时，小嘴会成为脸上最显眼的地方。可以用较细笔刷、稍浅颜色，或者减少重复描线。\n\n**检查方法：** 把画面缩回整张脸大小。如果你第一眼只能看到嘴的一大块黑色，先检查线重和尺寸。\n\n## 6. 第四步：固定位置，只比较宽度\n\n复制基准版。保持嘴中心和高度大致不变，把两个嘴角向外各移动一点，再重新连接。\n\n另一版则把两端往内收。这样你得到窄、中、宽三个版本。\n\n比较它们与脸宽和眼睛大小的关系。选一个更接近你希望表达的角色感觉的版本，写一句理由。\n\n不要同时缩短下巴、移动鼻子，否则宽度变化的效果会被混在一起。\n\n## 7. 第五步：固定宽度，只改变嘴角与中段的关系\n\n回到基准版。两端宽度先不动，让线的中间略低于嘴角，会得到柔和的上扬嘴角效果。\n\n再试另一版，让中间略高、两端相对较低，比较不同感觉。弯曲幅度保持小一些，先练轻微差别。\n\n本次没有同步修改眼睛和眉毛，所以可能出现情绪不完全一致的情况。这正是后面表情课要处理的内容。今天先学会控制嘴形本身。\n\n## 8. 下嘴唇那条小线要不要画？\n\n有些画法会在嘴下面加一小段线或明暗提示下唇体积。它不是必须项，也不是第二张嘴。\n\n第一遍可以省略。想加时，让它更短、更轻，和主嘴线保持清楚区分。如果加了之后像重复画了两张嘴，就先隐藏，回到一条线版本。\n\n## 9. 常见问题\n\n| 现象 | 先检查 | 一次试改一项 |\n| --- | --- | --- |\n| 像一条很黑的横杠 | 线重是否过大 | 减细或减轻线条 |\n| 嘴显得歪向一边 | 两端的中点是否偏离中线 | 整体移动，不急着重画形状 |\n| 微笑变成很夸张的弯月 | 弧度是否过大 | 先减小中段与嘴角的高差 |\n| 小嘴像贴在脸上的符号 | 位置是否与鼻子、下巴不协调 | 回到整体距离，检查上下空间 |\n| 加了唇线反而乱 | 次要线是否与主线一样重 | 隐藏次要线，再判断是否需要 |\n\n## 10. 三次小练习与结束标准\n\n**A，八分钟：** 在已有脸上标嘴角，画一条平缓闭嘴线。只检查位置、宽度和线重。\n\n**B，五分钟：** 复制三版，只比较窄、中、宽。\n\n**C，五到八分钟：** 固定你选中的宽度，比较平缓、嘴角微抬、嘴角微降三个版本。\n\n可以结束时，你应当能分别调整嘴的位置、宽度和弧度，而不是每次只能全部重画。保存平静版，下一课会在这个区域里画小开口。\n\n[上一篇：鼻子定位](07-简化的鼻子怎样定位.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：张开的小嘴](09-张开的小嘴怎么画.md)\n"}, {"id": "lesson-09", "number": 9, "short": "张开的小嘴怎么画", "file": "09-张开的小嘴怎么画.md", "html": "\u003ch1 id=\"09\">09 · 张开的小嘴怎么画\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只练一个小开口：先画外形，再区分口腔暗部与可选细节。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-08\">08 · 闭合的小嘴\u003c/a>。先做正面、小幅度张嘴，不处理大张嘴时下颌的明显变化。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 从一条线，变成一个有面积的形状\u003c/h2>\n\u003cp>闭嘴练习主要是一条线。嘴张开后，你需要考虑开口的宽度和高度，以及里面的色块。\u003c/p>\n\u003cp>可以暂时把它理解为一个小窗口：外边界决定开口形状，深色内部提示口腔。这个比喻用于简化绘画，不意味着真实嘴部是平板上的洞。\u003c/p>\n\u003cp>先把开口画清楚，再决定要不要加舌头和牙齿。它们不是每个小嘴都必须出现的部件。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：前三格是基础过程，后三格是可选变化\u003c/h2>\n\u003cp>\u003cimg alt=\"张嘴开口、口腔暗部与可选舌头牙齿的六格示意\" src=\"assets/lesson-09-open-mouth.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>标两个嘴角，先确定宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>连出上下边界，得到一个开口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>把内部概括成深色区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>一种可选画法：在底部留出小舌面\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>另一种可选画法：在上方留出简化牙齿带\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>改成小圆口，比较另一种开口外形\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>04、05、06 不是必须依次叠加的步骤。\u003c/strong> 今天做到 03 就能完成基础练习。图为生成示意，用来观察形状和层次，颜色不必照抄。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：保留位置，再决定宽度\u003c/h2>\n\u003cp>在上一课的嘴部区域新建一层，先隐藏闭嘴线。仍然用两个点确定嘴角。\u003c/p>\n\u003cp>第一次可以沿用较小的嘴宽，重点观察高度变化。嘴如果小到看不清，可以临时放大画布，但之后要缩回整脸检查。\u003c/p>\n\u003cp>这一次只做轻微张嘴，头部轮廓暂时保持。以后表现大声说话、大笑或大幅张口时，需要进一步考虑下颌运动，不能只把小开口无限拉大。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：画上边界，再画下边界\u003c/h2>\n\u003cp>从左嘴角到右嘴角，画一条比较浅的上边界。再从一端向下绕出弧线，接到另一端，形成更深的下边界。\u003c/p>\n\u003cp>这样你会得到一个简单的开口。它可以略扁、略圆，不要求是完美半圆。\u003c/p>\n\u003cp>先看空白形状是否清楚：两边有没有接上？底部有没有歪到一侧？想画小笑口时，嘴角位置是否符合想表达的方向？\u003c/p>\n\u003cp>不要为了修一个轮廓，反复把整张嘴扩大。必要时保留副本，重新用简单形状画一遍。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：给内部铺一个深色\u003c/h2>\n\u003cp>在线稿下面新建色块层，给开口内部填一个深色。深棕、偏红的深色或适合整体画风的暗色都可以；第一次甚至可以用灰色。\u003c/p>\n\u003cp>现在外形与内部形成区别。把画面缩回整脸大小，观察它是否读得出“张嘴”。\u003c/p>\n\u003cp>如果一眼看成很重的黑斑，先检查开口大小、位置和颜色对比，不要急着添加更多细节。\u003c/p>\n\u003cp>内部深色不需要复杂渐变。先学会把边界整理干净，避免颜色漏到嘴外。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：需要时，再加一项细节\u003c/h2>\n\u003ch3 id=\"a\">选项 A：简化舌面\u003c/h3>\n\u003cp>在深色开口的下部画一个较小、较浅的色块，让它与底部关系清楚。不要画成悬在开口正中央的一颗粉色豆子。\u003c/p>\n\u003cp>这是适用于本次小口示意的概括方式。实际可见舌面会随嘴形、视角和动作变化，不要求每个表情都露出来。\u003c/p>\n\u003ch3 id=\"b\">选项 B：简化牙齿\u003c/h3>\n\u003cp>在上边界内侧留一条浅色区域，表示一小段可见牙齿。先把它当作整体的带状形，不逐颗画格子。\u003c/p>\n\u003cp>如果浅色区域太宽，几乎吃掉全部口腔暗部，就容易读成另一种咬合或露齿表情。缩窄一点，再比较。\u003c/p>\n\u003cp>\u003cstrong>第一遍选一个做即可，也可以两个都不做。\u003c/strong>\u003c/p>\n\u003ch2 id=\"7\">7. 只改开口形状，试一次小圆口\u003c/h2>\n\u003cp>保留原来的嘴部中心，把横向开口改成较小的圆形或椭圆形，再填同样的深色。\u003c/p>\n\u003cp>它可能更接近轻微惊讶或某些发音状态，但具体感觉还要结合眉眼。这里先观察形状从横向展开变成集中在中间，视觉效果发生了什么变化。\u003c/p>\n\u003cp>不要在同一次比较中把眉毛、眼睛和头型都改掉。完整表情会在之后的课里组合。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎样改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像一块黑点，不像开口\u003c/td>\n\u003ctd>外形、大小与位置是否协调\u003c/td>\n\u003ctd>先看线稿版，再减小或减轻填色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像两条不相干的线\u003c/td>\n\u003ctd>嘴角是否把上下边界连成一个形状\u003c/td>\n\u003ctd>整理两端连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>舌头像飘着\u003c/td>\n\u003ctd>舌面色块是否和下部关系不清\u003c/td>\n\u003ctd>移向底部，减小并简化形状\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>牙齿像棋盘\u003c/td>\n\u003ctd>是否过早分成许多小格\u003c/td>\n\u003ctd>改成简洁的整体浅色带\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>张得很大却下巴完全不动\u003c/td>\n\u003ctd>已超出本篇的小幅张口范围\u003c/td>\n\u003ctd>先缩回小开口，大动作以后专门练\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三个小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 从嘴角开始，画出小开口并填一块暗色。放回整张脸检查。\u003c/p>\n\u003cp>\u003cstrong>B，五分钟：\u003c/strong> 自己再画一个，不看逐步图，只记住“宽度—开口—暗部”的顺序。\u003c/p>\n\u003cp>\u003cstrong>C，五到十分钟：\u003c/strong> 复制一版，在“加小舌面”“加牙齿带”“改圆口”中只选一种变化。\u003c/p>\n\u003cp>能解释外形和内部色块的分工，能区分基础步骤与可选细节，就可以结束。下一篇会把整个第一阶段的五官放回同一张脸，检查关系。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-08\">上一篇：闭合的小嘴\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-10\">下一篇：整张脸的检查\u003c/a>\u003c/p>", "text": "# 09 · 张开的小嘴怎么画\n\n> 今天只练一个小开口：先画外形，再区分口腔暗部与可选细节。\n>\n> 前置：[08 · 闭合的小嘴](08-闭合的小嘴怎么画.md)。先做正面、小幅度张嘴，不处理大张嘴时下颌的明显变化。\n\n## 1. 从一条线，变成一个有面积的形状\n\n闭嘴练习主要是一条线。嘴张开后，你需要考虑开口的宽度和高度，以及里面的色块。\n\n可以暂时把它理解为一个小窗口：外边界决定开口形状，深色内部提示口腔。这个比喻用于简化绘画，不意味着真实嘴部是平板上的洞。\n\n先把开口画清楚，再决定要不要加舌头和牙齿。它们不是每个小嘴都必须出现的部件。\n\n## 2. 看图：前三格是基础过程，后三格是可选变化\n\n![张嘴开口、口腔暗部与可选舌头牙齿的六格示意](assets/lesson-09-open-mouth.png)\n\n| 编号 | 在做什么 |\n| --- | --- |\n| 01 | 标两个嘴角，先确定宽度 |\n| 02 | 连出上下边界，得到一个开口 |\n| 03 | 把内部概括成深色区域 |\n| 04 | 一种可选画法：在底部留出小舌面 |\n| 05 | 另一种可选画法：在上方留出简化牙齿带 |\n| 06 | 改成小圆口，比较另一种开口外形 |\n\n**04、05、06 不是必须依次叠加的步骤。** 今天做到 03 就能完成基础练习。图为生成示意，用来观察形状和层次，颜色不必照抄。\n\n## 3. 第一步：保留位置，再决定宽度\n\n在上一课的嘴部区域新建一层，先隐藏闭嘴线。仍然用两个点确定嘴角。\n\n第一次可以沿用较小的嘴宽，重点观察高度变化。嘴如果小到看不清，可以临时放大画布，但之后要缩回整脸检查。\n\n这一次只做轻微张嘴，头部轮廓暂时保持。以后表现大声说话、大笑或大幅张口时，需要进一步考虑下颌运动，不能只把小开口无限拉大。\n\n## 4. 第二步：画上边界，再画下边界\n\n从左嘴角到右嘴角，画一条比较浅的上边界。再从一端向下绕出弧线，接到另一端，形成更深的下边界。\n\n这样你会得到一个简单的开口。它可以略扁、略圆，不要求是完美半圆。\n\n先看空白形状是否清楚：两边有没有接上？底部有没有歪到一侧？想画小笑口时，嘴角位置是否符合想表达的方向？\n\n不要为了修一个轮廓，反复把整张嘴扩大。必要时保留副本，重新用简单形状画一遍。\n\n## 5. 第三步：给内部铺一个深色\n\n在线稿下面新建色块层，给开口内部填一个深色。深棕、偏红的深色或适合整体画风的暗色都可以；第一次甚至可以用灰色。\n\n现在外形与内部形成区别。把画面缩回整脸大小，观察它是否读得出“张嘴”。\n\n如果一眼看成很重的黑斑，先检查开口大小、位置和颜色对比，不要急着添加更多细节。\n\n内部深色不需要复杂渐变。先学会把边界整理干净，避免颜色漏到嘴外。\n\n## 6. 第四步：需要时，再加一项细节\n\n### 选项 A：简化舌面\n\n在深色开口的下部画一个较小、较浅的色块，让它与底部关系清楚。不要画成悬在开口正中央的一颗粉色豆子。\n\n这是适用于本次小口示意的概括方式。实际可见舌面会随嘴形、视角和动作变化，不要求每个表情都露出来。\n\n### 选项 B：简化牙齿\n\n在上边界内侧留一条浅色区域，表示一小段可见牙齿。先把它当作整体的带状形，不逐颗画格子。\n\n如果浅色区域太宽，几乎吃掉全部口腔暗部，就容易读成另一种咬合或露齿表情。缩窄一点，再比较。\n\n**第一遍选一个做即可，也可以两个都不做。**\n\n## 7. 只改开口形状，试一次小圆口\n\n保留原来的嘴部中心，把横向开口改成较小的圆形或椭圆形，再填同样的深色。\n\n它可能更接近轻微惊讶或某些发音状态，但具体感觉还要结合眉眼。这里先观察形状从横向展开变成集中在中间，视觉效果发生了什么变化。\n\n不要在同一次比较中把眉毛、眼睛和头型都改掉。完整表情会在之后的课里组合。\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 可以怎样改 |\n| --- | --- | --- |\n| 像一块黑点，不像开口 | 外形、大小与位置是否协调 | 先看线稿版，再减小或减轻填色 |\n| 像两条不相干的线 | 嘴角是否把上下边界连成一个形状 | 整理两端连接 |\n| 舌头像飘着 | 舌面色块是否和下部关系不清 | 移向底部，减小并简化形状 |\n| 牙齿像棋盘 | 是否过早分成许多小格 | 改成简洁的整体浅色带 |\n| 张得很大却下巴完全不动 | 已超出本篇的小幅张口范围 | 先缩回小开口，大动作以后专门练 |\n\n## 9. 三个小练习\n\n**A，十分钟：** 从嘴角开始，画出小开口并填一块暗色。放回整张脸检查。\n\n**B，五分钟：** 自己再画一个，不看逐步图，只记住“宽度—开口—暗部”的顺序。\n\n**C，五到十分钟：** 复制一版，在“加小舌面”“加牙齿带”“改圆口”中只选一种变化。\n\n能解释外形和内部色块的分工，能区分基础步骤与可选细节，就可以结束。下一篇会把整个第一阶段的五官放回同一张脸，检查关系。\n\n[上一篇：闭合的小嘴](08-闭合的小嘴怎么画.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：整张脸的检查](10-把五官放回同一张脸.md)\n"}, {"id": "lesson-10", "number": 10, "short": "把五官放回同一张脸", "file": "10-把五官放回同一张脸.md", "html": "\u003ch1 id=\"10\">10 · 把五官放回同一张脸\u003c/h1>\n\u003cblockquote>\n\u003cp>今天完成第一阶段的小作品：一张正面脸部草图。\u003c/p>\n\u003cp>前置：01—09。目标是整合与检查，不是同时加入头发、服装、上色和复杂表情。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 今天最重要的能力：看出一个具体问题\u003c/h2>\n\u003cp>前面我们把脸拆开练习。现在要把轮廓、眼睛、眉毛、鼻子和嘴放回同一张图里，观察它们能否协调地表达你想画的脸。\u003c/p>\n\u003cp>“感觉怪”是一个起点，但还不能告诉你怎样修改。今天练习把它说得更具体：是整张嘴偏了，还是嘴太宽？是两眼一高一低，还是其中一只更睁开？\u003c/p>\n\u003cp>\u003cstrong>先写出问题，再决定改什么。\u003c/strong> 这样你更容易看到自己的修改有没有作用。\u003c/p>\n\u003ch2 id=\"2\">2. 看图：从发现问题，到只改一个地方\u003c/h2>\n\u003cp>\u003cimg alt=\"正面脸上嘴部偏移、辅助线检查与移动后的对照\" src=\"assets/lesson-10-face-review.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>正在做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>示例嘴部向画面右侧偏移，其他部件作为比较背景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>加中线，标出嘴部偏移并确定移动方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>把嘴移回中线附近，再观察整脸\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>本例的练习目标是平静、对称感较强的正面脸，所以把嘴移回中间。偏向一侧的嘴也可能是有意设计的表情；\u003cstrong>问题在于是否符合这次的目标，而不是任何不对称都错误。\u003c/strong>\u003c/p>\n\u003cp>图中的嘴下小线提示下唇，练习时可以省略。生成图有细微线条差异，重点看“定位—判断—小范围修改”的顺序，不把它当作严格相同的三个文件版本。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：先选一个明确、简单的目标\u003c/h2>\n\u003cp>今天建议画：正面、平视、没有歪头、较平静的脸。你可以参考喜欢的角色，但不要求在还没有发型时就达到完整角色辨识度。\u003c/p>\n\u003cp>如果有参考，把它放在旁边，保持能同时看到参考和练习。选择五官清楚、没有复杂遮挡的画面。\u003c/p>\n\u003cp>明确目标后，才有依据判断哪里需要修改。否则一会儿想画惊讶，一会儿想画害羞，容易把不同表达混在一起。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：按从大到小的顺序组装\u003c/h2>\n\u003cp>在同一张草图里依次安排：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>头部外轮廓与中线。\u003c/strong> 先知道脸的大小、宽窄和下巴位置。\u003c/li>\n\u003cli>\u003cstrong>双眼占位。\u003c/strong> 先放高度、间距，再替换成简化眼形。\u003c/li>\n\u003cli>\u003cstrong>虹膜与瞳孔。\u003c/strong> 检查被眼睑遮挡的关系和视线。\u003c/li>\n\u003cli>\u003cstrong>眉毛。\u003c/strong> 先选择一对比较放松的眉形。\u003c/li>\n\u003cli>\u003cstrong>鼻部定位。\u003c/strong> 用很少的线或色块表示。\u003c/li>\n\u003cli>\u003cstrong>嘴部。\u003c/strong> 先用闭合小嘴，减少额外问题。\u003c/li>\n\u003c/ol>\n\u003cp>已经有前几课的整脸底稿，可以继续沿用，不需要从零重画。零散练习来自不同尺寸时，重新安排到统一的头型里，不要直接把每个部件原尺寸拼起来。\u003c/p>\n\u003cp>图层只要便于修改即可。可以把双眼、眉毛、鼻嘴分别放层，不必为每一根短线建立图层。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：缩小看，按顺序检查\u003c/h2>\n\u003ch3 id=\"_1\">先看头型和位置\u003c/h3>\n\u003cp>在能看清整张脸的缩放比例下，检查外轮廓是否稳定，五官有没有集体偏向一侧。看中线时，对齐的是这张脸，不是画布边缘。\u003c/p>\n\u003ch3 id=\"_2\">再看双眼关系\u003c/h3>\n\u003cp>检查对应位置的高度、开口大小与虹膜安排。还记得第 05 篇的区别：整体移位、开口变化和尺寸变化要分开处理。\u003c/p>\n\u003ch3 id=\"_3\">接着看下半脸空间\u003c/h3>\n\u003cp>从眼睛往下，鼻子、嘴和下巴之间是否分配了合理空间？如果嘴已经贴近下巴，继续修改嘴的弧度通常解决不了位置问题。\u003c/p>\n\u003ch3 id=\"_4\">最后看线条与细节\u003c/h3>\n\u003cp>在主要位置稳定之后，再修一段过粗的眼线、一个漏出的辅助圆或一条多余线。不要让精细线条把你困在不协调的位置安排上。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：只选一个最值得改的问题\u003c/h2>\n\u003cp>把问题写成可以执行的句子：\u003c/p>\n\u003cul>\n\u003cli>“画面右侧眼睛整体偏高，先下移一点。”\u003c/li>\n\u003cli>“嘴的中心偏到右侧，保持形状不变，向左移。”\u003c/li>\n\u003cli>“鼻子和嘴太挤，先试着把嘴略下移，再检查下巴空间。”\u003c/li>\n\u003c/ul>\n\u003cp>避免只写“画得不好看”“不像”。它们表达了感受，但还需要继续定位才能动手。\u003c/p>\n\u003cp>如果同时看见很多问题，先选影响范围最大的：整个五官偏移，通常比一根睫毛长度更值得先处理。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：留副本，修改，再比较\u003c/h2>\n\u003cp>保存修改前的版本，复制相关图层或另存一个文件。只执行刚才写下的一项调整。\u003c/p>\n\u003cp>修改后先看整个脸，再看局部。比较参考与修改前后，问自己：“原来的具体问题有没有减轻？有没有产生新的位置问题？”\u003c/p>\n\u003cp>如果没有变好，可以退回副本。这不是失败，而是一次判断：你发现这个改法没有解决当前问题，需要换一个解释再试。\u003c/p>\n\u003cp>建议一次检查处理一到两项就停，避免把同一张画反复磨到疲惫。\u003c/p>\n\u003ch2 id=\"8\">8. 翻转画布怎样帮助检查？\u003c/h2>\n\u003cp>临时水平翻转画布，常能让你注意到已经看习惯的偏斜。它只是换一种观看方式，不是自动判错工具。\u003c/p>\n\u003cp>翻转后依然要把问题说具体：哪里相对于哪里偏了？这是不是自己刻意设计的表情？决定修改后，可以在你最舒服的方向操作。\u003c/p>\n\u003cp>不要因为翻转后“看起来陌生”，就认为整张画全部需要推倒重来。\u003c/p>\n\u003ch2 id=\"9\">9. 第一阶段的小作品怎么交？\u003c/h2>\n\u003cp>用一张简单对照图记录即可：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>修改前\u003c/th>\n\u003cth>发现的问题\u003c/th>\n\u003cth>做的调整\u003c/th>\n\u003cth>修改后观察\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>保存一张 PNG\u003c/td>\n\u003ctd>写一句具体描述\u003c/td>\n\u003ctd>只写实际改动\u003c/td>\n\u003ctd>是否改善，下一次再看什么\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>三次小任务可以这样安排：\u003c/p>\n\u003cp>\u003cstrong>A，十五到二十分钟：\u003c/strong> 组装一张简化正面脸，先不进入复杂细节。\u003c/p>\n\u003cp>\u003cstrong>B，五到十分钟：\u003c/strong> 缩小、翻转、对照参考，找出一个明确问题。\u003c/p>\n\u003cp>\u003cstrong>C，五到十分钟：\u003c/strong> 保存副本，修改一项，写一句前后比较。\u003c/p>\n\u003cp>如果需要更长时间，可以分两次做。完成标准不是达到示意图的线条精细程度，而是你能够主动安排五官并解释一次修改。\u003c/p>\n\u003ch2 id=\"10_1\">10. 到这里，你已经学会了哪些可复用的动作？\u003c/h2>\n\u003cul>\n\u003cli>[ ] 先用轻的辅助形和定位点，再增加细节。\u003c/li>\n\u003cli>[ ] 把眼睛、鼻子和嘴放进同一个头部，而不是各画各的。\u003c/li>\n\u003cli>[ ] 分开比较位置、大小、形状和线重。\u003c/li>\n\u003cli>[ ] 把“怪怪的”变成一个可修改的问题。\u003c/li>\n\u003cli>[ ] 留下源文件与前后版本，允许作品先以草图完成。\u003c/li>\n\u003c/ul>\n\u003cp>下一阶段从\u003ca href=\"#lesson-11\">刘海先画成几大块\u003c/a>开始，把这张脸逐渐变成你喜欢的角色。第二阶段 11—18 已完成，可继续顺序阅读。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-09\">上一篇：张开的小嘴\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-11\">下一篇：刘海分块\u003c/a>\u003c/p>", "text": "# 10 · 把五官放回同一张脸\n\n> 今天完成第一阶段的小作品：一张正面脸部草图。\n>\n> 前置：01—09。目标是整合与检查，不是同时加入头发、服装、上色和复杂表情。\n\n## 1. 今天最重要的能力：看出一个具体问题\n\n前面我们把脸拆开练习。现在要把轮廓、眼睛、眉毛、鼻子和嘴放回同一张图里，观察它们能否协调地表达你想画的脸。\n\n“感觉怪”是一个起点，但还不能告诉你怎样修改。今天练习把它说得更具体：是整张嘴偏了，还是嘴太宽？是两眼一高一低，还是其中一只更睁开？\n\n**先写出问题，再决定改什么。** 这样你更容易看到自己的修改有没有作用。\n\n## 2. 看图：从发现问题，到只改一个地方\n\n![正面脸上嘴部偏移、辅助线检查与移动后的对照](assets/lesson-10-face-review.png)\n\n| 编号 | 正在做什么 |\n| --- | --- |\n| 01 | 示例嘴部向画面右侧偏移，其他部件作为比较背景 |\n| 02 | 加中线，标出嘴部偏移并确定移动方向 |\n| 03 | 把嘴移回中线附近，再观察整脸 |\n\n本例的练习目标是平静、对称感较强的正面脸，所以把嘴移回中间。偏向一侧的嘴也可能是有意设计的表情；**问题在于是否符合这次的目标，而不是任何不对称都错误。**\n\n图中的嘴下小线提示下唇，练习时可以省略。生成图有细微线条差异，重点看“定位—判断—小范围修改”的顺序，不把它当作严格相同的三个文件版本。\n\n## 3. 第一步：先选一个明确、简单的目标\n\n今天建议画：正面、平视、没有歪头、较平静的脸。你可以参考喜欢的角色，但不要求在还没有发型时就达到完整角色辨识度。\n\n如果有参考，把它放在旁边，保持能同时看到参考和练习。选择五官清楚、没有复杂遮挡的画面。\n\n明确目标后，才有依据判断哪里需要修改。否则一会儿想画惊讶，一会儿想画害羞，容易把不同表达混在一起。\n\n## 4. 第二步：按从大到小的顺序组装\n\n在同一张草图里依次安排：\n\n1. **头部外轮廓与中线。** 先知道脸的大小、宽窄和下巴位置。\n2. **双眼占位。** 先放高度、间距，再替换成简化眼形。\n3. **虹膜与瞳孔。** 检查被眼睑遮挡的关系和视线。\n4. **眉毛。** 先选择一对比较放松的眉形。\n5. **鼻部定位。** 用很少的线或色块表示。\n6. **嘴部。** 先用闭合小嘴，减少额外问题。\n\n已经有前几课的整脸底稿，可以继续沿用，不需要从零重画。零散练习来自不同尺寸时，重新安排到统一的头型里，不要直接把每个部件原尺寸拼起来。\n\n图层只要便于修改即可。可以把双眼、眉毛、鼻嘴分别放层，不必为每一根短线建立图层。\n\n## 5. 第三步：缩小看，按顺序检查\n\n### 先看头型和位置\n\n在能看清整张脸的缩放比例下，检查外轮廓是否稳定，五官有没有集体偏向一侧。看中线时，对齐的是这张脸，不是画布边缘。\n\n### 再看双眼关系\n\n检查对应位置的高度、开口大小与虹膜安排。还记得第 05 篇的区别：整体移位、开口变化和尺寸变化要分开处理。\n\n### 接着看下半脸空间\n\n从眼睛往下，鼻子、嘴和下巴之间是否分配了合理空间？如果嘴已经贴近下巴，继续修改嘴的弧度通常解决不了位置问题。\n\n### 最后看线条与细节\n\n在主要位置稳定之后，再修一段过粗的眼线、一个漏出的辅助圆或一条多余线。不要让精细线条把你困在不协调的位置安排上。\n\n## 6. 第四步：只选一个最值得改的问题\n\n把问题写成可以执行的句子：\n\n- “画面右侧眼睛整体偏高，先下移一点。”\n- “嘴的中心偏到右侧，保持形状不变，向左移。”\n- “鼻子和嘴太挤，先试着把嘴略下移，再检查下巴空间。”\n\n避免只写“画得不好看”“不像”。它们表达了感受，但还需要继续定位才能动手。\n\n如果同时看见很多问题，先选影响范围最大的：整个五官偏移，通常比一根睫毛长度更值得先处理。\n\n## 7. 第五步：留副本，修改，再比较\n\n保存修改前的版本，复制相关图层或另存一个文件。只执行刚才写下的一项调整。\n\n修改后先看整个脸，再看局部。比较参考与修改前后，问自己：“原来的具体问题有没有减轻？有没有产生新的位置问题？”\n\n如果没有变好，可以退回副本。这不是失败，而是一次判断：你发现这个改法没有解决当前问题，需要换一个解释再试。\n\n建议一次检查处理一到两项就停，避免把同一张画反复磨到疲惫。\n\n## 8. 翻转画布怎样帮助检查？\n\n临时水平翻转画布，常能让你注意到已经看习惯的偏斜。它只是换一种观看方式，不是自动判错工具。\n\n翻转后依然要把问题说具体：哪里相对于哪里偏了？这是不是自己刻意设计的表情？决定修改后，可以在你最舒服的方向操作。\n\n不要因为翻转后“看起来陌生”，就认为整张画全部需要推倒重来。\n\n## 9. 第一阶段的小作品怎么交？\n\n用一张简单对照图记录即可：\n\n| 修改前 | 发现的问题 | 做的调整 | 修改后观察 |\n| --- | --- | --- | --- |\n| 保存一张 PNG | 写一句具体描述 | 只写实际改动 | 是否改善，下一次再看什么 |\n\n三次小任务可以这样安排：\n\n**A，十五到二十分钟：** 组装一张简化正面脸，先不进入复杂细节。\n\n**B，五到十分钟：** 缩小、翻转、对照参考，找出一个明确问题。\n\n**C，五到十分钟：** 保存副本，修改一项，写一句前后比较。\n\n如果需要更长时间，可以分两次做。完成标准不是达到示意图的线条精细程度，而是你能够主动安排五官并解释一次修改。\n\n## 10. 到这里，你已经学会了哪些可复用的动作？\n\n- [ ] 先用轻的辅助形和定位点，再增加细节。\n- [ ] 把眼睛、鼻子和嘴放进同一个头部，而不是各画各的。\n- [ ] 分开比较位置、大小、形状和线重。\n- [ ] 把“怪怪的”变成一个可修改的问题。\n- [ ] 留下源文件与前后版本，允许作品先以草图完成。\n\n下一阶段从[刘海先画成几大块](11-刘海先画成几大块.md)开始，把这张脸逐渐变成你喜欢的角色。第二阶段 11—18 已完成，可继续顺序阅读。\n\n[上一篇：张开的小嘴](09-张开的小嘴怎么画.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：刘海分块](11-刘海先画成几大块.md)\n"}, {"id": "lesson-11", "number": 11, "short": "刘海先画成几大块", "file": "11-刘海先画成几大块.md", "html": "\u003ch1 id=\"11\">11 · 刘海先画成几大块\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：在已有的正面脸上，画出轮廓清楚的刘海。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-10\">10 · 整张脸的检查\u003c/a>。暂时不处理辫子、帽子和复杂发丝。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 为什么先画大块？\u003c/h2>\n\u003cp>如果一开始逐根画头发，很容易得到很多线，却看不出发型。角色发型首先靠大轮廓、分组和遮挡被识别，细发丝可以之后再补。\u003c/p>\n\u003cp>本篇把一束头发暂时看作有宽度的带状形：上方有来源，中间顺着一个方向延伸，末端逐渐收尖。它不是贴在额头上的独立三角形。\u003c/p>\n\u003cp>\u003cstrong>我们先决定刘海整体占哪里，再在里面分出少量发块。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：从完整头部到几块刘海\u003c/h2>\n\u003cp>\u003cimg alt=\"在完整头部上逐步概括刘海的大形与分块\" src=\"assets/lesson-11-bangs.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>当前观察什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>没有头发时，头部原本的轮廓和空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>前额发际区域的大致位置，作为辅助参考\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>刘海整体从上方向前额延伸的覆盖范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>把整体分成中央和两侧的主要发块\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>整理外轮廓与发块边界，隐藏不需要的辅助线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>简单颜色帮助读出分组，不要求这课完成上色\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>图为 AI 生成的教学演绎，不是官方发型设定稿。示意各格略有差异，练习时沿用自己的同一底稿。颈部和耳朵只是背景参照，尚不会画可以省略。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：把头部留在头发下面\u003c/h2>\n\u003cp>打开第一阶段完成的脸，保留原来的头部轮廓。在上面新建“刘海草图”层，先不要擦掉头顶。\u003c/p>\n\u003cp>因为有了这个底稿，你才知道头发覆盖在多大的头上。若只从眼睛上方直接往外长头发，容易把头顶画得太扁，或者让左右发型挤进头骨本应占据的空间。\u003c/p>\n\u003cp>把底稿调淡一些即可。最终要隐藏被头发遮住的轮廓，但草稿阶段仍用它检查体积。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：先找覆盖范围，不急着画每个发尖\u003c/h2>\n\u003cp>看参考里刘海大致从哪个区域向下走，遮到额头、眉毛或眼睛的什么位置。头发的生长区域、分发方向和最后落在脸上的位置不是同一回事。\u003c/p>\n\u003cp>图 02 的弧线只帮助你认识前额发际区域，不表示所有发束都从这条线末端开始，也不是最后必须保留的一条线。\u003c/p>\n\u003cp>在新层上轻画刘海整体的顶部与下沿。顶部顺着头部留出合理余量，下沿可以在中央稍长、两侧稍短，具体关系以选定参考为准。\u003c/p>\n\u003cp>这时甚至可以把刘海当作一整块剪纸形状。缩小看：它覆盖了哪里？有没有把想保留的眼神全部挡住？\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：分出中央和两侧的大块\u003c/h2>\n\u003cp>先选最有辨识度的一块，例如从上方向两眼之间落下的中央发束。画它的两侧边界，让上方较宽、向末端逐渐收拢。\u003c/p>\n\u003cp>再在左右补几块。每块可以长短不同、偏向不同；初学控制在少量大块，先看得出主要节奏即可。\u003c/p>\n\u003cp>\u003cstrong>两条边界要在描述同一束头发的走向。\u003c/strong> 如果一边突然左拐、另一边完全向右，发块可能像被切断或扭结。先用一条淡的方向线想清楚它往哪里走，再围出宽度。\u003c/p>\n\u003cp>不需要把每束都画成等腰三角形。发束可以先弯再收尖，边缘也可以有轻微转折。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：决定哪一块压在前面\u003c/h2>\n\u003cp>两束头发交接时，先选其中一束在前面。让前方发束的边界连贯，后方发束进入遮挡处的线在这里停下。\u003c/p>\n\u003cp>不要把所有线都画穿。如果各束边界交叉成很多 X，通常很难看出前后。你可以临时给前方发块填一个淡色，检查它是否盖住了后方该隐藏的线。\u003c/p>\n\u003cp>某些画风会透出被刘海遮住的眉眼线条，那属于表现选择。初学这课先把遮挡关系处理清楚，再决定是否采用这种风格化做法。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：挑一条边界留下来\u003c/h2>\n\u003cp>把草稿调淡，新建整理层。保留整体外轮廓、主要分束边界，以及确实能说明方向的少量内部线。\u003c/p>\n\u003cp>隐藏原头部被刘海盖住的部分。先用图层副本或遮挡方式处理，保留完整头部底稿，方便后面改发型。\u003c/p>\n\u003cp>缩小看发型：如果已经能分清中央与两侧，就可以停。画满内部线条不会自动增加结构感。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎样改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像几根尖刺贴在额头\u003c/td>\n\u003ctd>发块有没有上方来源与连续走向\u003c/td>\n\u003ctd>先画整体，再从整体分块\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头顶变扁\u003c/td>\n\u003ctd>是否把原头部轮廓压小了\u003c/td>\n\u003ctd>显示底稿，恢复头部空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每块像复制的三角形\u003c/td>\n\u003ctd>长短、宽度、偏向是否全相同\u003c/td>\n\u003ctd>只调整一两块的长度与走向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线条交叉看不懂\u003c/td>\n\u003ctd>前后关系是否不明确\u003c/td>\n\u003ctd>确定前方发块，停掉被遮挡的线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>发丝很多却不像参考\u003c/td>\n\u003ctd>整体轮廓与分组是否差得较大\u003c/td>\n\u003ctd>暂时隐藏细线，先对照大形\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 在已有头部上画刘海整体，只分三到五个主要块，不加细发丝。\u003c/p>\n\u003cp>\u003cstrong>B，五到八分钟：\u003c/strong> 重新画一次，自己决定中央发束和两侧发束的前后关系。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只改变中央发束的长度。比较它对额头露出面积和眼神的影响。\u003c/p>\n\u003cp>可以结束时，你能指出整体轮廓、主要发块和一处遮挡，并且隐藏细线后仍能看懂刘海形状。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-10\">上一篇：整张脸的检查\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-12\">下一篇：侧发和后发\u003c/a>\u003c/p>", "text": "# 11 · 刘海先画成几大块\n\n> 今天只做一件事：在已有的正面脸上，画出轮廓清楚的刘海。\n>\n> 前置：[10 · 整张脸的检查](10-把五官放回同一张脸.md)。暂时不处理辫子、帽子和复杂发丝。\n\n## 1. 为什么先画大块？\n\n如果一开始逐根画头发，很容易得到很多线，却看不出发型。角色发型首先靠大轮廓、分组和遮挡被识别，细发丝可以之后再补。\n\n本篇把一束头发暂时看作有宽度的带状形：上方有来源，中间顺着一个方向延伸，末端逐渐收尖。它不是贴在额头上的独立三角形。\n\n**我们先决定刘海整体占哪里，再在里面分出少量发块。**\n\n## 2. 看图：从完整头部到几块刘海\n\n![在完整头部上逐步概括刘海的大形与分块](assets/lesson-11-bangs.png)\n\n| 编号 | 当前观察什么 |\n| --- | --- |\n| 01 | 没有头发时，头部原本的轮廓和空间 |\n| 02 | 前额发际区域的大致位置，作为辅助参考 |\n| 03 | 刘海整体从上方向前额延伸的覆盖范围 |\n| 04 | 把整体分成中央和两侧的主要发块 |\n| 05 | 整理外轮廓与发块边界，隐藏不需要的辅助线 |\n| 06 | 简单颜色帮助读出分组，不要求这课完成上色 |\n\n图为 AI 生成的教学演绎，不是官方发型设定稿。示意各格略有差异，练习时沿用自己的同一底稿。颈部和耳朵只是背景参照，尚不会画可以省略。\n\n## 3. 第一步：把头部留在头发下面\n\n打开第一阶段完成的脸，保留原来的头部轮廓。在上面新建“刘海草图”层，先不要擦掉头顶。\n\n因为有了这个底稿，你才知道头发覆盖在多大的头上。若只从眼睛上方直接往外长头发，容易把头顶画得太扁，或者让左右发型挤进头骨本应占据的空间。\n\n把底稿调淡一些即可。最终要隐藏被头发遮住的轮廓，但草稿阶段仍用它检查体积。\n\n## 4. 第二步：先找覆盖范围，不急着画每个发尖\n\n看参考里刘海大致从哪个区域向下走，遮到额头、眉毛或眼睛的什么位置。头发的生长区域、分发方向和最后落在脸上的位置不是同一回事。\n\n图 02 的弧线只帮助你认识前额发际区域，不表示所有发束都从这条线末端开始，也不是最后必须保留的一条线。\n\n在新层上轻画刘海整体的顶部与下沿。顶部顺着头部留出合理余量，下沿可以在中央稍长、两侧稍短，具体关系以选定参考为准。\n\n这时甚至可以把刘海当作一整块剪纸形状。缩小看：它覆盖了哪里？有没有把想保留的眼神全部挡住？\n\n## 5. 第三步：分出中央和两侧的大块\n\n先选最有辨识度的一块，例如从上方向两眼之间落下的中央发束。画它的两侧边界，让上方较宽、向末端逐渐收拢。\n\n再在左右补几块。每块可以长短不同、偏向不同；初学控制在少量大块，先看得出主要节奏即可。\n\n**两条边界要在描述同一束头发的走向。** 如果一边突然左拐、另一边完全向右，发块可能像被切断或扭结。先用一条淡的方向线想清楚它往哪里走，再围出宽度。\n\n不需要把每束都画成等腰三角形。发束可以先弯再收尖，边缘也可以有轻微转折。\n\n## 6. 第四步：决定哪一块压在前面\n\n两束头发交接时，先选其中一束在前面。让前方发束的边界连贯，后方发束进入遮挡处的线在这里停下。\n\n不要把所有线都画穿。如果各束边界交叉成很多 X，通常很难看出前后。你可以临时给前方发块填一个淡色，检查它是否盖住了后方该隐藏的线。\n\n某些画风会透出被刘海遮住的眉眼线条，那属于表现选择。初学这课先把遮挡关系处理清楚，再决定是否采用这种风格化做法。\n\n## 7. 第五步：挑一条边界留下来\n\n把草稿调淡，新建整理层。保留整体外轮廓、主要分束边界，以及确实能说明方向的少量内部线。\n\n隐藏原头部被刘海盖住的部分。先用图层副本或遮挡方式处理，保留完整头部底稿，方便后面改发型。\n\n缩小看发型：如果已经能分清中央与两侧，就可以停。画满内部线条不会自动增加结构感。\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 可以怎样改 |\n| --- | --- | --- |\n| 像几根尖刺贴在额头 | 发块有没有上方来源与连续走向 | 先画整体，再从整体分块 |\n| 头顶变扁 | 是否把原头部轮廓压小了 | 显示底稿，恢复头部空间 |\n| 每块像复制的三角形 | 长短、宽度、偏向是否全相同 | 只调整一两块的长度与走向 |\n| 线条交叉看不懂 | 前后关系是否不明确 | 确定前方发块，停掉被遮挡的线 |\n| 发丝很多却不像参考 | 整体轮廓与分组是否差得较大 | 暂时隐藏细线，先对照大形 |\n\n## 9. 三次小练习\n\n**A，十分钟：** 在已有头部上画刘海整体，只分三到五个主要块，不加细发丝。\n\n**B，五到八分钟：** 重新画一次，自己决定中央发束和两侧发束的前后关系。\n\n**C，五分钟：** 复制一版，只改变中央发束的长度。比较它对额头露出面积和眼神的影响。\n\n可以结束时，你能指出整体轮廓、主要发块和一处遮挡，并且隐藏细线后仍能看懂刘海形状。\n\n[上一篇：整张脸的检查](10-把五官放回同一张脸.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：侧发和后发](12-侧发和后发怎样包住头.md)\n"}, {"id": "lesson-12", "number": 12, "short": "侧发和后发怎样包住头", "file": "12-侧发和后发怎样包住头.md", "html": "\u003ch1 id=\"12\">12 · 侧发和后发怎样包住头\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只解决头发的前后层次：哪些在脸后面，哪些垂到脸前面。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-11\">11 · 刘海分块\u003c/a>。先用简单披发理解关系，再把方法用于角色的实际发型。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 先分清“发型整体”和“脸前面的两束头发”\u003c/h2>\n\u003cp>从正面看，头发常同时出现几种关系：后面的大体量包住头部，两侧发束从侧面垂下，刘海覆盖额头。\u003c/p>\n\u003cp>如果把所有头发都画成脸旁的两条带子，头后面的体量会缺失；如果只画一整块外轮廓，又可能看不出哪些发束在脸前。\u003c/p>\n\u003cp>\u003cstrong>本篇先确定外轮廓，再把前方侧发和后方发量分开。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：外面有厚度，前后有遮挡\u003c/h2>\n\u003cp>\u003cimg alt=\"侧发与后发围绕头部的轮廓和遮挡示意\" src=\"assets/lesson-12-side-back-hair.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>已有刘海的头部，暂未加入完整侧后发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>在头部之外规划头发整体外轮廓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>浅色后发体量在脸部后方形成背景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>加两侧靠前的发束，区分前后层次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>整理可见边界，清掉被遮住的线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>用不同蓝色帮助辨认分组\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>示意采用简化披发，不是要求把洛琪希的辫子改成披发。它帮助你先学会层次，下一课再处理辫子。颜色用于分组，不是统一的光影公式。配图为生成示意，各格有细微变化。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：显示头部底稿，画发型的外边界\u003c/h2>\n\u003cp>保留完整头部底稿。沿着头部外侧规划一圈更外面的发型轮廓，然后确定它往下延伸到哪里。\u003c/p>\n\u003cp>不需要处处留下相同距离。发型有蓬松和贴合的区别，但都要先考虑里面有一个完整的头。\u003c/p>\n\u003cp>先把头发想成整体剪影，少画内部线。缩小看外形是否完整，左右体量是否符合参考，而不是先纠结某一根发梢。\u003c/p>\n\u003cp>如果画辫子角色，头顶部和耳侧的发量也仍然存在，不是从脸边直接长出两根辫子就结束。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：把后发放到脸后面\u003c/h2>\n\u003cp>在软件里，可以先在脸部下方建立“后发”层，用一个简单色块或轮廓概括后面的发量。\u003c/p>\n\u003cp>注意“图层下面”不自动等于“画面里被遮住”。如果脸部图层只有线条、内部是透明的，后发颜色仍会透过脸显示出来。\u003c/p>\n\u003cp>临时处理有两种简单办法：在脸部线稿下放一个不透明的脸形底色，或者把后发中被脸遮住的区域清理掉。最好留一份完整后发草稿，便于以后改位置。\u003c/p>\n\u003cp>\u003cstrong>检查：\u003c/strong> 后发应该从头的两侧和下方露出来，而不是把脸中央也涂满。你看到的是物体之间的遮挡关系，软件图层只是实现它的方法。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：把靠前的侧发放到上面\u003c/h2>\n\u003cp>新建“前侧发”层，从太阳穴附近或参考中的分发区域，向下画出两侧主要发束。\u003c/p>\n\u003cp>先选一个长度：到脸颊、下巴或肩部。再用两条方向一致的边界围出宽度，末端适当收拢。\u003c/p>\n\u003cp>靠前的侧发可能遮住一小部分脸、耳朵或肩部。选择前后关系后，就不要让后面的轮廓完整穿过它。\u003c/p>\n\u003cp>这不是要求两侧画得一样。先用比较简单的正面安排入门，之后可以根据参考调整一侧的长度、厚度或露耳方式。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：用“线在哪里停下”说明遮挡\u003c/h2>\n\u003cp>看一处头发和脸相接的地方。前方发束的边界可以连续，后方脸侧或耳部的线到遮挡处就结束。\u003c/p>\n\u003cp>如果两条线只是在同一位置相切，又不清楚谁在前面，形状容易粘在一起。可以略微调整位置，让遮挡更明确，或留出一小段清楚的空隙。\u003c/p>\n\u003cp>这种办法同样适用于以后画帽子、衣领、抱书动作：先想清楚前后，再决定可见线条。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：检查原来的头没有消失\u003c/h2>\n\u003cp>轮流显示、隐藏头发，看底稿里的头部大小有没有被你无意改小。也可以暂时降低头发层透明度，检查外轮廓是否把头部包住。\u003c/p>\n\u003cp>再缩小检查整个发型。若头像一加头发就像戴了巨大头盔，可能是外侧余量过大或轮廓过于均匀；如果过于贴头，则可能失去该有的体量。对照具体参考，小幅调整一侧或顶部即可。\u003c/p>\n\u003cp>今天不急着添加发丝高光。把整体空间与遮挡讲清楚，已经足够。\u003c/p>\n\u003ch2 id=\"8\">8. 常见问题\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>先检查\u003c/th>\n\u003cth>可以怎样改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>后发透进脸里\u003c/td>\n\u003ctd>脸层内部是否透明\u003c/td>\n\u003ctd>加脸部遮挡底色，或清理被挡区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头像像扁掉了\u003c/td>\n\u003ctd>是否为了加头发缩小头部底稿\u003c/td>\n\u003ctd>恢复底稿，重新规划外轮廓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像左右两根孤立带子\u003c/td>\n\u003ctd>是否缺少头顶部和后方体量\u003c/td>\n\u003ctd>先把完整发型剪影补出来\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>耳朵、脸侧线穿过头发\u003c/td>\n\u003ctd>遮挡处是否忘记停线\u003c/td>\n\u003ctd>明确前方发束，隐藏后方线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>侧发和后发粘成一片\u003c/td>\n\u003ctd>边界与露出的空隙是否不清楚\u003c/td>\n\u003ctd>调整一处重叠关系，不急着加细线\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2 id=\"9\">9. 三次小练习\u003c/h2>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 在已有头像外面规划完整发型轮廓，只用大色块区分后发与脸。\u003c/p>\n\u003cp>\u003cstrong>B，八分钟：\u003c/strong> 加两束靠前侧发，选一处遮挡认真整理。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 复制一版，只改变一侧发束的长度。保持头部和另一侧不变，比较脸部露出面积。\u003c/p>\n\u003cp>可以结束时，你能指出后发、脸、前侧发的关系，并解释为什么后方的某一条线应该隐藏。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-11\">上一篇：刘海\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-13\">下一篇：辫子\u003c/a>\u003c/p>", "text": "# 12 · 侧发和后发怎样包住头\n\n> 今天只解决头发的前后层次：哪些在脸后面，哪些垂到脸前面。\n>\n> 前置：[11 · 刘海分块](11-刘海先画成几大块.md)。先用简单披发理解关系，再把方法用于角色的实际发型。\n\n## 1. 先分清“发型整体”和“脸前面的两束头发”\n\n从正面看，头发常同时出现几种关系：后面的大体量包住头部，两侧发束从侧面垂下，刘海覆盖额头。\n\n如果把所有头发都画成脸旁的两条带子，头后面的体量会缺失；如果只画一整块外轮廓，又可能看不出哪些发束在脸前。\n\n**本篇先确定外轮廓，再把前方侧发和后方发量分开。**\n\n## 2. 看图：外面有厚度，前后有遮挡\n\n![侧发与后发围绕头部的轮廓和遮挡示意](assets/lesson-12-side-back-hair.png)\n\n| 编号 | 重点 |\n| --- | --- |\n| 01 | 已有刘海的头部，暂未加入完整侧后发 |\n| 02 | 在头部之外规划头发整体外轮廓 |\n| 03 | 浅色后发体量在脸部后方形成背景 |\n| 04 | 加两侧靠前的发束，区分前后层次 |\n| 05 | 整理可见边界，清掉被遮住的线 |\n| 06 | 用不同蓝色帮助辨认分组 |\n\n示意采用简化披发，不是要求把洛琪希的辫子改成披发。它帮助你先学会层次，下一课再处理辫子。颜色用于分组，不是统一的光影公式。配图为生成示意，各格有细微变化。\n\n## 3. 第一步：显示头部底稿，画发型的外边界\n\n保留完整头部底稿。沿着头部外侧规划一圈更外面的发型轮廓，然后确定它往下延伸到哪里。\n\n不需要处处留下相同距离。发型有蓬松和贴合的区别，但都要先考虑里面有一个完整的头。\n\n先把头发想成整体剪影，少画内部线。缩小看外形是否完整，左右体量是否符合参考，而不是先纠结某一根发梢。\n\n如果画辫子角色，头顶部和耳侧的发量也仍然存在，不是从脸边直接长出两根辫子就结束。\n\n## 4. 第二步：把后发放到脸后面\n\n在软件里，可以先在脸部下方建立“后发”层，用一个简单色块或轮廓概括后面的发量。\n\n注意“图层下面”不自动等于“画面里被遮住”。如果脸部图层只有线条、内部是透明的，后发颜色仍会透过脸显示出来。\n\n临时处理有两种简单办法：在脸部线稿下放一个不透明的脸形底色，或者把后发中被脸遮住的区域清理掉。最好留一份完整后发草稿，便于以后改位置。\n\n**检查：** 后发应该从头的两侧和下方露出来，而不是把脸中央也涂满。你看到的是物体之间的遮挡关系，软件图层只是实现它的方法。\n\n## 5. 第三步：把靠前的侧发放到上面\n\n新建“前侧发”层，从太阳穴附近或参考中的分发区域，向下画出两侧主要发束。\n\n先选一个长度：到脸颊、下巴或肩部。再用两条方向一致的边界围出宽度，末端适当收拢。\n\n靠前的侧发可能遮住一小部分脸、耳朵或肩部。选择前后关系后，就不要让后面的轮廓完整穿过它。\n\n这不是要求两侧画得一样。先用比较简单的正面安排入门，之后可以根据参考调整一侧的长度、厚度或露耳方式。\n\n## 6. 第四步：用“线在哪里停下”说明遮挡\n\n看一处头发和脸相接的地方。前方发束的边界可以连续，后方脸侧或耳部的线到遮挡处就结束。\n\n如果两条线只是在同一位置相切，又不清楚谁在前面，形状容易粘在一起。可以略微调整位置，让遮挡更明确，或留出一小段清楚的空隙。\n\n这种办法同样适用于以后画帽子、衣领、抱书动作：先想清楚前后，再决定可见线条。\n\n## 7. 第五步：检查原来的头没有消失\n\n轮流显示、隐藏头发，看底稿里的头部大小有没有被你无意改小。也可以暂时降低头发层透明度，检查外轮廓是否把头部包住。\n\n再缩小检查整个发型。若头像一加头发就像戴了巨大头盔，可能是外侧余量过大或轮廓过于均匀；如果过于贴头，则可能失去该有的体量。对照具体参考，小幅调整一侧或顶部即可。\n\n今天不急着添加发丝高光。把整体空间与遮挡讲清楚，已经足够。\n\n## 8. 常见问题\n\n| 现象 | 先检查 | 可以怎样改 |\n| --- | --- | --- |\n| 后发透进脸里 | 脸层内部是否透明 | 加脸部遮挡底色，或清理被挡区域 |\n| 头像像扁掉了 | 是否为了加头发缩小头部底稿 | 恢复底稿，重新规划外轮廓 |\n| 像左右两根孤立带子 | 是否缺少头顶部和后方体量 | 先把完整发型剪影补出来 |\n| 耳朵、脸侧线穿过头发 | 遮挡处是否忘记停线 | 明确前方发束，隐藏后方线 |\n| 侧发和后发粘成一片 | 边界与露出的空隙是否不清楚 | 调整一处重叠关系，不急着加细线 |\n\n## 9. 三次小练习\n\n**A，十分钟：** 在已有头像外面规划完整发型轮廓，只用大色块区分后发与脸。\n\n**B，八分钟：** 加两束靠前侧发，选一处遮挡认真整理。\n\n**C，五分钟：** 复制一版，只改变一侧发束的长度。保持头部和另一侧不变，比较脸部露出面积。\n\n可以结束时，你能指出后发、脸、前侧发的关系，并解释为什么后方的某一条线应该隐藏。\n\n[上一篇：刘海](11-刘海先画成几大块.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：辫子](13-辫子怎样概括.md)\n"}, {"id": "lesson-13", "number": 13, "short": "辫子怎样概括", "file": "13-辫子怎样概括.md", "html": "\u003ch1 id=\"13\">13 · 辫子怎样概括\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只画一小段下垂辫子的外观，练走向、粗细和交叠节奏。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-12\">12 · 头发的前后关系\u003c/a>。先单独画辫子，不急着同时处理整张头像。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 先理解今天画的是“外观概括”\u003c/h2>\n\u003cp>三股辫是真实发束交替编织形成的。本篇不把完整编发过程压缩成一个图案公式，而是先从正面可见的外观入手：一条有走向的整体，里面出现交替向中间穿入、被另一块遮住的发块。\u003c/p>\n\u003cp>你可以找一张辫子参考，先看整体宽窄和交接位置。暂时忽略成百上千根细发丝。\u003c/p>\n\u003cp>\u003cstrong>关键是连续与遮挡：它不是一串互不相连的圆珠，也不是在长条里画横格子。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：先画长条范围，再组织交叠\u003c/h2>\n\u003cp>\u003cimg alt=\"辫子由走向、宽度和交替发块逐步构成的示意\" src=\"assets/lesson-13-braid.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>当前做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>画辫子整体走向与两侧宽度范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>粗略标出沿长度方向的节奏位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>从上方开始画少量交替覆盖的发块\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>延续节奏，逐渐往下收窄\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>整理线稿，加绑结和末端散开的发束\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>用接近的蓝色帮助辨认相邻发块\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>顶部被画框截取，表示这只是辫子的一段，不是头上连接点的完整画法。红点提示一处交接位置。图为生成示意，颜色用来区分形状，不表示辫子只有两股，也不作为编织拓扑的精确教程。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：用一条线确定辫子往哪里走\u003c/h2>\n\u003cp>先画一条轻的长线，表示辫子整体的中心走向。第一遍可以接近竖直，带一点自然弯曲，不必马上画甩动的辫子。\u003c/p>\n\u003cp>在中心线两边各画一条外边界。上方稍宽，下方逐渐变窄，围出一条长而收拢的区域。\u003c/p>\n\u003cp>这个范围决定辫子占据的空间。不要还没确定长度和粗细，就开始精细地画每个交叠单元。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：沿长度找一个大致节奏\u003c/h2>\n\u003cp>在长条上轻标几处位置，帮助安排相邻交接段。它们不必机械等距，下方变细时可以相应缩短间隔。\u003c/p>\n\u003cp>这里的横向标记只是草图尺子，最后不需要描出来。它们也不是每一股头发的真实边界。\u003c/p>\n\u003cp>先只安排几段，确保你能看清每段在做什么。以后画更长的辫子，再增加段数。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：画一个向中间收进去的发块\u003c/h2>\n\u003cp>从外侧向中心方向画一条弯曲边界，再配另一条边界，围出一块有宽度的头发。它的一端向下方或中间收拢，被下一块遮住。\u003c/p>\n\u003cp>下一块从另一侧接过来，形成交替的节奏。观察参考里哪条边界连续、哪条边界在交接处消失，照着这种遮挡关系画。\u003c/p>\n\u003cp>你可以先只画两三块。若已经分不清前后，就停在这里，不要靠继续往下重复来掩盖问题。\u003c/p>\n\u003ch2 id=\"6\">6. 第四步：交接处让一条边界停下\u003c/h2>\n\u003cp>两块相接时，前方那块的轮廓保持连贯，被盖住那块的线在交接处结束。它常形成类似一条线接到另一条线上的关系，而不是两条线全部穿过去。\u003c/p>\n\u003cp>如果你每个交接都画成一个 X，可能会读成绳网；如果每块都封闭成独立圆环，又会像链条。回到相邻两块的遮挡，先改清楚一处，再往下继续。\u003c/p>\n\u003cp>沿着中心走向逐段延伸，同时检查外边界是不是仍然落在最开始规划的范围里。\u003c/p>\n\u003ch2 id=\"7\">7. 第五步：加绑结和散开的末端\u003c/h2>\n\u003cp>辫子下端可以用一个小的带状形表示绑结。下面再画一束较短的散发，用整体轮廓概括即可。\u003c/p>\n\u003cp>散发的来源应当接在绑结下面，而不是与辫子中断成两个物体。可以先用一条轻方向线把它们串起来，再围出发束。\u003c/p>\n\u003cp>整理时隐藏中心线和节奏标记。保留外轮廓、交叠边界，以及少量帮助看清方向的线。\u003c/p>\n\u003ch2 id=\"8\">8. 怎样把这一段接回头像？\u003c/h2>\n\u003cp>先看参考里头发从耳侧或后侧怎样汇拢，再把辫子上端接到这片发量下面。连接点可能被侧发、耳部或肩部遮住，需要沿用上一课的前后关系。\u003c/p>\n\u003cp>第一遍可以只给头像加一侧辫子，另一侧稍后再画。为了画辫子而不断扩大画布也不必急，先决定头像要保留多长的一段。\u003c/p>\n\u003cp>不要把辫子根部直接接在脸部轮廓线上，仿佛从皮肤长出来。检查它与发型大块有没有连续关系。\u003c/p>\n\u003ch2 id=\"9\">9. 常见问题与小练习\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>检查与修改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像一串珠子\u003c/td>\n\u003ctd>取消独立闭合的小块，改清楚两块之间的覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像梯子\u003c/td>\n\u003ctd>隐藏横向辅助标记，用交替弧线描述发块\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中途突然变粗\u003c/td>\n\u003ctd>对照最初外边界，只修失控的那一段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>每个交点都很黑\u003c/td>\n\u003ctd>先确定谁在前，把被遮挡的线停掉\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>末端像另外挂上去\u003c/td>\n\u003ctd>用共同走向检查绑结上下的连接\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>A，十分钟：\u003c/strong> 只画一段含三到四个可见交叠的辫子，先把一处遮挡讲清楚。\u003c/p>\n\u003cp>\u003cstrong>B，八分钟：\u003c/strong> 重新画一段，从走向、外边界开始，不直接复制全部线条。\u003c/p>\n\u003cp>\u003cstrong>C，五分钟：\u003c/strong> 保持交叠方式，稍微改变整体弯曲走向，比较发块是否仍然沿着辫子连续延伸。\u003c/p>\n\u003cp>能指出整体走向、宽度变化和一处谁盖住谁，就达到本篇目标。精细发丝和漂亮高光留到之后再加。\u003c/p>\n\u003cp>\u003ca href=\"#lesson-12\">上一篇：侧发和后发\u003c/a> · \u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-14\">下一篇：帽子\u003c/a>\u003c/p>", "text": "# 13 · 辫子怎样概括\n\n> 今天只画一小段下垂辫子的外观，练走向、粗细和交叠节奏。\n>\n> 前置：[12 · 头发的前后关系](12-侧发和后发怎样包住头.md)。先单独画辫子，不急着同时处理整张头像。\n\n## 1. 先理解今天画的是“外观概括”\n\n三股辫是真实发束交替编织形成的。本篇不把完整编发过程压缩成一个图案公式，而是先从正面可见的外观入手：一条有走向的整体，里面出现交替向中间穿入、被另一块遮住的发块。\n\n你可以找一张辫子参考，先看整体宽窄和交接位置。暂时忽略成百上千根细发丝。\n\n**关键是连续与遮挡：它不是一串互不相连的圆珠，也不是在长条里画横格子。**\n\n## 2. 看图：先画长条范围，再组织交叠\n\n![辫子由走向、宽度和交替发块逐步构成的示意](assets/lesson-13-braid.png)\n\n| 编号 | 当前做什么 |\n| --- | --- |\n| 01 | 画辫子整体走向与两侧宽度范围 |\n| 02 | 粗略标出沿长度方向的节奏位置 |\n| 03 | 从上方开始画少量交替覆盖的发块 |\n| 04 | 延续节奏，逐渐往下收窄 |\n| 05 | 整理线稿，加绑结和末端散开的发束 |\n| 06 | 用接近的蓝色帮助辨认相邻发块 |\n\n顶部被画框截取，表示这只是辫子的一段，不是头上连接点的完整画法。红点提示一处交接位置。图为生成示意，颜色用来区分形状，不表示辫子只有两股，也不作为编织拓扑的精确教程。\n\n## 3. 第一步：用一条线确定辫子往哪里走\n\n先画一条轻的长线，表示辫子整体的中心走向。第一遍可以接近竖直，带一点自然弯曲，不必马上画甩动的辫子。\n\n在中心线两边各画一条外边界。上方稍宽，下方逐渐变窄，围出一条长而收拢的区域。\n\n这个范围决定辫子占据的空间。不要还没确定长度和粗细，就开始精细地画每个交叠单元。\n\n## 4. 第二步：沿长度找一个大致节奏\n\n在长条上轻标几处位置，帮助安排相邻交接段。它们不必机械等距，下方变细时可以相应缩短间隔。\n\n这里的横向标记只是草图尺子，最后不需要描出来。它们也不是每一股头发的真实边界。\n\n先只安排几段，确保你能看清每段在做什么。以后画更长的辫子，再增加段数。\n\n## 5. 第三步：画一个向中间收进去的发块\n\n从外侧向中心方向画一条弯曲边界，再配另一条边界，围出一块有宽度的头发。它的一端向下方或中间收拢，被下一块遮住。\n\n下一块从另一侧接过来，形成交替的节奏。观察参考里哪条边界连续、哪条边界在交接处消失，照着这种遮挡关系画。\n\n你可以先只画两三块。若已经分不清前后，就停在这里，不要靠继续往下重复来掩盖问题。\n\n## 6. 第四步：交接处让一条边界停下\n\n两块相接时，前方那块的轮廓保持连贯，被盖住那块的线在交接处结束。它常形成类似一条线接到另一条线上的关系，而不是两条线全部穿过去。\n\n如果你每个交接都画成一个 X，可能会读成绳网；如果每块都封闭成独立圆环，又会像链条。回到相邻两块的遮挡，先改清楚一处，再往下继续。\n\n沿着中心走向逐段延伸，同时检查外边界是不是仍然落在最开始规划的范围里。\n\n## 7. 第五步：加绑结和散开的末端\n\n辫子下端可以用一个小的带状形表示绑结。下面再画一束较短的散发，用整体轮廓概括即可。\n\n散发的来源应当接在绑结下面，而不是与辫子中断成两个物体。可以先用一条轻方向线把它们串起来，再围出发束。\n\n整理时隐藏中心线和节奏标记。保留外轮廓、交叠边界，以及少量帮助看清方向的线。\n\n## 8. 怎样把这一段接回头像？\n\n先看参考里头发从耳侧或后侧怎样汇拢，再把辫子上端接到这片发量下面。连接点可能被侧发、耳部或肩部遮住，需要沿用上一课的前后关系。\n\n第一遍可以只给头像加一侧辫子，另一侧稍后再画。为了画辫子而不断扩大画布也不必急，先决定头像要保留多长的一段。\n\n不要把辫子根部直接接在脸部轮廓线上，仿佛从皮肤长出来。检查它与发型大块有没有连续关系。\n\n## 9. 常见问题与小练习\n\n| 现象 | 检查与修改 |\n| --- | --- |\n| 像一串珠子 | 取消独立闭合的小块，改清楚两块之间的覆盖 |\n| 像梯子 | 隐藏横向辅助标记，用交替弧线描述发块 |\n| 中途突然变粗 | 对照最初外边界，只修失控的那一段 |\n| 每个交点都很黑 | 先确定谁在前，把被遮挡的线停掉 |\n| 末端像另外挂上去 | 用共同走向检查绑结上下的连接 |\n\n**A，十分钟：** 只画一段含三到四个可见交叠的辫子，先把一处遮挡讲清楚。\n\n**B，八分钟：** 重新画一段，从走向、外边界开始，不直接复制全部线条。\n\n**C，五分钟：** 保持交叠方式，稍微改变整体弯曲走向，比较发块是否仍然沿着辫子连续延伸。\n\n能指出整体走向、宽度变化和一处谁盖住谁，就达到本篇目标。精细发丝和漂亮高光留到之后再加。\n\n[上一篇：侧发和后发](12-侧发和后发怎样包住头.md) · [返回总目录](00-系列总计划与目录.md) · [下一篇：帽子](14-帽子怎样放在头上.md)\n"}, {"id": "lesson-14", "number": 14, "short": "帽子怎样放在头上", "file": "14-帽子怎样放在头上.md", "html": "\u003ch1 id=\"14\">14 · 帽子怎样放在头上\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只练一顶简化魔法帽怎样围住头部：先安排帽口与帽檐，再连接帽身。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-11\">11 · 刘海\u003c/a>、\u003ca href=\"#lesson-12\">12 · 侧后发\u003c/a>。辫子尚未画好也可以先练帽子。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 把帽子分成三个大部分\u003c/h2>\n\u003cp>先把洛琪希这类魔法帽概括为：容纳头部的帽口、向外展开的帽檐、向上延伸的帽身。\u003c/p>\n\u003cp>帽口不是直接画在脸上的小椭圆；它表示头进入帽子的开口。帽檐也不是一条随意穿过头的横线，它围着帽口向外延伸。\u003c/p>\n\u003cp>\u003cstrong>先考虑帽子里面有没有空间放下头，再画好看的尖顶。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：辅助椭圆与最后可见轮廓\u003c/h2>\n\u003cp>\u003cimg alt=\"魔法帽围绕头部的帽口、帽檐、帽身与遮挡示意\" src=\"assets/lesson-14-witch-hat.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>观察重点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01\u003c/td>\n\u003ctd>保留头部体积，知道帽子要包住哪里\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02\u003c/td>\n\u003ctd>用大、小辅助椭圆规划帽檐与帽口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03\u003c/td>\n\u003ctd>在帽口上方建立向上收拢的帽身\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04\u003c/td>\n\u003ctd>决定前后遮挡，辨认可见边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05\u003c/td>\n\u003ctd>整理帽子线稿，去掉不需要的辅助线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06\u003c/td>\n\u003ctd>简单着色后确认整体形状可读\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>蓝线和虚线用于帮助推想完整形状，不是最后都要描出来的轮廓。04 的虚线尤其用于提示辅助范围，不能机械地认为虚线所经过的整段永远不可见；是否可见仍取决于帽身、头部与帽檐实际的遮挡。\u003c/p>\n\u003cp>配图是生成的简化示意，各格存在轻微形状差异。自己练习时在同一底稿上逐步添加。脸部已有颜色只方便辨认，不要求现在同步上色。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：先留出整顶帽子的空间\u003c/h2>\n\u003cp>在画布上方和两侧留出余量。先用很轻的线框一下帽尖和帽檐最远能到哪里，避免等帽子画好才发现尖顶被裁掉。\u003c/p>\n\u003cp>显示完整头部底稿，即使头顶之后会被帽子遮住，也先保留它。头发还有一定体量，规划帽口时一起考虑。\u003c/p>\n\u003cp>本篇先练近正面、帽子没有大幅倾斜的情况。复杂侧视和帽檐翻折可以以后再展开。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：用辅助椭圆规划帽口和帽檐\u003c/h2>\n\u003cp>在头部上方附近，用一个较小的椭圆帮助表示帽口范围。它应该能围住戴帽位置的头部与头发，而不是小到插进头里。\u003c/p>\n\u003cp>再围着它画一个较大的椭圆，作为帽檐展开范围。先让两个形状的大致方向一致，别一个明显向左斜、一个明显向右斜。\u003c/p>\n\u003cp>这里用椭圆近似圆形开口的投影。看得越倾斜，圆形投影可能越扁；今天先照着近正面的参考安排，不必背某个固定扁率。\u003c/p>\n\u003cp>\u003cstrong
