<noscript><p>请允许浏览器运行本地 JavaScript 以使用阅读目录。也可以直接打开同文件夹中的 Markdown 源稿。</p></noscript><script type="application/json" id="lesson-data">[{"id": "plan", "number": null, "short": "系列总计划与目录", "file": "00-系列总计划与目录.md", "html": "\u003ch1 id=\"_1\">从零开始画出喜欢的角色：系列总计划与目录\u003c/h1>\n\u003cblockquote>\n\u003cp>面向：有编程基础、没有绘画基础，想通过板绘画出喜欢的二次元角色，尤其是洛琪希，并让她露出表情、做出动作的你。\u003c/p>\n\u003cp>系列形式：以 HTML 为主要阅读入口，每课讲清一个小问题，配分步图、解释、练习和检查方法；Markdown 保留为可编辑源稿。双击 \u003ca href=\"#home\">index.html\u003c/a> 开始阅读。\u003c/p>\n\u003cp>当前阶段：第一至第三阶段 01—24 已完成图文教程；第 25—42 篇待写。本文件同时作为可点击阅读目录与后续写作计划。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 这个系列最终要帮你做出什么？\u003c/h2>\n\u003cp>我们围绕一件可以逐步完成的作品学习：\u003cstrong>一张自己画的角色头像，能够表达不同情绪，最后在屏幕上眨眼、回应点击。\u003c/strong>\u003c/p>\n\u003cp>沿途可以留下这些成果：\u003c/p>\n\u003col>\n\u003cli>一张位置基本协调的正面脸部草图。\u003c/li>\n\u003cli>一张有头发、帽子和底色的洛琪希头像。\u003c/li>\n\u003cli>一组能看懂情绪的表情，以及简单眨眼动画。\u003c/li>\n\u003cli>一张略微侧转、带简单阴影的头像。\u003c/li>\n\u003cli>几个挥手、抱书、歪头的小姿势。\u003c/li>\n\u003cli>一个使用自己绘制素材的互动小作品。\u003c/li>\n\u003c/ol>\n\u003cp>这些成果不要求一次达到成熟插画的精细程度。练习中的草图也可以拿来做表情、测试动画；后续可以回头替换成进步后的版本。\u003c/p>\n\u003cp>喜欢的角色是我们反复应用知识的对象。每次学到一点，就尽量回到她的脸、发型、表情或姿势上，而不是把兴趣放到所有基础课结束以后。\u003c/p>\n\u003ch2 id=\"2\">2. 怎么拆篇，才不会又变成一个很大的课程？\u003c/h2>\n\u003cp>\u003cstrong>以一个可以观察、动手修改的问题作为一篇的边界。\u003c/strong>\u003c/p>\n\u003cp>例如，“眼睛怎么画”会拆成：\u003c/p>\n\u003cul>\n\u003cli>眼睛在脸上的什么位置。\u003c/li>\n\u003cli>一只眼睛的上下眼睑怎样围出外形。\u003c/li>\n\u003cli>虹膜和瞳孔放在哪里。\u003c/li>\n\u003cli>两只眼睛怎样配成一对。\u003c/li>\n\u003c/ul>\n\u003cp>“头怎么画”也会拆成外轮廓、五官摆放、发型、转向等不同文章。当前已经完成的第 01 篇只处理正面头部外轮廓。\u003c/p>\n\u003cp>一个具体的表情或姿势，可以作为一篇，因为它围绕同一个表达目的。但会复用前面已经学过的部件，不会在同篇里突然要求补完陌生的人体知识。\u003c/p>\n\u003cp>每篇目标是让你能说出：\u003cstrong>“我今天改动了什么，它为什么会让画面产生这种变化。”\u003c/strong>\u003c/p>\n\u003ch2 id=\"3\">3. 怎么阅读：先选你当前想做出的成果\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>当前想实现的目标\u003c/th>\n\u003cth>建议阅读路线\u003c/th>\n\u003cth>到这里可以暂时停下来做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>先把脸画出来\u003c/td>\n\u003ctd>01—10\u003c/td>\n\u003ctd>画几个脸部草图，试着画喜欢的角色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>完成第一张彩色头像\u003c/td>\n\u003ctd>01—18\u003c/td>\n\u003ctd>保存、展示或作为自己的小作品素材\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>最想看见可爱表情和眨眼\u003c/td>\n\u003ctd>01—24\u003c/td>\n\u003ctd>做表情卡和一个粗略眨眼预览\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想先结合编程\u003c/td>\n\u003ctd>01—24，然后 39—42\u003c/td>\n\u003ctd>做出能眨眼、点击微笑的小应用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想画转头和立体感\u003c/td>\n\u003ctd>完成头像后继续 25—30\u003c/td>\n\u003ctd>画轻微侧转、带简单阴影的头像\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>想画可爱的身体动作\u003c/td>\n\u003ctd>完成头像后继续 31—38\u003c/td>\n\u003ctd>画挥手、抱书、歪头的小姿势\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>不需要把全部 42 篇读完，才能做喜欢的东西。后面的文章也不会以“前面的画必须足够漂亮”为门槛。\u003c/p>\n\u003cp>软件不熟时，可以先查已有的\u003ca href=\"#guide\">板绘入门总指南\u003c/a>第 2 节。细分的工具补充篇列在本文后面，需要时再写、再读。\u003c/p>\n\u003ch2 id=\"4-42\">4. 总目录：42 篇，分六个阶段\u003c/h2>\n\u003cp>下表的“练习与完成判断”用于指导学习，不是评分标准。一篇可以做成一节练习，也可以分几天完成。\u003c/p>\n\u003cp>\u003cstrong>状态说明：第 01—24 篇已完成，标题可点击阅读；第 25—42 篇待写，暂不创建空文件或无效链接。\u003c/strong>\u003c/p>\n\u003ch3 id=\"0110\">第一阶段：先画出一张脸（01—10）\u003c/h3>\n\u003cp>阶段成果：一张没有复杂头发、没有上色的正面脸部草图。重点是部件的位置和关系。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-01\">01 · 头部起形：从圆到脸颊和下巴\u003c/a>\u003c/td>\n\u003ctd>正面头部外轮廓怎样起形\u003c/td>\n\u003ctd>已完成六步骤图\u003c/td>\n\u003ctd>画三张轮廓，改变下巴点，能说出脸形变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-02\">02 · 眼睛在脸上的什么位置\u003c/a>\u003c/td>\n\u003ctd>先决定双眼所在区域和间距\u003c/td>\n\u003ctd>同一头型上高低、间距的对照\u003c/td>\n\u003ctd>用简单眼形占位，比较两种安排，不加睫毛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-03\">03 · 一只眼睛的外形怎么画\u003c/a>\u003c/td>\n\u003ctd>上下眼睑怎样形成眼部边界\u003c/td>\n\u003ctd>外眼角、内眼角与上下眼睑分步图\u003c/td>\n\u003ctd>画三个简化眼形，能指出边界和开合方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-04\">04 · 虹膜和瞳孔放在哪里\u003c/a>\u003c/td>\n\u003ctd>眼睑遮挡虹膜的关系\u003c/td>\n\u003ctd>完整圆形辅助线与可见部分对照\u003c/td>\n\u003ctd>在同一眼形中放虹膜，检查是否露得过多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-05\">05 · 两只眼睛怎样配成一对\u003c/a>\u003c/td>\n\u003ctd>尺寸、眼角高度与视线怎样协调\u003c/td>\n\u003ctd>单眼正确但配对失衡的修改示意\u003c/td>\n\u003ctd>画一对眼，挑一项位置差异修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-06\">06 · 眉毛怎样放在眼睛上方\u003c/a>\u003c/td>\n\u003ctd>眉形、距离和倾斜怎样影响神态\u003c/td>\n\u003ctd>同一双眼配三种简单眉形\u003c/td>\n\u003ctd>保持眼睛不变，比较眉毛变化的效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-07\">07 · 简化的鼻子怎样定位\u003c/a>\u003c/td>\n\u003ctd>鼻子与中线、眼睛、嘴的关系\u003c/td>\n\u003ctd>正面简化鼻子的定位与少量表达方式\u003c/td>\n\u003ctd>用少量线或色块提示鼻子，不深入侧面结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-08\">08 · 闭合的小嘴怎么画\u003c/a>\u003c/td>\n\u003ctd>嘴的位置、宽度和嘴角怎样安排\u003c/td>\n\u003ctd>放置嘴部的分步图与宽窄对照\u003c/td>\n\u003ctd>给同一张脸画三种小幅度闭嘴形状\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-09\">09 · 张开的小嘴怎么画\u003c/a>\u003c/td>\n\u003ctd>开口外形与口腔暗部怎样区分\u003c/td>\n\u003ctd>小圆口、小张口的形状拆解\u003c/td>\n\u003ctd>画两种小开口，能看清外形与内部暗部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-10\">10 · 把五官放回同一张脸\u003c/a>\u003c/td>\n\u003ctd>从整体检查位置关系\u003c/td>\n\u003ctd>草图、主要问题、修改后的并排图\u003c/td>\n\u003ctd>完成一张脸，只挑最影响协调的一项修改\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>本阶段 01—10 已完成，每篇都有配图、逐步讲解、小练习及阅读导航。可以从第 01 篇顺序阅读，也可以点击对应小问题回查。\u003c/p>\n\u003cp>\u003cstrong>本阶段的约束：\u003c/strong> 不把某一种眼高、眼距或头身比例写成适用于所有角色的固定公式。使用明确的示例和参考比较，让你理解“可以怎样调整”。\u003c/p>\n\u003ch3 id=\"1118\">第二阶段：完成第一个角色头像（11—18）\u003c/h3>\n\u003cp>阶段成果：一个带发型、帽子和底色的简单头像。此时就可以用它做头像展示，或继续做表情练习。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-11\">11 · 刘海先画成几大块\u003c/a>\u003c/td>\n\u003ctd>怎样确定刘海外轮廓和主要分组\u003c/td>\n\u003ctd>头部底稿上逐步增加刘海的过程\u003c/td>\n\u003ctd>用少量大块表现刘海，暂不逐根画发丝\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-12\">12 · 侧发和后发怎样包住头\u003c/a>\u003c/td>\n\u003ctd>头发外形与头部底稿的关系\u003c/td>\n\u003ctd>头部、侧发、后发的前后关系示意\u003c/td>\n\u003ctd>保留头部体积，在两侧增加发型轮廓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-13\">13 · 辫子怎样概括\u003c/a>\u003c/td>\n\u003ctd>怎样用连续的大块表达编织走向\u003c/td>\n\u003ctd>一小段辫子的简化步骤\u003c/td>\n\u003ctd>画一段清楚的辫子，连接到现有发型\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-14\">14 · 帽子怎样放在头上\u003c/a>\u003c/td>\n\u003ctd>帽身、帽檐与头部怎样组合\u003c/td>\n\u003ctd>帽檐椭圆和帽身的大形示意\u003c/td>\n\u003ctd>画正面帽子，检查是否有空间容纳头部\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-15\">15 · 脖子怎样接到肩膀\u003c/a>\u003c/td>\n\u003ctd>头、颈、肩的基本连接\u003c/td>\n\u003ctd>简化颈肩的逐步连接图\u003c/td>\n\u003ctd>为头像补出简单肩部，避免头部悬空\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-16\">16 · 草图怎样整理成线稿\u003c/a>\u003c/td>\n\u003ctd>怎样选择并保留主要轮廓\u003c/td>\n\u003ctd>草稿线、保留线、清稿对照\u003c/td>\n\u003ctd>整理一小块线稿，能解释为什么保留这条线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-17\">17 · 底色怎样铺清楚\u003c/a>\u003c/td>\n\u003ctd>怎样区分主要颜色区域\u003c/td>\n\u003ctd>分区、底色层、合并观看的示意\u003c/td>\n\u003ctd>给头像铺有限的几种主要颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-18\">18 · 保存第一张完整头像\u003c/a>\u003c/td>\n\u003ctd>怎样在有限范围内完成一件作品\u003c/td>\n\u003ctd>从草图到完成版的检查示意\u003c/td>\n\u003ctd>保存源文件与 PNG，接受细节尚不完美\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>本阶段 11—18 已完成，每篇都有独立配图、分步说明、常见问题和小练习，可直接点击上表标题阅读。\u003c/p>\n\u003cp>\u003cstrong>本阶段的约束：\u003c/strong> 第一次可以简化饰品、衣领和发丝。学习目标是完成清楚的头像，不要求复制角色服装的所有细节。\u003c/p>\n\u003ch3 id=\"1924\">第三阶段：表情与第一次眨眼（19—24）\u003c/h3>\n\u003cp>阶段成果：几张表情卡与一次简单眨眼。使用同一张底稿，减少重复重画整张脸的负担。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-19\">19 · 微笑怎样从嘴角传到眼睛\u003c/a>\u003c/td>\n\u003ctd>嘴、眼睑和眉毛怎样协调表达微笑\u003c/td>\n\u003ctd>平静到微笑的局部变化对照\u003c/td>\n\u003ctd>改出一个轻微微笑，避免只把嘴放大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-20\">20 · 惊讶怎样表现\u003c/a>\u003c/td>\n\u003ctd>眉、眼、嘴的张开程度怎样协调\u003c/td>\n\u003ctd>同一底稿的轻度与明显惊讶\u003c/td>\n\u003ctd>做一个能辨认的惊讶，保留角色原有脸形\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-21\">21 · 害羞怎样通过视线表达\u003c/a>\u003c/td>\n\u003ctd>视线与眉嘴怎样表达含蓄情绪\u003c/td>\n\u003ctd>有无视线变化的对比\u003c/td>\n\u003ctd>保持头部角度，尝试移开视线的表情\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-22\">22 · 闭眼线怎样画\u003c/a>\u003c/td>\n\u003ctd>闭合后的眼睑位置与形状\u003c/td>\n\u003ctd>睁眼边界到闭眼线的关系\u003c/td>\n\u003ctd>保持头部不动，为底稿画闭眼状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-23\">23 · 半闭眼为什么不是把眼睛压扁\u003c/a>\u003c/td>\n\u003ctd>上眼睑怎样遮住虹膜\u003c/td>\n\u003ctd>睁眼、半闭、闭眼的放大示意\u003c/td>\n\u003ctd>画出半闭眼，让眼角位置大致稳定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#lesson-24\">24 · 把三种眼睛状态连起来\u003c/a>\u003c/td>\n\u003ctd>怎样用顺序和短暂停留读出眨眼\u003c/td>\n\u003ctd>帧顺序和粗略时间条\u003c/td>\n\u003ctd>通过动画软件或简单程序做一个粗略预览\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>本阶段 19—24 已完成独立图文教程，第 24 篇配有\u003ca href=\"blink.html\">本地眨眼预览\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>本阶段的约束：\u003c/strong> 表情图示用于讲解变化关系；实际制作时从同一底稿复制修改，避免不同生成图之间的细微差异导致画面跳动。害羞也不只靠加腮红表达。\u003c/p>\n\u003cp>完成本阶段后，如果你最想做互动作品，可以直接进入 39—42。转头和全身动作可以日后继续。\u003c/p>\n\u003ch3 id=\"2530\">第四阶段：轻微转头与简单光影（25—30）\u003c/h3>\n\u003cp>阶段成果：一个轻微侧转、带少量阴影的头像。这一阶段开始把前面的平面安排扩展为立体理解。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>25 · 球体中线怎样表示转向\u003c/td>\n\u003ctd>为什么转头后中线会偏移并弯曲\u003c/td>\n\u003ctd>同一球体从正面到轻微侧转\u003c/td>\n\u003ctd>只画球体与中线，让朝向能被看懂\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>26 · 侧转时双眼为什么不再一样宽\u003c/td>\n\u003ctd>远近侧眼睛的位置和透视变化\u003c/td>\n\u003ctd>同一头部的眼部占位示意\u003c/td>\n\u003ctd>只画轻微侧转的双眼占位，检查远近关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>27 · 侧转时鼻子和嘴怎样跟着走\u003c/td>\n\u003ctd>五官怎样属于同一个朝向\u003c/td>\n\u003ctd>正面与轻微侧转的五官关系\u003c/td>\n\u003ctd>完成一张简单侧转脸，不加入复杂仰俯视\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>28 · 歪头时整张脸怎样一起倾斜\u003c/td>\n\u003ctd>倾斜与侧转有什么不同\u003c/td>\n\u003ctd>整体轴线倾斜与局部画歪的比较\u003c/td>\n\u003ctd>画小角度歪头，保持五官内部关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>29 · 光从哪里来，阴影会落在哪里\u003c/td>\n\u003ctd>怎样先统一一个简单光源\u003c/td>\n\u003ctd>同一球体、发块在不同光向下的示意\u003c/td>\n\u003ctd>先在简单体块上区分受光与背光区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>30 · 给头像加一层简单阴影\u003c/td>\n\u003ctd>把光源判断应用到头发、脸和帽子\u003c/td>\n\u003ctd>底色到单层阴影的对照\u003c/td>\n\u003ctd>完成一个简单明暗版本，主要阴影方向一致\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>本阶段的约束：\u003c/strong> 不把头发投影、面部形体和材质反光一次讲完。先建立一个能说明原因的简单光照方案，再增加细节。\u003c/p>\n\u003ch3 id=\"3138\">第五阶段：把可爱的动作画出来（31—38）\u003c/h3>\n\u003cp>阶段成果：挥手、抱书、歪头的小姿势。可以先画上半身，再逐渐画全身。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>31 · 身体先用头、胸腔和骨盆概括\u003c/td>\n\u003ctd>怎样放置身体的三个主要部分\u003c/td>\n\u003ctd>简化体块的站姿示意\u003c/td>\n\u003ctd>先画三块的大小与位置，不画肌肉细节\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>32 · 身体怎样站稳\u003c/td>\n\u003ctd>躯干、支撑腿和脚的位置怎样配合\u003c/td>\n\u003ctd>稳定与失衡站姿的修改对照\u003c/td>\n\u003ctd>修改一个站姿，让支撑关系更清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>33 · 手臂怎样弯起来\u003c/td>\n\u003ctd>上臂、前臂与肘部怎样连接\u003c/td>\n\u003ctd>手臂直伸到弯曲的简化图\u003c/td>\n\u003ctd>用线段与简单圆柱画两种手臂姿势\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>34 · 手掌先画成一个小块\u003c/td>\n\u003ctd>怎样先确定手掌朝向和拇指一侧\u003c/td>\n\u003ctd>手掌块与简化手指分组\u003c/td>\n\u003ctd>画一个简化招手，不要求精细指节\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>35 · 腿和脚怎样接到地面\u003c/td>\n\u003ctd>腿部方向与脚的落点怎样对应\u003c/td>\n\u003ctd>简化站姿下半身示意\u003c/td>\n\u003ctd>补出站立双腿与脚，检查接地和长度关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>36 · 做一个打招呼的姿势\u003c/td>\n\u003ctd>头、肩、抬手怎样表达招呼\u003c/td>\n\u003ctd>动作草图到简化角色的过程\u003c/td>\n\u003ctd>画上半身挥手，缩小后仍能看懂动作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>37 · 做一个抱书的姿势\u003c/td>\n\u003ctd>手臂与书的前后遮挡怎样安排\u003c/td>\n\u003ctd>书、躯干、双臂分层关系\u003c/td>\n\u003ctd>画出围住书的双臂，检查有没有相互穿插\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>38 · 做一个安静歪头的姿势\u003c/td>\n\u003ctd>头与肩的关系怎样表达轻微动作\u003c/td>\n\u003ctd>中性站姿到歪头的变化\u003c/td>\n\u003ctd>在已有姿势上改头肩，保留稳定的身体\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>本阶段的约束：\u003c/strong> 简化手和身体也要解释连接关系。衣服先跟随姿势，不把服饰细化当成遮盖动作问题的方法。\u003c/p>\n\u003ch3 id=\"3942\">第六阶段：用编程做一个会回应的角色（39—42）\u003c/h3>\n\u003cp>阶段成果：一个可运行的小作品。延续你熟悉的编程方式；具体框架在实际写作时根据已有项目确定，不预设复杂技术栈。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号与文章主题\u003c/th>\n\u003cth>这篇只解决什么问题\u003c/th>\n\u003cth>配图计划\u003c/th>\n\u003cth>练习与完成判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>39 · 怎样导出不会跳动的表情素材\u003c/td>\n\u003ctd>画布、人物位置和透明背景怎样保持一致\u003c/td>\n\u003ctd>同一锚点对齐与错误跳动对照\u003c/td>\n\u003ctd>导出睁眼、半闭、闭眼、微笑并检查对齐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>40 · 怎样调整眨眼的节奏\u003c/td>\n\u003ctd>眼睑状态的停留时间怎样影响观感\u003c/td>\n\u003ctd>同样几帧不同节奏的时间条\u003c/td>\n\u003ctd>比较两种播放节奏，选一个自然的版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>41 · 点击后怎样切到微笑再恢复\u003c/td>\n\u003ctd>如何组织一次简单表情响应\u003c/td>\n\u003ctd>默认、反馈、恢复的状态示意\u003c/td>\n\u003ctd>点击后微笑，结束后恢复，避免眨眼状态冲突\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>42 · 完成并保存自己的角色小作品\u003c/td>\n\u003ctd>怎样把已有素材与交互整理成可用成品\u003c/td>\n\u003ctd>作品界面与文件关系示意\u003c/td>\n\u003ctd>运行、检查、记录版本，保留替换画稿的入口\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>第 24 篇负责第一次“动起来”的粗略预览；第 39—42 篇负责整理素材、调整节奏和完成交互，两者不重复展开相同内容。\u003c/p>\n\u003ch2 id=\"5\">5. 工具补充篇：遇到问题时再读\u003c/h2>\n\u003cp>这些内容不占主线编号，可以按需要补写。已有总指南中的简要说明可先用于起步。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>补充篇\u003c/th>\n\u003cth>适用情况\u003c/th>\n\u003cth>最小完成目标\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>工具 A · 数位板压感与基本控笔\u003c/td>\n\u003ctd>刚拿到设备，落笔不顺或没有压感\u003c/td>\n\u003ctd>能稳定落笔，能检查压感是否工作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具 B · 图层到底怎样用\u003c/td>\n\u003ctd>搞不清草图、线稿与底色的关系\u003c/td>\n\u003ctd>建两个图层，隐藏一个，独立修改另一个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具 C · 平移、旋转和防抖\u003c/td>\n\u003ctd>画线姿势不舒服，局部难以落笔\u003c/td>\n\u003ctd>调整画布与防抖，画一段更舒服的曲线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具 D · 保存源文件与透明 PNG\u003c/td>\n\u003ctd>导出后不能修改，或背景不透明\u003c/td>\n\u003ctd>保留源文件，并导出一张可用的透明图片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具 E · 看参考与请求反馈\u003c/td>\n\u003ctd>不知道怎么观察和提问\u003c/td>\n\u003ctd>指出一个具体差异，并提出能回答的问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Live2D、完整人体系统、复杂服装褶皱、场景背景、透视空间和三维制作可以另开后续系列。本系列先把头像、表情、简单动作和互动作品这条路线讲清楚。\u003c/p>\n\u003ch2 id=\"6\">6. 每篇教程都采用同一套写法\u003c/h2>\n\u003cp>为了让你打开下一篇时仍然知道怎么学，每篇固定包含以下内容。篇幅由问题决定，不为凑字数重复内容。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>本篇的小目标。\u003c/strong> 用一句话说明今天要画出什么，并列出必要前置知识。\u003c/li>\n\u003cli>\u003cstrong>为什么需要这一步。\u003c/strong> 解释它在实际画面中解决什么问题。\u003c/li>\n\u003cli>\u003cstrong>结果与分步图。\u003c/strong> 先知道目标长什么样，再说明图中的编号、颜色和标记。\u003c/li>\n\u003cli>\u003cstrong>逐步动手。\u003c/strong> 每一步讲“为什么这样做、怎样落笔、怎样检查”。\u003c/li>\n\u003cli>\u003cstrong>一个变化对比。\u003c/strong> 尽可能只改变一个条件，展示它怎样影响结果。\u003c/li>\n\u003cli>\u003cstrong>常见问题与修正。\u003c/strong> 把“怪怪的”转成能检查的位置、形状或关系。\u003c/li>\n\u003cli>\u003cstrong>三次小练习。\u003c/strong> 跟画一次、自己做一次、只改一个条件再做一次；成品整理篇可用对应的小任务替代。\u003c/li>\n\u003cli>\u003cstrong>可以结束的标准。\u003c/strong> 用可观察的行为判断，而不是要求“画得好看”。\u003c/li>\n\u003cli>\u003cstrong>下一篇衔接。\u003c/strong> 说明下一篇为什么在这里出现，引用已经写好的相关教程。\u003c/li>\n\u003c/ol>\n\u003cp>默认先安排二十到四十分钟的尝试范围。整合作品可以分多次完成，时长只用于控制任务大小，不作为必须达到的速度。\u003c/p>\n\u003ch2 id=\"7\">7. 配图怎么做，才能帮助学习？\u003c/h2>\n\u003ch3 id=\"_2\">每张图必须回答一个问题\u003c/h3>\n\u003cp>比如，讲“下巴位置改变脸长”，就固定辅助圆的大小，只移动下巴点；讲“半闭眼”，就固定头部和眼角，展示眼睑遮挡变化。\u003c/p>\n\u003cp>大部分正文计划使用一张核心教学图。确实需要时，再增加局部放大或修改对照，不用装饰性插画挤占说明空间。\u003c/p>\n\u003ch3 id=\"_3\">图中的文字和说明分工\u003c/h3>\n\u003cul>\n\u003cli>图内以编号、辅助线、少量明确标记为主。\u003c/li>\n\u003cli>较长的中文解释放在 Markdown 正文中，便于搜索、修改和阅读。\u003c/li>\n\u003cli>同一分步图尽量保持比例、方向和构图一致。\u003c/li>\n\u003cli>讲解中明确哪些线是辅助线，哪些线属于最终画面。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_4\">生成后逐张检查\u003c/h3>\n\u003cp>imagegen 适合生成角色与绘画示意；生成结果仍需要检查。检查重点包括：编号是否正确、每格新增内容是否清楚、五官和肢体是否合理、图与文字是否一致。\u003c/p>\n\u003cp>用于动画的图，必须额外区分“变化关系示意”和“可直接播放的对齐帧”。用于比例对比的图，要检查是否只有预定条件发生变化。若生成图做不到精确对照，就调整图或讲法，不把它当作精确模板。\u003c/p>\n\u003ch2 id=\"8\">8. 怎么保持学习轻松，又能看见进步？\u003c/h2>\n\u003cp>可以先尝试每周两到三篇小课，并留一次时间画自己喜欢的东西。忙时减少，兴致高时也可以多花时间在同一个问题上；不用给全部 42 篇设一个硬性结课日期。\u003c/p>\n\u003cp>每篇记录三句话就够了：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">我今天理解的一个关系：\n我改动的一处地方：\n我最喜欢的一个细节：\n\u003c/code>\u003c/pre>\n\u003cp>遇到困难时，先缩小作业。例如只画一对眼睛、一个嘴形、一段手臂，而不是为了练其中一部分重新画整个人。\u003c/p>\n\u003cp>你也可以在刚会画头部外轮廓时就尝试洛琪希，在还没学上色时就画微笑。目录提供的是可回查的顺序，创作兴趣可以随时穿插进去。\u003c/p>\n\u003ch2 id=\"9\">9. 文件组织与当前进度\u003c/h2>\n\u003cp>计划沿用现有文件夹，HTML 阅读版集中在 \u003ccode>index.html\u003c/code>，所有正式教程也按编号保存为独立 Markdown 源稿。图像放进 \u003ccode>assets/\u003c/code>，正文使用相对路径引用。已有文件不为统一命名而强行更名。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">从零开始学绘画/\n├── 00-系列总计划与目录.md                 已完成\n├── 从零开始学板绘：画出喜欢的洛琪希.md   已有总指南\n├── 01-头部起形：从圆到脸颊和下巴.md     已完成\n├── 02-眼睛在脸上的什么位置.md           已完成\n├── 03—10 编号教程                       已完成，具体文件见上方目录\n├── 11—18 编号教程                       已完成，具体文件见上方目录\n├── 19—24 编号教程                       已完成\n├── 25—42 编号教程                       待写，尚未创建\n├── index.html                           HTML 阅读入口\n├── blink.html                           本地眨眼练习工具\n├── reader.css / reader.js                阅读版样式与交互\n└── assets/                              已有配图与生成记录\n\u003c/code>\u003c/pre>\n\u003cp>上方树形图包含计划中的文件名，用于说明组织方式；当前只有已标明完成或已有的内容存在。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>总指南\u003c/td>\n\u003ctd>已有图文版\u003c/td>\n\u003ctd>作为工具与学习方法参考\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>系列总计划\u003c/td>\n\u003ctd>已完成\u003c/td>\n\u003ctd>随实际练习反馈调整细分程度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 01 篇\u003c/td>\n\u003ctd>已完成，有配图\u003c/td>\n\u003ctd>阅读导航已接入第 02 篇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 02—10 篇\u003c/td>\n\u003ctd>已完成，每篇独立配图\u003c/td>\n\u003ctd>第一阶段可以完整顺序阅读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 11—18 篇\u003c/td>\n\u003ctd>已完成，每篇独立配图\u003c/td>\n\u003ctd>第二阶段可以完整顺序阅读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 19—24 篇\u003c/td>\n\u003ctd>已完成，每篇独立配图\u003c/td>\n\u003ctd>第三阶段含可用的眨眼预览\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTML 阅读版\u003c/td>\n\u003ctd>已完成，覆盖总指南与 01—24\u003c/td>\n\u003ctd>目录、放大、练习折叠与本机进度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 25—42 篇\u003c/td>\n\u003ctd>已规划，待写\u003c/td>\n\u003ctd>随阶段推进，不提前创建空文档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工具补充篇\u003c/td>\n\u003ctd>已列范围，按需写\u003c/td>\n\u003ctd>优先解决影响动笔的操作问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>每完成一篇，再把本目录中的对应标题变成真实文件链接，并更新状态。生成提示词与检查记录留在 \u003ccode>assets/\u003c/code> 的记录文件中，便于追溯和修改。\u003c/p>\n\u003ch2 id=\"10\">10. 下一篇的写作任务已经明确\u003c/h2>\n\u003cp>\u003cstrong>第 25 篇：球体中线怎样表示转向。\u003c/strong>\u003c/p>\n\u003cp>先只画球体与中线，解释为什么头部轻微侧转时，中线会偏移并弯曲。暂不加入五官、头发和复杂仰俯视；完成标志是能用几条辅助线让朝向被看懂。\u003c/p>\n\u003cp>HTML 是主要阅读版，Markdown 是正文源稿。修改 Markdown 后，阅读版不会自动同步；需运行随附的 \u003ccode>build_reader.py\u003c/code> 重新生成，方法见\u003ca href=\"HTML阅读说明.md\">阅读说明\u003c/a>。\u003c/p>", "text": "# 从零开始画出喜欢的角色：系列总计划与目录\n\n> 面向：有编程基础、没有绘画基础，想通过板绘画出喜欢的二次元角色，尤其是洛琪希，并让她露出表情、做出动作的你。\n>\n> 系列形式：以 HTML 为主要阅读入口，每课讲清一个小问题，配分步图、解释、练习和检查方法；Markdown 保留为可编辑源稿。双击 [index.html](index.html) 开始阅读。\n>\n> 当前阶段：第一至第三阶段 01—24 已完成图文教程；第 25—42 篇待写。本文件同时作为可点击阅读目录与后续写作计划。\n\n## 1. 这个系列最终要帮你做出什么？\n\n我们围绕一件可以逐步完成的作品学习：**一张自己画的角色头像，能够表达不同情绪，最后在屏幕上眨眼、回应点击。**\n\n沿途可以留下这些成果：\n\n1. 一张位置基本协调的正面脸部草图。\n2. 一张有头发、帽子和底色的洛琪希头像。\n3. 一组能看懂情绪的表情，以及简单眨眼动画。\n4. 一张略微侧转、带简单阴影的头像。\n5. 几个挥手、抱书、歪头的小姿势。\n6. 一个使用自己绘制素材的互动小作品。\n\n这些成果不要求一次达到成熟插画的精细程度。练习中的草图也可以拿来做表情、测试动画；后续可以回头替换成进步后的版本。\n\n喜欢的角色是我们反复应用知识的对象。每次学到一点，就尽量回到她的脸、发型、表情或姿势上，而不是把兴趣放到所有基础课结束以后。\n\n## 2. 怎么拆篇，才不会又变成一个很大的课程？\n\n**以一个可以观察、动手修改的问题作为一篇的边界。**\n\n例如，“眼睛怎么画”会拆成：\n\n- 眼睛在脸上的什么位置。\n- 一只眼睛的上下眼睑怎样围出外形。\n- 虹膜和瞳孔放在哪里。\n- 两只眼睛怎样配成一对。\n\n“头怎么画”也会拆成外轮廓、五官摆放、发型、转向等不同文章。当前已经完成的第 01 篇只处理正面头部外轮廓。\n\n一个具体的表情或姿势，可以作为一篇，因为它围绕同一个表达目的。但会复用前面已经学过的部件，不会在同篇里突然要求补完陌生的人体知识。\n\n每篇目标是让你能说出：**“我今天改动了什么，它为什么会让画面产生这种变化。”**\n\n## 3. 怎么阅读：先选你当前想做出的成果\n\n| 当前想实现的目标 | 建议阅读路线 | 到这里可以暂时停下来做什么 |\n| --- | --- | --- |\n| 先把脸画出来 | 01—10 | 画几个脸部草图，试着画喜欢的角色 |\n| 完成第一张彩色头像 | 01—18 | 保存、展示或作为自己的小作品素材 |\n| 最想看见可爱表情和眨眼 | 01—24 | 做表情卡和一个粗略眨眼预览 |\n| 想先结合编程 | 01—24，然后 39—42 | 做出能眨眼、点击微笑的小应用 |\n| 想画转头和立体感 | 完成头像后继续 25—30 | 画轻微侧转、带简单阴影的头像 |\n| 想画可爱的身体动作 | 完成头像后继续 31—38 | 画挥手、抱书、歪头的小姿势 |\n\n不需要把全部 42 篇读完，才能做喜欢的东西。后面的文章也不会以“前面的画必须足够漂亮”为门槛。\n\n软件不熟时，可以先查已有的[板绘入门总指南](从零开始学板绘：画出喜欢的洛琪希.md)第 2 节。细分的工具补充篇列在本文后面，需要时再写、再读。\n\n## 4. 总目录：42 篇，分六个阶段\n\n下表的“练习与完成判断”用于指导学习，不是评分标准。一篇可以做成一节练习，也可以分几天完成。\n\n**状态说明：第 01—24 篇已完成，标题可点击阅读；第 25—42 篇待写，暂不创建空文件或无效链接。**\n\n### 第一阶段：先画出一张脸（01—10）\n\n阶段成果：一张没有复杂头发、没有上色的正面脸部草图。重点是部件的位置和关系。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| [01 · 头部起形：从圆到脸颊和下巴](01-头部起形：从圆到脸颊和下巴.md) | 正面头部外轮廓怎样起形 | 已完成六步骤图 | 画三张轮廓，改变下巴点，能说出脸形变化 |\n| [02 · 眼睛在脸上的什么位置](02-眼睛在脸上的什么位置.md) | 先决定双眼所在区域和间距 | 同一头型上高低、间距的对照 | 用简单眼形占位，比较两种安排，不加睫毛 |\n| [03 · 一只眼睛的外形怎么画](03-一只眼睛的外形怎么画.md) | 上下眼睑怎样形成眼部边界 | 外眼角、内眼角与上下眼睑分步图 | 画三个简化眼形，能指出边界和开合方向 |\n| [04 · 虹膜和瞳孔放在哪里](04-虹膜和瞳孔放在哪里.md) | 眼睑遮挡虹膜的关系 | 完整圆形辅助线与可见部分对照 | 在同一眼形中放虹膜，检查是否露得过多 |\n| [05 · 两只眼睛怎样配成一对](05-两只眼睛怎样配成一对.md) | 尺寸、眼角高度与视线怎样协调 | 单眼正确但配对失衡的修改示意 | 画一对眼，挑一项位置差异修改 |\n| [06 · 眉毛怎样放在眼睛上方](06-眉毛怎样放在眼睛上方.md) | 眉形、距离和倾斜怎样影响神态 | 同一双眼配三种简单眉形 | 保持眼睛不变，比较眉毛变化的效果 |\n| [07 · 简化的鼻子怎样定位](07-简化的鼻子怎样定位.md) | 鼻子与中线、眼睛、嘴的关系 | 正面简化鼻子的定位与少量表达方式 | 用少量线或色块提示鼻子，不深入侧面结构 |\n| [08 · 闭合的小嘴怎么画](08-闭合的小嘴怎么画.md) | 嘴的位置、宽度和嘴角怎样安排 | 放置嘴部的分步图与宽窄对照 | 给同一张脸画三种小幅度闭嘴形状 |\n| [09 · 张开的小嘴怎么画](09-张开的小嘴怎么画.md) | 开口外形与口腔暗部怎样区分 | 小圆口、小张口的形状拆解 | 画两种小开口，能看清外形与内部暗部 |\n| [10 · 把五官放回同一张脸](10-把五官放回同一张脸.md) | 从整体检查位置关系 | 草图、主要问题、修改后的并排图 | 完成一张脸，只挑最影响协调的一项修改 |\n\n本阶段 01—10 已完成，每篇都有配图、逐步讲解、小练习及阅读导航。可以从第 01 篇顺序阅读，也可以点击对应小问题回查。\n\n**本阶段的约束：** 不把某一种眼高、眼距或头身比例写成适用于所有角色的固定公式。使用明确的示例和参考比较，让你理解“可以怎样调整”。\n\n### 第二阶段：完成第一个角色头像（11—18）\n\n阶段成果：一个带发型、帽子和底色的简单头像。此时就可以用它做头像展示，或继续做表情练习。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| [11 · 刘海先画成几大块](11-刘海先画成几大块.md) | 怎样确定刘海外轮廓和主要分组 | 头部底稿上逐步增加刘海的过程 | 用少量大块表现刘海，暂不逐根画发丝 |\n| [12 · 侧发和后发怎样包住头](12-侧发和后发怎样包住头.md) | 头发外形与头部底稿的关系 | 头部、侧发、后发的前后关系示意 | 保留头部体积，在两侧增加发型轮廓 |\n| [13 · 辫子怎样概括](13-辫子怎样概括.md) | 怎样用连续的大块表达编织走向 | 一小段辫子的简化步骤 | 画一段清楚的辫子，连接到现有发型 |\n| [14 · 帽子怎样放在头上](14-帽子怎样放在头上.md) | 帽身、帽檐与头部怎样组合 | 帽檐椭圆和帽身的大形示意 | 画正面帽子，检查是否有空间容纳头部 |\n| [15 · 脖子怎样接到肩膀](15-脖子怎样接到肩膀.md) | 头、颈、肩的基本连接 | 简化颈肩的逐步连接图 | 为头像补出简单肩部，避免头部悬空 |\n| [16 · 草图怎样整理成线稿](16-草图怎样整理成线稿.md) | 怎样选择并保留主要轮廓 | 草稿线、保留线、清稿对照 | 整理一小块线稿，能解释为什么保留这条线 |\n| [17 · 底色怎样铺清楚](17-底色怎样铺清楚.md) | 怎样区分主要颜色区域 | 分区、底色层、合并观看的示意 | 给头像铺有限的几种主要颜色 |\n| [18 · 保存第一张完整头像](18-保存第一张完整头像.md) | 怎样在有限范围内完成一件作品 | 从草图到完成版的检查示意 | 保存源文件与 PNG，接受细节尚不完美 |\n\n本阶段 11—18 已完成，每篇都有独立配图、分步说明、常见问题和小练习，可直接点击上表标题阅读。\n\n**本阶段的约束：** 第一次可以简化饰品、衣领和发丝。学习目标是完成清楚的头像，不要求复制角色服装的所有细节。\n\n### 第三阶段：表情与第一次眨眼（19—24）\n\n阶段成果：几张表情卡与一次简单眨眼。使用同一张底稿，减少重复重画整张脸的负担。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| [19 · 微笑怎样从嘴角传到眼睛](19-微笑怎样从嘴角传到眼睛.md) | 嘴、眼睑和眉毛怎样协调表达微笑 | 平静到微笑的局部变化对照 | 改出一个轻微微笑，避免只把嘴放大 |\n| [20 · 惊讶怎样表现](20-惊讶怎样表现.md) | 眉、眼、嘴的张开程度怎样协调 | 同一底稿的轻度与明显惊讶 | 做一个能辨认的惊讶，保留角色原有脸形 |\n| [21 · 害羞怎样通过视线表达](21-害羞怎样通过视线表达.md) | 视线与眉嘴怎样表达含蓄情绪 | 有无视线变化的对比 | 保持头部角度，尝试移开视线的表情 |\n| [22 · 闭眼线怎样画](22-闭眼线怎样画.md) | 闭合后的眼睑位置与形状 | 睁眼边界到闭眼线的关系 | 保持头部不动，为底稿画闭眼状态 |\n| [23 · 半闭眼为什么不是把眼睛压扁](23-半闭眼为什么不是把眼睛压扁.md) | 上眼睑怎样遮住虹膜 | 睁眼、半闭、闭眼的放大示意 | 画出半闭眼，让眼角位置大致稳定 |\n| [24 · 把三种眼睛状态连起来](24-把三种眼睛状态连起来.md) | 怎样用顺序和短暂停留读出眨眼 | 帧顺序和粗略时间条 | 通过动画软件或简单程序做一个粗略预览 |\n\n本阶段 19—24 已完成独立图文教程，第 24 篇配有[本地眨眼预览](blink.html)。\n\n**本阶段的约束：** 表情图示用于讲解变化关系；实际制作时从同一底稿复制修改，避免不同生成图之间的细微差异导致画面跳动。害羞也不只靠加腮红表达。\n\n完成本阶段后，如果你最想做互动作品，可以直接进入 39—42。转头和全身动作可以日后继续。\n\n### 第四阶段：轻微转头与简单光影（25—30）\n\n阶段成果：一个轻微侧转、带少量阴影的头像。这一阶段开始把前面的平面安排扩展为立体理解。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| 25 · 球体中线怎样表示转向 | 为什么转头后中线会偏移并弯曲 | 同一球体从正面到轻微侧转 | 只画球体与中线，让朝向能被看懂 |\n| 26 · 侧转时双眼为什么不再一样宽 | 远近侧眼睛的位置和透视变化 | 同一头部的眼部占位示意 | 只画轻微侧转的双眼占位，检查远近关系 |\n| 27 · 侧转时鼻子和嘴怎样跟着走 | 五官怎样属于同一个朝向 | 正面与轻微侧转的五官关系 | 完成一张简单侧转脸，不加入复杂仰俯视 |\n| 28 · 歪头时整张脸怎样一起倾斜 | 倾斜与侧转有什么不同 | 整体轴线倾斜与局部画歪的比较 | 画小角度歪头，保持五官内部关系 |\n| 29 · 光从哪里来，阴影会落在哪里 | 怎样先统一一个简单光源 | 同一球体、发块在不同光向下的示意 | 先在简单体块上区分受光与背光区域 |\n| 30 · 给头像加一层简单阴影 | 把光源判断应用到头发、脸和帽子 | 底色到单层阴影的对照 | 完成一个简单明暗版本，主要阴影方向一致 |\n\n**本阶段的约束：** 不把头发投影、面部形体和材质反光一次讲完。先建立一个能说明原因的简单光照方案，再增加细节。\n\n### 第五阶段：把可爱的动作画出来（31—38）\n\n阶段成果：挥手、抱书、歪头的小姿势。可以先画上半身，再逐渐画全身。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| 31 · 身体先用头、胸腔和骨盆概括 | 怎样放置身体的三个主要部分 | 简化体块的站姿示意 | 先画三块的大小与位置，不画肌肉细节 |\n| 32 · 身体怎样站稳 | 躯干、支撑腿和脚的位置怎样配合 | 稳定与失衡站姿的修改对照 | 修改一个站姿，让支撑关系更清楚 |\n| 33 · 手臂怎样弯起来 | 上臂、前臂与肘部怎样连接 | 手臂直伸到弯曲的简化图 | 用线段与简单圆柱画两种手臂姿势 |\n| 34 · 手掌先画成一个小块 | 怎样先确定手掌朝向和拇指一侧 | 手掌块与简化手指分组 | 画一个简化招手，不要求精细指节 |\n| 35 · 腿和脚怎样接到地面 | 腿部方向与脚的落点怎样对应 | 简化站姿下半身示意 | 补出站立双腿与脚，检查接地和长度关系 |\n| 36 · 做一个打招呼的姿势 | 头、肩、抬手怎样表达招呼 | 动作草图到简化角色的过程 | 画上半身挥手，缩小后仍能看懂动作 |\n| 37 · 做一个抱书的姿势 | 手臂与书的前后遮挡怎样安排 | 书、躯干、双臂分层关系 | 画出围住书的双臂，检查有没有相互穿插 |\n| 38 · 做一个安静歪头的姿势 | 头与肩的关系怎样表达轻微动作 | 中性站姿到歪头的变化 | 在已有姿势上改头肩，保留稳定的身体 |\n\n**本阶段的约束：** 简化手和身体也要解释连接关系。衣服先跟随姿势，不把服饰细化当成遮盖动作问题的方法。\n\n### 第六阶段：用编程做一个会回应的角色（39—42）\n\n阶段成果：一个可运行的小作品。延续你熟悉的编程方式；具体框架在实际写作时根据已有项目确定，不预设复杂技术栈。\n\n| 编号与文章主题 | 这篇只解决什么问题 | 配图计划 | 练习与完成判断 |\n| --- | --- | --- | --- |\n| 39 · 怎样导出不会跳动的表情素材 | 画布、人物位置和透明背景怎样保持一致 | 同一锚点对齐与错误跳动对照 | 导出睁眼、半闭、闭眼、微笑并检查对齐 |\n| 40 · 怎样调整眨眼的节奏 | 眼睑状态的停留时间怎样影响观感 | 同样几帧不同节奏的时间条 | 比较两种播放节奏，选一个自然的版本 |\n| 41 · 点击后怎样切到微笑再恢复 | 如何组织一次简单表情响应 | 默认、反馈、恢复的状态示意 | 点击后微笑，结束后恢复，避免眨眼状态冲突 |\n| 42 · 完成并保存自己的角色小作品 | 怎样把已有素材与交互整理成可用成品 | 作品界面与文件关系示意 | 运行、检查、记录版本，保留替换画稿的入口 |\n\n第 24 篇负责第一次“动起来”的粗略预览；第 39—42 篇负责整理素材、调整节奏和完成交互，两者不重复展开相同内容。\n\n## 5. 工具补充篇：遇到问题时再读\n\n这些内容不占主线编号，可以按需要补写。已有总指南中的简要说明可先用于起步。\n\n| 补充篇 | 适用情况 | 最小完成目标 |\n| --- | --- | --- |\n| 工具 A · 数位板压感与基本控笔 | 刚拿到设备，落笔不顺或没有压感 | 能稳定落笔，能检查压感是否工作 |\n| 工具 B · 图层到底怎样用 | 搞不清草图、线稿与底色的关系 | 建两个图层，隐藏一个，独立修改另一个 |\n| 工具 C · 平移、旋转和防抖 | 画线姿势不舒服，局部难以落笔 | 调整画布与防抖，画一段更舒服的曲线 |\n| 工具 D · 保存源文件与透明 PNG | 导出后不能修改，或背景不透明 | 保留源文件，并导出一张可用的透明图片 |\n| 工具 E · 看参考与请求反馈 | 不知道怎么观察和提问 | 指出一个具体差异，并提出能回答的问题 |\n\nLive2D、完整人体系统、复杂服装褶皱、场景背景、透视空间和三维制作可以另开后续系列。本系列先把头像、表情、简单动作和互动作品这条路线讲清楚。\n\n## 6. 每篇教程都采用同一套写法\n\n为了让你打开下一篇时仍然知道怎么学，每篇固定包含以下内容。篇幅由问题决定，不为凑字数重复内容。\n\n1. **本篇的小目标。** 用一句话说明今天要画出什么，并列出必要前置知识。\n2. **为什么需要这一步。** 解释它在实际画面中解决什么问题。\n3. **结果与分步图。** 先知道目标长什么样，再说明图中的编号、颜色和标记。\n4. **逐步动手。** 每一步讲“为什么这样做、怎样落笔、怎样检查”。\n5. **一个变化对比。** 尽可能只改变一个条件，展示它怎样影响结果。\n6. **常见问题与修正。** 把“怪怪的”转成能检查的位置、形状或关系。\n7. **三次小练习。** 跟画一次、自己做一次、只改一个条件再做一次；成品整理篇可用对应的小任务替代。\n8. **可以结束的标准。** 用可观察的行为判断，而不是要求“画得好看”。\n9. **下一篇衔接。** 说明下一篇为什么在这里出现，引用已经写好的相关教程。\n\n默认先安排二十到四十分钟的尝试范围。整合作品可以分多次完成，时长只用于控制任务大小，不作为必须达到的速度。\n\n## 7. 配图怎么做，才能帮助学习？\n\n### 每张图必须回答一个问题\n\n比如，讲“下巴位置改变脸长”，就固定辅助圆的大小，只移动下巴点；讲“半闭眼”，就固定头部和眼角，展示眼睑遮挡变化。\n\n大部分正文计划使用一张核心教学图。确实需要时，再增加局部放大或修改对照，不用装饰性插画挤占说明空间。\n\n### 图中的文字和说明分工\n\n- 图内以编号、辅助线、少量明确标记为主。\n- 较长的中文解释放在 Markdown 正文中，便于搜索、修改和阅读。\n- 同一分步图尽量保持比例、方向和构图一致。\n- 讲解中明确哪些线是辅助线，哪些线属于最终画面。\n\n### 生成后逐张检查\n\nimagegen 适合生成角色与绘画示意；生成结果仍需要检查。检查重点包括：编号是否正确、每格新增内容是否清楚、五官和肢体是否合理、图与文字是否一致。\n\n用于动画的图，必须额外区分“变化关系示意”和“可直接播放的对齐帧”。用于比例对比的图，要检查是否只有预定条件发生变化。若生成图做不到精确对照，就调整图或讲法，不把它当作精确模板。\n\n## 8. 怎么保持学习轻松，又能看见进步？\n\n可以先尝试每周两到三篇小课，并留一次时间画自己喜欢的东西。忙时减少，兴致高时也可以多花时间在同一个问题上；不用给全部 42 篇设一个硬性结课日期。\n\n每篇记录三句话就够了：\n\n```text\n我今天理解的一个关系：\n我改动的一处地方：\n我最喜欢的一个细节：\n```\n\n遇到困难时，先缩小作业。例如只画一对眼睛、一个嘴形、一段手臂，而不是为了练其中一部分重新画整个人。\n\n你也可以在刚会画头部外轮廓时就尝试洛琪希，在还没学上色时就画微笑。目录提供的是可回查的顺序，创作兴趣可以随时穿插进去。\n\n## 9. 文件组织与当前进度\n\n计划沿用现有文件夹，HTML 阅读版集中在 `index.html`，所有正式教程也按编号保存为独立 Markdown 源稿。图像放进 `assets/`，正文使用相对路径引用。已有文件不为统一命名而强行更名。\n\n```text\n从零开始学绘画/\n├── 00-系列总计划与目录.md                 已完成\n├── 从零开始学板绘：画出喜欢的洛琪希.md   已有总指南\n├── 01-头部起形：从圆到脸颊和下巴.md     已完成\n├── 02-眼睛在脸上的什么位置.md           已完成\n├── 03—10 编号教程                       已完成，具体文件见上方目录\n├── 11—18 编号教程                       已完成，具体文件见上方目录\n├── 19—24 编号教程                       已完成\n├── 25—42 编号教程                       待写，尚未创建\n├── index.html                           HTML 阅读入口\n├── blink.html                           本地眨眼练习工具\n├── reader.css / reader.js                阅读版样式与交互\n└── assets/                              已有配图与生成记录\n```\n\n上方树形图包含计划中的文件名，用于说明组织方式；当前只有已标明完成或已有的内容存在。\n\n| 范围 | 当前状态 | 下一步 |\n| --- | --- | --- |\n| 总指南 | 已有图文版 | 作为工具与学习方法参考 |\n| 系列总计划 | 已完成 | 随实际练习反馈调整细分程度 |\n| 第 01 篇 | 已完成，有配图 | 阅读导航已接入第 02 篇 |\n| 第 02—10 篇 | 已完成，每篇独立配图 | 第一阶段可以完整顺序阅读 |\n| 第 11—18 篇 | 已完成，每篇独立配图 | 第二阶段可以完整顺序阅读 |\n| 第 19—24 篇 | 已完成，每篇独立配图 | 第三阶段含可用的眨眼预览 |\n| HTML 阅读版 | 已完成，覆盖总指南与 01—24 | 目录、放大、练习折叠与本机进度 |\n| 第 25—42 篇 | 已规划，待写 | 随阶段推进，不提前创建空文档 |\n| 工具补充篇 | 已列范围，按需写 | 优先解决影响动笔的操作问题 |\n\n每完成一篇，再把本目录中的对应标题变成真实文件链接，并更新状态。生成提示词与检查记录留在 `assets/` 的记录文件中，便于追溯和修改。\n\n## 10. 下一篇的写作任务已经明确\n\n**第 25 篇：球体中线怎样表示转向。**\n\n先只画球体与中线，解释为什么头部轻微侧转时，中线会偏移并弯曲。暂不加入五官、头发和复杂仰俯视；完成标志是能用几条辅助线让朝向被看懂。\n\nHTML 是主要阅读版，Markdown 是正文源稿。修改 Markdown 后，阅读版不会自动同步；需运行随附的 `build_reader.py` 重新生成，方法见[阅读说明](HTML阅读说明.md)。\n"}, {"id": "guide", "number": null, "short": "板绘入门总指南", "file": "从零开始学板绘：画出喜欢的洛琪希.md", "html": "\u003ch1 id=\"_1\">从零开始学板绘：画出喜欢的洛琪希\u003c/h1>\n\u003cblockquote>\n\u003cp>写给有编程基础、没有绘画基础，想画出喜欢的二次元角色，也想让她露出可爱表情、做出可爱动作的你。\u003c/p>\n\u003cp>第一个目标：完成一张自己画的洛琪希小头像，再做出睁眼、闭眼、微笑三个版本。用你会的编程，让她在屏幕上眨眼、回应点击。\u003c/p>\n\u003c/blockquote>\n\u003cp>这份指南是一条可以调整的入门路线。练习安排和时间分配是针对你的目标提出的建议，不是统一的教学标准，也不承诺几周就能画到某种水平。资源链接核对于 2026 年 9 月 21 日。\u003c/p>\n\u003cp>\u003cstrong>图文版怎么读：\u003c/strong> 第 3 节看“头像从草图到上色”，第 7 节看“动作从大形到角色”，第 11 节看“表情与眨眼”。每张图都有观察方法和可以立刻动笔的小作业。图片保存在同目录的 \u003ccode>assets/\u003c/code> 中，移动笔记时一起带走即可。\u003c/p>\n\u003cp>配图以洛琪希为主题，由 AI 生成并作教学整理，用于帮助理解绘画步骤；属于简化演绎，角色细节以你选定的正式作品参考为准。各格是教学示意，做动画时请在自己的统一底稿上绘制对齐的帧。\u003c/p>\n\u003ch2 id=\"1\">1. 先回答你最关心的问题：板绘到底应该怎么学？\u003c/h2>\n\u003cp>\u003cstrong>可以看视频，但要选一套有顺序的基础教学作为主线，再用自己的练习和小作品把它学会。\u003c/strong>\u003c/p>\n\u003cp>建议采用这个循环：\u003c/p>\n\u003cp>\u003cstrong>确定一个小问题 → 看一小段讲解 → 跟着画 → 自己再画 → 对照修改 → 用到喜欢的角色上。\u003c/strong>\u003c/p>\n\u003cp>比如，今天的问题是“我画的脸总是太长”。你就学习头部比例，画几个简化头像，比较眼睛到下巴的距离，然后修改自己的洛琪希草图。今天不需要顺便看完头发、衣服、透视和光影教程。\u003c/p>\n\u003cp>你可以直接在数位板上学习绘画基础。纸上素描可以作为补充，但不必先完成一整套纸笔课程才能开始板绘。\u003c/p>\n\u003cp>把学习分成两部分会更清楚：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要学的部分\u003c/th>\n\u003cth>它解决什么问题\u003c/th>\n\u003cth>一开始怎么安排\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>工具操作\u003c/td>\n\u003ctd>笔怎么画、图层怎么用、怎样保存和上色\u003c/td>\n\u003ctd>先用几次练习掌握常用功能，之后按需查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>绘画能力\u003c/td>\n\u003ctd>形状为什么不像、五官为什么不协调、表情怎样表达\u003c/td>\n\u003ctd>持续练习观察、比例、形体、明暗和表达\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>会使用软件，是你开始画画的条件。画得越来越好，需要积累观察、尝试和修改的经验。\u003c/p>\n\u003ch2 id=\"2\">2. 先准备一个够用的板绘环境\u003c/h2>\n\u003ch3 id=\"_2\">设备怎么选\u003c/h3>\n\u003cp>如果你已经有电脑，可以从一块带压感笔的数位板开始。数位板是在板上画、看电脑屏幕；数位屏则是直接在带显示的设备上画。两者都能学习，前者需要适应手眼分离。\u003c/p>\n\u003cp>已有能正常使用的绘画设备，就先用已有设备。尚未购买时，优先确认：支持你的系统、压感正常、绘画区域和桌面空间合适、驱动和售后信息清楚。有条件可以试用，看握笔和落笔是否舒服。先不用围绕最高参数做决定。\u003c/p>\n\u003ch3 id=\"_3\">软件先固定一个\u003c/h3>\n\u003cp>本指南默认用 \u003cstrong>Krita\u003c/strong> 开始：可以从官网下载桌面版，并参考中文入门文档。如果你已经安装并习惯 CLIP STUDIO PAINT，也可以继续用它，后面的绘画练习同样适用。\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://krita.org/zh-cn/download/\">Krita 官方下载\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://docs.krita.org/zh_CN/user_manual/getting_started.html\">Krita 中文新手入门\u003c/a>：用于查新建、保存、基本概念和画布操作。\u003c/li>\n\u003cli>\u003ca href=\"https://tips.clip-studio.com/zh-cn/official\">CLIP STUDIO PAINT 官方中文教程\u003c/a>：已使用该软件时再看，不需要同时学两个软件。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"_4\">第一次打开软件，只完成这些设置\u003c/h3>\n\u003col>\n\u003cli>按设备厂商说明安装驱动，确认笔能移动光标并落笔。\u003c/li>\n\u003cli>选择一支支持压感变化的笔刷，轻画、重画各几笔，观察粗细或不透明度是否变化。\u003c/li>\n\u003cli>建一个约 \u003cstrong>1600 × 1600 像素、RGB/sRGB\u003c/strong> 的练习画布。尺寸是起步建议；电脑吃力时可以缩小。屏幕作品先关注像素尺寸。\u003c/li>\n\u003cli>选一支边缘清楚、没有明显纹理的普通笔刷。初期固定它即可。\u003c/li>\n\u003cli>认识画笔、橡皮、撤销、缩放、平移、旋转画布、新建图层、图层显隐、选区、移动和变形。\u003c/li>\n\u003cli>保存一次可编辑源文件，再导出一次 PNG。Krita 的源文件可以用 \u003ccode>.kra\u003c/code>；PNG 适合展示，但不能代替保留图层的源文件。\u003c/li>\n\u003c/ol>\n\u003cp>如果画得出线却没有压感，先检查笔刷是否启用了压感，再核对驱动和软件的输入设置。Krita 文档说明，Windows 下的 WinTab / Windows Ink 选择需要与设备驱动配置相匹配。具体排查参考 \u003ca href=\"https://docs.krita.org/zh_CN/user_manual/drawing_tablets.html\">Krita 数位板说明\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>完成标志：能新建画布，在不同图层上画两笔，隐藏其中一层，保存后重新打开。\u003c/strong> 到这里就可以开始绘画练习了。\u003c/p>\n\u003ch2 id=\"3\">3. 绘画应该按什么顺序学？\u003c/h2>\n\u003cp>下面按“尽早画出角色头像，再逐步扩展到动作”的目标排序。各项会反复穿插，不需要完全掌握上一项才允许接触下一项。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>顺序\u003c/th>\n\u003cth>学什么\u003c/th>\n\u003cth>用白话解释\u003c/th>\n\u003cth>一个具体练习\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>控笔与形状\u003c/td>\n\u003ctd>让笔画大致走到想去的地方，看清外轮廓\u003c/td>\n\u003ctd>画直线、弧线、椭圆，再用大形状概括帽子\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>观察与比例\u003c/td>\n\u003ctd>比较谁更长、更宽，彼此隔多远\u003c/td>\n\u003ctd>对照参考，比较头宽、脸长和眼睛位置\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>简单形体与透视\u003c/td>\n\u003ctd>理解物体转向后为什么变样\u003c/td>\n\u003ctd>画转向不同方向的盒子、球和圆柱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>头部与五官\u003c/td>\n\u003ctd>让五官处在同一个头部上\u003c/td>\n\u003ctd>画正面和轻微侧转的简化头像\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>头发与角色特征\u003c/td>\n\u003ctd>从大块形状组织发型、帽子和服装\u003c/td>\n\u003ctd>先画发型整体，再分出刘海和侧发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>表情设计\u003c/td>\n\u003ctd>用眉、眼、嘴和姿势表达情绪\u003c/td>\n\u003ctd>同一张脸画平静、微笑、惊讶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>平涂与简单明暗\u003c/td>\n\u003ctd>分清颜色区域，让形体有朝向\u003c/td>\n\u003ctd>底色上加一层方向一致的阴影\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>简化人体与动态\u003c/td>\n\u003ctd>表达重心、身体朝向和动作意图\u003c/td>\n\u003ctd>用头、胸腔、骨盆和四肢线画打招呼\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>动画与互动\u003c/td>\n\u003ctd>把几个状态组织成自然的变化\u003c/td>\n\u003ctd>睁眼、半闭、闭眼，组成一次眨眼\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>你想画二次元，也值得学习真实物体的结构。\u003c/strong> 比如球体和圆柱的转向，有助于理解脸部和手臂；观察自己的眉眼变化，有助于设计角色表情。这些知识最终都可以回到你喜欢的角色上。\u003c/p>\n\u003ch3 id=\"_5\">初期可以少花时间的内容\u003c/h3>\n\u003cp>复杂笔刷、华丽特效、完整人体肌肉名称、复杂背景、精细材质、长篇动画，都可以在作品需要时逐步加入。第一个头像只需要处理有限的问题：轮廓、五官位置、发型大形和简单颜色。\u003c/p>\n\u003ch3 id=\"_6\">图解一：一个头像是怎样一步步画出来的？\u003c/h3>\n\u003cp>\u003cimg alt=\"洛琪希头像的六个绘画阶段：结构、五官、头发帽子、线稿、底色、阴影\" src=\"assets/01-portrait-process.png\" />\u003c/p>\n\u003cp>\u003cstrong>阅读顺序：上排从左到右是 01—03，下排从左到右是 04—06。\u003c/strong> 每一步只增加一类信息。你自己的第一张作品做到 05，也已经可以保存和展示。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>图中编号\u003c/th>\n\u003cth>这一格在做什么\u003c/th>\n\u003cth>你动笔时先注意什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01 结构\u003c/td>\n\u003ctd>概括头部外形，用辅助线标方向和五官所在区域\u003c/td>\n\u003ctd>先比较头部的高与宽，再加颈肩；圆形只是辅助形，脸不必是标准圆\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02 五官\u003c/td>\n\u003ctd>在同一个头部上安排眼、鼻、嘴\u003c/td>\n\u003ctd>把两只眼睛一起看，比较眼距以及嘴到下巴的距离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03 大块特征\u003c/td>\n\u003ctd>加刘海、侧发、辫子和帽子的大形\u003c/td>\n\u003ctd>先看整体轮廓，辫子先画成几段连接的大块，细节可以省略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04 整理线稿\u003c/td>\n\u003ctd>根据草图选择需要保留的边界\u003c/td>\n\u003ctd>降低草图层透明度，在新层画主要轮廓，不必描回所有草稿线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05 铺底色\u003c/td>\n\u003ctd>给不同区域分配基本颜色\u003c/td>\n\u003ctd>在轮廓明确后区分皮肤、头发、帽子和衣服，先保持色块清楚\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06 加明暗\u003c/td>\n\u003ctd>用阴影和少量亮部进一步描述形体\u003c/td>\n\u003ctd>先选定光源方向，练习时只加一层简单阴影就够了\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>辅助线是定位工具。\u003c/strong> 图中的横线帮助你比较五官位置，它不是必须穿过瞳孔的标准线。不同画法会把眼睛参考线定义在眼部的不同位置，练习时先理解教程的定义，再保持一致。\u003c/p>\n\u003cp>\u003cstrong>可以照着建立的图层，从上到下：\u003c/strong> 阴影 → 线稿 → 底色 → 草图 → 背景。这是一种适合开始练习的安排。阴影层先用普通模式、低一些的不透明度就可以，之后再学限制上色范围和混合模式。\u003c/p>\n\u003cp>图中帽尖为了突出脸部局部被画框截取；你自己的完整头像若需要露出整顶帽子，应在草图阶段先给帽尖留出空间。\u003c/p>\n\u003cp>\u003cstrong>二十分钟小作业：\u003c/strong> 用五分钟画 01，五分钟加到 02，再用十分钟画头发和帽子的几个大块。今天可以停在 03。缩小画面，检查“头朝哪里、眼睛在哪里、帽子有多大”是否清楚。\u003c/p>\n\u003ch2 id=\"4\">4. 视频怎么选？该不该到处看？\u003c/h2>\n\u003ch3 id=\"_7\">给自己固定三个资源位置\u003c/h3>\n\u003cp>\u003cstrong>一个软件参考 + 一套基础主线 + 一个当前问题的补充教程。\u003c/strong>\u003c/p>\n\u003cp>软件参考解决“这个按钮怎么用”；基础主线提供学习顺序；补充教程解决“我这次画眼睛遇到了什么问题”。主线先选定一段时间，比如两周，再根据自己能否跟上、能否完成作业来调整。\u003c/p>\n\u003cp>挑主线教程时，看这些具体特征：\u003c/p>\n\u003cul>\n\u003cli>明确面向零基础，讲解比例、形体和观察方法。\u003c/li>\n\u003cli>展示草图和修改过程，并解释为什么修改。\u003c/li>\n\u003cli>有正常速度的示范，你能暂停后跟着做。\u003c/li>\n\u003cli>每节能转化成一个小练习，最好提供作业或参考。\u003c/li>\n\u003cli>教学目标接近你当前阶段，例如简化头像，而不是复杂商业立绘。\u003c/li>\n\u003c/ul>\n\u003cp>精美的加速绘画视频可以用于欣赏、了解流程。学习一个陌生知识点时，优先选择能听懂理由、看清操作的讲解。\u003c/p>\n\u003ch3 id=\"_8\">我建议你现在这样选资源\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用途\u003c/th>\n\u003cth>资源\u003c/th>\n\u003cth>现在具体看什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>软件操作，必需\u003c/td>\n\u003ctd>\u003ca href=\"https://docs.krita.org/zh_CN/user_manual/getting_started.html\">Krita 中文新手入门\u003c/a>\u003c/td>\n\u003ctd>首次使用、基础概念、视图控制；边查边操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>绘画基础，可作主线\u003c/td>\n\u003ctd>\u003ca href=\"https://www.ctrlpaint.com/library\">Ctrl+Paint 免费课程目录\u003c/a>\u003c/td>\n\u003ctd>从观察比例、概括形体、线条和基础明暗中按下面顺序选课\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中文角色专项，按需\u003c/td>\n\u003ctd>在 B 站等视频平台定向搜索\u003c/td>\n\u003ctd>按下面的关键词找一套连贯的头像基础系列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动起来，完成头像后\u003c/td>\n\u003ctd>\u003ca href=\"https://docs.live2d.com/zh-CHS/cubism-editor-tutorials/top/\">Live2D 官方中文教程\u003c/a>\u003c/td>\n\u003ctd>先看眨眼入门，再决定是否继续学习制作模型\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Ctrl+Paint 有英文短视频课程，目录包含观察测量、形体简化、线条、明暗等内容；部分课程使用 Photoshop，也有纸笔示范。这里推荐其中通用的绘画知识。你可以在 Krita 中做相同概念的练习，软件菜单与快捷键则查 Krita 文档。该资源并非专门的日系角色课程。\u003ca href=\"https://www.ctrlpaint.com/library\">课程目录与说明\u003c/a>\u003c/p>\n\u003cp>如果英文讲解理解起来费力，就用中文基础系列作为主线；没必要为了某个资源额外增加学习负担。中文课程可以依次搜索：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>板绘 零基础 观察 比例 形体 系列课\u003c/code>\u003c/li>\n\u003cli>\u003ccode>二次元 头部结构 正面 四分之三侧面 基础\u003c/code>\u003c/li>\n\u003cli>\u003ccode>二次元 表情 眉毛 眼睑 嘴型 讲解\u003c/code>\u003c/li>\n\u003cli>\u003ccode>赛璐璐 平涂 阴影 入门\u003c/code>\u003c/li>\n\u003c/ol>\n\u003cp>“四分之三侧面”就是头转向一边、仍能看到大部分正脸的角度；“赛璐璐上色”在这类教程里通常指用比较清楚的色块边界表现底色和阴影。\u003c/p>\n\u003cp>这些是搜索词，不代表我已经评估或推荐了搜索结果中的某个付费老师。\u003cstrong>先限制自己花约二十分钟选一节能够跟上的课，接着动笔。\u003c/strong>\u003c/p>\n\u003ch3 id=\"ctrlpaint\">选 Ctrl+Paint 时的最小观看顺序\u003c/h3>\n\u003cp>在课程目录中按标题查找即可，每次只选一到两节：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>Visual Measuring\u003c/code> / \u003ccode>Visual Measuring: Proportion\u003c/code>：练比较长宽和距离。\u003c/li>\n\u003cli>\u003ccode>Drawing shape: Linear Block-in\u003c/code> / \u003ccode>Negative Space\u003c/code>：练概括大轮廓，观察形状之间的空隙。\u003c/li>\n\u003cli>\u003ccode>Simplifying Form\u003c/code> / \u003ccode>Constructive Form pt. 1\u003c/code>：练把复杂对象拆成简单形体。\u003c/li>\n\u003cli>\u003ccode>Fluid Linework\u003c/code> / \u003ccode>Canvas Rotation\u003c/code>：练线条和旋转画布辅助落笔。\u003c/li>\n\u003cli>\u003ccode>Form, Value, and Light\u003c/code>：开始理解形体、明暗和光照。\u003c/li>\n\u003c/ol>\n\u003cp>每看一组，都回到自己的角色草图中应用一次。课程库剩余部分可以日后按需使用。\u003c/p>\n\u003ch3 id=\"_9\">一节课怎样才算学过？\u003c/h3>\n\u003cp>以“头部比例”为例：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>看：\u003c/strong> 看五到十五分钟，记录一个要点，例如“先比较头部外轮廓，再安排五官”。\u003c/li>\n\u003cli>\u003cstrong>跟：\u003c/strong> 暂停视频，跟画一遍，不追赶老师速度。\u003c/li>\n\u003cli>\u003cstrong>重做：\u003c/strong> 关闭步骤演示，保留参考图，自己再画一个。\u003c/li>\n\u003cli>\u003cstrong>变化：\u003c/strong> 改一个条件，例如把正脸转过去一点，或者换一个角色参考。\u003c/li>\n\u003cli>\u003cstrong>比较：\u003c/strong> 标出一处差异，修改并保存前后版本。\u003c/li>\n\u003c/ol>\n\u003cp>只看懂讲解，说明你理解了作者在说什么；能够自己画出并检查一次，才有机会发现自己还缺什么。\u003c/p>\n\u003ch2 id=\"5\">5. 每天练多久？练习和快乐怎么兼顾？\u003c/h2>\n\u003cp>先按每周四到五次、每次四十到六十分钟尝试。时间不合适就调整，周数也可以延长。建议保留一部分时间专门画喜欢的东西。\u003c/p>\n\u003cp>一次六十分钟的示例：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时长\u003c/th>\n\u003cth>做什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>5 分钟\u003c/td>\n\u003ctd>直线、弧线、椭圆热身\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10 分钟\u003c/td>\n\u003ctd>看或复习一个知识点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15 分钟\u003c/td>\n\u003ctd>做一个针对性练习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>25 分钟\u003c/td>\n\u003ctd>把它用到洛琪希头像、表情或小涂鸦上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5 分钟\u003c/td>\n\u003ctd>对照、保存、写下一次要改的地方\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>视频时间可以被反复观看某个关键片段替代。已经理解了就直接练，不用每天找新教程。\u003c/p>\n\u003cp>很累时用十五分钟版本：看参考两分钟，画十分钟，记录三分钟。只完成一个小表情也可以。中断几天后从最近的问题继续，不需要补齐“欠下的练习”。\u003c/p>\n\u003ch2 id=\"6\">6. 第一周每天怎么做：照着这一段开始\u003c/h2>\n\u003cp>这一周以熟悉工具、学会比较形状、留下第一张头像为目标。每天是一节练习，可以隔天做。\u003c/p>\n\u003ch3 id=\"1_1\">第 1 天：让笔正常工作，留下第一张画\u003c/h3>\n\u003cul>\n\u003cli>完成第 2 节的安装、压感检查和保存操作。\u003c/li>\n\u003cli>新建“草图”“线稿”两个图层，试着隐藏和显示它们。\u003c/li>\n\u003cli>选一张脸部清楚、角度接近正面、光照简单的洛琪希参考图。\u003c/li>\n\u003cli>花十五到二十分钟画头像，允许不完整，不要求像。\u003c/li>\n\u003cli>保存为 \u003ccode>day01_first_try.kra\u003c/code>，导出一张 PNG。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：能否打开自己的源文件继续画？\u003c/strong> 第一张画留下来，之后用它看进步。\u003c/p>\n\u003ch3 id=\"2_1\">第 2 天：只观察轮廓和比例\u003c/h3>\n\u003cul>\n\u003cli>看一小节观察或比例教学。\u003c/li>\n\u003cli>用直线和弧线画三个小头像轮廓，暂时省略睫毛和饰品。\u003c/li>\n\u003cli>在参考和练习上分别找头顶、下巴、脸最宽处、眼睛所在高度。\u003c/li>\n\u003cli>比较头部高宽、眼睛到下巴的距离，修改一处最明显的差异。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：能否说出“哪里偏长或偏宽”？\u003c/strong>\u003c/p>\n\u003ch3 id=\"3_1\">第 3 天：用简单形体理解头部和帽子\u003c/h3>\n\u003cul>\n\u003cli>画几个盒子、球和圆柱，标出正面与侧面。\u003c/li>\n\u003cli>给球体画一条弯曲的中线，表示它朝哪个方向。\u003c/li>\n\u003cli>用球体加简化下颌概括头部，用锥体和椭圆概括帽子。\u003c/li>\n\u003cli>画三个小草图；保留能看懂朝向的一个。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：有没有先确定整体朝向，再加细节？\u003c/strong> 初期不要求复杂透视准确。\u003c/p>\n\u003ch3 id=\"4_1\">第 4 天：把五官放进同一个头部\u003c/h3>\n\u003cul>\n\u003cli>先画头部外轮廓、中线和眼睛参考线，再放眼睛、鼻子、嘴。\u003c/li>\n\u003cli>画两个正面头像，比较眼距、嘴的位置和下巴长度。\u003c/li>\n\u003cli>缩小查看，或临时水平翻转画布，挑一处位置问题修改。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：先看整张脸是否协调，再细画单只眼睛。\u003c/strong> 二次元风格的比例可以变化，不必把某个比例公式当成所有角色的标准。\u003c/p>\n\u003ch3 id=\"5_1\">第 5 天：头发先分大块\u003c/h3>\n\u003cul>\n\u003cli>把头发概括为整体轮廓，再分刘海、侧发和后发等大块。\u003c/li>\n\u003cli>在头像上加发型和帽子，每一大块先用少量线表达。\u003c/li>\n\u003cli>做一张小尺寸预览，看角色特征是否清楚。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：缩小以后，是否仍能看出发型和帽子的形状？\u003c/strong>\u003c/p>\n\u003ch3 id=\"6_1\">第 6 天：完成一个平涂头像\u003c/h3>\n\u003cul>\n\u003cli>选前几天最喜欢的草图，降低草图图层的不透明度。\u003c/li>\n\u003cli>新建线稿层，整理主要轮廓。可以旋转画布，以舒服的方向落笔。\u003c/li>\n\u003cli>在线稿下方建颜色层，分别铺皮肤、头发、帽子和衣服的底色。\u003c/li>\n\u003cli>先保留简单颜色，保存源文件并导出 PNG。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：能否把这张图当作“第一版完成品”保存？\u003c/strong> 少画饰品或肩膀都可以。\u003c/p>\n\u003ch3 id=\"7\">第 7 天：做一次具体复盘\u003c/h3>\n\u003cul>\n\u003cli>并排看第 1 天与第 6 天的图。\u003c/li>\n\u003cli>写下两处变化，例如“眼睛位置更接近参考”“头发外形更清楚”。\u003c/li>\n\u003cli>选一个下周要解决的问题，例如“侧转时五官还是像贴在平面上”。\u003c/li>\n\u003cli>如果有精力，复制头像草图，尝试把嘴角和眼睑改成微笑。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>今天的检查：下次打开画布时，你是否知道先改什么？\u003c/strong>\u003c/p>\n\u003ch2 id=\"7_1\">7. 接下来七周的路线：每阶段留下一件小作品\u003c/h2>\n\u003cp>这里的“周”表示一个练习阶段。每周只有一两次空闲时，把一阶段扩展为两周或更久即可。完成条件只用来决定下一步，不是考试分数。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>主练内容\u003c/th>\n\u003cth>针对性练习\u003c/th>\n\u003cth>阶段作品与观察点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>第 2 周\u003c/td>\n\u003ctd>观察与头部比例\u003c/td>\n\u003ctd>根据同一参考画 4—6 个短时头像，每次只检查一种比例\u003c/td>\n\u003ctd>修订版头像；能指出并修正一处比例问题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 3 周\u003c/td>\n\u003ctd>头部转向与简单形体\u003c/td>\n\u003ctd>画正面、轻微侧转和侧面的结构草图\u003c/td>\n\u003ctd>一页头像角度练习；能大致看懂朝向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 4 周\u003c/td>\n\u003ctd>发型、帽子、颈肩\u003c/td>\n\u003ctd>先大形，后分块，再加少量细节\u003c/td>\n\u003ctd>一张简单胸像；轮廓清楚，头颈连接可理解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 5 周\u003c/td>\n\u003ctd>表情\u003c/td>\n\u003ctd>在同一底稿上画平静、微笑、惊讶，协调眉眼嘴\u003c/td>\n\u003ctd>一张三表情图；不看文字也能区分情绪\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 6 周\u003c/td>\n\u003ctd>平涂与明暗\u003c/td>\n\u003ctd>给球体和头像各设一个光源，用少量明暗色块表现\u003c/td>\n\u003ctd>一个带简单阴影的头像；主要阴影方向一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 7 周\u003c/td>\n\u003ctd>简化人体与姿势\u003c/td>\n\u003ctd>看参考，用头、胸腔、骨盆和四肢线画 5 个小姿势\u003c/td>\n\u003ctd>简单打招呼或抱书姿势；能看懂动作意图\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第 8 周\u003c/td>\n\u003ctd>小作品与互动\u003c/td>\n\u003ctd>整理头像表情图，统一画布和位置，接入程序\u003c/td>\n\u003ctd>一个能眨眼和点击微笑的小页面或应用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>遇到卡点时可以缩小作品范围：胸像改成头像，全身动作改成上半身，精细线稿改成整洁草图。你仍然可以完成一个表达明确的小作品。\u003c/p>\n\u003ch3 id=\"_10\">图解二：可爱的动作，先用简单形状表达\u003c/h3>\n\u003cp>\u003cimg alt=\"三个姿势的结构与完成示意：挥手、抱书、歪头\" src=\"assets/03-pose-construction.png\" />\u003c/p>\n\u003cp>\u003cstrong>按列看：同一列的上排是姿势概括，下排是加上角色外观后的示意。\u003c/strong> 两排比例经过简化，不需要把它们当成可以直接叠合的模板。先观察动作关系，再在自己的同一个底稿上逐步细化。\u003c/p>\n\u003cp>上排的椭圆表示头和胸腔，接近盒子的形状表示骨盆，线段表示四肢方向。蓝线用于概括身体的动作走向，帮助你观察弯曲和倾斜；它不是脊柱的精确位置，也不是重心垂线。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>姿势\u003c/th>\n\u003cth>可爱感来自哪些可观察的变化\u003c/th>\n\u003cth>第一遍只需要画什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01 挥手\u003c/td>\n\u003ctd>手抬到脸旁、手臂弯曲、身体略有倾斜，表情与招呼动作呼应\u003c/td>\n\u003ctd>头、肩线、弯曲的手臂、支撑身体的腿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02 抱书\u003c/td>\n\u003ctd>书靠近胸前，双臂围住书，肩部姿态较收敛\u003c/td>\n\u003ctd>头、胸腔、书的矩形和两条手臂的走向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03 歪头\u003c/td>\n\u003ctd>头部有轻微倾斜，身体和手的位置比较安静\u003c/td>\n\u003ctd>倾斜的头部中线、肩线、身体大形和脚的位置\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>先让动作能被读懂。\u003c/strong> 把帽子、头发和衣服细节遮住，如果简单的人形仍然像在挥手或抱书，说明动作意图已经比较明确。站姿还要检查脚是否接地、躯干是否被腿支撑；衣服花纹可以最后画。\u003c/p>\n\u003cp>\u003cstrong>十五分钟小作业：\u003c/strong> 每个姿势画三分钟，只画上排那样的大形；剩下六分钟选一个加上帽子和头发轮廓。第一遍手掌可以概括成一个小块，先处理手臂方向，再逐步学习手指。\u003c/p>\n\u003cp>如果全身太难，可以只画头到胸口：保留头的倾斜、肩的位置和手臂方向，同样能练到表演。\u003c/p>\n\u003ch2 id=\"8\">8. 临摹怎样做才有用？\u003c/h2>\n\u003cp>看参考画画是可以持续使用的方法。先给每次临摹一个目标：练轮廓、比例、表情还是明暗？一张图不必同时解决所有问题。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>怎么做\u003c/th>\n\u003cth>适合练什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>对照临摹\u003c/td>\n\u003ctd>参考放旁边，自己观察后画\u003c/td>\n\u003ctd>比较形状、距离和颜色\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>结构分析\u003c/td>\n\u003ctd>在参考上另建一层，标中线、轴线和大形体\u003c/td>\n\u003ctd>理解画面怎样组织\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>简短默画\u003c/td>\n\u003ctd>观察后关掉参考，画一个简化版本，再对照\u003c/td>\n\u003ctd>检查自己记住并理解了什么\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>变化练习\u003c/td>\n\u003ctd>保留大部分结构，只改一个表情或角度\u003c/td>\n\u003ctd>把学到的内容迁移到新情况\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>结构分析可以覆盖在参考上做，但随后最好在空白画布重画一次。默画是检查工具，不要求你以后都凭空画。分享练习时说明是临摹或分析，并记录参考作者、作品或出处。\u003c/p>\n\u003cp>一个适合你的循环是：\u003cstrong>临摹洛琪希的平静表情 → 标出眉眼嘴的位置 → 在自己的底稿上设计一个轻微微笑 → 对照检查变化是否自然。\u003c/strong>\u003c/p>\n\u003ch2 id=\"9\">9. 没有老师，我怎么知道哪里有问题？\u003c/h2>\n\u003cp>先把“画得不好”换成一个能动手修改的问题。建议按下面顺序看，避免在基础位置有偏差时反复打磨睫毛。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>整体轮廓：\u003c/strong> 头是不是过窄？帽子是不是过大？\u003c/li>\n\u003cli>\u003cstrong>比例位置：\u003c/strong> 眼睛是否过高？嘴到下巴的距离是否合适？\u003c/li>\n\u003cli>\u003cstrong>形体朝向：\u003c/strong> 头已经转向一侧，五官是否也跟着转？\u003c/li>\n\u003cli>\u003cstrong>表达：\u003c/strong> 眉、眼、嘴是否共同表达同一种情绪？\u003c/li>\n\u003cli>\u003cstrong>线条和颜色：\u003c/strong> 主要轮廓是否清楚？明暗是否遮住了表情？\u003c/li>\n\u003c/ol>\n\u003cp>每次只改最影响画面的一到两项。可以缩小图像、水平翻转，或暂时转成灰度查看明暗；这些都是帮助观察的工具，不能代替理解结构。\u003c/p>\n\u003cp>寻求反馈时，把参考、练习和你的疑问放在一起，例如：\u003c/p>\n\u003cblockquote>\n\u003cp>“我在练正面头像比例。我觉得眼睛到下巴的距离不对。请指出最值得先改的两处，并解释比较方法。”\u003c/p>\n\u003c/blockquote>\n\u003cp>可以找有绘画经验的朋友、学习社区或能看图的助手一起分析。涉及结构和风格判断时，多对照可靠参考；自动分析也可能出错。\u003c/p>\n\u003cp>每周留一条简短记录就够了：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">日期：\n今天练的问题：\n参考来源：\n我发现的一个差异：\n我做了什么修改：\n下次继续做什么：\n今天让我开心的一个细节：\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"10\">10. 什么时候报班或买课？\u003c/h2>\n\u003cp>可以先用免费资源完成前几次练习，确认自己主要卡在哪里。付费教学是否值得，优先看它能否提供你缺少的结构化指导和具体反馈。\u003c/p>\n\u003cp>试听或查看课程说明时，确认：\u003c/p>\n\u003cul>\n\u003cli>是否明确适合零基础，有没有前置要求。\u003c/li>\n\u003cli>作业量是否与你的时间匹配。\u003c/li>\n\u003cli>是否有针对个人作业的批改，由谁批改、频率怎样。\u003c/li>\n\u003cli>能否看到普通学员的作业与修改过程。\u003c/li>\n\u003cli>课程最终成果是否接近你想做的角色头像、表情或插画。\u003c/li>\n\u003c/ul>\n\u003cp>如果你总是不知道错在哪里，逐项讲解的批改可能比增加视频数量更有帮助。如果你已经知道该练什么，只是尚未动笔，可以先把现有练习完成再决定。\u003c/p>\n\u003ch2 id=\"11\">11. 如何用编程让学习更开心？\u003c/h2>\n\u003ch3 id=\"_11\">图解三：表情变化与眨眼，是两种不同的练习\u003c/h3>\n\u003cp>\u003cimg alt=\"同一角色的平静、微笑、惊讶，以及睁眼、半闭眼、闭眼示意\" src=\"assets/02-expressions-blink.png\" />\u003c/p>\n\u003cp>\u003cstrong>上排练情绪，下排练眼睑运动。\u003c/strong> 图中省略帽子，让你更容易比较脸部；观察时可以把头发和衣服暂时忽略。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>图中编号\u003c/th>\n\u003cth>观察重点\u003c/th>\n\u003cth>在自己的画上怎么做\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01 平静\u003c/td>\n\u003ctd>眼睛自然睁开，嘴部放松\u003c/td>\n\u003ctd>先把它画成统一底稿，保存一份\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>02 微笑\u003c/td>\n\u003ctd>嘴角轻轻抬起，眼睑更放松，眉眼嘴共同表达情绪\u003c/td>\n\u003ctd>复制底稿，先改嘴，再少量调整眼睑；不必把嘴画得很大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>03 惊讶\u003c/td>\n\u003ctd>眼睛更张开，眉毛略抬高，嘴形成小开口\u003c/td>\n\u003ctd>同时比较眼睛和嘴的变化，避免只放大嘴\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04 睁眼\u003c/td>\n\u003ctd>眨眼之前的常态\u003c/td>\n\u003ctd>固定脸部、头发和衣服图层，只准备修改眼睛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>05 半闭眼\u003c/td>\n\u003ctd>上眼睑下移，遮住更多虹膜\u003c/td>\n\u003ctd>保持眼角位置大致稳定，重新画眼睑覆盖关系\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>06 闭眼\u003c/td>\n\u003ctd>眼睑闭合，虹膜不可见\u003c/td>\n\u003ctd>用简洁的闭眼线表达，检查闭眼后脸是否仍是同一张脸\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>眨眼练习可以按 \u003ccode>04 → 05 → 06 → 05 → 04\u003c/code> 播放。\u003c/strong> 先尝试每个过渡帧约 40—80 毫秒，睁眼状态停留几秒，再根据效果调整。这只是用于试验的起点，动作快慢要结合你想表达的感觉。长时间保持 05，读起来可能更像困倦；短暂经过 05，则更容易读成眨眼。\u003c/p>\n\u003cp>半闭眼也不是把整只眼睛垂直压扁：注意眼睑怎样遮住虹膜，而眼角、头部和鼻子的位置基本保持稳定。\u003c/p>\n\u003cp>\u003cstrong>二十分钟小作业：\u003c/strong> 选你自己的平静头像，把眼睛单独放一层，复制出半闭和闭眼版本。通过隐藏、显示图层快速切换，检查头有没有跳动。上图各格有细微绘制差异，适合观察变化关系；制作动画时，在自己的同一张底稿上画三种状态会更稳定。\u003c/p>\n\u003ch3 id=\"_12\">把自己画的表情接进程序\u003c/h3>\n\u003cp>完成一个静态头像后，安排一个范围很小的互动项目。绘画先做到可用，程序先做到能运行。\u003c/p>\n\u003cp>建议准备同一画布尺寸、同一位置的三张透明背景图片：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">roxy_idle.png     平静、睁眼\nroxy_blink.png    闭眼\nroxy_smile.png    微笑\n\u003c/code>\u003c/pre>\n\u003cp>用你熟悉的编程方式完成：\u003c/p>\n\u003col>\n\u003cli>默认显示平静头像。\u003c/li>\n\u003cli>隔几秒短暂切到闭眼，再恢复睁眼，试着调整节奏。\u003c/li>\n\u003cli>点击头像时显示微笑，稍后恢复。\u003c/li>\n\u003cli>保持图片锚点一致，检查切换时整个头是否跳动。\u003c/li>\n\u003c/ol>\n\u003cp>之后可以增加半闭眼图片改善过渡，或者把眉、眼、嘴拆成独立图层。需要更自然的连续转头、身体变形和头发摆动时，再学习 Live2D。它的官方教程覆盖眨眼、表情与身体运动，可以从局部功能开始。\u003ca href=\"https://docs.live2d.com/zh-CHS/cubism-editor-tutorials/top/\">Live2D 官方教程\u003c/a>\u003c/p>\n\u003cp>拆图和绑定本身也是技能。你可以先用官方练习素材学软件，再根据需求准备自己的分层图稿。普通完整 PNG 无法直接保留被遮住的部位和独立部件。\u003c/p>\n\u003cp>\u003cstrong>给编程部分也设一个小范围：先只做“眨眼 + 点击微笑”。\u003c/strong> 让它帮助你展示自己的画，之后再决定要不要加聊天、语音或复杂界面。\u003c/p>\n\u003ch2 id=\"12\">12. 初学时常见的卡点\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>遇到的情况\u003c/th>\n\u003cth>下一步怎么做\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>收藏很多教程，仍然没开始\u003c/td>\n\u003ctd>选一个知识点，看十分钟，立即画一个对应练习\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线条抖，一直撤销\u003c/td>\n\u003ctd>适度使用防抖、旋转画布、用舒服的笔触长度；同时检查大轮廓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>只画精致眼睛，拼起来不像一个人\u003c/td>\n\u003ctd>先统一头部轮廓和五官位置，再细化眼睛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头发越画越乱\u003c/td>\n\u003ctd>回到整体轮廓，把发丝合并成几个大块\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跟着教程能画，自己画就停住\u003c/td>\n\u003ctd>保留参考，关闭步骤演示重画，再尝试一个小变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>练基础很枯燥\u003c/td>\n\u003ctd>每次把一个基础点应用到角色上，例如用椭圆练帽檐\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>总觉得第一张图不够好\u003c/td>\n\u003ctd>保存第一版，列一个具体问题，在第二版中解决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>连续几天没练，觉得必须重来\u003c/td>\n\u003ctd>打开最近的作品，从记录的下一个问题继续\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>你可以喜欢一个角色很多年，也可以在学习中发现自己更喜欢画表情、设计姿势或制作互动。方向可以随着作品改变。\u003c/p>\n\u003ch2 id=\"13\">13. 今天就可以完成的清单\u003c/h2>\n\u003cul>\n\u003cli>[ ] 确认绘画设备能正常工作，压感有效。\u003c/li>\n\u003cli>[ ] 固定一个软件和一支普通笔刷。\u003c/li>\n\u003cli>[ ] 学会新建图层、保存源文件、导出 PNG。\u003c/li>\n\u003cli>[ ] 选一张清楚的洛琪希正面参考，记录出处。\u003c/li>\n\u003cli>[ ] 花十五到二十分钟画第一个头像。\u003c/li>\n\u003cli>[ ] 保存它，写下一个想改的地方和一个自己喜欢的细节。\u003c/li>\n\u003c/ul>\n\u003cp>今天留下的这张画，会成为以后所有练习的起点。你喜欢她的眼神、表情和动作，接下来就可以一点点学会怎样亲手表达它们。\u003c/p>", "text": "# 从零开始学板绘：画出喜欢的洛琪希\n\n> 写给有编程基础、没有绘画基础，想画出喜欢的二次元角色，也想让她露出可爱表情、做出可爱动作的你。\n>\n> 第一个目标：完成一张自己画的洛琪希小头像，再做出睁眼、闭眼、微笑三个版本。用你会的编程，让她在屏幕上眨眼、回应点击。\n\n这份指南是一条可以调整的入门路线。练习安排和时间分配是针对你的目标提出的建议，不是统一的教学标准，也不承诺几周就能画到某种水平。资源链接核对于 2026 年 9 月 21 日。\n\n**图文版怎么读：** 第 3 节看“头像从草图到上色”，第 7 节看“动作从大形到角色”，第 11 节看“表情与眨眼”。每张图都有观察方法和可以立刻动笔的小作业。图片保存在同目录的 `assets/` 中，移动笔记时一起带走即可。\n\n配图以洛琪希为主题，由 AI 生成并作教学整理，用于帮助理解绘画步骤；属于简化演绎，角色细节以你选定的正式作品参考为准。各格是教学示意，做动画时请在自己的统一底稿上绘制对齐的帧。\n\n## 1. 先回答你最关心的问题：板绘到底应该怎么学？\n\n**可以看视频，但要选一套有顺序的基础教学作为主线，再用自己的练习和小作品把它学会。**\n\n建议采用这个循环：\n\n**确定一个小问题 → 看一小段讲解 → 跟着画 → 自己再画 → 对照修改 → 用到喜欢的角色上。**\n\n比如，今天的问题是“我画的脸总是太长”。你就学习头部比例，画几个简化头像，比较眼睛到下巴的距离，然后修改自己的洛琪希草图。今天不需要顺便看完头发、衣服、透视和光影教程。\n\n你可以直接在数位板上学习绘画基础。纸上素描可以作为补充，但不必先完成一整套纸笔课程才能开始板绘。\n\n把学习分成两部分会更清楚：\n\n| 要学的部分 | 它解决什么问题 | 一开始怎么安排 |\n| --- | --- | --- |\n| 工具操作 | 笔怎么画、图层怎么用、怎样保存和上色 | 先用几次练习掌握常用功能，之后按需查 |\n| 绘画能力 | 形状为什么不像、五官为什么不协调、表情怎样表达 | 持续练习观察、比例、形体、明暗和表达 |\n\n会使用软件，是你开始画画的条件。画得越来越好，需要积累观察、尝试和修改的经验。\n\n## 2. 先准备一个够用的板绘环境\n\n### 设备怎么选\n\n如果你已经有电脑，可以从一块带压感笔的数位板开始。数位板是在板上画、看电脑屏幕；数位屏则是直接在带显示的设备上画。两者都能学习，前者需要适应手眼分离。\n\n已有能正常使用的绘画设备，就先用已有设备。尚未购买时，优先确认：支持你的系统、压感正常、绘画区域和桌面空间合适、驱动和售后信息清楚。有条件可以试用，看握笔和落笔是否舒服。先不用围绕最高参数做决定。\n\n### 软件先固定一个\n\n本指南默认用 **Krita** 开始：可以从官网下载桌面版，并参考中文入门文档。如果你已经安装并习惯 CLIP STUDIO PAINT，也可以继续用它，后面的绘画练习同样适用。\n\n- [Krita 官方下载](https://krita.org/zh-cn/download/)\n- [Krita 中文新手入门](https://docs.krita.org/zh_CN/user_manual/getting_started.html)：用于查新建、保存、基本概念和画布操作。\n- [CLIP STUDIO PAINT 官方中文教程](https://tips.clip-studio.com/zh-cn/official)：已使用该软件时再看，不需要同时学两个软件。\n\n### 第一次打开软件，只完成这些设置\n\n1. 按设备厂商说明安装驱动，确认笔能移动光标并落笔。\n2. 选择一支支持压感变化的笔刷，轻画、重画各几笔，观察粗细或不透明度是否变化。\n3. 建一个约 **1600 × 1600 像素、RGB/sRGB** 的练习画布。尺寸是起步建议；电脑吃力时可以缩小。屏幕作品先关注像素尺寸。\n4. 选一支边缘清楚、没有明显纹理的普通笔刷。初期固定它即可。\n5. 认识画笔、橡皮、撤销、缩放、平移、旋转画布、新建图层、图层显隐、选区、移动和变形。\n6. 保存一次可编辑源文件，再导出一次 PNG。Krita 的源文件可以用 `.kra`；PNG 适合展示，但不能代替保留图层的源文件。\n\n如果画得出线却没有压感，先检查笔刷是否启用了压感，再核对驱动和软件的输入设置。Krita 文档说明，Windows 下的 WinTab / Windows Ink 选择需要与设备驱动配置相匹配。具体排查参考 [Krita 数位板说明](https://docs.krita.org/zh_CN/user_manual/drawing_tablets.html)。\n\n**完成标志：能新建画布，在不同图层上画两笔，隐藏其中一层，保存后重新打开。** 到这里就可以开始绘画练习了。\n\n## 3. 绘画应该按什么顺序学？\n\n下面按“尽早画出角色头像，再逐步扩展到动作”的目标排序。各项会反复穿插，不需要完全掌握上一项才允许接触下一项。\n\n| 顺序 | 学什么 | 用白话解释 | 一个具体练习 |\n| --- | --- | --- | --- |\n| 1 | 控笔与形状 | 让笔画大致走到想去的地方，看清外轮廓 | 画直线、弧线、椭圆，再用大形状概括帽子 |\n| 2 | 观察与比例 | 比较谁更长、更宽，彼此隔多远 | 对照参考，比较头宽、脸长和眼睛位置 |\n| 3 | 简单形体与透视 | 理解物体转向后为什么变样 | 画转向不同方向的盒子、球和圆柱 |\n| 4 | 头部与五官 | 让五官处在同一个头部上 | 画正面和轻微侧转的简化头像 |\n| 5 | 头发与角色特征 | 从大块形状组织发型、帽子和服装 | 先画发型整体，再分出刘海和侧发 |\n| 6 | 表情设计 | 用眉、眼、嘴和姿势表达情绪 | 同一张脸画平静、微笑、惊讶 |\n| 7 | 平涂与简单明暗 | 分清颜色区域，让形体有朝向 | 底色上加一层方向一致的阴影 |\n| 8 | 简化人体与动态 | 表达重心、身体朝向和动作意图 | 用头、胸腔、骨盆和四肢线画打招呼 |\n| 9 | 动画与互动 | 把几个状态组织成自然的变化 | 睁眼、半闭、闭眼，组成一次眨眼 |\n\n**你想画二次元，也值得学习真实物体的结构。** 比如球体和圆柱的转向，有助于理解脸部和手臂；观察自己的眉眼变化，有助于设计角色表情。这些知识最终都可以回到你喜欢的角色上。\n\n### 初期可以少花时间的内容\n\n复杂笔刷、华丽特效、完整人体肌肉名称、复杂背景、精细材质、长篇动画，都可以在作品需要时逐步加入。第一个头像只需要处理有限的问题：轮廓、五官位置、发型大形和简单颜色。\n\n### 图解一：一个头像是怎样一步步画出来的？\n\n![洛琪希头像的六个绘画阶段：结构、五官、头发帽子、线稿、底色、阴影](assets/01-portrait-process.png)\n\n**阅读顺序：上排从左到右是 01—03，下排从左到右是 04—06。** 每一步只增加一类信息。你自己的第一张作品做到 05，也已经可以保存和展示。\n\n| 图中编号    | 这一格在做什么               | 你动笔时先注意什么                      |\n| ------- | --------------------- | ------------------------------ |\n| 01 结构   | 概括头部外形，用辅助线标方向和五官所在区域 | 先比较头部的高与宽，再加颈肩；圆形只是辅助形，脸不必是标准圆 |\n| 02 五官   | 在同一个头部上安排眼、鼻、嘴        | 把两只眼睛一起看，比较眼距以及嘴到下巴的距离         |\n| 03 大块特征 | 加刘海、侧发、辫子和帽子的大形       | 先看整体轮廓，辫子先画成几段连接的大块，细节可以省略     |\n| 04 整理线稿 | 根据草图选择需要保留的边界         | 降低草图层透明度，在新层画主要轮廓，不必描回所有草稿线    |\n| 05 铺底色  | 给不同区域分配基本颜色           | 在轮廓明确后区分皮肤、头发、帽子和衣服，先保持色块清楚    |\n| 06 加明暗  | 用阴影和少量亮部进一步描述形体       | 先选定光源方向，练习时只加一层简单阴影就够了         |\n\n**辅助线是定位工具。** 图中的横线帮助你比较五官位置，它不是必须穿过瞳孔的标准线。不同画法会把眼睛参考线定义在眼部的不同位置，练习时先理解教程的定义，再保持一致。\n\n**可以照着建立的图层，从上到下：** 阴影 → 线稿 → 底色 → 草图 → 背景。这是一种适合开始练习的安排。阴影层先用普通模式、低一些的不透明度就可以，之后再学限制上色范围和混合模式。\n\n图中帽尖为了突出脸部局部被画框截取；你自己的完整头像若需要露出整顶帽子，应在草图阶段先给帽尖留出空间。\n\n**二十分钟小作业：** 用五分钟画 01，五分钟加到 02，再用十分钟画头发和帽子的几个大块。今天可以停在 03。缩小画面，检查“头朝哪里、眼睛在哪里、帽子有多大”是否清楚。\n\n## 4. 视频怎么选？该不该到处看？\n\n\n### 给自己固定三个资源位置\n\n**一个软件参考 + 一套基础主线 + 一个当前问题的补充教程。**\n\n软件参考解决“这个按钮怎么用”；基础主线提供学习顺序；补充教程解决“我这次画眼睛遇到了什么问题”。主线先选定一段时间，比如两周，再根据自己能否跟上、能否完成作业来调整。\n\n挑主线教程时，看这些具体特征：\n\n- 明确面向零基础，讲解比例、形体和观察方法。\n- 展示草图和修改过程，并解释为什么修改。\n- 有正常速度的示范，你能暂停后跟着做。\n- 每节能转化成一个小练习，最好提供作业或参考。\n- 教学目标接近你当前阶段，例如简化头像，而不是复杂商业立绘。\n\n精美的加速绘画视频可以用于欣赏、了解流程。学习一个陌生知识点时，优先选择能听懂理由、看清操作的讲解。\n\n### 我建议你现在这样选资源\n\n| 用途 | 资源 | 现在具体看什么 |\n| --- | --- | --- |\n| 软件操作，必需 | [Krita 中文新手入门](https://docs.krita.org/zh_CN/user_manual/getting_started.html) | 首次使用、基础概念、视图控制；边查边操作 |\n| 绘画基础，可作主线 | [Ctrl+Paint 免费课程目录](https://www.ctrlpaint.com/library) | 从观察比例、概括形体、线条和基础明暗中按下面顺序选课 |\n| 中文角色专项，按需 | 在 B 站等视频平台定向搜索 | 按下面的关键词找一套连贯的头像基础系列 |\n| 动起来，完成头像后 | [Live2D 官方中文教程](https://docs.live2d.com/zh-CHS/cubism-editor-tutorials/top/) | 先看眨眼入门，再决定是否继续学习制作模型 |\n\nCtrl+Paint 有英文短视频课程，目录包含观察测量、形体简化、线条、明暗等内容；部分课程使用 Photoshop，也有纸笔示范。这里推荐其中通用的绘画知识。你可以在 Krita 中做相同概念的练习，软件菜单与快捷键则查 Krita 文档。该资源并非专门的日系角色课程。[课程目录与说明](https://www.ctrlpaint.com/library)\n\n如果英文讲解理解起来费力，就用中文基础系列作为主线；没必要为了某个资源额外增加学习负担。中文课程可以依次搜索：\n\n1. `板绘 零基础 观察 比例 形体 系列课`\n2. `二次元 头部结构 正面 四分之三侧面 基础`\n3. `二次元 表情 眉毛 眼睑 嘴型 讲解`\n4. `赛璐璐 平涂 阴影 入门`\n\n“四分之三侧面”就是头转向一边、仍能看到大部分正脸的角度；“赛璐璐上色”在这类教程里通常指用比较清楚的色块边界表现底色和阴影。\n\n这些是搜索词，不代表我已经评估或推荐了搜索结果中的某个付费老师。**先限制自己花约二十分钟选一节能够跟上的课，接着动笔。**\n\n### 选 Ctrl+Paint 时的最小观看顺序\n\n在课程目录中按标题查找即可，每次只选一到两节：\n\n1. `Visual Measuring` / `Visual Measuring: Proportion`：练比较长宽和距离。\n2. `Drawing shape: Linear Block-in` / `Negative Space`：练概括大轮廓，观察形状之间的空隙。\n3. `Simplifying Form` / `Constructive Form pt. 1`：练把复杂对象拆成简单形体。\n4. `Fluid Linework` / `Canvas Rotation`：练线条和旋转画布辅助落笔。\n5. `Form, Value, and Light`：开始理解形体、明暗和光照。\n\n每看一组，都回到自己的角色草图中应用一次。课程库剩余部分可以日后按需使用。\n\n### 一节课怎样才算学过？\n\n以“头部比例”为例：\n\n1. **看：** 看五到十五分钟，记录一个要点，例如“先比较头部外轮廓，再安排五官”。\n2. **跟：** 暂停视频，跟画一遍，不追赶老师速度。\n3. **重做：** 关闭步骤演示，保留参考图，自己再画一个。\n4. **变化：** 改一个条件，例如把正脸转过去一点，或者换一个角色参考。\n5. **比较：** 标出一处差异，修改并保存前后版本。\n\n只看懂讲解，说明你理解了作者在说什么；能够自己画出并检查一次，才有机会发现自己还缺什么。\n\n## 5. 每天练多久？练习和快乐怎么兼顾？\n\n先按每周四到五次、每次四十到六十分钟尝试。时间不合适就调整，周数也可以延长。建议保留一部分时间专门画喜欢的东西。\n\n一次六十分钟的示例：\n\n| 时长 | 做什么 |\n| --- | --- |\n| 5 分钟 | 直线、弧线、椭圆热身 |\n| 10 分钟 | 看或复习一个知识点 |\n| 15 分钟 | 做一个针对性练习 |\n| 25 分钟 | 把它用到洛琪希头像、表情或小涂鸦上 |\n| 5 分钟 | 对照、保存、写下一次要改的地方 |\n\n视频时间可以被反复观看某个关键片段替代。已经理解了就直接练，不用每天找新教程。\n\n很累时用十五分钟版本：看参考两分钟，画十分钟，记录三分钟。只完成一个小表情也可以。中断几天后从最近的问题继续，不需要补齐“欠下的练习”。\n\n## 6. 第一周每天怎么做：照着这一段开始\n\n这一周以熟悉工具、学会比较形状、留下第一张头像为目标。每天是一节练习，可以隔天做。\n\n### 第 1 天：让笔正常工作，留下第一张画\n\n- 完成第 2 节的安装、压感检查和保存操作。\n- 新建“草图”“线稿”两个图层，试着隐藏和显示它们。\n- 选一张脸部清楚、角度接近正面、光照简单的洛琪希参考图。\n- 花十五到二十分钟画头像，允许不完整，不要求像。\n- 保存为 `day01_first_try.kra`，导出一张 PNG。\n\n**今天的检查：能否打开自己的源文件继续画？** 第一张画留下来，之后用它看进步。\n\n### 第 2 天：只观察轮廓和比例\n\n- 看一小节观察或比例教学。\n- 用直线和弧线画三个小头像轮廓，暂时省略睫毛和饰品。\n- 在参考和练习上分别找头顶、下巴、脸最宽处、眼睛所在高度。\n- 比较头部高宽、眼睛到下巴的距离，修改一处最明显的差异。\n\n**今天的检查：能否说出“哪里偏长或偏宽”？**\n\n### 第 3 天：用简单形体理解头部和帽子\n\n- 画几个盒子、球和圆柱，标出正面与侧面。\n- 给球体画一条弯曲的中线，表示它朝哪个方向。\n- 用球体加简化下颌概括头部，用锥体和椭圆概括帽子。\n- 画三个小草图；保留能看懂朝向的一个。\n\n**今天的检查：有没有先确定整体朝向，再加细节？** 初期不要求复杂透视准确。\n\n### 第 4 天：把五官放进同一个头部\n\n- 先画头部外轮廓、中线和眼睛参考线，再放眼睛、鼻子、嘴。\n- 画两个正面头像，比较眼距、嘴的位置和下巴长度。\n- 缩小查看，或临时水平翻转画布，挑一处位置问题修改。\n\n**今天的检查：先看整张脸是否协调，再细画单只眼睛。** 二次元风格的比例可以变化，不必把某个比例公式当成所有角色的标准。\n\n### 第 5 天：头发先分大块\n\n- 把头发概括为整体轮廓，再分刘海、侧发和后发等大块。\n- 在头像上加发型和帽子，每一大块先用少量线表达。\n- 做一张小尺寸预览，看角色特征是否清楚。\n\n**今天的检查：缩小以后，是否仍能看出发型和帽子的形状？**\n\n### 第 6 天：完成一个平涂头像\n\n- 选前几天最喜欢的草图，降低草图图层的不透明度。\n- 新建线稿层，整理主要轮廓。可以旋转画布，以舒服的方向落笔。\n- 在线稿下方建颜色层，分别铺皮肤、头发、帽子和衣服的底色。\n- 先保留简单颜色，保存源文件并导出 PNG。\n\n**今天的检查：能否把这张图当作“第一版完成品”保存？** 少画饰品或肩膀都可以。\n\n### 第 7 天：做一次具体复盘\n\n- 并排看第 1 天与第 6 天的图。\n- 写下两处变化，例如“眼睛位置更接近参考”“头发外形更清楚”。\n- 选一个下周要解决的问题，例如“侧转时五官还是像贴在平面上”。\n- 如果有精力，复制头像草图，尝试把嘴角和眼睑改成微笑。\n\n**今天的检查：下次打开画布时，你是否知道先改什么？**\n\n## 7. 接下来七周的路线：每阶段留下一件小作品\n\n这里的“周”表示一个练习阶段。每周只有一两次空闲时，把一阶段扩展为两周或更久即可。完成条件只用来决定下一步，不是考试分数。\n\n| 阶段 | 主练内容 | 针对性练习 | 阶段作品与观察点 |\n| --- | --- | --- | --- |\n| 第 2 周 | 观察与头部比例 | 根据同一参考画 4—6 个短时头像，每次只检查一种比例 | 修订版头像；能指出并修正一处比例问题 |\n| 第 3 周 | 头部转向与简单形体 | 画正面、轻微侧转和侧面的结构草图 | 一页头像角度练习；能大致看懂朝向 |\n| 第 4 周 | 发型、帽子、颈肩 | 先大形，后分块，再加少量细节 | 一张简单胸像；轮廓清楚，头颈连接可理解 |\n| 第 5 周 | 表情 | 在同一底稿上画平静、微笑、惊讶，协调眉眼嘴 | 一张三表情图；不看文字也能区分情绪 |\n| 第 6 周 | 平涂与明暗 | 给球体和头像各设一个光源，用少量明暗色块表现 | 一个带简单阴影的头像；主要阴影方向一致 |\n| 第 7 周 | 简化人体与姿势 | 看参考，用头、胸腔、骨盆和四肢线画 5 个小姿势 | 简单打招呼或抱书姿势；能看懂动作意图 |\n| 第 8 周 | 小作品与互动 | 整理头像表情图，统一画布和位置，接入程序 | 一个能眨眼和点击微笑的小页面或应用 |\n\n遇到卡点时可以缩小作品范围：胸像改成头像，全身动作改成上半身，精细线稿改成整洁草图。你仍然可以完成一个表达明确的小作品。\n\n### 图解二：可爱的动作，先用简单形状表达\n\n![三个姿势的结构与完成示意：挥手、抱书、歪头](assets/03-pose-construction.png)\n\n**按列看：同一列的上排是姿势概括，下排是加上角色外观后的示意。** 两排比例经过简化，不需要把它们当成可以直接叠合的模板。先观察动作关系，再在自己的同一个底稿上逐步细化。\n\n上排的椭圆表示头和胸腔，接近盒子的形状表示骨盆，线段表示四肢方向。蓝线用于概括身体的动作走向，帮助你观察弯曲和倾斜；它不是脊柱的精确位置，也不是重心垂线。\n\n| 姿势 | 可爱感来自哪些可观察的变化 | 第一遍只需要画什么 |\n| --- | --- | --- |\n| 01 挥手 | 手抬到脸旁、手臂弯曲、身体略有倾斜，表情与招呼动作呼应 | 头、肩线、弯曲的手臂、支撑身体的腿 |\n| 02 抱书 | 书靠近胸前，双臂围住书，肩部姿态较收敛 | 头、胸腔、书的矩形和两条手臂的走向 |\n| 03 歪头 | 头部有轻微倾斜，身体和手的位置比较安静 | 倾斜的头部中线、肩线、身体大形和脚的位置 |\n\n**先让动作能被读懂。** 把帽子、头发和衣服细节遮住，如果简单的人形仍然像在挥手或抱书，说明动作意图已经比较明确。站姿还要检查脚是否接地、躯干是否被腿支撑；衣服花纹可以最后画。\n\n**十五分钟小作业：** 每个姿势画三分钟，只画上排那样的大形；剩下六分钟选一个加上帽子和头发轮廓。第一遍手掌可以概括成一个小块，先处理手臂方向，再逐步学习手指。\n\n如果全身太难，可以只画头到胸口：保留头的倾斜、肩的位置和手臂方向，同样能练到表演。\n\n## 8. 临摹怎样做才有用？\n\n看参考画画是可以持续使用的方法。先给每次临摹一个目标：练轮廓、比例、表情还是明暗？一张图不必同时解决所有问题。\n\n| 方法 | 怎么做 | 适合练什么 |\n| --- | --- | --- |\n| 对照临摹 | 参考放旁边，自己观察后画 | 比较形状、距离和颜色 |\n| 结构分析 | 在参考上另建一层，标中线、轴线和大形体 | 理解画面怎样组织 |\n| 简短默画 | 观察后关掉参考，画一个简化版本，再对照 | 检查自己记住并理解了什么 |\n| 变化练习 | 保留大部分结构，只改一个表情或角度 | 把学到的内容迁移到新情况 |\n\n结构分析可以覆盖在参考上做，但随后最好在空白画布重画一次。默画是检查工具，不要求你以后都凭空画。分享练习时说明是临摹或分析，并记录参考作者、作品或出处。\n\n一个适合你的循环是：**临摹洛琪希的平静表情 → 标出眉眼嘴的位置 → 在自己的底稿上设计一个轻微微笑 → 对照检查变化是否自然。**\n\n## 9. 没有老师，我怎么知道哪里有问题？\n\n先把“画得不好”换成一个能动手修改的问题。建议按下面顺序看，避免在基础位置有偏差时反复打磨睫毛。\n\n1. **整体轮廓：** 头是不是过窄？帽子是不是过大？\n2. **比例位置：** 眼睛是否过高？嘴到下巴的距离是否合适？\n3. **形体朝向：** 头已经转向一侧，五官是否也跟着转？\n4. **表达：** 眉、眼、嘴是否共同表达同一种情绪？\n5. **线条和颜色：** 主要轮廓是否清楚？明暗是否遮住了表情？\n\n每次只改最影响画面的一到两项。可以缩小图像、水平翻转，或暂时转成灰度查看明暗；这些都是帮助观察的工具，不能代替理解结构。\n\n寻求反馈时，把参考、练习和你的疑问放在一起，例如：\n\n> “我在练正面头像比例。我觉得眼睛到下巴的距离不对。请指出最值得先改的两处，并解释比较方法。”\n\n可以找有绘画经验的朋友、学习社区或能看图的助手一起分析。涉及结构和风格判断时，多对照可靠参考；自动分析也可能出错。\n\n每周留一条简短记录就够了：\n\n```text\n日期：\n今天练的问题：\n参考来源：\n我发现的一个差异：\n我做了什么修改：\n下次继续做什么：\n今天让我开心的一个细节：\n```\n\n## 10. 什么时候报班或买课？\n\n可以先用免费资源完成前几次练习，确认自己主要卡在哪里。付费教学是否值得，优先看它能否提供你缺少的结构化指导和具体反馈。\n\n试听或查看课程说明时，确认：\n\n- 是否明确适合零基础，有没有前置要求。\n- 作业量是否与你的时间匹配。\n- 是否有针对个人作业的批改，由谁批改、频率怎样。\n- 能否看到普通学员的作业与修改过程。\n- 课程最终成果是否接近你想做的角色头像、表情或插画。\n\n如果你总是不知道错在哪里，逐项讲解的批改可能比增加视频数量更有帮助。如果你已经知道该练什么，只是尚未动笔，可以先把现有练习完成再决定。\n\n## 11. 如何用编程让学习更开心？\n\n### 图解三：表情变化与眨眼，是两种不同的练习\n\n![同一角色的平静、微笑、惊讶，以及睁眼、半闭眼、闭眼示意](assets/02-expressions-blink.png)\n\n**上排练情绪，下排练眼睑运动。** 图中省略帽子，让你更容易比较脸部；观察时可以把头发和衣服暂时忽略。\n\n| 图中编号 | 观察重点 | 在自己的画上怎么做 |\n| --- | --- | --- |\n| 01 平静 | 眼睛自然睁开，嘴部放松 | 先把它画成统一底稿，保存一份 |\n| 02 微笑 | 嘴角轻轻抬起，眼睑更放松，眉眼嘴共同表达情绪 | 复制底稿，先改嘴，再少量调整眼睑；不必把嘴画得很大 |\n| 03 惊讶 | 眼睛更张开，眉毛略抬高，嘴形成小开口 | 同时比较眼睛和嘴的变化，避免只放大嘴 |\n| 04 睁眼 | 眨眼之前的常态 | 固定脸部、头发和衣服图层，只准备修改眼睛 |\n| 05 半闭眼 | 上眼睑下移，遮住更多虹膜 | 保持眼角位置大致稳定，重新画眼睑覆盖关系 |\n| 06 闭眼 | 眼睑闭合，虹膜不可见 | 用简洁的闭眼线表达，检查闭眼后脸是否仍是同一张脸 |\n\n**眨眼练习可以按 `04 → 05 → 06 → 05 → 04` 播放。** 先尝试每个过渡帧约 40—80 毫秒，睁眼状态停留几秒，再根据效果调整。这只是用于试验的起点，动作快慢要结合你想表达的感觉。长时间保持 05，读起来可能更像困倦；短暂经过 05，则更容易读成眨眼。\n\n半闭眼也不是把整只眼睛垂直压扁：注意眼睑怎样遮住虹膜，而眼角、头部和鼻子的位置基本保持稳定。\n\n**二十分钟小作业：** 选你自己的平静头像，把眼睛单独放一层，复制出半闭和闭眼版本。通过隐藏、显示图层快速切换，检查头有没有跳动。上图各格有细微绘制差异，适合观察变化关系；制作动画时，在自己的同一张底稿上画三种状态会更稳定。\n\n### 把自己画的表情接进程序\n\n完成一个静态头像后，安排一个范围很小的互动项目。绘画先做到可用，程序先做到能运行。\n\n建议准备同一画布尺寸、同一位置的三张透明背景图片：\n\n```text\nroxy_idle.png     平静、睁眼\nroxy_blink.png    闭眼\nroxy_smile.png    微笑\n```\n\n用你熟悉的编程方式完成：\n\n1. 默认显示平静头像。\n2. 隔几秒短暂切到闭眼，再恢复睁眼，试着调整节奏。\n3. 点击头像时显示微笑，稍后恢复。\n4. 保持图片锚点一致，检查切换时整个头是否跳动。\n\n之后可以增加半闭眼图片改善过渡，或者把眉、眼、嘴拆成独立图层。需要更自然的连续转头、身体变形和头发摆动时，再学习 Live2D。它的官方教程覆盖眨眼、表情与身体运动，可以从局部功能开始。[Live2D 官方教程](https://docs.live2d.com/zh-CHS/cubism-editor-tutorials/top/)\n\n拆图和绑定本身也是技能。你可以先用官方练习素材学软件，再根据需求准备自己的分层图稿。普通完整 PNG 无法直接保留被遮住的部位和独立部件。\n\n**给编程部分也设一个小范围：先只做“眨眼 + 点击微笑”。** 让它帮助你展示自己的画，之后再决定要不要加聊天、语音或复杂界面。\n\n## 12. 初学时常见的卡点\n\n| 遇到的情况 | 下一步怎么做 |\n| --- | --- |\n| 收藏很多教程，仍然没开始 | 选一个知识点，看十分钟，立即画一个对应练习 |\n| 线条抖，一直撤销 | 适度使用防抖、旋转画布、用舒服的笔触长度；同时检查大轮廓 |\n| 只画精致眼睛，拼起来不像一个人 | 先统一头部轮廓和五官位置，再细化眼睛 |\n| 头发越画越乱 | 回到整体轮廓，把发丝合并成几个大块 |\n| 跟着教程能画，自己画就停住 | 保留参考，关闭步骤演示重画，再尝试一个小变化 |\n| 练基础很枯燥 | 每次把一个基础点应用到角色上，例如用椭圆练帽檐 |\n| 总觉得第一张图不够好 | 保存第一版，列一个具体问题，在第二版中解决 |\n| 连续几天没练，觉得必须重来 | 打开最近的作品，从记录的下一个问题继续 |\n\n你可以喜欢一个角色很多年，也可以在学习中发现自己更喜欢画表情、设计姿势或制作互动。方向可以随着作品改变。\n\n## 13. 今天就可以完成的清单\n\n- [ ] 确认绘画设备能正常工作，压感有效。\n- [ ] 固定一个软件和一支普通笔刷。\n- [ ] 学会新建图层、保存源文件、导出 PNG。\n- [ ] 选一张清楚的洛琪希正面参考，记录出处。\n- [ ] 花十五到二十分钟画第一个头像。\n- [ ] 保存它，写下一个想改的地方和一个自己喜欢的细节。\n\n今天留下的这张画，会成为以后所有练习的起点。你喜欢她的眼神、表情和动作，接下来就可以一点点学会怎样亲手表达它们。\n"}, {"id": "lesson-01", "number": 1, "short": "头部起形：从圆到脸颊和下巴", "file": "01-头部起形：从圆到脸颊和下巴.md", "html": "\u003ch1 id=\"01\">01 · 头部起形：从圆到脸颊和下巴\u003c/h1>\n\u003cblockquote>\n\u003cp>本篇只练一件事：画出一个没有头发、没有五官的正面头部外轮廓。\u003c/p>\n\u003cp>你需要的基础：能在绘画软件中新建图层、使用画笔和橡皮。\u003c/p>\n\u003cp>建议先读一遍，再用二十到三十分钟完成文末练习。可以分两次做。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 为什么从这里开始？“结构”到底指什么？\u003c/h2>\n\u003cp>你最终想画的是洛琪希的脸。要把眼睛和嘴放好，先需要知道：这张脸有多宽、多长，左右分别在哪里，下巴到哪里结束。\u003c/p>\n\u003cp>在这一篇里，我们先用几个简单形状，把这些位置安排出来。这一步常被称作“起形”，可以理解为：\u003cstrong>先确定大轮廓，再往里面放细节。\u003c/strong>\u003c/p>\n\u003cp>完整的头部结构还包括立体体积、侧面、转头和俯仰等内容。本篇只取其中最小的一步：\u003cstrong>正面、平视时的外轮廓。\u003c/strong> 今天画的是一个简化的二维轮廓，它是后面理解立体头部的起点。\u003c/p>\n\u003cp>本篇的方法是“圆形辅助形 + 下方的脸颊和下巴”。这是一种便于入门的画法，不是所有头型都必须套用的公式。圆也不代表真实头骨的精确边界。\u003c/p>\n\u003ch2 id=\"2\">2. 先看我们要做出的结果\u003c/h2>\n\u003cp>\u003cimg alt=\"正面头部起形六步骤：圆、中心线、下巴点、两侧脸颊、下颌连接、整理轮廓\" src=\"assets/04-head-outline-steps.png\" />\u003c/p>\n\u003cp>从上排左侧的 01 开始，按 01 → 02 → 03 → 04 → 05 → 06 阅读。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>浅蓝色：\u003c/strong> 帮助定位的草稿线，完成后可以隐藏。\u003c/li>\n\u003cli>\u003cstrong>珊瑚红色：\u003c/strong> 当前新确定的点或线段。\u003c/li>\n\u003cli>\u003cstrong>深灰色：\u003c/strong> 最后保留的外轮廓。\u003c/li>\n\u003c/ul>\n\u003cp>颜色只是为了方便你看懂。你自己练习时，用一支普通笔刷也可以。\u003c/p>\n\u003cp>这张图由 imagegen 生成并经检查，用来说明顺序。各格有轻微绘制差异，重点是理解新增了什么，而不是测量格子里的像素比例。\u003c/p>\n\u003ch2 id=\"3\">3. 动笔前，只准备两个图层\u003c/h2>\n\u003cp>在你熟悉的绘画软件里，新建一个约 1600 × 1600 像素的画布。大小可以调整，不影响这次练习。\u003c/p>\n\u003cp>把两个图层命名为：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">轮廓   ← 放在上面，最后整理线条\n草图   ← 放在下面，画圆、中心线和定位点\n\u003c/code>\u003c/pre>\n\u003cp>选择一支边缘清楚的普通笔刷，颜色用灰色或浅蓝色。线画得稍轻一点，方便修改。缩放到你能舒服地画出一个手掌大小轮廓的程度，不必一直放大到看清每个像素。\u003c/p>\n\u003cp>\u003cstrong>先在“草图”层完成前五步。\u003c/strong>\u003c/p>\n\u003ch2 id=\"4\">4. 第一步：画一个近似的圆——先决定上半部占多大\u003c/h2>\n\u003ch3 id=\"_1\">这一步为什么要画圆？\u003c/h3>\n\u003cp>圆给你一个容易比较的起点。它暂时帮助你确定头部上方的大小和左右宽度，接下来再往下延伸出脸部轮廓。\u003c/p>\n\u003cp>现在不用想眼睛，也不用想发型。注意力只放在一个问题上：\u003cstrong>这块形状大概有多宽、多高？\u003c/strong>\u003c/p>\n\u003ch3 id=\"_2\">怎么落笔？\u003c/h3>\n\u003col>\n\u003cli>在画布中间偏上的位置，轻轻画一个圆，下面留出空间。\u003c/li>\n\u003cli>可以用几段较长的弧线接起来，不要求一笔闭合。\u003c/li>\n\u003cli>如果某侧明显鼓出去，就擦掉或重画那一小段。\u003c/li>\n\u003c/ol>\n\u003cp>手画得稍扁、稍歪都可以。你甚至可以先用椭圆工具做一个辅助圆，体验后面的流程，再单独练手画圆。\u003c/p>\n\u003ch3 id=\"_3\">怎样检查？\u003c/h3>\n\u003cp>把画面稍微缩小，看它是否大致接近圆，而不是明显细长的椭圆。检查左右有没有特别突出的鼓包。\u003c/p>\n\u003cp>\u003cstrong>到这里就停。\u003c/strong> 一张脸不像，未必是圆不够标准；今天不必把大部分时间花在修圆上。\u003c/p>\n\u003ch2 id=\"5\">5. 第二步：穿过圆心画中线——给下巴一个对齐依据\u003c/h2>\n\u003ch3 id=\"_4\">这条线有什么用？\u003c/h3>\n\u003cp>这次练的是朝向正前方、没有歪头的头部。用一条竖直线标出它的左右中心，你就能判断下巴是否偏到一边。\u003c/p>\n\u003cp>这里的“中心”是画面上头部左右的大致中间，不是五官的某条固定比例线。\u003c/p>\n\u003ch3 id=\"_5\">怎么落笔？\u003c/h3>\n\u003col>\n\u003cli>找圆顶和圆底的大致中间位置。\u003c/li>\n\u003cli>画一条穿过圆心的竖线。\u003c/li>\n\u003cli>让线延伸到圆外下方，留出放下巴点的位置。\u003c/li>\n\u003c/ol>\n\u003cp>如果圆不完全对称，先让中线大致把它分成左右两半就够了。\u003c/p>\n\u003ch3 id=\"_6\">怎样检查？\u003c/h3>\n\u003cp>比较中线左边和右边的宽度。如果一侧明显宽很多，先看看是线偏了，还是圆画歪了。\u003c/p>\n\u003cp>\u003cstrong>本篇先把线画直。\u003c/strong> 以后头转向侧面时，中线会帮助表达转向，那是另一篇练习。\u003c/p>\n\u003ch2 id=\"6\">6. 第三步：放下巴点——先决定脸要延伸多长\u003c/h2>\n\u003ch3 id=\"_7\">为什么先放一个点，不直接画下巴？\u003c/h3>\n\u003cp>因为点很容易移动。先确定脸部最低处，你再连接左右轮廓，就不会一边画一边不断把脸往下拉。\u003c/p>\n\u003cp>这一步决定了一个很重要的形状关系：\u003cstrong>在圆的大小基本不变时，下巴点越往下，最后的头部轮廓就越长。\u003c/strong>\u003c/p>\n\u003ch3 id=\"_8\">怎么落笔？\u003c/h3>\n\u003col>\n\u003cli>在圆底下方、中线上的一个位置，轻点一下。\u003c/li>\n\u003cli>第一次参考图中位置即可，不需要量出固定比例。\u003c/li>\n\u003cli>暂时把这个点当作脸的最低位置，接下来左右两边都要接近这里。\u003c/li>\n\u003c/ol>\n\u003cp>不要把它放到画布很下面；你只是给圆增加一段下半部，不是在圆下面再接一个同样大的圆。\u003c/p>\n\u003ch3 id=\"_9\">怎样检查？\u003c/h3>\n\u003cp>看“圆顶到下巴点”的整体长度，再和圆的宽度比较。你的目标是一个比宽度略长、下方可以逐渐收窄的形状。\u003c/p>\n\u003cp>如果拿不准，复制草图，做两个版本：一个下巴点稍近，一个稍远。等接完轮廓，你就能直观看到区别。\u003c/p>\n\u003cp>\u003cstrong>这里没有必须背下来的距离。\u003c/strong> 不同角色和画风会有不同的脸部长度，之后要结合具体参考调整。\u003c/p>\n\u003ch2 id=\"7\">7. 第四步：接出两侧脸颊——先向下，再逐渐收窄\u003c/h2>\n\u003ch3 id=\"_10\">为什么不从圆的最宽处直接拉直线到下巴？\u003c/h3>\n\u003cp>因为那样很容易画成“一个圆加一个尖三角”。脸的两侧通常需要有形状变化，而不是两条直线一直交到尖点。\u003c/p>\n\u003cp>本次示意采用柔和的脸部轮廓：\u003cstrong>上面保留一些宽度，往下走时慢慢往中间收。\u003c/strong>\u003c/p>\n\u003ch3 id=\"_11\">怎么落笔？\u003c/h3>\n\u003col>\n\u003cli>找圆左下和右下的大致对应位置。你可以把它想成钟面上接近 8 点和 4 点的方向，只用于帮助定位，不必量角度。\u003c/li>\n\u003cli>从左侧画一小段弧线，向下、略向内走。\u003c/li>\n\u003cli>在右侧画一段相似的线。\u003c/li>\n\u003cli>两条线先停在接近圆底的高度附近，暂时不急着接到下巴点。\u003c/li>\n\u003c/ol>\n\u003cp>试着让线顺着原来的大轮廓往下延续，避免在接头处突然向外凸出或向内凹进去。\u003c/p>\n\u003ch3 id=\"_12\">怎样检查？\u003c/h3>\n\u003cp>选同样的高度，看看左右两条线分别离中线多远。大致相近就可以，暂时不追求机械式对称。\u003c/p>\n\u003cp>也可以问自己：从上往下看，宽度是不是逐渐减少？有没有突然出现一个台阶或尖角？\u003c/p>\n\u003ch2 id=\"8\">8. 第五步：连接下颌和下巴——让线在底部柔和地转弯\u003c/h2>\n\u003cp>这里的“下颌轮廓”，先简单理解为脸部下方两侧连向下巴的边界。本次只画外形，不学习骨骼名称。\u003c/p>\n\u003ch3 id=\"_13\">怎么落笔？\u003c/h3>\n\u003col>\n\u003cli>从刚才左侧脸颊线的末端继续向内、向下画。\u003c/li>\n\u003cli>接近下巴点时，逐渐改变方向，画出小小的圆弧过渡。\u003c/li>\n\u003cli>从右侧做同样的连接，让两侧在底部连起来。\u003c/li>\n\u003cli>如果最底下变成了针尖，就把尖端擦掉一点，换成短而柔和的弧线。\u003c/li>\n\u003c/ol>\n\u003cp>这次练习可以让下巴显得偏尖，但不需要成为一个几何三角形的尖角。其他画风当然可以有更方或更尖的下巴，那些变化留到后续比较。\u003c/p>\n\u003ch3 id=\"_14\">怎样检查？\u003c/h3>\n\u003cp>缩小看整体：上部比较圆，下部逐渐收窄，下巴基本在中线上。\u003c/p>\n\u003cp>你现在会看到圆的下半段还留在脸的内部，像一道弧线。\u003cstrong>那是辅助圆，不是脸上需要保留的边界。\u003c/strong> 下一步会把它隐藏。\u003c/p>\n\u003ch2 id=\"9\">9. 第六步：整理外轮廓——决定哪些线要留下\u003c/h2>\n\u003ch3 id=\"_15\">怎么做？\u003c/h3>\n\u003col>\n\u003cli>降低“草图”层的不透明度，让线变淡。\u003c/li>\n\u003cli>切换到上面的“轮廓”层。\u003c/li>\n\u003cli>沿着圆的上半部、两侧脸颊和下巴，画出一条连续的外边界。可以分几笔完成。\u003c/li>\n\u003cli>不描中心线、不描下巴定位点，也不描内部的圆底弧线。\u003c/li>\n\u003cli>隐藏“草图”层，看看剩下的轮廓。\u003c/li>\n\u003c/ol>\n\u003cp>现在你应该得到图中 06 那样的简化头型。\u003c/p>\n\u003cp>如果轮廓局部不顺，可以旋转画布，让落笔方向更舒服，也可以使用适量防抖。整理时仍然要看整体，别为了修一小段线把整张脸越改越窄。\u003c/p>\n\u003ch3 id=\"_16\">怎样检查？\u003c/h3>\n\u003cp>依次只看这三件事：\u003c/p>\n\u003cul>\n\u003cli>头顶是否有完整、连贯的圆弧？\u003c/li>\n\u003cli>两侧是否逐渐收向下巴，而不是突然折进去？\u003c/li>\n\u003cli>下巴是否大致在左右中心？\u003c/li>\n\u003c/ul>\n\u003cp>满足到“能看懂”的程度，就可以保存。今天先把它当成完成品。\u003c/p>\n\u003ch2 id=\"10\">10. 画出来怪怪的，先查哪一项？\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你看到的现象\u003c/th>\n\u003cth>先检查什么\u003c/th>\n\u003cth>可以怎样试着改\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>像一个很长的鸡蛋\u003c/td>\n\u003ctd>下巴点是否放得太远\u003c/td>\n\u003ctd>把下巴点向上移一点，重接下面两侧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像一个球，几乎没有下半张脸\u003c/td>\n\u003ctd>下巴点是否太贴近圆底，两侧是否没有收窄\u003c/td>\n\u003ctd>适度下移下巴点，让下方轮廓逐渐往内走\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>像圆下面粘着一个三角形\u003c/td>\n\u003ctd>两侧是否用了过直的线，接头是否突然改变方向\u003c/td>\n\u003ctd>放慢收窄，改成连贯曲线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>明明画正面，却像向一边歪\u003c/td>\n\u003ctd>下巴点是否偏离中线，左右收窄是否差很多\u003c/td>\n\u003ctd>打开草图层，比较同一高度左右的宽度\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>下巴像针尖\u003c/td>\n\u003ctd>两侧是否直接交成尖角\u003c/td>\n\u003ctd>擦掉最尖的一小段，换成短圆弧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>里面有一道奇怪的弧线\u003c/td>\n\u003ctd>是否把辅助圆的下半段也描成了轮廓\u003c/td>\n\u003ctd>隐藏草图层，检查最终层只保留外边界\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>每次只改一项，然后缩小看变化。为了这次“正面、平视”的练习，我们暂时把左右大致对称作为观察目标；以后画表情和转头时，情况会更丰富。\u003c/p>\n\u003ch2 id=\"11\">11. 今天只交三张小草图\u003c/h2>\n\u003ch3 id=\"a\">A：跟着画一遍\u003c/h3>\n\u003cp>按照 01—06 做一次。在草稿旁标出“圆”“中线”“下巴点”，确认自己知道每一步的用途。约八到十分钟。\u003c/p>\n\u003ch3 id=\"b\">B：保留图解，但自己决定步骤\u003c/h3>\n\u003cp>新开一块空白区域，自己画第二个轮廓。忘记步骤时可以回看，重点是自己做判断。约五到八分钟。\u003c/p>\n\u003ch3 id=\"c\">C：只改变一个变量\u003c/h3>\n\u003cp>复制第二张的草图，保持圆的大小不变，只把下巴点上移或下移一点，再重接脸颊和下巴。约五分钟。\u003c/p>\n\u003cp>把 B 和 C 放在一起，写一句观察：\u003c/p>\n\u003cblockquote>\n\u003cp>我把下巴点向\u003cstrong>\u003cem>_\u003c/em>_移动后，脸的外形变得更\u003c/strong>____。\u003c/p>\n\u003c/blockquote>\n\u003cp>如果还有精力，可以做一次“下巴位置不变、只改变两侧收窄程度”的比较。这是额外练习，不需要今天一起完成。\u003c/p>\n\u003ch2 id=\"12\">12. 怎样判断可以结束这一篇？\u003c/h2>\n\u003cul>\n\u003cli>[ ] 我知道圆只是辅助形，不必成为最终画面的一部分。\u003c/li>\n\u003cli>[ ] 我能先找到中线、放下巴点，再连接两侧。\u003c/li>\n\u003cli>[ ] 我能指出轮廓太长、太窄或偏向一边的具体位置。\u003c/li>\n\u003cli>[ ] 我尝试改变一个位置，并看到了形状变化。\u003c/li>\n\u003cli>[ ] 我保存了这次练习，不需要为了第一张线不够漂亮反复重来。\u003c/li>\n\u003c/ul>\n\u003cp>完成这些，就已经实现了这一篇的目标：你开始能够有意识地安排头部外形。\u003c/p>\n\u003cp>下一篇最自然的小问题是：\u003cstrong>“在这个轮廓里，眼睛应该放在哪个区域？”\u003c/strong> 先确定摆放位置，再单独学习一只眼睛怎样画、嘴巴怎样画。等到开始转头时，我们再引入球体、侧面和弯曲中线。\u003c/p>\n\u003cblockquote>\n\u003cp>今天的记录：我最想改的是\u003cstrong>\u003cem>_\u003c/em>_；我已经比第一张更清楚的地方是\u003c/strong>____。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003ca href=\"#plan\">返回总目录\u003c/a> · \u003ca href=\"#lesson-02\">下一篇：眼睛在脸上的什么位置\u003c/a>\u003c/p>", "text": "# 01 · 头部起形：从圆到脸颊和下巴\n\n> 本篇只练一件事：画出一个没有头发、没有五官的正面头部外轮廓。\n>\n> 你需要的基础：能在绘画软件中新建图层、使用画笔和橡皮。\n>\n> 建议先读一遍，再用二十到三十分钟完成文末练习。可以分两次做。\n\n## 1. 为什么从这里开始？“结构”到底指什么？\n\n你最终想画的是洛琪希的脸。要把眼睛和嘴放好，先需要知道：这张脸有多宽、多长，左右分别在哪里，下巴到哪里结束。\n\n在这一篇里，我们先用几个简单形状，把这些位置安排出来。这一步常被称作“起形”，可以理解为：**先确定大轮廓，再往里面放细节。**\n\n完整的头部结构还包括立体体积、侧面、转头和俯仰等内容。本篇只取其中最小的一步：**正面、平视时的外轮廓。** 今天画的是一个简化的二维轮廓，它是后面理解立体头部的起点。\n\n本篇的方法是“圆形辅助形 + 下方的脸颊和下巴”。这是一种便于入门的画法，不是所有头型都必须套用的公式。圆也不代表真实头骨的精确边界。\n\n## 2. 先看我们要做出的结果\n\n![正面头部起形六步骤：圆、中心线、下巴点、两侧脸颊、下颌连接、整理轮廓](assets/04-head-outline-steps.png)\n\n从上排左侧的 01 开始，按 01 → 02 → 03 → 04 → 05 → 06 阅读。\n\n- **浅蓝色：** 帮助定位的草稿线，完成后可以隐藏。\n- **珊瑚红色：** 当前新确定的点或线段。\n- **深灰色：** 最后保留的外轮廓。\n\n颜色只是为了方便你看懂。你自己练习时，用一支普通笔刷也可以。\n\n这张图由 imagegen 生成并经检查，用来说明顺序。各格有轻微绘制差异，重点是理解新增了什么，而不是测量格子里的像素比例。\n\n## 3. 动笔前，只准备两个图层\n\n在你熟悉的绘画软件里，新建一个约 1600 × 1600 像素的画布。大小可以调整，不影响这次练习。\n\n把两个图层命名为：\n\n```text\n轮廓   ← 放在上面，最后整理线条\n草图   ← 放在下面，画圆、中心线和定位点\n```\n\n选择一支边缘清楚的普通笔刷，颜色用灰色或浅蓝色。线画得稍轻一点，方便修改。缩放到你能舒服地画出一个手掌大小轮廓的程度，不必一直放大到看清每个像素。\n\n**先在“草图”层完成前五步。**\n\n## 4. 第一步：画一个近似的圆——先决定上半部占多大\n\n### 这一步为什么要画圆？\n\n圆给你一个容易比较的起点。它暂时帮助你确定头部上方的大小和左右宽度，接下来再往下延伸出脸部轮廓。\n\n现在不用想眼睛，也不用想发型。注意力只放在一个问题上：**这块形状大概有多宽、多高？**\n\n### 怎么落笔？\n\n1. 在画布中间偏上的位置，轻轻画一个圆，下面留出空间。\n2. 可以用几段较长的弧线接起来，不要求一笔闭合。\n3. 如果某侧明显鼓出去，就擦掉或重画那一小段。\n\n手画得稍扁、稍歪都可以。你甚至可以先用椭圆工具做一个辅助圆，体验后面的流程，再单独练手画圆。\n\n### 怎样检查？\n\n把画面稍微缩小，看它是否大致接近圆，而不是明显细长的椭圆。检查左右有没有特别突出的鼓包。\n\n**到这里就停。** 一张脸不像，未必是圆不够标准；今天不必把大部分时间花在修圆上。\n\n## 5. 第二步：穿过圆心画中线——给下巴一个对齐依据\n\n### 这条线有什么用？\n\n这次练的是朝向正前方、没有歪头的头部。用一条竖直线标出它的左右中心，你就能判断下巴是否偏到一边。\n\n这里的“中心”是画面上头部左右的大致中间，不是五官的某条固定比例线。\n\n### 怎么落笔？\n\n1. 找圆顶和圆底的大致中间位置。\n2. 画一条穿过圆心的竖线。\n3. 让线延伸到圆外下方，留出放下巴点的位置。\n\n如果圆不完全对称，先让中线大致把它分成左右两半就够了。\n\n### 怎样检查？\n\n比较中线左边和右边的宽度。如果一侧明显宽很多，先看看是线偏了，还是圆画歪了。\n\n**本篇先把线画直。** 以后头转向侧面时，中线会帮助表达转向，那是另一篇练习。\n\n## 6. 第三步：放下巴点——先决定脸要延伸多长\n\n### 为什么先放一个点，不直接画下巴？\n\n因为点很容易移动。先确定脸部最低处，你再连接左右轮廓，就不会一边画一边不断把脸往下拉。\n\n这一步决定了一个很重要的形状关系：**在圆的大小基本不变时，下巴点越往下，最后的头部轮廓就越长。**\n\n### 怎么落笔？\n\n1. 在圆底下方、中线上的一个位置，轻点一下。\n2. 第一次参考图中位置即可，不需要量出固定比例。\n3. 暂时把这个点当作脸的最低位置，接下来左右两边都要接近这里。\n\n不要把它放到画布很下面；你只是给圆增加一段下半部，不是在圆下面再接一个同样大的圆。\n\n### 怎样检查？\n\n看“圆顶到下巴点”的整体长度，再和圆的宽度比较。你的目标是一个比宽度略长、下方可以逐渐收窄的形状。\n\n如果拿不准，复制草图，做两个版本：一个下巴点稍近，一个稍远。等接完轮廓，你就能直观看到区别。\n\n**这里没有必须背下来的距离。** 不同角色和画风会有不同的脸部长度，之后要结合具体参考调整。\n\n## 7. 第四步：接出两侧脸颊——先向下，再逐渐收窄\n\n### 为什么不从圆的最宽处直接拉直线到下巴？\n\n因为那样很容易画成“一个圆加一个尖三角”。脸的两侧通常需要有形状变化，而不是两条直线一直交到尖点。\n\n本次示意采用柔和的脸部轮廓：**上面保留一些宽度，往下走时慢慢往中间收。**\n\n### 怎么落笔？\n\n1. 找圆左下和右下的大致对应位置。你可以把它想成钟面上接近 8 点和 4 点的方向，只用于帮助定位，不必量角度。\n2. 从左侧画一小段弧线，向下、略向内走。\n3. 在右侧画一段相似的线。\n4. 两条线先停在接近圆底的高度附近，暂时不急着接到下巴点。\n\n试着让线顺着原来的大轮廓往下延续，避免在接头处突然向外凸出或向内凹进去。\n\n### 怎样检查？\n\n选同样的高度，看看左右两条线分别离中线多远。大致相近就可以，暂时不追求机械式对称。\n\n也可以问自己：从上往下看，宽度是不是逐渐减少？有没有突然出现一个台阶或尖角？\n\n## 8. 第五步：连接下颌和下巴——让线在底部柔和地转弯\n\n这里的“下颌轮廓”，先简单理解为脸部下方两侧连向下巴的边界。本次只画外形，不学习骨骼名称。\n\n### 怎么落笔？\n\n1. 从刚才左侧脸颊线的末端继续向内、向下画。\n2. 接近下巴点时，逐渐改变方向，画出小小的圆弧过渡。\n3. 从右侧做同样的连接，让两侧在底部连起来。\n4. 如果最底下变成了针尖，就把尖端擦掉一点，换成短而柔和的弧线。\n\n这次练习可以让下巴显得偏尖，但不需要成为一个几何三角形的尖角。其他画风当然可以有更方或更尖的下巴，那些变化留到后续比较。\n\n### 怎样检查？\n\n缩小看整体：上部比较圆，下部逐渐收窄，下巴基本在中线上。\n\n你现在会看到圆的下半段还留在脸的内部，像一道弧线。**那是辅助圆，不是脸上需要保留的边界。** 下一步会把它隐藏。\n\n## 9. 第六步：整理外轮廓——决定哪些线要留下\n\n### 怎么做？\n\n1. 降低“草图”层的不透明度，让线变淡。\n2. 切换到上面的“轮廓”层。\n3. 沿着圆的上半部、两侧脸颊和下巴，画出一条连续的外边界。可以分几笔完成。\n4. 不描中心线、不描下巴定位点，也不描内部的圆底弧线。\n5. 隐藏“草图”层，看看剩下的轮廓。\n\n现在你应该得到图中 06 那样的简化头型。\n\n如果轮廓局部不顺，可以旋转画布，让落笔方向更舒服，也可以使用适量防抖。整理时仍然要看整体，别为了修一小段线把整张脸越改越窄。\n\n### 怎样检查？\n\n依次只看这三件事：\n\n- 头顶是否有完整、连贯的圆弧？\n- 两侧是否逐渐收向下巴，而不是突然折进去？\n- 下巴是否大致在左右中心？\n\n满足到“能看懂”的程度，就可以保存。今天先把它当成完成品。\n\n## 10. 画出来怪怪的，先查哪一项？\n\n| 你看到的现象 | 先检查什么 | 可以怎样试着改 |\n| --- | --- | --- |\n| 像一个很长的鸡蛋 | 下巴点是否放得太远 | 把下巴点向上移一点，重接下面两侧 |\n| 像一个球，几乎没有下半张脸 | 下巴点是否太贴近圆底，两侧是否没有收窄 | 适度下移下巴点，让下方轮廓逐渐往内走 |\n| 像圆下面粘着一个三角形 | 两侧是否用了过直的线，接头是否突然改变方向 | 放慢收窄，改成连贯曲线 |\n| 明明画正面，却像向一边歪 | 下巴点是否偏离中线，左右收窄是否差很多 | 打开草图层，比较同一高度左右的宽度 |\n| 下巴像针尖 | 两侧是否直接交成尖角 | 擦掉最尖的一小段，换成短圆弧 |\n| 里面有一道奇怪的弧线 | 是否把辅助圆的下半段也描成了轮廓 | 隐藏草图层，检查最终层只保留外边界 |\n\n每次只改一项，然后缩小看变化。为了这次“正面、平视”的练习，我们暂时把左右大致对称作为观察目标；以后画表情和转头时，情况会更丰富。\n\n## 11. 今天只交三张小草图\n\n### A：跟着画一遍\n\n按照 01—06 做一次。在草稿旁标出“圆”“中线”“下巴点”，确认自己知道每一步的用途。约八到十分钟。\n\n### B：保留图解，但自己决定步骤\n\n新开一块空白区域，自己画第二个轮廓。忘记步骤时可以回看，重点是自己做判断。约五到八分钟。\n\n### C：只改变一个变量\n\n复制第二张的草图，保持圆的大小不变，只把下巴点上移或下移一点，再重接脸颊和下巴。约五分钟。\n\n把 B 和 C 放在一起，写一句观察：\n\n> 我把下巴点向______移动后，脸的外形变得更______。\n\n如果还有精力，可以做一次“下巴位置不变、只改变两侧收窄程度”的比较。这是额外练习，不需要今天一起完成。\n\n## 12. 怎样判断可以结束这一篇？\n\n- [ ] 我知道圆只是辅助形，不必成为最终画面的一部分。\n- [ ] 我能先找到中线、放下巴点，再连接两侧。\n- [ ] 我能指出轮廓太长、太窄或偏向一边的具体位置。\n- [ ] 我尝试改变一个位置，并看到了形状变化。\n- [ ] 我保存了这次练习，不需要为了第一张线不够漂亮反复重来。\n\n完成这些，就已经实现了这一篇的目标：你开始能够有意识地安排头部外形。\n\n下一篇最自然的小问题是：**“在这个轮廓里，眼睛应该放在哪个区域？”** 先确定摆放位置，再单独学习一只眼睛怎样画、嘴巴怎样画。等到开始转头时，我们再引入球体、侧面和弯曲中线。\n\n> 今天的记录：我最想改的是______；我已经比第一张更清楚的地方是______。\n\n[返回总目录](00-系列总计划与目录.md) · [下一篇：眼睛在脸上的什么位置](02-眼睛在脸上的什么位置.md)\n"}, {"id": "lesson-02", "number": 2, "short": "眼睛在脸上的什么位置", "file": "02-眼睛在脸上的什么位置.md", "html": "\u003ch1 id=\"02\">02 · 眼睛在脸上的什么位置\u003c/h1>\n\u003cblockquote>\n\u003cp>今天只做一件事：在已经画好的正面头部里，安排两只眼睛的位置。\u003c/p>\n\u003cp>前置：\u003ca href=\"#lesson-01\">01 · 头部起形\u003c/a>。本篇用椭圆占位，不需要会画漂亮的眼睛。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1\">1. 为什么先决定位置？\u003c/h2>\n\u003cp>一只眼睛单独看很好看，放进脸里却可能不协调。问题有时出在位置：两只眼睛太高、太低、太挤，或者把脸的两侧撑满了。\u003c/p>\n\u003cp>先用两个简单形状占位，调整起来很轻松。等位置合适，再把它们换成眼睑、虹膜和瞳孔。\u003c/p>\n\u003cp>\u003cstrong>今天只观察三个关系：眼睛在脸上的高度、两只眼睛之间的空隙、眼睛到脸侧的空隙。\u003c/strong>\u003c/p>\n\u003ch2 id=\"2\">2. 看图：上排改高度，下排改间距\u003c/h2>\n\u003cp>\u003cimg alt=\"相同正面头型中眼睛高度与间距的比较\" src=\"assets/lesson-02-eye-placement.png\" />\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>编号\u003c/th>\n\u003cth>看什么\u003c/th>\n\u003cth>自己练习时固定什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>01—03\u003c/td>\n\u003ctd>眼睛从较高到较低的位置变化\u003c/td>\n\u003ctd>头型、眼睛大小和左右间距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>04—06\u003c/td>\n\u003ctd>两只眼睛从较近到较远的变化\u003c/td>\n\u003ctd>头型、眼睛大小和所在高度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>蓝色竖线表示脸的中线，横线表示本图约定的\u003cstrong>眼形中心高度\u003c/strong>；红色短标记强调两只眼睛中间的空隙。这里的横线不是所有画法通用的“上眼睑线”。\u003c/p>\n\u003cp>配图是 AI 生成的关系示意，各格存在微小差异。你练习时复制自己的同一张头部底稿，才更容易做到一次只改一个条件。六格是变化比较，不是正确答案与错误答案。\u003c/p>\n\u003ch2 id=\"3\">3. 第一步：准备同一个头部底稿\u003c/h2>\n\u003cp>打开第 01 篇的画稿，在头部轮廓上方新建“眼睛占位”图层。保留浅色竖直中线。\u003c/p>\n\u003cp>今天练正面、平视、没有歪头的脸。先检查下巴是否大致在中线上。头型明显歪斜时，先调整轮廓，避免一边摆眼睛、一边猜到底哪里出错。\u003c/p>\n\u003cp>可以复制底稿做三份。轮廓保持不动，眼睛在单独图层上画，之后就能只移动眼睛。\u003c/p>\n\u003ch2 id=\"4\">4. 第二步：先选一条试画的高度\u003c/h2>\n\u003ch3 id=\"_1\">从哪里开始？\u003c/h3>\n\u003cp>如果你还没有参考，可以先在“头顶到下巴”的大约中间高度画一条轻横线，作为试画起点。这里说的头顶是头部轮廓顶部，不是头发或帽子顶部。\u003c/p>\n\u003cp>这不是角色比例的标准答案。二次元头型、眼睛大小和画风都会改变安排；有了喜欢的参考之后，应比较参考中的具体关系。\u003c/p>\n\u003ch3 id=\"_2\">怎么放？\u003c/h3>\n\u003cp>在横线左右两边，各画一个横向椭圆。让横线从两个椭圆的大致中心经过，两个形状高度、宽度先画得相近。\u003c/p>\n\u003cp>暂时不填瞳孔，不加睫毛。缩小看看椭圆上方留下多少额头区域，下方留下多少脸部区域。\u003c/p>\n\u003ch3 id=\"_3\">怎么检查？\u003c/h3>\n\u003cp>复制一份，把两只眼睛\u003cstrong>一起\u003c/strong>稍微往上移；再复制一份，一起往下移。一次移动小一点，比较更容易。\u003c/p>\n\u003cp>问自己：“哪一版更接近我喜欢的参考？哪一版给鼻子、嘴和下巴留下的空间比较合适？”今天还没画那些部件，也可以先观察剩下的空间。\u003c/p>\n\u003cp>不要在同一次比较里又放大眼睛、又缩短下巴，否则你难以判断变化来自哪里。\u003c/p>\n\u003ch2 id=\"5\">5. 第三步：安排中间的空隙\u003c/h2>\n\u003cp>先看靠近中线的两个边界，也就是未来的两个内眼角。它们不应该自动贴到中线上，中间需要留出鼻梁所在的区域。\u003c/p>\n\u003cp>如果不知道从哪里起步，可以暂时让中间空隙接近一只占位眼的宽度，再结合参考调整。这个办法只是让你能开始比较，不是所有二次元角色的定律。\u003c/p>\n\u003cp>把左眼往左、右眼往右移动，中间空隙会增大；反向移动，空隙会缩小。\u003cstrong>保持两只眼睛同时、对称地移动，先别改变眼形大小。\u003c/strong>
